# bridge configuration — the FORKLIFT, ENVELOPE and WARNING groups, against the
# TEST DOUBLE.
#
# Added 2026-08-06 (m5-55). It is the first configuration in this directory that
# carries `opcua-nodes.md` §13 at all, and the first that carries §12 against
# anything but the live CPU: until the double was extended in the same round
# (`bridge-design.md` §12 item 17), the envelope group could only ever be
# exercised against PLCSIM Advanced.
#
# The configured set is 7 input slots, 8 output slots, 6 diagnostics, 22 nodes
# touched and an 8-key write allowlist — and no rule anywhere in the bridge
# writes any of those numbers down: each is derived from the groups declared here
# (§2.1 G2), and the line above is a transcription of the bridge's own startup
# line rather than arithmetic done in this comment.
#
# The endpoint is the double's, never PLCSIM's (§10, operational rule). It is
# its own port, so a run of this file never waits on another double's TIME_WAIT.

# Five groups exist in the loader; four are declared here. The `warning` group
# is a SEPARATE group and not four rows added to `envelope`, for the reason
# `amr_bridge/config.py` states at WARNING_GROUP: §13 is its own node-model
# section, and the node does not exist on the controller in force until
# `plc/forklift/TIA-BUILD-PROCEDURE.md` chunk X creates it — so a run against
# today's CPU must be able to leave it out without losing the envelope.
#
# The `safety` group (added 2026-08-06, m5-62) is the fifth, and it is a group of
# its own for the same two reasons one section down: §11 is its own node-model
# section with its own folder and its own DB, and it is the ONLY group in this
# file that reads and never writes.
groups: ["forklift", "envelope", "warning", "safety"]

opcua:
  endpoint: "opc.tcp://127.0.0.1:4845/amr-agent/celldouble/"
  namespace_uris:
    server_interfaces: "http://www.siemens.com/simatic-s7-opcua"
    interface: "http://DemoCell"
  security_policy: "none"
  certificate_path: null
  private_key_path: null
  username: null
  requested_session_timeout_ms: 10000
  session_name: "amr-agent-bridge-double-m5"
  reconnect_interval_s: 1.0
  reconnect_backoff_max_s: 5.0

nodes:
  interface_path:
    - namespace: server_interfaces
      browse_name: "ServerInterfaces"
    - namespace: interface
      browse_name: "DemoCell"

  # One heartbeat for the whole process, whatever the group count (§2.1 G5).
  heartbeat:
    BridgeHeartbeat:               ["Link", "BridgeHeartbeat"]

  groups:
    forklift:
      inputs:
        ForkliftForkHeight:            ["Forklift", "Input", "ForkliftForkHeight"]
        ForkliftLinearSpeed:           ["Forklift", "Input", "ForkliftLinearSpeed"]
        ForkliftObstacleInStopZone:    ["Forklift", "Input", "ForkliftObstacleInStopZone"]
        ForkliftObstacleMinDistance:   ["Forklift", "Input", "ForkliftObstacleMinDistance"]
      outputs:
        ForkliftTractionSpeedRef:      ["Forklift", "Output", "ForkliftTractionSpeedRef"]
        ForkliftSteerAngleRef:         ["Forklift", "Output", "ForkliftSteerAngleRef"]
        ForkliftForkSpeedRef:          ["Forklift", "Output", "ForkliftForkSpeedRef"]
      diagnostics:
        ForkliftTeleopActive:          ["Forklift", "Status", "ForkliftTeleopActive"]
        ForkliftObstacleStopActive:    ["Forklift", "Status", "ForkliftObstacleStopActive"]
        ForkliftSpeedLimitActive:      ["Forklift", "Status", "ForkliftSpeedLimitActive"]
        ForkliftResetRequired:         ["Forklift", "Status", "ForkliftResetRequired"]
        HmiLinkOk:                     ["Forklift", "Link", "HmiLinkOk"]

    envelope:
      inputs:
        ForkliftVehicleModeApplied:    ["Forklift", "Vehicle", "ForkliftVehicleModeApplied"]
        ForkliftVehicleHeartbeat:      ["Forklift", "Vehicle", "ForkliftVehicleHeartbeat"]
      outputs:
        ForkliftDriveModeActive:       ["Forklift", "Mode", "ForkliftDriveModeActive"]
        ForkliftMotionEnable:          ["Forklift", "Envelope", "ForkliftMotionEnable"]
        ForkliftSpeedCeiling:          ["Forklift", "Envelope", "ForkliftSpeedCeiling"]
        ForkliftEquipmentPermit:       ["Forklift", "Envelope", "ForkliftEquipmentPermit"]
      diagnostics:
        ForkliftProcessStopActive:     ["Forklift", "ProcessStop", "ForkliftProcessStopActive"]

    warning:
      # ONE node, one direction, and its own folder and DB (`opcua-nodes.md`
      # §13). The bridge writes it; the value is the field evaluation's.
      inputs:
        ForkliftWarningFieldOccupied:  ["Forklift", "Warning", "ForkliftWarningFieldOccupied"]

    safety:
      # ONE node, READ ONLY, republished to the vehicle's torque-off stand-in
      # (`opcua-nodes.md` §11.2b SD2). There is no `inputs` table here and there
      # never will be: `Forklift/Safety/` is read-only to every client (§11.4
      # MR1) and the write allowlist is derived from the `inputs` tables, so this
      # group adds zero writable keys by construction.
      #
      # `SpeedMonitorDemand` and the other four mirrors are ABSENT deliberately
      # (SD1): the speed monitor's reaction is the PLC's permissive and reaches
      # the vehicle as consequence, through no stop topic of its own, and the
      # rest are display-only. Nothing but the demand Bool crosses this seam —
      # no speed, no limit, no margin, no reading (SD7, ADR 0014 D4).
      outputs:
        TorqueOffDemand:               ["Forklift", "Safety", "TorqueOffDemand"]

ros:
  node_name: "forklift_plc_bridge"
  topics:
    forklift:
      fork_height:           "/forklift/fork_height"
      linear_speed:          "/forklift/linear_speed"
      obstacle_in_stop_zone: "/forklift/obstacle/in_stop_zone"
      obstacle_min_distance: "/forklift/obstacle/min_distance"
      cmd_traction_speed:    "/forklift/cmd/traction_speed"
      cmd_steer_angle:       "/forklift/cmd/steer_angle"
      cmd_fork_speed:        "/forklift/cmd/fork_speed"
    envelope:
      mode_in_force:             "/forklift/mode/in_force"
      envelope_motion_enable:    "/forklift/envelope/motion_enable"
      envelope_speed_ceiling:    "/forklift/envelope/speed_ceiling"
      envelope_equipment_permit: "/forklift/envelope/equipment_permit"
      mode_applied:              "/forklift/mode/applied"
      vehicle_heartbeat:         "/forklift/vehicle/heartbeat"
    warning:
      # The producer's own topic name, `agv/forklift/config.yaml` topics: block
      # and `opcua-nodes.md` §13.3, unchanged.
      warning_field_occupied:    "/forklift/warning_field/occupied"
    safety:
      # The consumer's own topic name, `agv/forklift/config.yaml` topics:
      # `safety_torque_off_demand`, and the subscriber is
      # `agv/forklift/scripts/sto_contactor.py`. Deliberately NOT under
      # /forklift/cmd/: a demand is not a setpoint (§12.10's reasoning, applied
      # to §11).
      torque_off_demand:         "/forklift/safety/torque_off_demand"
  analog_reliability: "reliable"

cycle:
  # One cadence for the whole process: a group adds slots, never a cadence
  # (§5.1). The warning slot's freshness window is NOT here and is deliberately
  # not configurable — it is a named constant of the bridge (config.py,
  # WARNING_FIELD_STALE_MAX_S), for the same reason this file carries no
  # threshold, tolerance or debounce anywhere.
  period_s: 0.05
  status_poll_period_s: 1.0

evidence:
  csv_path: "evidence/latency-double-m5.csv"
  flush_interval_s: 1.0

logging:
  level: "INFO"
