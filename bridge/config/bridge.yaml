# bridge configuration — the ONLY file that varies between the test double and
# PLCSIM Advanced / real hardware.
#
# bridge-design.md §2: "No thresholds, no limits, no tolerances, no timers — a
# config key for any of those would be logic wearing a disguise."
#
# Everything below is one of:
#   - an address (endpoint, namespace URIs, BrowseName path, topic name),
#   - a cadence (cycle period — an expectation, not a deadline, §9.2/§12.7),
#   - housekeeping (reconnect retry interval, log level, evidence paths).
#
# There is deliberately no threshold, no tolerance, no clamp, no scale, no
# offset, no debounce time and no "hold last value for X ms" key anywhere in
# this file, and the loader rejects any key it does not know (config.py).

opcua:
  # The bridge connects OUT to this endpoint. It never listens (invariant 4).
  # The value below is the commissioned PLCSIM Advanced instance
  # (EVIDENCE_LATENCY.md §B.0), and it is what the m3-26 run of Section B was
  # measured against. The test double lives on
  #   opc.tcp://127.0.0.1:4840/amr-agent/celldouble/
  # and must not be running while this endpoint is in use — swapping this one
  # line is the whole difference between the two (bridge-design.md §10).
  endpoint: "opc.tcp://192.168.53.1:4840"

  # The browse path crosses TWO namespaces (bridge-design.md §3.1 N2). Both are
  # resolved to an index by URI at every session establishment; neither index
  # appears here, neither is hardcoded, and neither is derived from the other.
  # A URI that is missing on the server is a connect failure, retried per §8.1 —
  # the bridge never scans the namespace array for a likely-looking entry and
  # never falls back to an index (§3.1 N4).
  namespace_uris:
    # Vendor-fixed. The S7-1500 publishes its ServerInterfaces folder here.
    server_interfaces: "http://www.siemens.com/simatic-s7-opcua"
    # TIA Portal derives this URI from the server interface name as
    # http://<interface name> and the field is not editable, so the
    # demonstration cell's interface `DemoCell` gives http://DemoCell
    # (ADR 0006). Renaming the interface changes this URI and breaks every
    # browse until this line follows it (§3.1 N5).
    interface: "http://DemoCell"

  # Security. "none" is the in-container test-double setting. For PLCSIM /
  # hardware set policy/certificate/private_key; the files live OUTSIDE this
  # repository and are referenced by absolute path (invariant 13).
  security_policy: "none"        # "none" | e.g. "Basic256Sha256,SignAndEncrypt"
  certificate_path: null         # absolute path, outside the repo
  private_key_path: null         # absolute path, outside the repo
  username: null                 # absolute path to a secret file, or null

  # A REQUEST, never a value the bridge may rely on (§3.2 S1). The server
  # revises it and the granted value is the only one any behaviour uses: the
  # commissioned S7-1500 granted 30 000 ms against a 3 600 000 ms request, so a
  # grant may land either side of this number. The keep-alive interval is
  # DERIVED from the granted value at every session establishment and is
  # deliberately absent from this file (§3.2 S3).
  requested_session_timeout_ms: 10000
  session_name: "amr-agent-bridge"

  # Reconnect housekeeping (§8.1). This is retry timing for a broken session,
  # not a gate on any signal: it never delays or suppresses a value that could
  # be sent.
  reconnect_interval_s: 1.0
  reconnect_backoff_max_s: 5.0

nodes:
  # Objects -> the server interface node, one element per level, each carrying
  # the namespace THAT element belongs to (§3.1 N3). `DemoCell` does not hang
  # directly under `Objects`: it is a child of the ServerInterfaces folder the
  # S7-1500 publishes, and that folder is Siemens-owned, so a single index
  # cannot qualify both elements (§3.1 N1).
  interface_path:
    - namespace: server_interfaces
      browse_name: "ServerInterfaces"
    - namespace: interface
      browse_name: "DemoCell"
  # Everything below is relative to the interface node (§3.1 N1) and lives in
  # the interface namespace, mirroring opcua-nodes.md §9.2 exactly.
  # WRITABLE by the bridge — the PLC input image (§9.3).
  inputs:
    ConveyorBeltPosition:          ["Input", "ConveyorBeltPosition"]
    ConveyorBeltSpeed:             ["Input", "ConveyorBeltSpeed"]
    ProductSensorRange:            ["Input", "ProductSensorRange"]
    PanelStartPressed:             ["Input", "PanelStartPressed"]
    # Normally open like PanelStartPressed, unlike the two NC rows below: its
    # fail state is FALSE (opcua-nodes.md §9.3). The bridge writes it only from
    # a real publish, so before the first one the node keeps the server's own
    # FALSE start value — it is never asserted by this process (§6.1 R1).
    PanelResetPressed:             ["Input", "PanelResetPressed"]
    PanelStopCircuitClosed:        ["Input", "PanelStopCircuitClosed"]
    PanelProcessStopCircuitClosed: ["Input", "PanelProcessStopCircuitClosed"]
  # WRITABLE by the bridge — its own liveness counter (§9.7).
  heartbeat:
    BridgeHeartbeat:               ["Link", "BridgeHeartbeat"]
  # READ and applied to the cell unchanged (§9.4).
  output:
    ConveyorSpeedCommand:          ["Output", "ConveyorSpeedCommand"]
  # READ for logging only. Applied to nothing, used in no decision (§4.4).
  diagnostics:
    CellCycleRunning:              ["Status", "CellCycleRunning"]
    CellProcessStopActive:         ["Status", "CellProcessStopActive"]
    CellResetRequired:             ["Status", "CellResetRequired"]
    ProductPresentAtSensor:        ["Status", "ProductPresentAtSensor"]
    ConveyorDriveFault:            ["Status", "ConveyorDriveFault"]
    BridgeLinkOk:                  ["Link", "BridgeLinkOk"]

ros:
  node_name: "cell_plc_bridge"
  # Subscriptions (cell → PLC).
  topics:
    joint_state:   "/cell/conveyor/joint_state"
    product_scan:  "/cell/product_sensor/scan"
    panel_start:   "/cell/panel/start"
    panel_reset:   "/cell/panel/reset"
    panel_stop:    "/cell/panel/stop"
    panel_process_stop: "/cell/panel/process_stop"
    # Publication (PLC → cell).
    cmd_speed:     "/cell/conveyor/cmd_speed"
  # Addressing, not logic (§4.5): the joint whose position/velocity is the
  # belt encoder, matched by name in every message.
  joint_name: "belt_joint"
  # Subscription reliability for the two analog topics, matched to the
  # publisher (ros_gz_bridge publishes RELIABLE — verified with
  # `ros2 topic info -v`, logged again at every startup).
  analog_reliability: "reliable"     # "reliable" | "best_effort"

cycle:
  # 20 Hz. An interface expectation (opcua-nodes.md §9.2), NOT a deadline and
  # NOT a control parameter. The bridge is best effort (invariant 9).
  period_s: 0.05
  # Diagnostics are read at a low rate so they stay visibly out of the
  # measured loop (§5).
  status_poll_period_s: 1.0

evidence:
  # Housekeeping. Names no machine: a relative path is resolved against the
  # bridge directory (the parent of config/), so this default works from any
  # checkout, in the container and in WSL alike. `~` and `$VARS` are expanded,
  # and an absolute path is used as written. A measurement run gives its
  # capture its own dated name with --evidence-csv; this default is the
  # scratch file of an ordinary run and is truncated at every start.
  csv_path: "evidence/latency-latest.csv"
  flush_interval_s: 2.0

logging:
  level: "INFO"
