# bridge configuration — the ONLY file that varies between the test double and
# PLCSIM Advanced / real hardware.
#
# bridge-design.md §2: "No thresholds, no limits, no tolerances, no timers — a
# config key for any of those would be logic wearing a disguise."
#
# Everything below is one of:
#   - the signal groups this run carries (§2.1),
#   - an address (endpoint, namespace URIs, BrowseName path, topic name),
#   - a cadence (cycle period — an expectation, not a deadline, §9.2/§12.7),
#   - housekeeping (reconnect retry interval, log level, evidence paths).
#
# There is deliberately no threshold, no tolerance, no clamp, no scale, no
# offset, no debounce time and no "hold last value for X ms" key anywhere in
# this file, and the loader rejects any key it does not know (config.py).

# The CONFIGURED SIGNAL SET (bridge-design.md §2.1). The union of these groups'
# slots is the only set any rule counts: the startup rule R3, the write
# allowlist, the reconnect refresh and the rewrite after a detected server
# restart all say "every input in the configured signal set" and none of them
# names a number.
#
# This file carries the FORKLIFT GROUP, and the CELL GROUP IS ABSENT. Both
# halves of that sentence are observations of the server, taken 2026-08-06 with
# bridge/tools/probe_server_paths.py against the commissioned instance and
# recorded in bridge/EVIDENCE_ENVELOPE_BRIDGE.md §1:
#
#   * the `Forklift/` subtree is no longer a design value — the owner's build
#     (plc/forklift/TIA-BUILD-PROCEDURE.md, 2026-08-05) created it and every
#     §10 path this file names reads back with its documented type, no `_1`
#     suffix anywhere. That closes the condition the previous version of this
#     comment carried (opcua-nodes.md §10.2 step 6, bridge-design.md §12 item 10);
#   * the CPU in force runs project `safe_amr`, whose `DemoCell` interface
#     publishes `Forklift/` and `Link/BridgeHeartbeat` AND NOTHING ELSE. The M3
#     cell's `Input/`, `Output/` and `Status/` folders and `Link/BridgeLinkOk`
#     are not advertised and are not addressable — each returns `BadNoMatch`.
#     So the cell group is not omitted as a preference: a run carrying it
#     against this CPU fails at node resolution, which is the intended failure
#     mode (§3.1 N4) and not a configuration to keep around.
#
# A group absent from this list contributes nothing: no subscription, no slot,
# no node resolution, no write, no poll and no entry in the write allowlist
# (§2.1 G1). It is not a disabled feature that idles — it does not exist in
# this run, and its node and topic tables are absent below. The cell group's
# tables therefore left this file with the group, and a run against the M3
# demonstration-cell project restores them from git history rather than from a
# commented-out block: a table that is present but unused is a table nothing
# checks.
#
# A run against the test double, which serves both subtrees, uses
# bridge-double-both.yaml or bridge-double-forklift.yaml beside this file.
# The ENVELOPE group beside it carries `opcua-nodes.md` §12 — the autonomy
# envelope, the drive mode and the vehicle's report back. A THIRD group and not
# an enlargement of the forklift group: a group is one plant and one node-model
# section (§2.1), these six slots are §12's and live in four DBs of their own,
# and every committed count of the forklift group stays true untouched.
# §12.13 item 1 leaves that choice to the interface agent and asks for
# `bridge-design.md` to carry the group before any bridge work on it; the
# design document does not carry it yet, so this configuration is the bridge's
# proposal made runnable, and the m5-44 report requests the interface round.
groups: ["forklift", "envelope"]

opcua:
  # The bridge connects OUT to this endpoint. It never listens (invariant 4).
  # The value below is the commissioned PLCSIM Advanced instance
  # (EVIDENCE_LATENCY.md §B.0), and it is what the m3-26 run of Section B was
  # measured against. The test double lives on
  #   opc.tcp://127.0.0.1:4840/amr-agent/celldouble/
  # and must not be running while this endpoint is in use — swapping this one
  # line is the whole difference between the two (bridge-design.md §10).
  endpoint: "opc.tcp://192.168.53.1:4840"

  # The browse path crosses TWO namespaces (bridge-design.md §3.1 N2). Both are
  # resolved to an index by URI at every session establishment; neither index
  # appears here, neither is hardcoded, and neither is derived from the other.
  # A URI that is missing on the server is a connect failure, retried per §8.1 —
  # the bridge never scans the namespace array for a likely-looking entry and
  # never falls back to an index (§3.1 N4). The forklift group would add a
  # LEVEL, not a namespace: `DemoCell/Forklift/…` resolves under the same
  # interface node (§3.1 N7).
  namespace_uris:
    # Vendor-fixed. The S7-1500 publishes its ServerInterfaces folder here.
    server_interfaces: "http://www.siemens.com/simatic-s7-opcua"
    # TIA Portal derives this URI from the server interface name as
    # http://<interface name> and the field is not editable, so the
    # demonstration cell's interface `DemoCell` gives http://DemoCell
    # (ADR 0006). Renaming the interface changes this URI and breaks every
    # browse until this line follows it (§3.1 N5).
    interface: "http://DemoCell"

  # Security. "none" is the in-container test-double setting. For PLCSIM /
  # hardware set policy/certificate/private_key; the files live OUTSIDE this
  # repository and are referenced by absolute path (invariant 13).
  security_policy: "none"        # "none" | e.g. "Basic256Sha256,SignAndEncrypt"
  certificate_path: null         # absolute path, outside the repo
  private_key_path: null         # absolute path, outside the repo
  username: null                 # absolute path to a secret file, or null

  # A REQUEST, never a value the bridge may rely on (§3.2 S1). The server
  # revises it and the granted value is the only one any behaviour uses: the
  # commissioned S7-1500 granted 30 000 ms against a 3 600 000 ms request, so a
  # grant may land either side of this number. The keep-alive interval is
  # DERIVED from the granted value at every session establishment and is
  # deliberately absent from this file (§3.2 S3).
  requested_session_timeout_ms: 10000
  session_name: "amr-agent-bridge"

  # Reconnect housekeeping (§8.1). This is retry timing for a broken session,
  # not a gate on any signal: it never delays or suppresses a value that could
  # be sent.
  reconnect_interval_s: 1.0
  reconnect_backoff_max_s: 5.0

nodes:
  # Objects -> the server interface node, one element per level, each carrying
  # the namespace THAT element belongs to (§3.1 N3). `DemoCell` does not hang
  # directly under `Objects`: it is a child of the ServerInterfaces folder the
  # S7-1500 publishes, and that folder is Siemens-owned, so a single index
  # cannot qualify both elements (§3.1 N1).
  interface_path:
    - namespace: server_interfaces
      browse_name: "ServerInterfaces"
    - namespace: interface
      browse_name: "DemoCell"

  # ONE heartbeat for the whole process, shared by every configured group
  # (§2.1 G5, opcua-nodes.md §10.11: no second heartbeat exists). WRITABLE by
  # the bridge — its own liveness counter (§9.7).
  heartbeat:
    BridgeHeartbeat:               ["Link", "BridgeHeartbeat"]

  # One table per CONFIGURED group. Paths are relative to the interface node
  # (§3.1 N1) and live in the interface namespace.
  groups:
    forklift:
      # WRITABLE by the bridge — the plant's state (opcua-nodes.md §10.5), in
      # that section's order. `ForkliftObstacleInStopZone` is the one input
      # whose TRUE is the NON-permissive state; it is carried uninverted and
      # its DB start value is TRUE (§10.9).
      inputs:
        ForkliftForkHeight:            ["Forklift", "Input", "ForkliftForkHeight"]
        ForkliftLinearSpeed:           ["Forklift", "Input", "ForkliftLinearSpeed"]
        ForkliftObstacleInStopZone:    ["Forklift", "Input", "ForkliftObstacleInStopZone"]
        ForkliftObstacleMinDistance:   ["Forklift", "Input", "ForkliftObstacleMinDistance"]
      # READ and applied to the plant unchanged (§10.6): no ramp, no clamp, no
      # interlock, no zeroing. Not writable on the server either — the two
      # enforcements are independent (§10.3), and the CPU refuses the write.
      outputs:
        ForkliftTractionSpeedRef:      ["Forklift", "Output", "ForkliftTractionSpeedRef"]
        ForkliftSteerAngleRef:         ["Forklift", "Output", "ForkliftSteerAngleRef"]
        ForkliftForkSpeedRef:          ["Forklift", "Output", "ForkliftForkSpeedRef"]
      # READ for logging only, applied to nothing and used in no decision
      # (§4.9). `HmiLinkOk` is the PLC's verdict on the OTHER client's liveness.
      # The five `Forklift/Hmi/` requests and `Forklift/Link/HmiHeartbeat`
      # appear nowhere in this file, in either direction: the bridge never
      # touches the HMI's group, and the loader rejects a config that names it
      # (§4.10).
      diagnostics:
        ForkliftTeleopActive:          ["Forklift", "Status", "ForkliftTeleopActive"]
        ForkliftObstacleStopActive:    ["Forklift", "Status", "ForkliftObstacleStopActive"]
        ForkliftSpeedLimitActive:      ["Forklift", "Status", "ForkliftSpeedLimitActive"]
        ForkliftResetRequired:         ["Forklift", "Status", "ForkliftResetRequired"]
        HmiLinkOk:                     ["Forklift", "Link", "HmiLinkOk"]

    envelope:
      # WRITABLE by the bridge — the two values the VEHICLE'S OWN CONTROL LAYER
      # owns and the bridge carries (opcua-nodes.md §12.2: value owner and node
      # writer are different roles). `Forklift/Vehicle/` is the only writable
      # position this group has.
      inputs:
        ForkliftVehicleModeApplied:    ["Forklift", "Vehicle", "ForkliftVehicleModeApplied"]
        ForkliftVehicleHeartbeat:      ["Forklift", "Vehicle", "ForkliftVehicleHeartbeat"]
      # READ and republished unchanged (§12.10). NOT WRITABLE on the server:
      # the CPU refuses a write to `Forklift/Envelope/*` with BadNotWritable
      # (read back 2026-08-05, TIA-BUILD-PROCEDURE record table), which is the
      # server-side half of "a permission is not a command" (§12.2). The
      # bridge's own allowlist is the other half and is derived from the
      # `inputs` table above, so neither depends on the other.
      outputs:
        ForkliftDriveModeActive:       ["Forklift", "Mode", "ForkliftDriveModeActive"]
        ForkliftMotionEnable:          ["Forklift", "Envelope", "ForkliftMotionEnable"]
        ForkliftSpeedCeiling:          ["Forklift", "Envelope", "ForkliftSpeedCeiling"]
        ForkliftEquipmentPermit:       ["Forklift", "Envelope", "ForkliftEquipmentPermit"]
      # READ for logging only, applied to nothing and reaching no topic: the
      # operator's stop reaches the vehicle through the envelope and the
      # setpoints, never through a stop topic of its own (§12.7 PS6).
      diagnostics:
        ForkliftProcessStopActive:     ["Forklift", "ProcessStop", "ForkliftProcessStopActive"]
      # `Mode/HmiDriveModeRequest` and `ProcessStop/HmiProcessStopRequest` are
      # absent from every table above, in both directions. They are the HMI's,
      # and the loader rejects a config that names an `Hmi…` tag in a writable
      # position (§4.10).

ros:
  node_name: "forklift_plc_bridge"
  # One topic table per configured group.
  topics:
    forklift:
      # The vehicle layer's contract (opcua-nodes.md §10.10). Every one is
      # std_msgs/Float64 or std_msgs/Bool, whose payload is the single field
      # `data`: no index to resolve and no array to select from (§4.5).
      fork_height:           "/forklift/fork_height"
      linear_speed:          "/forklift/linear_speed"
      obstacle_in_stop_zone: "/forklift/obstacle/in_stop_zone"
      obstacle_min_distance: "/forklift/obstacle/min_distance"
      cmd_traction_speed:    "/forklift/cmd/traction_speed"
      cmd_steer_angle:       "/forklift/cmd/steer_angle"
      cmd_fork_speed:        "/forklift/cmd/fork_speed"
    envelope:
      # The vehicle layer's contract (opcua-nodes.md §12.10, and the same names
      # in agv/forklift/config.yaml's `topics:` block). The four the bridge
      # publishes are DELIBERATELY NOT under /forklift/cmd/: that namespace is
      # for commands applied to joints, and a bound or a permission does not
      # belong beside three setpoints (§12.10).
      mode_in_force:             "/forklift/mode/in_force"
      envelope_motion_enable:    "/forklift/envelope/motion_enable"
      envelope_speed_ceiling:    "/forklift/envelope/speed_ceiling"
      envelope_equipment_permit: "/forklift/envelope/equipment_permit"
      # Subscriptions (vehicle → PLC).
      mode_applied:              "/forklift/mode/applied"
      vehicle_heartbeat:         "/forklift/vehicle/heartbeat"
  # No `joint_name`: no configured group selects a joint out of a JointState
  # array, and the loader rejects the key when nothing needs it (§2.1 G1).
  # Subscription reliability for the Real-valued topics, matched to the
  # publisher (ros_gz_bridge publishes RELIABLE — verified with
  # `ros2 topic info -v`, logged again at every startup).
  analog_reliability: "reliable"     # "reliable" | "best_effort"

cycle:
  # 20 Hz. An interface expectation (opcua-nodes.md §9.2), NOT a deadline and
  # NOT a control parameter. The bridge is best effort (invariant 9). One
  # cadence for the whole process: a group adds slots, never a cadence (§5.1).
  period_s: 0.05
  # Diagnostics are read at a low rate so they stay visibly out of the
  # measured loop (§5).
  status_poll_period_s: 1.0

evidence:
  # Housekeeping. Names no machine: a relative path is resolved against the
  # bridge directory (the parent of config/), so this default works from any
  # checkout, in the container and in WSL alike. `~` and `$VARS` are expanded,
  # and an absolute path is used as written.
  #
  # This is a STEM, not the file name. The recorder appends a per-session suffix
  # (UTC second + pid) and creates the file exclusively, so no start can ever
  # truncate an earlier session's capture: sharing one path across seven bridge
  # restarts is how a day of 20 Hz data was lost on 2026-07-28. A measurement run
  # still gives its capture its own name with --evidence-csv, which is a stem too.
  csv_path: "evidence/latency-session.csv"
  flush_interval_s: 2.0

logging:
  level: "INFO"
