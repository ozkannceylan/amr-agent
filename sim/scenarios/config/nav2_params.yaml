# nav2_params.yaml - M3 navigation scenario parameters for the amr-agent
# project (brief m3-02).
#
# Tuned for the vendor RB-KAIROS bringup of sim/launch/warehouse_bringup.launch.py
# in the CPU-only project container (headless real-time factor ~0.1):
#   - use_sim_time everywhere; all tolerances/timeouts below are SIM seconds.
#   - TF frames as published by the vendor stack: robot_odom ->
#     robot_base_footprint (robotnik_base_control) plus robot_state_publisher.
#   - Scan: /robot/front_laser/scan (SICK S300 sim, 270 samples, 10 m).
#   - Odom: /robot/robotnik_base_control/odom.
#   - Velocity out: geometry_msgs/Twist -> the vendor controller's
#     /robot/robotnik_base_control/cmd_vel_unstamped (remapped in the launch
#     file; enable_stamped_cmd_vel stays false, the Jazzy default).
#   - Base is mecanum (holonomic-capable) but is driven diff-drive style
#     (vx + wz only): DWB with vy locked to zero. This is the configuration
#     that was actually verified to reach goals in this container; AMCL uses
#     the omni motion model so any residual lateral slip is still tracked.
#   - Footprint: RB-KAIROS platform ~0.98 x 0.67 m -> rectangle below.
#   - Speeds kept low (0.45 m/s) so the ~0.1 RTF headless sim tracks the
#     command; bond timeouts disabled because heartbeats starve at this RTF.

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: robot_odom
    base_frame_id: robot_base_footprint
    scan_topic: /robot/front_laser/scan
    robot_model_type: "nav2_amcl::OmniMotionModel"
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    laser_max_range: 10.0
    laser_min_range: 0.05
    max_beams: 60
    update_min_d: 0.10
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    z_hit: 0.7
    z_rand: 0.3
    sigma_hit: 0.2
    do_beamskip: false
    set_initial_pose: false     # run_scenario.py publishes /initialpose
    always_reset_initial_pose: false
    tf_broadcast: true

map_server:
  ros__parameters:
    use_sim_time: true
    # yaml_filename is passed by nav_scenario.launch.py (absolute path).

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: robot_base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 2.0
      footprint: "[[0.49, 0.34], [0.49, -0.34], [-0.49, -0.34], [-0.49, 0.34]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_scan rear_scan
        front_scan:
          topic: /robot/front_laser/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          raytrace_max_range: 7.0
          expected_update_rate: 0.0
        rear_scan:
          topic: /robot/rear_laser/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          raytrace_max_range: 7.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 5.0        # low: headless RTF ~0.1, no point spinning
    enable_stamped_cmd_vel: false    # vendor cmd_vel_unstamped takes Twist
    odom_topic: /robot/robotnik_base_control/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5    # vy unused (diff-drive style)
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.4
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Diff-drive-style limits on the mecanum base: vy locked to 0.
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.45
      max_vel_y: 0.0
      max_vel_theta: 0.7
      min_speed_xy: 0.0
      max_speed_xy: 0.45
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: robot_odom
      robot_base_frame: robot_base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 3.0
      publish_frequency: 1.0
      transform_tolerance: 2.0
      footprint: "[[0.49, 0.34], [0.49, -0.34], [-0.49, -0.34], [-0.49, 0.34]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_scan rear_scan
        front_scan:
          topic: /robot/front_laser/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          expected_update_rate: 0.0
        rear_scan:
          topic: /robot/rear_laser/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 5.0
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: robot_odom
    global_frame: map
    robot_base_frame: robot_base_footprint
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.7
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.5

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: robot_base_footprint
    odom_topic: /robot/robotnik_base_control/odom
    bt_loop_duration: 20
    default_server_timeout: 40
    wait_for_service_timeout: 5000
    transform_tolerance: 1.0
