# config.yaml - named constants for the vehicle side forklift nodes.
#
# Rule for this directory: NO behavioural constant is written inline in a
# Python file. Every rate, limit, threshold, timeout, joint name and topic
# name the nodes use is read from here, so that a value can be changed and
# reviewed without reading code, and so that the contract table in
# README.md has exactly one source.
#
# Authority. model.sdf owns the geometry. The values under `model:` below
# are a MIRROR of numbers that also appear in model.sdf, because SDF cannot
# be read as YAML and the nodes need them. If the two ever disagree,
# model.sdf is right and this file is wrong. EVIDENCE_MODEL.md records the
# diff that shows they agree.
#
# Nothing here is a safety parameter. `obstacle.stop_distance_m` is a
# process comfort zone evaluated in Python over a network carried scan; the
# protective stop and safe torque off are onboard and hardwired and appear
# nowhere in this file (invariant 1).

model:
  # Spawned model name. The gz topic names below do NOT depend on it: every
  # gz system in model.sdf states its topic explicitly for that reason.
  name: Forklift

  # Mirrors of model.sdf geometry.
  wheel_radius_m: 0.12          # drive_wheel cylinder radius
  steer_limit_rad: 1.31         # steer_joint mechanical stop, symmetric
  fork_travel_min_m: 0.0        # mast_joint lower limit
  fork_travel_max_m: 1.6        # mast_joint upper limit

  # Tricycle geometry, DERIVED from model.sdf link poses rather than
  # written there as a single number, which is why these two are the only
  # mirrors in this block that are not a verbatim copy:
  #
  #   steer_link      <pose>  0.55 0 0.24 ...   the steer axis
  #   rear_wheel_left <pose> -0.50 0.36 0.12    rear axle
  #   rear_wheel_right<pose> -0.50 -0.36 0.12   rear axle
  #
  # wheelbase        = 0.55 - (-0.50) = 1.05 m
  # rear axle x in base_link = -0.50 m, so base_link stands 0.50 m
  # FORWARD of the rear axle midpoint. That offset is not cosmetic: the
  # rear axle midpoint is the only point of a tricycle whose velocity is
  # purely longitudinal, so base_link necessarily has a LATERAL velocity
  # component d*yawrate whenever the vehicle turns, and wheel odometry
  # that ignores it reports a body twist the vehicle does not have.
  # scripts/wheel_odometry.py derives the pose of the rear axle exactly
  # and then places base_link on it. scripts/check_odometry.py checks
  # both numbers against model.sdf rather than trusting this comment.
  wheelbase_m: 1.05
  rear_axle_offset_m: -0.50

  # Joint names as they appear in the bridged JointState message. The
  # mast joint is the only one forklift_io.py needs; the other two are
  # what wheel_odometry.py reads, because odometry is the one function
  # that cannot address a joint through a topic. The full joint list is a
  # contract and its home is the table in README.md.
  mast_joint_name: mast_joint
  drive_joint_name: drive_wheel_joint
  steer_joint_name: steer_joint

limits:
  # Largest traction speed this node will pass on. A request beyond it is
  # clamped, not rejected: the vehicle keeps moving at the limit.
  traction_speed_max_mps: 1.50

  # Largest carriage travel rate the node will integrate. Also the slew
  # limit on the position target, which is what actually makes the lift
  # ramp rather than step.
  fork_speed_max_mps: 0.15

rates:
  # State publication rate for /forklift/fork_height and
  # /forklift/linear_speed.
  io_publish_hz: 10.0
  # Rate at which the fork position target is integrated and republished.
  # Faster than the state rate so the target ramp is smooth.
  io_command_hz: 20.0
  # Publication rate for both /forklift/obstacle/* topics.
  obstacle_publish_hz: 10.0

odometry:
  # ================ WHEEL ODOMETRY, AND ITS ERROR MODEL ================
  #
  # Read by scripts/wheel_odometry.py, which computes the vehicle's own
  # motion estimate from its own joint states through tricycle
  # kinematics. It is ONE SENSOR'S OPINION, not the vehicle's pose: it
  # is an input to the EKF exactly as the IMU is, and the EKF is the
  # single owner of odom -> base_link (invariant 10).
  #
  # THE HONESTY RULE THAT GOVERNS EVERY NUMBER BELOW. None of these was
  # chosen to make the drift come out at a convenient value. Each is
  # derived from a stated property of the modelled hardware, the
  # derivation is in EVIDENCE_ODOMETRY.md section 4, and the resulting
  # drift is reported whatever it turned out to be.
  #
  # WHAT IS *NOT* IN THIS BLOCK, AND THAT IS THE POINT: WHEEL SLIP. The
  # physics engine already produces it. Over the 3.989 m arc measured by
  # brief m5-07b the drive wheel turned 4.065 m of tread, and every
  # metre of that discrepancy arrives free from the contact model. Adding
  # a slip term here would be inventing an error the simulation already
  # has, and it would be the exact move the honesty rule forbids.

  # Rate at which the estimate is integrated and published. 50 Hz is the
  # rate an AGV odometry loop typically runs at, an order under the
  # 500 Hz the joint states arrive at, so each cycle differences a real
  # displacement rather than quantiser dither.
  publish_hz: 50.0

  # ---- the two encoders ----
  #
  # DRIVE WHEEL, incremental. 1024 pulses per revolution read in
  # quadrature = 4096 counts/rev, the commonest catalogue resolution for
  # a motor-mounted incremental encoder. Quantisation step
  # 2*pi/4096 = 1.53398e-3 rad, which at the 0.12 m wheel is 0.184 mm of
  # tread per count. The node quantises the ABSOLUTE wheel angle onto
  # that grid and differences it, which is what an incremental encoder
  # physically does; quantising the difference instead would lose the
  # residue and drift by a count per cycle.
  drive_encoder_counts_per_rev: 4096

  # STEER AXIS, absolute. 12-bit single-turn, 4096 counts over 2*pi, the
  # commonest catalogue resolution for an absolute steer-axis encoder.
  # Same 1.53398e-3 rad step, = 0.0879 deg.
  steer_encoder_counts_per_rev: 4096

  # STEER ZERO OFFSET, and where the value comes from. A steer encoder's
  # zero is set against the mechanical straight-ahead by a calibration,
  # and no calibration can resolve better than ONE COUNT. So the
  # modelled residual IS one count, 1.53398e-3 rad = 0.0879 deg. It is
  # deliberately the smallest defensible value rather than a plausible
  # workshop tolerance, because this is the term that dominates a
  # tricycle's heading error and it must not be inflated: driving
  # straight, the vehicle believes it is turning at
  # v/L * tan(0.0879 deg) = 1.46 mrad/s at 1 m/s, which is 5.0 deg per
  # 60 s of straight running with no slip anywhere.
  #
  # The sign is positive and arbitrary; a real vehicle's is whatever its
  # last calibration left. Nothing downstream may assume it.
  steer_zero_offset_rad: 0.00153398

  # ROLLING RADIUS THE NODE BELIEVES, against the 0.12 m the physics
  # actually rolls on. A loaded polyurethane drive tyre's effective
  # rolling radius is SMALLER than its free radius, so a vehicle
  # calibrated on a free or new tyre over-reports distance. 0.5% is the
  # load-compression figure for a PU drive wheel of this size:
  # 0.12 * 1.005 = 0.1206 m.
  #
  # THE SIGN IS THE PESSIMISTIC ONE ON PURPOSE. Physics slip already
  # makes the wheel over-turn relative to the ground, so an error that
  # over-reports distance COMPOUNDS with slip instead of cancelling it.
  # Choosing the other sign would have flattered the result by half a
  # per cent and there would have been no way to see it in the output.
  # Tyre wear, which is larger and the same sign, is not modelled: it is
  # what a recalibration removes.
  rolling_radius_m: 0.1206

  # ---- the covariances this node publishes, and their derivation ----
  #
  # These are the numbers that decide how much the EKF believes the
  # wheels against the IMU, so they are derived rather than chosen. All
  # three are evaluated at a nominal 1.0 m/s, stated because a
  # covariance from a velocity-dependent error term is only meaningful
  # with the velocity named. dt = 0.02 s, q = 1.53398e-3 rad,
  # r = 0.1206 m, L = 1.05 m, d = 0.50 m.
  #
  # vx.  Two terms.
  #   quantisation: the difference of two independent uniform
  #     quantisation errors has sigma q/sqrt(6) = 6.2624e-4 rad, so
  #     sigma_s = r * 6.2624e-4 = 7.5525e-5 m and
  #     sigma_v = 7.5525e-5 / 0.02 = 3.7763e-3 m/s
  #   rolling radius: 0.5% of 1.0 m/s = 5.0e-3 m/s
  #   sigma_vx = sqrt(3.7763e-3^2 + 5.0e-3^2) = 6.2658e-3 m/s
  vx_variance: 3.93e-05

  # vyaw.  yawrate = v * tan(delta) / L, so d(yawrate)/d(delta) at
  #   delta = 0 is v/L = 0.95238 1/s.
  #   quantisation: sigma_delta = q/sqrt(12) = 4.4281e-4 rad
  #                 -> 4.2172e-4 rad/s
  #   zero offset:  one count, 1.53398e-3 rad -> 1.46094e-3 rad/s
  #   sigma_vyaw = sqrt(4.2172e-4^2 + 1.46094e-3^2) = 1.52059e-3 rad/s
  #
  # Compare the IMU: model.sdf declares the gyro at 1.745e-3 rad/s of
  # white noise, so the two sources are within a factor of 1.15 of each
  # other on the SAME quantity and the EKF genuinely blends them rather
  # than one drowning the other. Neither number was moved to arrange
  # that; it is what a 12-bit steer encoder and a BMI088 happen to be.
  vyaw_variance: 2.312e-06

  # vy is not measured. It is d * yawrate exactly, a kinematic
  # consequence of base_link standing 0.50 m ahead of the rear axle, so
  # its variance is d^2 times vyaw's: 0.25 * 2.312e-06 = 5.78e-07.
  vy_variance: 5.78e-07

  # Pose covariance published with the estimate. The pose of a dead
  # reckoning estimate has UNBOUNDED error, and no honest fixed number
  # exists for it, so this node publishes a large constant and the EKF
  # is configured to fuse the TWIST only - never the pose. The value
  # exists so the message is well formed and so that anything which
  # ignores this warning and fuses the pose is told the pose is worth
  # nothing.
  pose_variance_unused: 1000.0

  # A joint state older than this counts as no joint state. The node
  # then publishes nothing rather than integrating a stale sample across
  # a gap, because an integrator that fills gaps invents distance.
  joint_state_timeout_s: 0.50

standstill:
  # ============ THE VEHICLE IS NOT ROTATING, AND HOW IT KNOWS ============
  #
  # Read by scripts/wheel_odometry.py, which decides the verdict because
  # it already owns the encoder model, and by scripts/imu_gate.py, which
  # acts on it. Nothing else forms this datum (invariant 10).
  #
  # THE PHYSICS THIS RESTS ON. A tricycle's instantaneous centre of
  # rotation lies on the line of the rear axle, because the two passive
  # wheels cannot slide sideways. The drive wheel's contact point does
  # NOT lie on that line - it stands one wheelbase in front of it - so
  # the body cannot rotate without the drive wheel travelling. Writing
  # the drive wheel's velocity in the body frame,
  #
  #     v_D = (v_R, psidot * L)     so     |v_D| >= |psidot| * L
  #
  # which integrates to |dpsi| <= (tread travelled) / L. ONE DRIVE
  # ENCODER COUNT IS 2*pi/4096 rad of wheel = 1.53398e-3 * 0.1206 m =
  # 1.850e-4 m of tread, so a count that does not change bounds the body
  # rotation over that interval at 1.850e-4 / 1.05 = 1.762e-4 rad, which
  # is 0.0101 deg. That is the whole argument: when the encoders report
  # no motion the vehicle is not turning, so whatever the gyro reports in
  # that condition is bias and not rotation.
  #
  # THIS IS NOT A SAFETY FUNCTION. It gates one measurement channel of
  # one estimator. It inhibits no actuator, latches nothing and stops
  # nothing; the protective stop and safe torque off are onboard and
  # hardwired and appear nowhere in this file (invariant 1).

  # THE TRAILING WINDOW. The verdict is a RATE TEST over the last
  # `window_s`, not a total since the last count change: over the window
  # the drive count must not have changed at all, and the steer count by
  # no more than `steer_tolerance_counts`. Holding under one drive count
  # for 0.50 s bounds the drive wheel's tread speed at
  # 1.850e-4 / 0.50 = 0.37 mm/s and the body's rotation rate at
  # 0.0202 deg/s. It also costs 0.50 s of ungated gyro at the start of
  # every stop, which is the conservative direction and is deliberate:
  # the gate opens on the FIRST count of motion and closes only after
  # the window, so it is late to trust the standstill and instantaneous
  # to distrust it.
  #
  # WHY A WINDOW AND NOT A REFERENCE INSTANT, WHICH IS WHAT m5-07d
  # WROTE. A test of the form "both counts unchanged SINCE t0", with t0
  # receding for as long as the vehicle stands, is a statement about
  # TOTAL displacement over an unbounded interval. No axis of a real
  # machine satisfies it for ever: any creep, however slow, eventually
  # crosses a count, and the whole held interval is then discarded and
  # the gyro gate re-opened for a full window. Measured over a 210 s
  # idle AFTER a drive, that cost 14.4 s of ungated gyro and 2.11 deg of
  # heading, GROWING with how long the vehicle stood there
  # (EVIDENCE_ODOMETRY.md section 13). What the gate needs at each
  # sample is "the body is not rotating now", and that is a rate.
  window_s: 0.50

  # WHY THE STEER COUNT IS IN THE TEST TOO, although the bound above
  # does not need it. A parked forklift can steer on the spot, and a
  # steered wheel scrubbing against the floor is the one manoeuvre in
  # which the drive encoder could stay still while the contact patch
  # slides. Requiring both axes still means "no wheel is moving at all",
  # which is a stronger statement than the bound needs.
  #
  # IT DOES NOT COST NOTHING DURING AN IDLE. m5-07d said it did, on the
  # evidence of two idles taken at bringup with every joint still at its
  # spawn value. After a DRIVE the steer axis relaxes: measured over a
  # 210 s post-drive idle it swept 27 counts (2.37 deg), one count at a
  # time, roughly one count every eleven seconds, while the drive count
  # did not move once after the first 0.30 s. Under the old
  # exact-equality test those single steer counts were the ENTIRE leak.
  include_steer_axis: true

  # HOW MUCH THE STEER COUNT MAY MOVE ACROSS THE WINDOW, AND WHERE THE
  # NUMBER COMES FROM. It is ONE COUNT, and it is not a fitted value: it
  # is the same one count of zero uncertainty this file already declares
  # for that encoder in `steer_zero_offset_rad` above. A calibration
  # cannot resolve the steer zero to better than one count, so the
  # vehicle does not know its own steer angle to better than one count,
  # and a test that demands the reading be IDENTICAL is asking the axis
  # to hold to a precision its own model does not claim.
  #
  # WHAT IT PERMITS, STATED RATHER THAN ASSUMED. One count across a
  # 0.50 s window is a steer rate of 1.53398e-3 / 0.50 = 3.07e-3 rad/s
  # = 0.176 deg/s. Against the axis's own declared maximum of 2.0 rad/s
  # (model.sdf, steer_joint <velocity>) that is 0.15 % of full rate, so
  # any commanded steer motion crosses it by three orders of magnitude
  # and opens the gate at once. Against the measured post-drive
  # relaxation of 0.09 counts/s it is 20x larger, which is why the
  # relaxation no longer re-opens the gate.
  #
  # THE DRIVE AXIS HAS NO SUCH TOLERANCE AND MUST NOT BE GIVEN ONE. Its
  # zero-change test IS the bound: a tolerance of N counts multiplies
  # the permitted body rotation by (N + 1), so one count of drive
  # tolerance would raise the bound from 0.0202 deg/s to 0.0404 deg/s -
  # 2.4 deg/min of REAL rotation the gate would then hide, which is the
  # failure direction this whole mechanism is designed against. The
  # drive tolerance is written as a constant in wheel_odometry.py, not
  # as a parameter here, so that it cannot be raised by editing a file
  # that reviews as configuration.
  steer_tolerance_counts: 1

  # A verdict older than this counts as NO verdict, and the gate then
  # FAILS OPEN - the gyro is fused exactly as it was before this
  # mechanism existed. The failure directions are not symmetric: a gate
  # stuck open costs the drift this brief measures, while a gate stuck
  # closed would hide a real rotation from the filter. So every
  # uncertainty resolves to open. 0.20 s is ten missed verdicts at the
  # 50 Hz they are published at.
  verdict_timeout_s: 0.20

imu:
  # Nothing in this block is a noise parameter. model.sdf owns the
  # sensor's noise, the message carries the covariance gz derives from
  # it, and no node here re-states either (invariant 10). What lives
  # here is only what a node needs in order to CHECK the stream.
  #
  # Declared sample rate, mirrored from model.sdf's <update_rate>.
  # scripts/check_odometry.py compares the measured rate against it
  # rather than quoting one of the two.
  publish_hz: 100.0

  # A sample older than this counts as no IMU. Matches the EKF's
  # sensor_timeout in ekf.yaml.
  timeout_s: 0.20

obstacle:
  # WHICH CHANNEL THIS READS, AND WHY IT IS THAT ONE. obstacle_zone.py
  # subscribes to `topics.safety_scanner_front_measurement`: the NON-SAFE
  # MEASUREMENT CHANNEL of the front safety scanner, at z = 0.15 m. It is
  # a process comfort zone reading a process output, and it is the low
  # plane M4 demonstrated, 0.10 m below the 0.25 m scanner it replaces.
  #
  # It is NOT fed by the navigation lidar. That sensor's plane is z =
  # 1.80 m, where a pallet, a crate and the arena's 0.60 m walls are all
  # invisible, so a comfort zone computed there would read clear in front
  # of an obstacle the vehicle is about to hit. Owner ruling of
  # 2026-07-30, docs/briefs/m5-06-measurement-channel.md.
  #
  # It is NOT the safe channel either, and no value in this file is. The
  # device class modelled emits a safe output AND a separate non-safe
  # measurement channel; this node reads the second one. The measurement
  # channel must never implement a safety function.
  #
  # Half width of the sector examined about the driving direction.
  # 0.5236 rad is 30 deg, so the sector is 60 deg wide.
  sector_half_angle_rad: 0.5236

  # Centre of that sector, EXPRESSED IN THE ANGLE COORDINATE OF THE SCAN
  # THE NODE READS, which is the scan's own frame. It is not a free
  # parameter: it is minus the mount yaw of the sensor feeding the node,
  # so that the sector stays centred on straight ahead in the VEHICLE
  # frame whatever corner the sensor sits on.
  #
  #   front safety scanner mount yaw   = +0.7853982 rad (+45 deg)
  #   sector centre in the scan frame  = -0.7853982 rad (-45 deg)
  #   sector in the scan frame         = -75 deg .. -15 deg
  #   sector in the vehicle frame      = -30 deg .. +30 deg, ahead
  #
  # Zero was correct only while the scan came from a sensor mounted at
  # yaw 0. Leaving it at zero here would have watched the diagonal
  # 15..75 deg off the bow and called it "straight ahead".
  # scripts/check_sensor_frames.py checks this value against model.sdf
  # rather than trusting the arithmetic above.
  sector_centre_rad: -0.7853982

  # A valid sample at or below this range sets in_stop_zone. This is a
  # process threshold and it is not a protective field.
  stop_distance_m: 1.20

  # A scan older than this counts as no scan at all. The evaluator then
  # reports the obstacle present state, never the clear state.
  scan_timeout_s: 0.50

  # Distance reported when there is no usable measurement. Zero is chosen
  # deliberately: it is the most pessimistic distance the topic can carry,
  # so a consumer that only reads the distance still sees the worst case.
  unknown_distance_m: 0.0

logging:
  # Period for throttled "waiting for data" messages, so a missing source
  # is visible in the log without flooding it.
  throttle_s: 5.0

qos:
  # Depth of every publisher and subscriber queue in these two nodes.
  # Sensor and state data are latest value wins, so the queue is short.
  depth: 10

# Default spawn pose used by launch/vehicle.launch.py. Overridable on the
# command line; a scenario that wants a different start pose passes it
# rather than editing this file.
spawn:
  x_m: 0.0
  y_m: 0.0
  z_m: 0.05
  yaw_rad: 0.0

frames:
  # TF frame names. MIRRORS, like the `model:` block above: model.sdf is
  # the authority for both the names and the poses, and
  # scripts/sensor_tf.py reads them from it rather than from here.
  # scripts/check_sensor_frames.py diffs this block against model.sdf, so
  # a disagreement is a failing check and not a silent drift.
  #
  # The parent carries the model name and the children do not, which looks
  # inconsistent and is not ours to fix: `base` is what model.sdf's
  # OdometryPublisher already puts in <robot_base_frame>, and each child is
  # what that sensor's <gz_frame_id> already puts in its scan header. Those
  # are the strings the messages actually carry, and a TF tree that renames
  # either of them stops resolving.
  base: forklift/base_link
  safety_scanner_front: safety_scanner_front_link
  safety_scanner_rear: safety_scanner_rear_link
  nav_lidar: nav_lidar_link
  imu: imu_link

  # The odometry frame. It is a MIRROR of model.sdf's <odom_frame>, like
  # `base` above, and it is written here because ekf.yaml and
  # scripts/wheel_odometry.py both have to name it and neither may
  # invent it. The EKF is the sole publisher of the edge
  # forklift/odom -> forklift/base_link; the name did not change when
  # ownership of that edge moved from the simulator to the EKF, which is
  # the whole reason it was stated explicitly in the model.
  odom: forklift/odom

topics:
  # Simulation clock, bridged one to one.
  clock: /clock

  # ---- written by forklift_io.py, carried by the bridge into gz ----
  # Same name on both sides of the bridge: these ARE the model's raw
  # command inputs and the identity is the point.
  gz_steer_cmd: /forklift/gz/steer_cmd
  gz_traction_cmd: /forklift/gz/traction_cmd
  gz_fork_cmd: /forklift/gz/fork_cmd

  # ---- produced by gz, renamed by the bridge onto the ROS names below --
  # The gz name keeps the /forklift/gz/ prefix so that a gz side topic list
  # reads as one namespace; the ROS name is the one vehicle software uses.
  gz_joint_state: /forklift/gz/joint_state
  gz_odom: /forklift/gz/odom
  gz_scan_nav: /forklift/gz/scan_nav
  gz_imu: /forklift/gz/imu

  # THE GROUND-TRUTH odom -> base_link TRANSFORM. RETIRED AS A SOURCE
  # ON 2026-07-31 AND STILL DECLARED HERE, WHICH IS NOT A CONTRADICTION.
  #
  # model.sdf's OdometryPublisher still publishes it, because it is the
  # REFERENCE that estimator error is measured against and phase 2 was
  # always going to keep it. What changed is that nothing bridges it onto
  # /tf any more: launch/vehicle.launch.py's ground_truth_tf argument now
  # defaults to FALSE, the EKF owns odom -> base_link, and the launch
  # file refuses outright to start with both sources on (see the
  # exclusivity check in that file).
  #
  # It is still a topic name this directory owns, so it is still
  # declared. It is consumed by exactly one thing:
  # scripts/check_odometry.py, the measurement harness, which is not an
  # estimator and does not steer anything. NOTHING THAT NAVIGATES MAY
  # READ IT. Feeding it to the EKF, to SLAM, to AMCL or to any node whose
  # output an estimator consumes recreates the circularity the whole
  # two-phase plan exists to remove: an estimate scored against its own
  # input cannot be wrong.
  gz_tf_ground_truth: /forklift/gz/tf_ground_truth

  joint_states: /forklift/joint_states

  # GROUND TRUTH TOO, and the name STILL does not say so - the one place
  # this directory cannot fix. /forklift/odom is a cross-layer contract
  # (sim/launch/forklift_bringup.launch.py bridges it,
  # sim/scenarios/run_forklift_rehearsal.py reads it,
  # scripts/forklift_io.py derives /forklift/linear_speed from it) and
  # renaming it from here would break a layer this directory may not
  # edit. The request stands, now with more force than when
  # docs/reports/m5-07b-odom-tf.md first made it: the ESTIMATE now
  # exists, it is odom_filtered below, and this name is the reference.
  # The rename wanted is /forklift/odom -> /forklift/odom_ground_truth
  # (gz side /forklift/gz/odom_ground_truth), in one coordinated brief.
  #
  # Until it happens, THREE pose streams exist on this vehicle and the
  # rule for telling them apart is written in README.md, "Three pose
  # streams, one owner": this one is truth, odom_wheel is one sensor's
  # opinion, odom_filtered is the estimate and it alone owns the
  # transform.
  odom: /forklift/odom
  tf: /tf

  # ---- the IMU ----
  # gz name and ROS name differ only by the /gz/ segment, like the other
  # feedback channels. The ROS message carries NO usable orientation and
  # that is deliberate: see model.sdf's <enable_orientation> block, and
  # the warning under "The orientation trap" in README.md.
  imu: /forklift/imu

  # THE GYRO CHANNEL AS THE FILTER ACTUALLY SEES IT. scripts/imu_gate.py
  # subscribes to `imu` above and republishes here, and the ONE thing it
  # does is stop republishing while `wheel_standstill` below is true: a
  # gyro reading taken when the encoders say the vehicle is not rotating
  # is bias, not rotation, so it is not offered to the filter as a
  # rotation measurement. `ekf.yaml` names THIS topic as imu0 and never
  # the raw one.
  #
  # A GAP IN THIS TOPIC IS THE SIGNAL, not a fault. The gate suppresses
  # rather than rewrites, deliberately: a republished message carrying a
  # zeroed rate would be a sensor reading this vehicle never took, and
  # any later consumer would have no way to tell it from one it did.
  # Silence cannot be mistaken for a measurement.
  imu_gated: /forklift/imu_gated

  # THE ENCODER-DERIVED STANDSTILL VERDICT. std_msgs/Bool at 50 Hz from
  # scripts/wheel_odometry.py, which owns it because it owns the encoder
  # model; consumed by scripts/imu_gate.py and by nothing else. The
  # physics behind it and the window are in the `standstill:` block
  # above. It is an estimator input, not a machine state: it does not
  # mean the vehicle is enabled, parked, safe or stopped, and nothing
  # may read it as any of those.
  wheel_standstill: /forklift/wheel_standstill

  # ---- the two estimator topics ----
  #
  # ONE SENSOR'S OPINION. Wheel odometry integrated from this vehicle's
  # own joint states through its tricycle kinematics, by
  # scripts/wheel_odometry.py, carrying the encoder and calibration
  # errors of the `odometry:` block above. It is an INPUT to the EKF in
  # the same sense the IMU is, it publishes NO transform, and no
  # consumer should treat it as the vehicle's pose.
  odom_wheel: /forklift/odom_wheel

  # THE ESTIMATE. robot_localization's EKF, fusing odom_wheel and imu.
  # This node, and no other, publishes forklift/odom -> forklift/base_link
  # on /tf. It is the pose Nav2, SLAM and AMCL see, and it is the one
  # datum in this file with exactly one owner by construction rather than
  # by convention (invariant 10).
  odom_filtered: /forklift/odom_filtered

  # The NAVIGATION lidar on the ROS side. Its consumers are SLAM, AMCL and
  # the Nav2 costmaps, and it is the ONLY input any of them may have. No
  # safety scanner channel feeds a navigation consumer (ADR 0011). The
  # generic name is kept because it is what a SLAM node expects to be
  # remapped from, and because it names the vehicle's map-building scan.
  scan: /forklift/scan

  # ---- the two channels of each safety scanner ----
  # The device class modelled emits TWO outputs: a safe one and a separate
  # NON-SAFE MEASUREMENT channel that its datasheet provides for HMI,
  # diagnostics and process use while stating it must not be used for
  # safety-related tasks. In this simulation the gpu_lidar scan IS the
  # measurement channel, and the safe (OSSD-equivalent) verdict is DERIVED
  # from it by field evaluation, which is what the real device does
  # internally. The derivation is m5-12's and appears nowhere here.
  #
  # THE RULE, CHECKABLE BY EYE: every channel a subscriber can reach is a
  # measurement channel. The safe channel has no topic on either
  # transport, ever.
  #
  # HOW that safe channel reaches the F-program is DESIGN INTENT, NOT
  # SETTLED FACT. ADR 0011 decision 2 makes it configured F-I/O (an
  # ET 200SP F-DI parameterised as the scanner's OSSD pair) whose channel
  # values the S7-PLCSIM Advanced API drives by tag name, this project's
  # analogue of the copper an OSSD pair runs on. That path has never been
  # run: whether this PLCSIM Advanced version simulates F-I/O at all, and
  # whether the API writes a configured F-DI's channel values by tag
  # name, are settled in the tool by plc/forklift-safety/FIO-FEASIBILITY.md
  # (brief m5-03), whose verdict is still blank. If either answers no, the
  # named fallback is the standard-DB stand-in of
  # plc/forklift-safety/SPEC.md, labelled a stand-in wherever it appears.
  # No name or value in THIS file changes under either answer.
  #
  # The safe channel is derived from the SAME rays as the measurement
  # channel. That is honest device modelling and it is NOT redundancy:
  # the two share every failure of the rays. See README.md, "Two channels
  # per safety scanner".
  #
  # THE MEASUREMENT CHANNEL IS NON-SAFE AND MUST NEVER IMPLEMENT A SAFETY
  # FUNCTION. A rendered depth image has no integrity, no OSSD, no fault
  # reaction and no diagnostic coverage, and it crosses a bridge and a
  # network to get here (invariant 1).
  gz_safety_scanner_front_measurement: /forklift/gz/safety_scanner_front/measurement
  gz_safety_scanner_rear_measurement: /forklift/gz/safety_scanner_rear/measurement

  # Bridged into ROS, because a process consumer exists for it:
  # obstacle_zone.py, the M4 comfort stop, whose plane this is.
  safety_scanner_front_measurement: /forklift/safety_scanner_front/measurement

  # THE REAR MEASUREMENT CHANNEL, bridged 2026-08-06 (m5-12b) UNDER THE
  # RESERVED NAME. Until then this block said "no ROS name, because no
  # process consumer exists for it ... when a consumer appears, the name
  # it takes is /forklift/safety_scanner_rear/measurement, by the same
  # pattern". THAT CONSUMER NOW EXISTS: scripts/field_evaluation.py needs
  # both devices, because the protective verdict is the UNION of the two
  # (FIELD-EVALUATION.md section 7) and the fork direction is the rear
  # device's to watch. The reserved name is taken verbatim; nothing was
  # renamed and no second name was invented.
  #
  # IT IS STILL THE NON-SAFE MEASUREMENT CHANNEL, exactly like its front
  # twin, and bridging it changes nothing about that. The safe channel of
  # either device still has no topic on either transport (see the block
  # above, and README.md "Two channels per safety scanner"). The one
  # prohibition that matters is unchanged: NO SCANNER CHANNEL FEEDS A
  # NAVIGATION CONSUMER - SLAM, AMCL and the costmaps read
  # `scan` (the navigation lidar) and nothing else.
  safety_scanner_rear_measurement: /forklift/safety_scanner_rear/measurement

  # ---- vehicle side command inputs, engineering units ----
  cmd_traction_speed: /forklift/cmd/traction_speed
  cmd_steer_angle: /forklift/cmd/steer_angle
  cmd_fork_speed: /forklift/cmd/fork_speed

  # ---- vehicle side derived state ----
  fork_height: /forklift/fork_height
  linear_speed: /forklift/linear_speed
  obstacle_in_stop_zone: /forklift/obstacle/in_stop_zone
  obstacle_min_distance: /forklift/obstacle/min_distance

  # ---- the Nav2 command chain (nav2.yaml, m5-10) ----
  #
  # THE THREE TOPICS OF ADR 0014 SEAM (b), IN ORDER. None of them leaves
  # the vehicle; seam (b) never crosses OPC UA at any granularity.
  #
  #   cmd_vel           controller_server's 20 Hz output
  #   cmd_vel_smoothed  velocity_smoother's output, ramp limited against
  #                     the EKF's measured twist
  #   -> scripts/cmd_vel_to_tricycle.py -> cmd_steer_angle and
  #      cmd_traction_speed above, which are forklift_io.py's inputs
  #
  # BOTH CARRY geometry_msgs/Twist, NOT TwistStamped. On Jazzy every nav2
  # node's `enable_stamped_cmd_vel` defaults FALSE; nav2.yaml pins it
  # rather than inheriting it, because a subscriber of the wrong type
  # receives nothing at all and logs nothing about it.
  #
  # THE ENVELOPE GATE SITS BETWEEN cmd_vel_smoothed AND THE CONVERTER,
  # which is ADR 0014 seam (b)'s "below the smoother" (m5-11). It is named
  # here now, and its constants are the `envelope:` block at the end of
  # this file. The converter's input topic is still a launch argument, so
  # the gate was inserted without editing the converter.
  cmd_vel: /cmd_vel
  cmd_vel_smoothed: /cmd_vel_smoothed
  cmd_vel_gated: /cmd_vel_gated

  # ---- the envelope seam, PLC -> vehicle (opcua-nodes.md section 12.10) ----
  #
  # THESE ARE NOT COMMANDS AND NOT SETPOINTS. Every one of them is a bound
  # or a permission the vehicle's own control layer consumes while forming
  # its own commands (section 12.1, "a permission is not a command"). The
  # envelope can prevent motion; it cannot cause it.
  #
  # NOTHING IN agv/ IS AN OPC UA CLIENT. These are ROS 2 topics the bridge
  # republishes, which is what keeps invariant 11's layer adjacency
  # intact (section 12.1). At M5 no PLC is connected and they are driven
  # by scripts/envelope_run.py, a topic double.
  #
  # THE NAMES ARE THE NODE MODEL'S, not this file's: the BrowseNames in
  # opcua-nodes.md section 12.10 are authoritative and the topic column of
  # that table is what is copied here.
  envelope_motion_enable: /forklift/envelope/motion_enable
  envelope_speed_ceiling: /forklift/envelope/speed_ceiling
  envelope_equipment_permit: /forklift/envelope/equipment_permit
  mode_in_force: /forklift/mode/in_force

  # ---- the vehicle's report back (section 12.6) ----
  #
  # The two values ADR 0014 D5.3 requires the gate's evidence to exercise:
  # a supervisor that published a bound and received nothing back would be
  # making a claim it could not check. They are a READBACK, never a second
  # answer to "what mode is the machine in" (M1, M4).
  mode_applied: /forklift/mode/applied
  vehicle_heartbeat: /forklift/vehicle/heartbeat

navigation:
  # ============ THE Twist -> TRICYCLE CONVERSION, AND ITS TWO EDGES ============
  #
  # Read by scripts/cmd_vel_to_tricycle.py. The conversion itself is
  # geometry and lives in that file with its derivation; what lives here
  # is the two thresholds that decide what happens where the geometry
  # stops being defined.
  #
  # NOTHING IN THIS BLOCK IS A SAFETY PARAMETER. The converter inhibits
  # nothing, latches nothing and stops nothing; a refused command is a
  # command not issued, not a machine state (invariant 1).

  # THE CREEP DEADBAND. Below this forward speed the requested curvature
  # w/v is not a number the controller meant: the ratio's denominator is
  # dominated by rounding and by the smoother's ramp, and every steer
  # angle it implies is beyond the mechanical stop anyway (at |v| = 0.005
  # and the stack's own maximum yaw rate 0.5714 rad/s the implied angle is
  # 89.5 deg against a 75.06 deg stop).
  #
  # THE VALUE IS AN UPPER BOUND FROM THE LAYER ABOVE, NOT A TUNING KNOB,
  # AND IT IS THE FORMULA THAT GOVERNS, NOT THIS NUMBER
  # (ARRIVAL-GEOMETRY.md 9.1; docs/LESSONS.md 2026-08-05, the deadlock
  # entry). nav2.yaml's velocity_smoother is `feedback: CLOSED_LOOP` with
  # `scale_velocities: true`, so from REST its output per tick cannot
  # exceed max_accel * dt on the most restrictive axis:
  #
  #     dt      = 1 / smoothing_frequency          = 1 / 20 Hz = 0.05 s
  #     a_v*dt  = 0.50 m/s^2   * 0.05 s            = 0.025  m/s
  #     a_w*dt  = 0.4762 rad/s^2 * 0.05 s          = 0.02381 rad/s
  #     v_pinned(kappa) = min(0.025, 0.02381 / kappa)   m/s
  #
  # so at commanded curvature kappa the SMALLEST speed this chain can
  # ever hand the converter from rest is v_pinned, and at the mechanical
  # steer stop, kappa_max = tan(1.31) / 1.05 = 3.569 1/m, that floor is
  #
  #     a_w * dt / kappa_max = 0.02381 / 3.569 = 0.00667 m/s.
  #
  # A deadband at or above that floor is a DEADLOCK and not a margin: the
  # converter zeroes traction, the plant does not move, the EKF measures
  # zero, the closed-loop smoother stays pinned at v_pinned, and the leg
  # stalls until a timeout cancels it. 0.02 m/s armed that loop for every
  # steer beyond atan(0.02381/0.02 * 1.05) = 51.3 deg and it was measured
  # doing so: EVIDENCE_NAV2.md 9.3 r1, cmd_v held at 0.015 m/s with the
  # steer at 1.072 rad and ground truth frozen for 20 s.
  #
  # THE ADMISSIBLE WINDOW, derived from the two floors either side:
  #
  #     zero_speed_mps (0.002)  <  creep  <  a_w * dt / kappa_max (0.00667)
  #
  # The lower bound keeps the refusal semantics below intact; the upper
  # bound makes the deadlock unreachable at ANY steer angle, because the
  # armed region kappa > 0.02381 / creep = 4.76 1/m lies beyond the
  # mechanical kappa_max = 3.569 1/m. 0.005 sits inside that window with
  # margin on both sides. IF max_accel, smoothing_frequency or the steer
  # stop CHANGES, THIS VALUE IS RE-DERIVED FROM THE WINDOW ABOVE.
  #
  # It also stays well below the controller's own smallest intended
  # speed, RPP's `min_approach_linear_velocity: 0.05` in nav2.yaml: a
  # deadband at or above that would swallow the approach creep and the
  # vehicle would stop short of every goal.
  creep_speed_mps: 0.005

  # THE STANDSTILL THRESHOLD, and it is the one that decides what counts
  # as a REFUSAL. A tricycle can turn only while its drive wheel travels,
  # so the request that has no solution at all is "turn while stopped".
  # Below this speed the vehicle is stopped as far as its own instruments
  # are concerned: one drive-encoder count per 50 Hz odometry cycle is
  # 0.184 mm of tread in 0.02 s = 0.0092 m/s, and this is a fifth of that.
  #
  # WHY IT IS SEPARATE FROM THE CREEP DEADBAND ABOVE. The first measured
  # navigation run counted 27 "rotation in place" refusals on a goal it
  # reached: every one was the tail of a deceleration, where the smoother
  # had the speed at 15 mm/s and the controller still wanted a curve. That
  # request is executable - 15 mm/s on a 1.29 m radius - and calling it a
  # refusal made the counter say nothing. nav2's Spin sends v = 0 exactly,
  # which is what this threshold catches.
  zero_speed_mps: 0.002

  # THE ROTATION-IN-PLACE REPORT THRESHOLD. Below the creep deadband, a
  # yaw rate above this is a request the vehicle physically cannot honour
  # - one steered wheel one wheelbase ahead of the rear axle cannot turn
  # the body without travelling. The converter commands zero traction,
  # HOLDS the steer axis where it is, and counts the refusal.
  #
  # 0.01 rad/s is 0.57 deg/s, 28x the 0.0202 deg/s that the `standstill:`
  # block above shows one held drive-encoder count already bounds the body
  # rotation at. So it is comfortably above the rate at which this vehicle
  # can even tell it is turning, and any real Spin request (nav2's default
  # tree asks for 1.57 rad) crosses it by two orders of magnitude.
  yawrate_refusal_radps: 0.01

envelope:
  # ================== THE ENVELOPE GATE'S NAMED CONSTANTS ==================
  #
  # Read by scripts/envelope_gate.py, and by nothing else. The gate is the
  # vehicle-side ENFORCER of the envelope the PLC forms: the PLC forms the
  # envelope and does not enforce it (opcua-nodes.md section 12.6, ADR 0014
  # D5).
  #
  # NOTHING IN THIS BLOCK IS A SAFETY PARAMETER, and the gate is not a
  # safety function. Loss of the envelope is a DEGRADED MODE and not a
  # safety event (invariant 2, section 12.1). The protective stop, the
  # e-stop chain and safe torque off are onboard and hardwired and no
  # value here can trigger, release or delay one (invariant 1).

  # THE FRESHNESS WINDOW, opcua-nodes.md section 12.4 E5, and it is E5's
  # "named constant in the vehicle layer" - ITS OWN, never shared with
  # HMI_STALE_TIME, HEARTBEAT_STALE_TIME or UI_POLL_STALE_TIME, which are
  # three PLC- and HMI-side constants watching different parties across
  # different transports (section 10.8 P4 one layer out).
  #
  # WHERE THE VALUE COMES FROM. E5 says it is "derived from the rate the
  # bridge republishes at". That rate is 20 Hz (section 12.10, every
  # envelope row), so one publication is 50 ms and this window is TEN of
  # them. It is deliberately not tighter: the bridge's poll is
  # phase-quantised, the vehicle's own scheduler jitters, and a window
  # that stops the vehicle on ordinary jitter would make the degraded mode
  # the normal mode.
  #
  # WHAT IT IS NOT DERIVED FROM, stated because it would be the wrong
  # derivation: it is NOT set from the ~46 ms closed-loop interval ADR 0014
  # quotes as G1. That figure is an upper bound on a PLC round trip
  # measured through a 0-50 ms poll phase, and it is not a measurement of
  # envelope age on the vehicle's side of the bridge. ADR 0014's own open
  # item asks for a brief that MEASURES PLC-write-to-topic age and jitter;
  # until that measurement exists this window is a DESIGN VALUE derived
  # from a nominal rate, and EVIDENCE_ENVELOPE.md says so.
  stale_window_s: 0.50

  # THE COMMAND TIMEOUT. If the chain ABOVE the gate stops talking - the
  # smoother dies, or its own 1.0 s dead-man has already zeroed it and
  # then it stops too - the gate drives its output to zero on the same
  # ramp rather than holding the last command. forklift_io.py republishes
  # its held command at 20 Hz, so a gate that simply went quiet would
  # leave the vehicle driving on the last value it ever emitted.
  #
  # It is SEPARATE from stale_window_s and must stay separate: one watches
  # the supervisor, the other watches this vehicle's own controller, and
  # retuning one must not silently retune the other.
  command_timeout_s: 0.50

  # THE GATE'S OWN DECELERATION RAMP. ADR 0014 seam (b)'s gate law is
  # "enable false, or envelope stale -> controlled stop ON THE VEHICLE'S
  # OWN DECELERATION RAMP". A step to zero is not a controlled stop: it is
  # a command discontinuity that the chain below cannot honour anyway.
  #
  # 0.50 m/s^2 is the same figure nav2.yaml gives the smoother as
  # max_decel, and the duplication is deliberate rather than shared: the
  # smoother's limit is a parameter of a node this repository does not
  # own, in a file with a different reader, and the gate must ramp
  # correctly when the smoother is not running at all. The two are checked
  # against each other in EVIDENCE_ENVELOPE.md and not wired together.
  stop_decel_mps2: 0.50

  # THE GATE'S OUTPUT RATE. 20 Hz, matching nav2.yaml's
  # smoothing_frequency, so the gate neither drops nor duplicates a
  # command in the pass-through case. This timer is what publishes the
  # ramp and the held zero; a command arriving while the gate is passing
  # is emitted IMMEDIATELY and not held for the next tick, so the gate
  # adds no latency to the permissive path (measured in
  # EVIDENCE_ENVELOPE.md section 7).
  publish_hz: 20.0

  # THE CEILING'S PLAUSIBILITY WINDOW, opcua-nodes.md section 12.4:
  # 0.00 ... TRACTION_SPEED_MAX, unsigned, and "a value outside the range
  # is a broken supervisor and is non-permissive to the consumer, never a
  # bound to clamp". Tested AFFIRMATIVELY - valid := (0 <= c <= max) - so
  # a NaN falls through to the fault branch (LESSONS 2026-07-27).
  #
  # THE VALUE 1.00 IS THE PLC'S CONSTANT, NOT THIS LAYER'S. It mirrors
  # TRACTION_SPEED_MAX in plc/forklift/SPEC.md section 3.3 as
  # opcua-nodes.md section 12.4 quotes it. That makes it a SECOND COPY of
  # a datum with one owner, which invariant 10 does not admit; it is
  # carried as a plausibility bound only, it can only ever make the gate
  # MORE restrictive, and it is raised in the m5-11 report as an open
  # question rather than silently owned here.
  #
  # It is NOT limits.traction_speed_max_mps (1.50) above. That is the
  # DRIVE-WHEEL TREAD speed limit of this model, a different quantity in a
  # different place in the chain: the ceiling bounds ground speed.
  ceiling_max_mps: 1.00

  # THE MODE ENCODING, opcua-nodes.md section 12.3, defined there and
  # re-encoded nowhere. Written out here so this file can be diffed
  # against that table; a value outside {0, 1, 2} is a broken writer and
  # is a fault, never a mode to clamp.
  mode_none: 0
  mode_teleop: 1
  mode_autonomous: 2

field:
  # ============ THE PROTECTIVE FIELD EVALUATION - PHASE 1 ONLY ============
  #
  # Read by scripts/field_evaluation.py, and by nothing else. The AUTHORITY
  # for every value below is agv/forklift/FIELD-EVALUATION.md (m5-12); this
  # block is where that document's constants are NAMED, per this directory's
  # rule that no behavioural constant is written inline in a Python file. If
  # the two disagree, FIELD-EVALUATION.md is right and this file is wrong,
  # and the section reference beside each value is what makes that diffable.
  #
  # WHAT THIS IS, IN ONE SENTENCE. A MODEL OF WHAT A SAFETY-RATED SCANNER
  # DOES INSIDE ITS OWN HOUSING - turn its rays into a protective-field
  # verdict - feeding a STAND-IN FOR WIRING. It is standard Python reading
  # a rendered depth image across a bridge and a graph.
  #
  # IT IS NOT A SAFETY FUNCTION AND CARRIES NO CLAIM: no Category, no
  # Performance Level, no SIL, no PFH, no channel count, no diagnostic
  # coverage (ADR 0011 D5, FIELD-EVALUATION.md section 10). Every PL and
  # Category named in that document is a PLr TARGET out of docs/safety/,
  # never an achievement. No depth, response time or stopping distance
  # below is a figure any machine is characterised by. The protective stop,
  # the e-stop chain and safe torque off are onboard and hardwired
  # (invariant 1); this node latches nothing and stops nothing.
  #
  # THE VERDICT HAS NO TOPIC, AND THAT IS THE POINT. It crosses exactly one
  # dedicated TCP link to the stand-in writer (plc/forklift-safety/SPEC.md
  # section 7.2), as a real device's OSSD pair crosses only its own copper.
  # The rule in `topics:` above - "every channel a subscriber can reach is a
  # measurement channel; the safe channel has no topic on either transport,
  # ever" - is an owner ruling (m5-06, 2026-07-30) and this node obeys it.
  # scripts/check_sensor_frames.py section 4 checks that rule by machine.

  # ---- the contour, phase 1: ONE STATIC ALL-DIRECTION FIELD ----
  #
  # FIELD-EVALUATION.md section 12 phase 1: "case B's geometry as one
  # static all-direction contour (fork sector 1.35 m, drive sector 1.35 m -
  # deliberately the SMALLER derived depth everywhere ...), clipped per
  # section 6". No case selection, no speed enforcement, no warning field:
  # those are phases 2 and 3 and none of them is built.
  #
  # WHERE 1.35 m COMES FROM (section 5, case B). D(v) = v*T + v^2/(2a) + Z
  # + Kp*T with T = 0.46 s (section 3, summed per stage), a = 0.50 m/s^2
  # (the envelope gate's measured ramp), Z = 0.05 m, and the PROVISIONAL
  # intruder-advance term Kp*T = 0.74 m. At v = 0.55 m/s that is
  # 0.253 + 0.303 + 0.05 + 0.74 = 1.35 m.
  #
  # PROVISIONAL, AND SAID SO RATHER THAN SETTLED. The ISO 13855 framing
  # behind the Kp term comes from secondary engineering sources; the
  # project has no access to the standard's text, so whether a
  # vehicle-carried field must add intruder advance at all is UNRESOLVED
  # (FIELD-EVALUATION.md sections 4 and 10.3). The DEMANDING reading is
  # carried here - the term is included, which makes the field LARGER.
  # Three of T's eight stages are budgets, not measurements (section 11).
  protective_depth_m: 1.35

  # HALF WIDTH OF THE TWO CORRIDORS (section 6): 0.45 vehicle half-width
  # + 0.05 measurement allowance Z + 0.05 steering-deviation allowance.
  # The last term is a BUDGET and is measurement 7 of section 11.
  #
  # It lands 1 mm outside the vehicle's own widest plan point (the plan
  # hull of model.sdf is y = +-0.5490, set by the two scanner housing
  # corners at 45 deg). Those housings sit 20 mm BELOW the scan plane by
  # construction, so they return nothing and the coincidence costs
  # nothing - but a housing raised into the plane would make this contour
  # permanently violated, and that is why the number is written here with
  # its derivation rather than tuned.
  corridor_half_width_m: 0.55

  # THE VEHICLE OUTLINE THE DEPTHS ARE MEASURED FROM. MIRRORS of the plan
  # hull of model.sdf, like the `model:` block above: model.sdf is the
  # authority. Read back from it on 2026-08-06 as x [-1.8750, 0.8600]
  # (tine tips to nose). scripts/field_evaluation.py re-reads model.sdf
  # for the two SCANNER POSES rather than mirroring those, so no pose is
  # copied anywhere; these two scalars are the only mirrors here.
  outline_nose_x_m: 0.86
  outline_tine_tip_x_m: -1.875

  # ---- the self-return clips (section 6, R8) ----
  #
  # A FIELD DRAWN PAST THE VEHICLE'S OWN RETURNS IS PERMANENTLY VIOLATED.
  # Each entry caps the field's OUTER BOUNDARY over a bearing band of one
  # device, in THAT DEVICE'S OWN FRAME (the frame its message names).
  #
  # THIS IS FIELD GEOMETRY, CATEGORICALLY NOT A FILTER APPLIED TO SAMPLES
  # (EVIDENCE_SENSOR_COVERAGE.md section 13.8 point 1, in its own words).
  # The samples are untouched and still classified; what the clip changes
  # is HOW FAR THE MONITORED REGION REACHES at that bearing, which is what
  # a real device's configured contour does. Deleting the returns instead
  # would put a lie about the vehicle's surroundings into the evaluation.
  #
  # A bearing whose boundary falls below the sensor's own range_min has NO
  # LIVE FIELD: no sample can be inside it, so the sector is excluded and
  # an invalid sample there raises nothing. That is how the rear band is
  # excluded, and it is stated rather than special-cased in code.
  self_return_clips:
    - device: rear
      # Measured: the rear device's own mast rails and fork carriage,
      # returns at 0.090-0.780 m (EVIDENCE_SENSOR_COVERAGE.md section 13,
      # R8). Boundary = 0.090 - 0.05 = 0.040 m, which is below range_min
      # 0.10 m, so the sector is EXCLUDED from the rear field entirely -
      # FIELD-EVALUATION.md section 6's "effectively the sector is
      # excluded". It costs no coverage: the FRONT device watches those
      # bearings (section 13.8 point 3).
      #
      # THE BAND IS WIDER THAN FIELD-EVALUATION.md SECTION 6'S TABLE, AND
      # THE DEVIATION IS DELIBERATE AND MEASURED. That table quotes
      # -131.5..-72.3 deg, which are section 13.2's -131.48..-72.26
      # rounded OUTWARD at one end and INWARD at the other. Applied as
      # written it leaves the two EDGE rays of the measured band inside
      # the field:
      #
      #   index  5, bearing -132.482 deg, self-return 0.780 m (mast rail
      #             corner, section 13.3) against a contour boundary of
      #             1.001 m  -> permanent intrusion
      #   index 65, bearing  -72.263 deg, self-return 0.164 m (carriage,
      #             section 13.3) against a contour boundary of 2.183 m
      #             -> permanent intrusion
      #
      # Either one alone makes the rear field permanently violated and the
      # aggregate verdict INTRUSION for ever. Section 13.2's own body-
      # return index set is 5..65, not 6..65, and section 13.3 records
      # index 5 explicitly. So this band is taken from the MEASURED index
      # set the design's own rule points at - "clipped by each device's
      # measured self-return contour minus 0.05 m" - and is placed between
      # rays: index 4 is at -133.485 deg and index 66 at -71.259 deg, so
      # -133.0 and -71.8 catch 5..65 inclusive and nothing else. A
      # correction to section 6's table is requested in the m5-12b report
      # rather than edited into another brief's deliverable.
      bearing_lo_deg: -133.0
      bearing_hi_deg: -71.8
      boundary_m: 0.040
    - device: front
      # Measured: ONE ray of 275, index 274 at the aperture edge, on
      # rear_wheel_left at 1.084 m (section 13.6). Sensor-frame bearing
      # +137.49 deg; the +182.5 deg quoted in section 6 of the design is
      # the VEHICLE bearing of the same ray. Boundary 1.084 - 0.05.
      bearing_lo_deg: 136.4
      bearing_hi_deg: 137.6
      boundary_m: 1.034

  # ---- freshness, validity and debounce (section 8) ----
  #
  # RULE 0, AND IT GOVERNS EVERY VALUE IN THIS SUB-BLOCK: the safe
  # direction is the DEMANDING one - unknown means intrusion. Never the
  # reverse.

  # THREE SCAN PERIODS, AND THIS NODE'S OWN VALUE. Deliberately distinct
  # from obstacle.scan_timeout_s (0.50 s), envelope.stale_window_s
  # (0.50 s), odometry.joint_state_timeout_s and imu.timeout_s: those
  # watch different parties for different purposes, and sharing a window
  # would let one retuning silently retune another (section 8 rule 1).
  scan_fresh_max_s: 0.30

  # CLEAR IS DEBOUNCED, INTRUSION IS NOT (section 8). Intrusion asserts on
  # ONE scan - defensible only because the simulated sensor declares no
  # noise model; a real device of this class evaluates 2-8 consecutive
  # scans and a noise model added to model.sdf re-opens this. Clear needs
  # three consecutive fully-valid, fully-clear scans = 0.30 s. Asymmetric
  # on purpose: instant to demand, slow to release. Downstream the demand
  # LATCHES anyway (SPEC section 5, ZoneStopDemand, cleared only by the
  # monitored reset), so this shapes a reported level and never a latch.
  clear_debounce_scans: 3

  # A SENSOR PRODUCING GARBAGE AT RATE IS NOT A SENSOR (section 8 rule 5).
  # Above this fraction of invalid samples in one scan the device is
  # FAULTED and reads intrusion; the fault clears only after three
  # consecutive scans back under it. 0.05 is a design value.
  invalid_fault_fraction: 0.05
  fault_clear_scans: 3

  # THE EVALUATION TICK. The aggregate is re-formed at this rate whether
  # or not a scan arrived, so a device that goes silent becomes an
  # intrusion on the freshness rule rather than on the next message that
  # never comes. 20 Hz is twice the 10 Hz scan rate.
  evaluate_hz: 20.0

  # ---- the link to the stand-in writer (SPEC section 7.2) ----
  link:
    # THE WINDOWS HOST ADDRESS IS A READ-BACK VALUE, NEVER A DOCUMENT'S
    # (ADR 0006, and SPEC section 7.2 says so explicitly). `auto` means
    # the node derives it from THIS HOST's own configuration and LOGS
    # which source produced it: $AMR_FIELD_LINK_HOST if set, else the WSL
    # default route, else the resolv.conf nameserver. An explicit address
    # here overrides the derivation and is also logged.
    host: auto

    # SPEC section 7.2 design value. The writer listens on it; this node
    # dials it. One TCP connection, one client at a time.
    port: 45015

    # 1 Hz keepalive, SPEC section 7.2. The writer's FIELD_LINK_STALE_MAX
    # is 1000 ms, so a ping period equal to that window would race it.
    # 0.50 s is two pings inside the writer's window.
    ping_period_s: 0.50

    # One reconnect attempt per second, each logged. While the link is
    # down this node sends nothing and the writer, by its own contract,
    # drives the zone channel OPEN after its stale window. The
    # evaluation's own death is handled by its consumer in the demanding
    # direction and NOTHING here duplicates that.
    reconnect_period_s: 1.0

    # HOW LONG A NON-BLOCKING CONNECT IS GIVEN TO COMPLETE before the
    # attempt is abandoned and a new one started. It is a DEADLINE, never
    # a wait: the socket is non-blocking and completion is polled with
    # select() at zero timeout on later evaluation ticks.
    #
    # THE FIRST BUILD BLOCKED HERE AND FAILED ITSELF FOR IT. With
    # socket.create_connection(timeout=2.0) and no writer listening, each
    # attempt stalled this node's single-threaded executor for the whole
    # timeout; the scan and /clock queues backed up behind it and the node
    # then read ITS OWN freshness rule as violated - 0.838-0.996 s of
    # stamp age against a 0.30 s window - while an independent probe on
    # the same two topics in the same run measured 0.016 s and 0.027 s.
    # LESSONS 2026-07-29 states this for a harness; it binds harder on a
    # node whose other job is to notice that a scanner has gone silent.
    connect_timeout_s: 2.0

    # ZONE <digit>: THE DIGIT IS THE CIRCUIT LEVEL, fixed by
    # bridge/STANDIN-WRITER-DESIGN.md section 3 because SPEC section 7.2
    # left it unassigned, and MATCHED here rather than re-invented - the
    # listener is built and running-tested.
    #   ZONE 1 = field clear    -> ZoneDeviceCircuitClosed := TRUE
    #   ZONE 0 = intrusion, OR this evaluation's own fault verdict
    #                           -> ZoneDeviceCircuitClosed := FALSE
    # Wire NC, program NO, rebuilt for a software wire.
    zone_clear_digit: 1
    zone_intrusion_digit: 0

  # ---- the transition log (section 7, SPEC section 7.6) ----
  #
  # LOAD-BEARING EVIDENCE, NOT A NICETY. Criterion (a) is decided by
  # CORRELATED RECORDS, because the F-program cannot check a write's
  # origin (SPEC section 7.6): a zone transition in the writer's log with
  # no matching line here is NOT criterion-(a) evidence, whatever the
  # narration says. One file per session, unique name per start, refusing
  # a collision rather than overwriting (LESSONS 2026-07-28).
  log_dir: evidence/field_evaluation

