# config.yaml - named constants for the vehicle side forklift nodes.
#
# Rule for this directory: NO behavioural constant is written inline in a
# Python file. Every rate, limit, threshold, timeout, joint name and topic
# name the nodes use is read from here, so that a value can be changed and
# reviewed without reading code, and so that the contract table in
# README.md has exactly one source.
#
# Authority. model.sdf owns the geometry. The values under `model:` below
# are a MIRROR of numbers that also appear in model.sdf, because SDF cannot
# be read as YAML and the nodes need them. If the two ever disagree,
# model.sdf is right and this file is wrong. EVIDENCE_MODEL.md records the
# diff that shows they agree.
#
# Nothing here is a safety parameter. `obstacle.stop_distance_m` is a
# process comfort zone evaluated in Python over a network carried scan; the
# protective stop and safe torque off are onboard and hardwired and appear
# nowhere in this file (invariant 1).

model:
  # Spawned model name. The gz topic names below do NOT depend on it: every
  # gz system in model.sdf states its topic explicitly for that reason.
  name: Forklift

  # Mirrors of model.sdf geometry.
  wheel_radius_m: 0.12          # drive_wheel cylinder radius
  steer_limit_rad: 1.31         # steer_joint mechanical stop, symmetric
  fork_travel_min_m: 0.0        # mast_joint lower limit
  fork_travel_max_m: 1.6        # mast_joint upper limit

  # Tricycle geometry, DERIVED from model.sdf link poses rather than
  # written there as a single number, which is why these two are the only
  # mirrors in this block that are not a verbatim copy:
  #
  #   steer_link      <pose>  0.55 0 0.24 ...   the steer axis
  #   rear_wheel_left <pose> -0.50 0.36 0.12    rear axle
  #   rear_wheel_right<pose> -0.50 -0.36 0.12   rear axle
  #
  # wheelbase        = 0.55 - (-0.50) = 1.05 m
  # rear axle x in base_link = -0.50 m, so base_link stands 0.50 m
  # FORWARD of the rear axle midpoint. That offset is not cosmetic: the
  # rear axle midpoint is the only point of a tricycle whose velocity is
  # purely longitudinal, so base_link necessarily has a LATERAL velocity
  # component d*yawrate whenever the vehicle turns, and wheel odometry
  # that ignores it reports a body twist the vehicle does not have.
  # scripts/wheel_odometry.py derives the pose of the rear axle exactly
  # and then places base_link on it. scripts/check_odometry.py checks
  # both numbers against model.sdf rather than trusting this comment.
  wheelbase_m: 1.05
  rear_axle_offset_m: -0.50

  # Joint names as they appear in the bridged JointState message. The
  # mast joint is the only one forklift_io.py needs; the other two are
  # what wheel_odometry.py reads, because odometry is the one function
  # that cannot address a joint through a topic. The full joint list is a
  # contract and its home is the table in README.md.
  mast_joint_name: mast_joint
  drive_joint_name: drive_wheel_joint
  steer_joint_name: steer_joint

limits:
  # Largest traction speed this node will pass on. A request beyond it is
  # clamped, not rejected: the vehicle keeps moving at the limit.
  traction_speed_max_mps: 1.50

  # Largest carriage travel rate the node will integrate. Also the slew
  # limit on the position target, which is what actually makes the lift
  # ramp rather than step.
  fork_speed_max_mps: 0.15

rates:
  # State publication rate for /forklift/fork_height and
  # /forklift/linear_speed.
  io_publish_hz: 10.0
  # Rate at which the fork position target is integrated and republished.
  # Faster than the state rate so the target ramp is smooth.
  io_command_hz: 20.0
  # Publication rate for both /forklift/obstacle/* topics.
  obstacle_publish_hz: 10.0

odometry:
  # ================ WHEEL ODOMETRY, AND ITS ERROR MODEL ================
  #
  # Read by scripts/wheel_odometry.py, which computes the vehicle's own
  # motion estimate from its own joint states through tricycle
  # kinematics. It is ONE SENSOR'S OPINION, not the vehicle's pose: it
  # is an input to the EKF exactly as the IMU is, and the EKF is the
  # single owner of odom -> base_link (invariant 10).
  #
  # THE HONESTY RULE THAT GOVERNS EVERY NUMBER BELOW. None of these was
  # chosen to make the drift come out at a convenient value. Each is
  # derived from a stated property of the modelled hardware, the
  # derivation is in EVIDENCE_ODOMETRY.md section 4, and the resulting
  # drift is reported whatever it turned out to be.
  #
  # WHAT IS *NOT* IN THIS BLOCK, AND THAT IS THE POINT: WHEEL SLIP. The
  # physics engine already produces it. Over the 3.989 m arc measured by
  # brief m5-07b the drive wheel turned 4.065 m of tread, and every
  # metre of that discrepancy arrives free from the contact model. Adding
  # a slip term here would be inventing an error the simulation already
  # has, and it would be the exact move the honesty rule forbids.

  # Rate at which the estimate is integrated and published. 50 Hz is the
  # rate an AGV odometry loop typically runs at, an order under the
  # 500 Hz the joint states arrive at, so each cycle differences a real
  # displacement rather than quantiser dither.
  publish_hz: 50.0

  # ---- the two encoders ----
  #
  # DRIVE WHEEL, incremental. 1024 pulses per revolution read in
  # quadrature = 4096 counts/rev, the commonest catalogue resolution for
  # a motor-mounted incremental encoder. Quantisation step
  # 2*pi/4096 = 1.53398e-3 rad, which at the 0.12 m wheel is 0.184 mm of
  # tread per count. The node quantises the ABSOLUTE wheel angle onto
  # that grid and differences it, which is what an incremental encoder
  # physically does; quantising the difference instead would lose the
  # residue and drift by a count per cycle.
  drive_encoder_counts_per_rev: 4096

  # STEER AXIS, absolute. 12-bit single-turn, 4096 counts over 2*pi, the
  # commonest catalogue resolution for an absolute steer-axis encoder.
  # Same 1.53398e-3 rad step, = 0.0879 deg.
  steer_encoder_counts_per_rev: 4096

  # STEER ZERO OFFSET, and where the value comes from. A steer encoder's
  # zero is set against the mechanical straight-ahead by a calibration,
  # and no calibration can resolve better than ONE COUNT. So the
  # modelled residual IS one count, 1.53398e-3 rad = 0.0879 deg. It is
  # deliberately the smallest defensible value rather than a plausible
  # workshop tolerance, because this is the term that dominates a
  # tricycle's heading error and it must not be inflated: driving
  # straight, the vehicle believes it is turning at
  # v/L * tan(0.0879 deg) = 1.46 mrad/s at 1 m/s, which is 5.0 deg per
  # 60 s of straight running with no slip anywhere.
  #
  # The sign is positive and arbitrary; a real vehicle's is whatever its
  # last calibration left. Nothing downstream may assume it.
  steer_zero_offset_rad: 0.00153398

  # ROLLING RADIUS THE NODE BELIEVES, against the 0.12 m the physics
  # actually rolls on. A loaded polyurethane drive tyre's effective
  # rolling radius is SMALLER than its free radius, so a vehicle
  # calibrated on a free or new tyre over-reports distance. 0.5% is the
  # load-compression figure for a PU drive wheel of this size:
  # 0.12 * 1.005 = 0.1206 m.
  #
  # THE SIGN IS THE PESSIMISTIC ONE ON PURPOSE. Physics slip already
  # makes the wheel over-turn relative to the ground, so an error that
  # over-reports distance COMPOUNDS with slip instead of cancelling it.
  # Choosing the other sign would have flattered the result by half a
  # per cent and there would have been no way to see it in the output.
  # Tyre wear, which is larger and the same sign, is not modelled: it is
  # what a recalibration removes.
  rolling_radius_m: 0.1206

  # ---- the covariances this node publishes, and their derivation ----
  #
  # These are the numbers that decide how much the EKF believes the
  # wheels against the IMU, so they are derived rather than chosen. All
  # three are evaluated at a nominal 1.0 m/s, stated because a
  # covariance from a velocity-dependent error term is only meaningful
  # with the velocity named. dt = 0.02 s, q = 1.53398e-3 rad,
  # r = 0.1206 m, L = 1.05 m, d = 0.50 m.
  #
  # vx.  Two terms.
  #   quantisation: the difference of two independent uniform
  #     quantisation errors has sigma q/sqrt(6) = 6.2624e-4 rad, so
  #     sigma_s = r * 6.2624e-4 = 7.5525e-5 m and
  #     sigma_v = 7.5525e-5 / 0.02 = 3.7763e-3 m/s
  #   rolling radius: 0.5% of 1.0 m/s = 5.0e-3 m/s
  #   sigma_vx = sqrt(3.7763e-3^2 + 5.0e-3^2) = 6.2658e-3 m/s
  vx_variance: 3.93e-05

  # vyaw.  yawrate = v * tan(delta) / L, so d(yawrate)/d(delta) at
  #   delta = 0 is v/L = 0.95238 1/s.
  #   quantisation: sigma_delta = q/sqrt(12) = 4.4281e-4 rad
  #                 -> 4.2172e-4 rad/s
  #   zero offset:  one count, 1.53398e-3 rad -> 1.46094e-3 rad/s
  #   sigma_vyaw = sqrt(4.2172e-4^2 + 1.46094e-3^2) = 1.52059e-3 rad/s
  #
  # Compare the IMU: model.sdf declares the gyro at 1.745e-3 rad/s of
  # white noise, so the two sources are within a factor of 1.15 of each
  # other on the SAME quantity and the EKF genuinely blends them rather
  # than one drowning the other. Neither number was moved to arrange
  # that; it is what a 12-bit steer encoder and a BMI088 happen to be.
  vyaw_variance: 2.312e-06

  # vy is not measured. It is d * yawrate exactly, a kinematic
  # consequence of base_link standing 0.50 m ahead of the rear axle, so
  # its variance is d^2 times vyaw's: 0.25 * 2.312e-06 = 5.78e-07.
  vy_variance: 5.78e-07

  # Pose covariance published with the estimate. The pose of a dead
  # reckoning estimate has UNBOUNDED error, and no honest fixed number
  # exists for it, so this node publishes a large constant and the EKF
  # is configured to fuse the TWIST only - never the pose. The value
  # exists so the message is well formed and so that anything which
  # ignores this warning and fuses the pose is told the pose is worth
  # nothing.
  pose_variance_unused: 1000.0

  # A joint state older than this counts as no joint state. The node
  # then publishes nothing rather than integrating a stale sample across
  # a gap, because an integrator that fills gaps invents distance.
  joint_state_timeout_s: 0.50

standstill:
  # ============ THE VEHICLE IS NOT ROTATING, AND HOW IT KNOWS ============
  #
  # Read by scripts/wheel_odometry.py, which decides the verdict because
  # it already owns the encoder model, and by scripts/imu_gate.py, which
  # acts on it. Nothing else forms this datum (invariant 10).
  #
  # THE PHYSICS THIS RESTS ON. A tricycle's instantaneous centre of
  # rotation lies on the line of the rear axle, because the two passive
  # wheels cannot slide sideways. The drive wheel's contact point does
  # NOT lie on that line - it stands one wheelbase in front of it - so
  # the body cannot rotate without the drive wheel travelling. Writing
  # the drive wheel's velocity in the body frame,
  #
  #     v_D = (v_R, psidot * L)     so     |v_D| >= |psidot| * L
  #
  # which integrates to |dpsi| <= (tread travelled) / L. ONE DRIVE
  # ENCODER COUNT IS 2*pi/4096 rad of wheel = 1.53398e-3 * 0.1206 m =
  # 1.850e-4 m of tread, so a count that does not change bounds the body
  # rotation over that interval at 1.850e-4 / 1.05 = 1.762e-4 rad, which
  # is 0.0101 deg. That is the whole argument: when the encoders report
  # no motion the vehicle is not turning, so whatever the gyro reports in
  # that condition is bias and not rotation.
  #
  # THIS IS NOT A SAFETY FUNCTION. It gates one measurement channel of
  # one estimator. It inhibits no actuator, latches nothing and stops
  # nothing; the protective stop and safe torque off are onboard and
  # hardwired and appear nowhere in this file (invariant 1).

  # BOTH encoder counts must be unchanged for this long before the
  # verdict goes true. The window is what turns an instantaneous reading
  # into a condition: holding under one count for 0.50 s bounds the
  # drive wheel's tread speed at 1.850e-4 / 0.50 = 0.37 mm/s and the
  # body's rotation rate at 0.0202 deg/s. It also costs 0.50 s of
  # ungated gyro at the start of every stop, which is the conservative
  # direction and is deliberate: the gate opens on the FIRST count of
  # motion and closes only after the window, so it is late to trust the
  # standstill and instantaneous to distrust it.
  window_s: 0.50

  # WHY THE STEER COUNT IS IN THE TEST TOO, although the bound above
  # does not need it. A parked forklift can steer on the spot, and a
  # steered wheel scrubbing against the floor is the one manoeuvre in
  # which the drive encoder could stay still while the contact patch
  # slides. Requiring both counts still means "no wheel is moving at
  # all", which is a stronger statement than the bound needs and costs
  # nothing during an idle, when neither moves.
  include_steer_axis: true

  # A verdict older than this counts as NO verdict, and the gate then
  # FAILS OPEN - the gyro is fused exactly as it was before this
  # mechanism existed. The failure directions are not symmetric: a gate
  # stuck open costs the drift this brief measures, while a gate stuck
  # closed would hide a real rotation from the filter. So every
  # uncertainty resolves to open. 0.20 s is ten missed verdicts at the
  # 50 Hz they are published at.
  verdict_timeout_s: 0.20

imu:
  # Nothing in this block is a noise parameter. model.sdf owns the
  # sensor's noise, the message carries the covariance gz derives from
  # it, and no node here re-states either (invariant 10). What lives
  # here is only what a node needs in order to CHECK the stream.
  #
  # Declared sample rate, mirrored from model.sdf's <update_rate>.
  # scripts/check_odometry.py compares the measured rate against it
  # rather than quoting one of the two.
  publish_hz: 100.0

  # A sample older than this counts as no IMU. Matches the EKF's
  # sensor_timeout in ekf.yaml.
  timeout_s: 0.20

obstacle:
  # WHICH CHANNEL THIS READS, AND WHY IT IS THAT ONE. obstacle_zone.py
  # subscribes to `topics.safety_scanner_front_measurement`: the NON-SAFE
  # MEASUREMENT CHANNEL of the front safety scanner, at z = 0.15 m. It is
  # a process comfort zone reading a process output, and it is the low
  # plane M4 demonstrated, 0.10 m below the 0.25 m scanner it replaces.
  #
  # It is NOT fed by the navigation lidar. That sensor's plane is z =
  # 1.80 m, where a pallet, a crate and the arena's 0.60 m walls are all
  # invisible, so a comfort zone computed there would read clear in front
  # of an obstacle the vehicle is about to hit. Owner ruling of
  # 2026-07-30, docs/briefs/m5-06-measurement-channel.md.
  #
  # It is NOT the safe channel either, and no value in this file is. The
  # device class modelled emits a safe output AND a separate non-safe
  # measurement channel; this node reads the second one. The measurement
  # channel must never implement a safety function.
  #
  # Half width of the sector examined about the driving direction.
  # 0.5236 rad is 30 deg, so the sector is 60 deg wide.
  sector_half_angle_rad: 0.5236

  # Centre of that sector, EXPRESSED IN THE ANGLE COORDINATE OF THE SCAN
  # THE NODE READS, which is the scan's own frame. It is not a free
  # parameter: it is minus the mount yaw of the sensor feeding the node,
  # so that the sector stays centred on straight ahead in the VEHICLE
  # frame whatever corner the sensor sits on.
  #
  #   front safety scanner mount yaw   = +0.7853982 rad (+45 deg)
  #   sector centre in the scan frame  = -0.7853982 rad (-45 deg)
  #   sector in the scan frame         = -75 deg .. -15 deg
  #   sector in the vehicle frame      = -30 deg .. +30 deg, ahead
  #
  # Zero was correct only while the scan came from a sensor mounted at
  # yaw 0. Leaving it at zero here would have watched the diagonal
  # 15..75 deg off the bow and called it "straight ahead".
  # scripts/check_sensor_frames.py checks this value against model.sdf
  # rather than trusting the arithmetic above.
  sector_centre_rad: -0.7853982

  # A valid sample at or below this range sets in_stop_zone. This is a
  # process threshold and it is not a protective field.
  stop_distance_m: 1.20

  # A scan older than this counts as no scan at all. The evaluator then
  # reports the obstacle present state, never the clear state.
  scan_timeout_s: 0.50

  # Distance reported when there is no usable measurement. Zero is chosen
  # deliberately: it is the most pessimistic distance the topic can carry,
  # so a consumer that only reads the distance still sees the worst case.
  unknown_distance_m: 0.0

logging:
  # Period for throttled "waiting for data" messages, so a missing source
  # is visible in the log without flooding it.
  throttle_s: 5.0

qos:
  # Depth of every publisher and subscriber queue in these two nodes.
  # Sensor and state data are latest value wins, so the queue is short.
  depth: 10

# Default spawn pose used by launch/vehicle.launch.py. Overridable on the
# command line; a scenario that wants a different start pose passes it
# rather than editing this file.
spawn:
  x_m: 0.0
  y_m: 0.0
  z_m: 0.05
  yaw_rad: 0.0

frames:
  # TF frame names. MIRRORS, like the `model:` block above: model.sdf is
  # the authority for both the names and the poses, and
  # scripts/sensor_tf.py reads them from it rather than from here.
  # scripts/check_sensor_frames.py diffs this block against model.sdf, so
  # a disagreement is a failing check and not a silent drift.
  #
  # The parent carries the model name and the children do not, which looks
  # inconsistent and is not ours to fix: `base` is what model.sdf's
  # OdometryPublisher already puts in <robot_base_frame>, and each child is
  # what that sensor's <gz_frame_id> already puts in its scan header. Those
  # are the strings the messages actually carry, and a TF tree that renames
  # either of them stops resolving.
  base: forklift/base_link
  safety_scanner_front: safety_scanner_front_link
  safety_scanner_rear: safety_scanner_rear_link
  nav_lidar: nav_lidar_link
  imu: imu_link

  # The odometry frame. It is a MIRROR of model.sdf's <odom_frame>, like
  # `base` above, and it is written here because ekf.yaml and
  # scripts/wheel_odometry.py both have to name it and neither may
  # invent it. The EKF is the sole publisher of the edge
  # forklift/odom -> forklift/base_link; the name did not change when
  # ownership of that edge moved from the simulator to the EKF, which is
  # the whole reason it was stated explicitly in the model.
  odom: forklift/odom

topics:
  # Simulation clock, bridged one to one.
  clock: /clock

  # ---- written by forklift_io.py, carried by the bridge into gz ----
  # Same name on both sides of the bridge: these ARE the model's raw
  # command inputs and the identity is the point.
  gz_steer_cmd: /forklift/gz/steer_cmd
  gz_traction_cmd: /forklift/gz/traction_cmd
  gz_fork_cmd: /forklift/gz/fork_cmd

  # ---- produced by gz, renamed by the bridge onto the ROS names below --
  # The gz name keeps the /forklift/gz/ prefix so that a gz side topic list
  # reads as one namespace; the ROS name is the one vehicle software uses.
  gz_joint_state: /forklift/gz/joint_state
  gz_odom: /forklift/gz/odom
  gz_scan_nav: /forklift/gz/scan_nav
  gz_imu: /forklift/gz/imu

  # THE GROUND-TRUTH odom -> base_link TRANSFORM. RETIRED AS A SOURCE
  # ON 2026-07-31 AND STILL DECLARED HERE, WHICH IS NOT A CONTRADICTION.
  #
  # model.sdf's OdometryPublisher still publishes it, because it is the
  # REFERENCE that estimator error is measured against and phase 2 was
  # always going to keep it. What changed is that nothing bridges it onto
  # /tf any more: launch/vehicle.launch.py's ground_truth_tf argument now
  # defaults to FALSE, the EKF owns odom -> base_link, and the launch
  # file refuses outright to start with both sources on (see the
  # exclusivity check in that file).
  #
  # It is still a topic name this directory owns, so it is still
  # declared. It is consumed by exactly one thing:
  # scripts/check_odometry.py, the measurement harness, which is not an
  # estimator and does not steer anything. NOTHING THAT NAVIGATES MAY
  # READ IT. Feeding it to the EKF, to SLAM, to AMCL or to any node whose
  # output an estimator consumes recreates the circularity the whole
  # two-phase plan exists to remove: an estimate scored against its own
  # input cannot be wrong.
  gz_tf_ground_truth: /forklift/gz/tf_ground_truth

  joint_states: /forklift/joint_states

  # GROUND TRUTH TOO, and the name STILL does not say so - the one place
  # this directory cannot fix. /forklift/odom is a cross-layer contract
  # (sim/launch/forklift_bringup.launch.py bridges it,
  # sim/scenarios/run_forklift_rehearsal.py reads it,
  # scripts/forklift_io.py derives /forklift/linear_speed from it) and
  # renaming it from here would break a layer this directory may not
  # edit. The request stands, now with more force than when
  # docs/reports/m5-07b-odom-tf.md first made it: the ESTIMATE now
  # exists, it is odom_filtered below, and this name is the reference.
  # The rename wanted is /forklift/odom -> /forklift/odom_ground_truth
  # (gz side /forklift/gz/odom_ground_truth), in one coordinated brief.
  #
  # Until it happens, THREE pose streams exist on this vehicle and the
  # rule for telling them apart is written in README.md, "Three pose
  # streams, one owner": this one is truth, odom_wheel is one sensor's
  # opinion, odom_filtered is the estimate and it alone owns the
  # transform.
  odom: /forklift/odom
  tf: /tf

  # ---- the IMU ----
  # gz name and ROS name differ only by the /gz/ segment, like the other
  # feedback channels. The ROS message carries NO usable orientation and
  # that is deliberate: see model.sdf's <enable_orientation> block, and
  # the warning under "The orientation trap" in README.md.
  imu: /forklift/imu

  # THE GYRO CHANNEL AS THE FILTER ACTUALLY SEES IT. scripts/imu_gate.py
  # subscribes to `imu` above and republishes here, and the ONE thing it
  # does is stop republishing while `wheel_standstill` below is true: a
  # gyro reading taken when the encoders say the vehicle is not rotating
  # is bias, not rotation, so it is not offered to the filter as a
  # rotation measurement. `ekf.yaml` names THIS topic as imu0 and never
  # the raw one.
  #
  # A GAP IN THIS TOPIC IS THE SIGNAL, not a fault. The gate suppresses
  # rather than rewrites, deliberately: a republished message carrying a
  # zeroed rate would be a sensor reading this vehicle never took, and
  # any later consumer would have no way to tell it from one it did.
  # Silence cannot be mistaken for a measurement.
  imu_gated: /forklift/imu_gated

  # THE ENCODER-DERIVED STANDSTILL VERDICT. std_msgs/Bool at 50 Hz from
  # scripts/wheel_odometry.py, which owns it because it owns the encoder
  # model; consumed by scripts/imu_gate.py and by nothing else. The
  # physics behind it and the window are in the `standstill:` block
  # above. It is an estimator input, not a machine state: it does not
  # mean the vehicle is enabled, parked, safe or stopped, and nothing
  # may read it as any of those.
  wheel_standstill: /forklift/wheel_standstill

  # ---- the two estimator topics ----
  #
  # ONE SENSOR'S OPINION. Wheel odometry integrated from this vehicle's
  # own joint states through its tricycle kinematics, by
  # scripts/wheel_odometry.py, carrying the encoder and calibration
  # errors of the `odometry:` block above. It is an INPUT to the EKF in
  # the same sense the IMU is, it publishes NO transform, and no
  # consumer should treat it as the vehicle's pose.
  odom_wheel: /forklift/odom_wheel

  # THE ESTIMATE. robot_localization's EKF, fusing odom_wheel and imu.
  # This node, and no other, publishes forklift/odom -> forklift/base_link
  # on /tf. It is the pose Nav2, SLAM and AMCL see, and it is the one
  # datum in this file with exactly one owner by construction rather than
  # by convention (invariant 10).
  odom_filtered: /forklift/odom_filtered

  # The NAVIGATION lidar on the ROS side. Its consumers are SLAM, AMCL and
  # the Nav2 costmaps, and it is the ONLY input any of them may have. No
  # safety scanner channel feeds a navigation consumer (ADR 0011). The
  # generic name is kept because it is what a SLAM node expects to be
  # remapped from, and because it names the vehicle's map-building scan.
  scan: /forklift/scan

  # ---- the two channels of each safety scanner ----
  # The device class modelled emits TWO outputs: a safe one and a separate
  # NON-SAFE MEASUREMENT channel that its datasheet provides for HMI,
  # diagnostics and process use while stating it must not be used for
  # safety-related tasks. In this simulation the gpu_lidar scan IS the
  # measurement channel, and the safe (OSSD-equivalent) verdict is DERIVED
  # from it by field evaluation, which is what the real device does
  # internally. The derivation is m5-12's and appears nowhere here.
  #
  # THE RULE, CHECKABLE BY EYE: every channel a subscriber can reach is a
  # measurement channel. The safe channel has no topic on either
  # transport, ever.
  #
  # HOW that safe channel reaches the F-program is DESIGN INTENT, NOT
  # SETTLED FACT. ADR 0011 decision 2 makes it configured F-I/O (an
  # ET 200SP F-DI parameterised as the scanner's OSSD pair) whose channel
  # values the S7-PLCSIM Advanced API drives by tag name, this project's
  # analogue of the copper an OSSD pair runs on. That path has never been
  # run: whether this PLCSIM Advanced version simulates F-I/O at all, and
  # whether the API writes a configured F-DI's channel values by tag
  # name, are settled in the tool by plc/forklift-safety/FIO-FEASIBILITY.md
  # (brief m5-03), whose verdict is still blank. If either answers no, the
  # named fallback is the standard-DB stand-in of
  # plc/forklift-safety/SPEC.md, labelled a stand-in wherever it appears.
  # No name or value in THIS file changes under either answer.
  #
  # The safe channel is derived from the SAME rays as the measurement
  # channel. That is honest device modelling and it is NOT redundancy:
  # the two share every failure of the rays. See README.md, "Two channels
  # per safety scanner".
  #
  # THE MEASUREMENT CHANNEL IS NON-SAFE AND MUST NEVER IMPLEMENT A SAFETY
  # FUNCTION. A rendered depth image has no integrity, no OSSD, no fault
  # reaction and no diagnostic coverage, and it crosses a bridge and a
  # network to get here (invariant 1).
  gz_safety_scanner_front_measurement: /forklift/gz/safety_scanner_front/measurement
  gz_safety_scanner_rear_measurement: /forklift/gz/safety_scanner_rear/measurement

  # Bridged into ROS, because a process consumer exists for it:
  # obstacle_zone.py, the M4 comfort stop, whose plane this is.
  safety_scanner_front_measurement: /forklift/safety_scanner_front/measurement

  # The REAR measurement channel has no ROS name, because no process
  # consumer exists for it. A measurement channel is bridged when, and
  # only when, something on the process side consumes it: an unconsumed
  # channel on the network is an invitation to a drive-by consumer, and
  # the one prohibition that matters here is a scanner feeding a
  # NAVIGATION consumer. When a consumer appears, the name it takes is
  # /forklift/safety_scanner_rear/measurement, by the same pattern.

  # ---- vehicle side command inputs, engineering units ----
  cmd_traction_speed: /forklift/cmd/traction_speed
  cmd_steer_angle: /forklift/cmd/steer_angle
  cmd_fork_speed: /forklift/cmd/fork_speed

  # ---- vehicle side derived state ----
  fork_height: /forklift/fork_height
  linear_speed: /forklift/linear_speed
  obstacle_in_stop_zone: /forklift/obstacle/in_stop_zone
  obstacle_min_distance: /forklift/obstacle/min_distance
