# hmi/config-safety-mirror-double.yaml — the same HMI against this layer's OWN
# section 11 double.
#
# `hmi/tools/safety_mirror_double.py`. Neither `bridge/test_double/
# plc_test_double.py` nor `plc/forklift/double/server.py` serves
# `Forklift/Safety/` yet (opcua-nodes.md §11 landed 2026-07-29, after both), so
# this is a minimal, independent double owned by this layer — written without
# importing either, so brief m5a-07 has something to run the section 11
# evidence against without touching bridge/ or plc/. It is a DUMB address
# space, exactly like the bridge test double: it runs no program and forms no
# verdict, so `Forklift/Output/*`, `Forklift/Status/*` and `HmiLinkOk` keep
# their start values for the whole run. What moves is only the four
# `Forklift/Safety/` mirrors, and only server-side, from
# `check_hmi_safety_mirrors.py` — never through a client write, which this
# double refuses exactly as a real server would (§11.4 MR1).
#
# Own port, per the brief: 4860, distinct from every port already spoken for —
# 4840 (PLCSIM), 4842-4846 (the bridge's test doubles), 4847 (this layer's own
# instance of the bridge double), 4850 (the PLC logic double), 4897/4898
# (m4f-07c's one-off re-run instances, EVIDENCE_HMI.md §F.4).

opcua:
  endpoint: "opc.tcp://127.0.0.1:4860/amr-agent/safetymirrordouble/"
  namespace_uris:
    server_interfaces: "http://www.siemens.com/simatic-s7-opcua"
    interface: "http://DemoCell"
  security_policy: "none"
  requested_session_timeout_ms: 10000
  session_name: "amr-agent-hmi-safety-mirror-double"
  reconnect_interval_s: 1.0
  reconnect_backoff_max_s: 5.0

cycle:
  write_period_s: 0.100
  floor_period_s: 0.200
  metrics_period_s: 0.200

http:
  host: "127.0.0.1"
  port: 8093

nodes:
  interface_path:
    - "server_interfaces:ServerInterfaces"
    - "interface:DemoCell"
  write:
    HmiTractionRequest:          ["Forklift", "Hmi", "HmiTractionRequest"]
    HmiSteerRequest:             ["Forklift", "Hmi", "HmiSteerRequest"]
    HmiForkRequest:              ["Forklift", "Hmi", "HmiForkRequest"]
    HmiTeleopRequest:            ["Forklift", "Hmi", "HmiTeleopRequest"]
    HmiResetRequest:             ["Forklift", "Hmi", "HmiResetRequest"]
  heartbeat:
    HmiHeartbeat:                ["Forklift", "Link", "HmiHeartbeat"]
  read:
    ForkliftForkHeight:          ["Forklift", "Input",  "ForkliftForkHeight"]
    ForkliftLinearSpeed:         ["Forklift", "Input",  "ForkliftLinearSpeed"]
    ForkliftObstacleInStopZone:  ["Forklift", "Input",  "ForkliftObstacleInStopZone"]
    ForkliftObstacleMinDistance: ["Forklift", "Input",  "ForkliftObstacleMinDistance"]
    ForkliftTractionSpeedRef:    ["Forklift", "Output", "ForkliftTractionSpeedRef"]
    ForkliftSteerAngleRef:       ["Forklift", "Output", "ForkliftSteerAngleRef"]
    ForkliftForkSpeedRef:        ["Forklift", "Output", "ForkliftForkSpeedRef"]
    ForkliftTeleopActive:        ["Forklift", "Status", "ForkliftTeleopActive"]
    ForkliftObstacleStopActive:  ["Forklift", "Status", "ForkliftObstacleStopActive"]
    ForkliftSpeedLimitActive:    ["Forklift", "Status", "ForkliftSpeedLimitActive"]
    ForkliftResetRequired:       ["Forklift", "Status", "ForkliftResetRequired"]
    HmiLinkOk:                   ["Forklift", "Link",   "HmiLinkOk"]

    # `Forklift/Safety/` (opcua-nodes.md §11.2), optional (§11.6). This
    # double's `--with-safety-mirrors` flag decides whether these resolve.
    EStopDemand:                 ["Forklift", "Safety",  "EStopDemand"]
    ZoneStopDemand:              ["Forklift", "Safety",  "ZoneStopDemand"]
    SafetyResetRequired:         ["Forklift", "Safety",  "SafetyResetRequired"]
    SafetyResetFault:            ["Forklift", "Safety",  "SafetyResetFault"]

logging:
  level: "INFO"
