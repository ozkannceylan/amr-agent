# config.yaml - every constant the m5-ver3 scripts obey, and the only
# place any of them is written down.
#
# THE RULE THIS FILE EXISTS FOR: no behavioural constant lives inline in a
# script on this track - not a partition, not a pose, not a topic, not a
# waiting budget, and not the path to ROS. m5v3.sh and tools/rtf_probe.sh
# read this file once per invocation through tools/_common.sh, which
# refuses by the key's DOTTED name if it cannot. So a constant that has to
# move moves HERE, once, and both scripts move with it. A constant spelled
# in two places is two opinions about one number, and the first one to be
# edited is the one that is right.
#
# EVERY VALUE IS A STRING WHERE A SCRIPT PASSES IT THROUGH. The spawn
# coordinates go onto a gz service request as text; quoting them keeps
# "-3.00" from reaching the wire as "-3.0" and keeps the evidence file's
# comparison against the table exact rather than approximately exact.
#
# It grows. Task 1 owns launch and isolation; the sensor profiles, the
# fusion parameters and the Nav2 stack of F1-F5 land under keys of their
# own beside these.

# ------------------------------ ISOLATION ------------------------------
# WHAT KEEPS THIS TRACK OFF M6's GRAPH, and what decides what stop may
# kill. m6 runs partition m6 on domain 96; step5 ran m5demo. Both may be
# up on this machine at the same time as this one, and a shared graph
# would put one stack's publishers on the other's topics.
#   GZ_PARTITION IS THE ONE THAT SCOPES GAZEBO. gz transport is not DDS,
#   so ROS_DOMAIN_ID does not isolate the simulator at all; it isolates
#   the ROS side (the bridge and everything that will subscribe to it).
#   Both are set on every child, and m5v3.sh's ours() reads GZ_PARTITION
#   back out of a candidate process's environment to decide whether the
#   sweep may touch it. That is why the partition is NOT overridable from
#   the environment: start and stop must never be able to disagree about
#   which graph this is.
isolation:
  gz_partition: "m5v3"
  ros_domain_id: "97"

# --------------------------------- GPU ---------------------------------
# RENDERING ON THIS TRACK IS THE GPU's, AND THAT IS A GATE RATHER THAN A
# PREFERENCE. WSL's default GL stack is llvmpipe - measured on this rig,
# `glxinfo -B` with neither variable set reports
# "llvmpipe (LLVM 20.1.2, 256 bits)" - and software rasterisation is what
# made m6 gate a four-truck fleet at RTF 0.30. This track adds cameras and
# a heavier lidar load to ONE truck, so it starts from the other end: the
# two exports below select Mesa's d3d12 gallium driver and pin it to the
# NVIDIA adapter, and m5v3.sh refuses to start anything at all unless the
# renderer string then names required_renderer.
#   THE REFUSAL IS THE POINT. A silent llvmpipe fallback does not fail, it
#   just measures a different machine, and every figure taken under it is
#   a figure about software rendering wearing this rig's name.
gpu:
  gallium_driver: "d3d12"
  d3d12_adapter_name: "NVIDIA"
  # The substring the renderer string must contain. Measured with the two
  # exports above: "D3D12 (NVIDIA GeForce RTX 4050 Laptop GPU)".
  required_renderer: "NVIDIA"

# -------------------------------- WORLD --------------------------------
# M6's FLOOR, BY REFERENCE AND NOT BY COPY. warehouse_ver3.sdf is the
# 48 x 32 m two-road-class relayout M6.6 built and M6.7 drove; it is
# spawn-free (no vehicle include anywhere in it), so one track can spawn
# four trucks into it and another can spawn one, and neither edits it.
# COPYING IT WOULD BE THE MISTAKE: two floors that start identical and
# drift are two floors, and a route table measured on one of them is then
# a claim about neither.
#   The world NAME inside the file is "warehouse" and stays that way -
#   every /world/warehouse/* service and topic on this track keys on it.
# Paths are relative to the repository root, which m5v3.sh resolves from
# its own location.
world:
  file: "m6/gazebo/warehouse_ver3.sdf"
  name: "warehouse"

# ------------------------------- VEHICLE -------------------------------
# ONE TRUCK. m5-ver3 is the showcase vehicle rebuilt around real sensors;
# the fleet is M6's and stays M6's (vault AMR-DEC-003).
#   THE MODEL IS THIS TRACK'S OWN FORK, gazebo/forklift_ver3/model.sdf,
#   which is m6/gazebo/forklift_ver2/model.sdf byte for byte but for its
#   name. It is forked rather than referenced because F1 rewrites its
#   sensors, and m6's figures are measured on the file it was forked from.
#
# THE SPAWN POSE IS f1's, READ OUT OF m6/ipc/status_contract.py's VEHICLES
# TABLE - the values that table holds TODAY, which are not the ones this
# track's plan quoted. The plan asked for (-3.00, -5.50, 0.05) yaw 0.0.
# That pair is real, but it is the pose of an EARLIER FLOOR: it is
# sim/launch/warehouse_bringup.launch.py's _SPAWN_X/_SPAWN_Y, what step5
# and M6.1 spawned at on warehouse_ver2, and M6.6's relayout put a rack
# column across it. The table moved with the floor; the quotation did not.
#
# IT WAS MEASURED RATHER THAN ARGUED, AND THE ARITHMETIC AGREES WITH THE
# MEASUREMENT TO THE MILLIMETRE (EVIDENCE_BRINGUP.md 7):
#   The model's forks reach x = -1.875 in its own frame. At (-3.00, -5.50)
#   with yaw 0 the fork tips therefore land at world x = -4.875, and
#   RackSW3 stands at x in [-4.500, -4.000], y in [-6.000, -2.500], from
#   the floor up - so the truck is spawned with 0.875 m of fork inside a
#   rack leg. gz accepts it (`data: true` says the request was accepted,
#   never that the truck is clear of geometry), the contact solver then
#   ejects it, and it slides to rest at x = -2.125 - fork tips flush on
#   the rack face at -4.000, exactly the 0.875 m of penetration undone.
#   Measured three ways: warehouse_ver2 settles at (-3.000000, -5.500000)
#   from the same request; warehouse_ver3 slides for m6's own
#   forklift_ver2 model exactly as it does for this fork; and spawn z made
#   no difference.
#
# WHERE THE TABLE'S POSE LANDS: the NORTH RING LEG, y = +10.00, an 8.00 m
# clear cruise corridor with no rack, station or bay in it. The racks
# nearest it end at y = +6.00. yaw 3.14159 points the forks at world +x
# (model yaw 0 puts them at -x), so the truck stands facing east down the
# leg. Measured on this world: it settles at exactly (-17.000000,
# 10.000000, -0.000001), RPY (0, 0, 3.141590), and does not move again.
#
# A POSE THIS TRACK CHOOSES FOR ITSELF IS FINE - one truck does not owe a
# fleet formation anything - but it has to be CHECKED against the floor
# the way this one was, and the check is the fork reach above, not a look
# at the map.
vehicle:
  model: "m5_ver3/gazebo/forklift_ver3/model.sdf"
  # The name the truck is SPAWNED under, which is what a gz service
  # addressing this one truck has to say. Independent of the <model name>
  # inside the file; both are forklift_ver3 here so there is nothing to
  # remember.
  name: "forklift_ver3"
  spawn:
    x: "-17.00"
    y: "10.00"
    z: "0.05"
    yaw: "3.14159"
  # ------------------------- THE GEOMETRY -------------------------
  # THE FOUR NUMBERS A NODE NEEDS TO TURN A JOINT INTO A POSE, seeded
  # from agv/forklift/config.yaml's `model:` block, which is ver2's
  # mirror of model.sdf and derived every one of them there:
  #
  #   steer_link      <pose>  0.55 0 0.24 ...   the steer axis
  #   rear_wheel_left <pose> -0.50 0.36 0.12    rear axle
  #   rear_wheel_right<pose> -0.50 -0.36 0.12   rear axle
  #
  # so the wheelbase is 0.55 - (-0.50) = 1.05 m, and the rear axle
  # midpoint sits at x = -0.50 in base_link.
  #   THAT OFFSET IS NOT COSMETIC. The rear axle midpoint is the only
  #   point of a tricycle whose velocity is purely longitudinal, so
  #   base_link necessarily has a LATERAL velocity component d*yawrate
  #   whenever the vehicle turns, and a wheel odometry that ignores it
  #   reports a body twist the vehicle does not have.
  # THEY ARE COPIED AND NOT REFERENCED because agv/ is ver2's tree and
  # this track may not read it at run time (CONTEXT.md); the source is
  # named above so the copy can be checked against it by hand.
  wheelbase_m: "1.05"
  rear_axle_offset_m: "-0.50"
  # The drive_wheel collision cylinder's radius, read from model.sdf.
  # Not a parameter of anything: it is what the truck rolls on. It lived
  # under wheel_slip: until F1 Task 3, and moved here when the odometry
  # node needed the same number - a constant spelled in two places is
  # two opinions about one number.
  wheel_radius_m: "0.12"
  # steer_joint's mechanical stop, symmetric. tools/drive_route.py checks
  # every steer angle in a profile against it before it drives anything,
  # and REFUSES the profile if one is outside - it does not clamp.
  #   THE DIFFERENCE IS WHICH THING IS BEING CORRECTED.
  #   agv/forklift/scripts/forklift_io.py clamps, and is right to: it is
  #   taking commands from a live stack in real time and has to make one
  #   of them legal. drive_route.py is reading a table somebody wrote
  #   down, so a clamp there would silently drive a manoeuvre the table
  #   does not describe - and the geometry argued in drive_route:'s own
  #   comments would then be a claim about a run nobody performed. A
  #   table that asks for an impossible angle is a table to correct.
  steer_limit_rad: "1.31"

# -------------------------------- TOPICS -------------------------------
# WHAT THE BRIDGE CARRIES, AND NOTHING ELSE YET. A bridged channel with no
# consumer is a claim the run does not make, so this list is exactly what
# Task 1 measures and F1 will grow it.
topics:
  # The simulation clock. One world, one clock.
  clock: "/clock"
  # MEASUREMENT REFERENCE ONLY. This is the OdometryPublisher system's
  # ground-truth pose - no wheel slip, no encoder quantisation, no drift -
  # and on this track it is an instrument, never an input.
  #   F1 KEPT IT, AND KEEPING IT WAS THE POINT. What F1 added is the
  #   wheel odometry below, BESIDE this channel and scored against it; a
  #   phase that deleted its own reference in the same breath as it built
  #   the thing that needs one would have nothing to publish a drift
  #   figure against. Taking it out of the model belongs to whatever
  #   phase has a fused estimate to put in its place, and the EKF that
  #   would be that estimate is F2's. Until then anything that NAVIGATES
  #   on it is measuring its own answer.
  odom_ground_truth: "/forklift/gz/odom"
  # The navigation lidar. 15 Hz, 270 deg, 25.0 m range max since F1 Task 2
  # gave it the TiM571 profile - the SDF is the authority for all three
  # and sensors.nav_lidar.rate_hz below is the figure the hz check quotes.
  scan_nav: "/forklift/gz/scan_nav"
  # The IMU, 100 Hz, six axes and NO orientation. Bridged since F1 Task 2:
  # it is one of the two inputs the F2 EKF fuses, and a channel that will
  # be fused has to be watched from the run before it is.
  imu: "/forklift/gz/imu"
  # THE PALLET CAMERA'S TWO BRIDGED CHANNELS, AND THE POINT CLOUD IS NOT
  # ONE OF THEM. gz's rgbd_camera also advertises <topic>/points, and
  # bridging a point cloud is what took ros_gz issue #368's rig from 90%
  # RTF to 31% (docs/reports/m5v3-03 5). The depth image plus its
  # camera_info carries the same information at a fraction of the wire
  # cost and ROS reconstructs the cloud where a consumer needs it.
  #   THE DEPTH IMAGE GOES OVER ros_gz_image's image_bridge, not the
  #   parameter bridge, and camera_info over the parameter bridge - they
  #   are two different processes for that reason.
  cam_depth: "/forklift/gz/cam/depth_image"
  cam_info: "/forklift/gz/cam/camera_info"
  # NOT BRIDGED, AND NOT AN OVERSIGHT. The 3D lidar's ROS consumer arrives
  # in F2; until it does, bridging 32768 points at 10 Hz would buy nothing
  # and cost the RTF every figure on this track is measured against. Named
  # here because EVIDENCE_MODEL_V3.md measures its gz-side rate.
  #   gz advertises this name as a gz.msgs.LaserScan and, because the scan
  #   has 32 vertical samples, a companion <topic>/points cloud.
  points3d: "/forklift/gz/points3d"
  # THE TRACTION TERMINAL, and tools/slip_bench.sh is the only thing on
  # this track that publishes to it. It is the MOTOR terminal, not the
  # vehicle stack's command topic (model.sdf, COMMAND TOPICS): m5-ver3
  # runs no vehicle stack yet, so the bench addresses the motor directly.
  traction_cmd: "/forklift/gz/actuator/traction_cmd"
  # THE STEER TERMINAL, its pair. tools/drive_route.py publishes both, one
  # after the other, at every segment boundary of a profile, and it is the
  # only thing on this track that publishes to this one.
  #   IT LIVES HERE BECAUSE IT IS A BEHAVIOURAL CONSTANT AND NOT BECAUSE
  #   IT IS BRIDGED. It spent F1 Task 3 spelled inline in drive_route.py
  #   under the argument that this block lists what the bridge carries -
  #   which this block does not: traction_cmd above it, points3d and
  #   safety_scan_back are all here and none is on a bridge line. An
  #   address that decides WHICH ACTUATOR a bench drives is exactly the
  #   kind of constant this file's own header says may not sit inline in a
  #   script, and the header of a section is not a licence to break it.
  steer_cmd: "/forklift/gz/actuator/steer_cmd"
  # The three driven joints' position and rate, published once per physics
  # iteration. The bench reads the drive joint's ACHIEVED rate off it, so
  # a shortfall in the controller can be told apart from slip at the tyre.
  #   BRIDGED SINCE F1 TASK 3, because it is where the STEER angle is
  #   published and nodes/wheel_odometry.py cannot do tricycle kinematics
  #   without it. It carries three joints at the world's own rate, which
  #   is the traffic a wheel odometry costs; EVIDENCE_SENSORS.md 5 is
  #   where what it costs the RTF is measured rather than assumed - the
  #   full sensor set with the estimator on top of it, against the same
  #   probe's baseline without either.
  joint_state: "/forklift/gz/joint_state"
  # THE DRIVE SHAFT'S READING CHANNEL A, and the odometry's only input
  # from the traction axis. model.sdf runs TWO JointStatePublisher
  # systems on drive_wheel_joint and publishes read_a and read_b; what
  # that arrangement is, in m6/ipc/encoder_link.py's own words, is a
  # SINGLE-CHANNEL TESTED SYSTEM - one shaft, one measured quantity, two
  # readings of it - and never a two-channel one.
  #   SO THE ODOMETRY RIDES ONE HEAD. read_b is deliberately NOT bridged
  #   and NOT consumed here: averaging the two would claim a redundancy
  #   the shaft does not have, and it would halve a quantisation that is
  #   common to both readings anyway. The cross-comparison of a against b
  #   is the PLC's function and lives in m6, not on this track.
  drive_speed_read_a: "/forklift/gz/drive_speed/read_a"
  # WHERE THE ESTIMATE COMES OUT. nav_msgs/Odometry, odom -> base_link,
  # at the rate read_a arrives at. It is an ESTIMATE and not a pose: it
  # is scored against odom_ground_truth above and must never be compared
  # with it by an equality - see wheel_odom: below for the two errors it
  # is built to make.
  wheel_odom: "/m5v3/wheel_odom"
  # THE BACK SAFETY SCANNER'S MEASUREMENT CHANNEL, NOT BRIDGED, AND IT HAS
  # TWO CONSUMERS ON THIS TRACK - which is why it is named for the SENSOR
  # and not for either job.
  #   THE GUI WAITS ON IT. gz-sim's GuiRunner discards world state that
  #   arrives before its first snapshot, so a GUI client started before
  #   the model's sensors advertise anchors every lidar fan at the world
  #   origin for the life of the window (measured in m6,
  #   gazebo/m6_world.launch.py). Gating the client on this topic
  #   appearing on the gz side puts the sensors inside that snapshot. It
  #   is this topic rather than another because it is the last sensor the
  #   model brings up, not because of anything it measures.
  #   THE EVIDENCE RECORDER CAPTURES IT. F1 Task 4 scores one safety
  #   scanner's beam noise against the SDF, and these three sensors are
  #   deliberately not bridged (Global Constraint 6 freezes them and F2
  #   has their consumer), so tools/sensor_evidence.py takes them gz-side.
  # IT WAS SPELLED `gui_gate` UNTIL F1 TASK 4, and it was renamed rather
  # than copied for the reason wheel_radius_m moved in Task 3: a constant
  # spelled in two places is two opinions about one number, and the first
  # one to be edited is the one that is right. A key named after the JOB
  # of its first consumer cannot be shared with its second without lying
  # about one of them.
  safety_scan_back: "/forklift/gz/safety_scanner_back/measurement"

# ------------------------------- SENSORS -------------------------------
# THE SDF GOVERNS EVERY SENSOR. Geometry, mount pose, sample count, field
# of view, range, noise and update rate are written in
# gazebo/forklift_ver3/model.sdf and nowhere else, each beside the
# datasheet line it came from. What is repeated HERE is only what a SHELL
# has to know to check the plant: the nominal rate a `ros2 topic hz` or a
# `gz topic -hz` reading is compared against. A shell cannot read SDF, and
# a rate written twice is two opinions about one number - so the rule for
# this section is that it may hold NOTHING the SDF does not already
# decide, and EVIDENCE_MODEL_V3.md diffs the two columns by hand.
#   Every figure below is the CONFIGURED rate. What the plant DELIVERS is
#   a measurement, it is lower, and it lives in the evidence file.
sensors:
  nav_lidar:
    # SICK TiM571 profile: 15 Hz, 811 samples over 270 deg, 0.05-25.0 m.
    rate_hz: "15"
  safety_scanner:
    # FROZEN BY THE PLC FIELD CONTRACT. 10 Hz, 275 samples over 275 deg,
    # 0.10-8.0 m, unchanged from forklift_ver2 - F1 added a noise block to
    # these three sensors and nothing else (Global Constraint 6).
    rate_hz: "10"
  lidar_3d:
    # Ouster OS0 class: 1024 x 32 over 360 x 90 deg, 0.3-50.0 m.
    rate_hz: "10"
  imu:
    # Bosch BMI088 class, six axes, no orientation.
    rate_hz: "100"
  pallet_cam:
    # Intel RealSense D455 class: 640 x 480, 87 deg HFOV, 0.6-6.0 m.
    rate_hz: "15"

# ------------------------------ WHEEL SLIP -----------------------------
# THE DRIVE WHEEL IS ALLOWED TO SLIP, AND THAT IS THE POINT OF F1's
# ODOMETRY. Wheel odometry computed from a joint that cannot slip is
# ground truth with extra steps: the F2 EKF would have nothing to correct
# and every localisation figure taken against it would be circular. The
# gz-sim-wheel-slip-system in model.sdf gives the tyre a finite
# longitudinal and lateral compliance so the contact patch creeps under
# traction, the way a polyurethane tyre on concrete does.
#
# THE TWO PHYSICAL CONSTANTS ARE DERIVED FROM THE MODEL'S OWN NUMBERS,
# never chosen. Both derivations are written out beside the plugin in
# model.sdf and repeated here because a shell and a report need them:
#
#   wheel_radius_m 0.12   is the drive_wheel collision cylinder's radius,
#                         read from model.sdf. Not a parameter.
#
#   wheel_normal_force_n  is the STATIC load the drive wheel carries. The
#                         model's sixteen links total 1165.95 kg with the
#                         centre of mass at x = -0.083323 m; the drive
#                         contact is at x = +0.55 and the rear axle at
#                         x = -0.50, a 1.05 m wheelbase. So
#                           W       = 1165.95 x 9.80665 = 11434.06 N
#                           N_drive = W x (0.50 - 0.083323) / 1.05
#                                   = 11434.06 x 0.396835 = 4537.4 N
#                         Treating the 50 kg of wheel and yoke as unsprung
#                         and carrying it straight to the ground instead
#                         gives 4537.4 N as well - the two agree to
#                         0.01 N - so the beam model above is used and
#                         the distinction is not drawn.
#
# THE TWO COMPLIANCES ARE MEASURED, NOT DERIVED. gz's compliance is
# unitless and the slip it produces depends on the contact solver, so the
# only honest way to a number is to command a cruise and measure what the
# ground truth did. The tuning table, including the rejected values, is
# EVIDENCE_MODEL_V3.md section 7; tools/slip_bench.sh is the instrument.
#
# WHERE wheel_radius_m WENT. It used to be the first key of this block.
# F1's odometry needs the same 0.12 m, and a constant spelled in two
# places is two opinions about one number, so it moved UP to
# vehicle.wheel_radius_m - beside the wheelbase and the steer limit,
# where a reader looking for the truck's geometry looks. The derivation
# above is unchanged and still governs; only the key moved.
wheel_slip:
  wheel_normal_force_n: "4537.4"
  # Longitudinal is the one the odometry feels: it is the traction
  # direction, and it is what makes a wheel revolution mean slightly less
  # than 2 pi r of ground.
  slip_compliance_longitudinal: "7.0"
  # Lateral is the tyre's sideways give. It is held at the same value
  # rather than tuned: this track measures no lateral manoeuvre yet, and a
  # number tuned against nothing is a number invented.
  slip_compliance_lateral: "7.0"
  # ------------------------- THE SLIP BENCH --------------------------
  # tools/slip_bench.sh commands the traction terminal directly, lets the
  # plant reach a steady speed, and then measures the ground truth over a
  # window. Every constant it obeys is here.
  bench:
    # The cruise the fleet actually runs at (m6/ipc/follower.py
    # CRUISE_MPS). Slip is a function of speed, so it is measured at the
    # speed the vehicle spends its life at and not at a convenient one.
    cruise_mps: "0.7"
    # Discarded before the window opens: the drive joint accelerating from
    # rest, which is where the largest slip of the whole run happens and
    # is exactly not what "slip at steady cruise" means. 5 s at 0.7 m/s is
    # 3.5 m, an order of magnitude more than the plant needs to settle.
    settle_s: "5"
    # The window itself. 10 s is 7 m of travel, so a 1 % slip shows up as
    # 70 mm of ground-truth displacement - three orders of magnitude above
    # the ground truth's own resolution.
    sample_s: "10"
    # Between the two segments: the traction terminal is commanded to a
    # standing zero and the vehicle has to actually stop before it is
    # driven back the other way.
    rest_s: "3"

# ----------------------------- WHEEL ODOMETRY ---------------------------
# WHAT nodes/wheel_odometry.py OBEYS, and every one of its errors is a
# number in this block rather than a line in that file.
#
# THE HONESTY RULE THAT GOVERNS EVERY VALUE BELOW is ver2's, quoted from
# agv/forklift/config.yaml's odometry: block because it has not improved
# with age: none of these was chosen to make the drift come out at a
# convenient size. Each is a stated property of the modelled hardware, the
# derivation is written beside it, and the drift that results is reported
# whatever it turns out to be.
#
# WHAT IS *NOT* HERE, AND THAT IS THE POINT: WHEEL SLIP. The physics
# engine already produces it - that is what wheel_slip: above exists for -
# and adding a slip term here would be inventing an error the simulation
# already has.
wheel_odom:
  # ---- the reading head ----
  #
  # ONE COUNT IS 2 pi / 1024 = 6.13592e-3 rad OF SHAFT, which at the
  # 0.12 m wheel is 0.7363 mm of tread. That is the quantum every
  # displacement this node reports is a whole multiple of.
  #   WHY 1024 AND NOT ver2's 4096. agv/forklift/config.yaml records this
  #   same shaft's encoder as 1024 pulses read in QUADRATURE, 4096
  #   counts/rev, 0.184 mm of tread per count. This track models the LINE
  #   grid instead of the quadrature-decoded one, and that is a choice
  #   rather than a discovery: F1 exists to give F2's EKF something to
  #   correct, and an error has to be VISIBLE in the run that measures it
  #   before it is worth filtering. A 0.184 mm quantum on a 20 m aisle
  #   run is not. The cost, stated: this encoder is four times coarser
  #   than the one ver2's vehicle carries, and any figure compared across
  #   the two tracks has to say which grid it was taken on.
  counts_per_rev: "1024"

  # ---- the radius the vehicle BELIEVES ----
  #
  # A scale on vehicle.wheel_radius_m, and it is deliberately not 1.0.
  # A loaded polyurethane drive tyre's effective rolling radius is
  # SMALLER than its free radius, so a truck calibrated on a free or new
  # tyre over-reports distance for ever: 0.12 * 1.015 = 0.1218 m.
  #   THE SIGN IS THE PESSIMISTIC ONE ON PURPOSE, and this is ver2's
  #   argument (odometry.rolling_radius_m) applied to a plant that now
  #   really does slip. The wheel_slip: system above makes the wheel
  #   OVER-TURN relative to the ground, so an error that over-reports
  #   distance COMPOUNDS with slip instead of cancelling it. The other
  #   sign would have flattered every figure by 1.5 % and there would
  #   have been no way to see it in the output.
  #   1.5 % rather than ver2's 0.5 % for the reason 1024 is not 4096:
  #   over the 20 m aisle profile it is 0.30 m of divergence, three
  #   orders of magnitude above the ground truth's own resolution and
  #   readable off a plot rather than out of a residual.
  wheel_radius_scale: "1.015"

  # ---- the steer zero the vehicle BELIEVES ----
  #
  # SENSOR SIDE, ADDED TO THE READING, never to a command. A steer
  # encoder's zero is set against mechanical straight-ahead by a
  # calibration, and no calibration is exact; what is modelled is that
  # calibration's residual. The wheel goes where it is told and the
  # estimator is wrong about where that is.
  #   WHAT IT COSTS, WRITTEN OUT. Driving dead straight, the estimator
  #   believes it is turning at v * tan(0.005) / L = 3.33 mrad/s at
  #   0.7 m/s: 11.5 deg of invented heading per 60 s of straight running.
  #   That is the term that dominates a tricycle's heading error, and it
  #   is the one an EKF with a gyro in it exists to observe.
  # The sign is positive and arbitrary - a real vehicle's is whatever its
  # last calibration left - and nothing downstream may assume it.
  steer_bias_rad: "0.005"

  # ---- the error NOT in this block, and it is the biggest one ----
  #
  # LATERAL TYRE SCRUB, WHICH DEAD RECKONING CANNOT SEE AT ALL. The
  # kinematics this node integrates assumes the tyres do not slide
  # sideways. wheel_slip: above gives them a lateral compliance on
  # purpose, so at a hard steer the contact patch scrubs and the vehicle
  # takes a FRACTION of the yaw its steer angle promises - measured on
  # this rig at 0.401 of it at 0.785 rad and 0.634 at 1.25 rad
  # (drive_route: below carries the table). The node has no term for
  # this and must not be given one: it is not modelling an instrument
  # error, it is the vehicle failing to go where its wheels point, and
  # nothing readable at the shaft or the steer axis contains it.
  #   MEASURED END TO END on the square profile, 2026-08-25: the plant
  #   turned 5.8418 rad and this node reported 10.1408 - it over-rotates
  #   by 1.74x through four hard corners. On a STRAIGHT the same run's
  #   heading error is 0.058 rad. That gap is the single strongest
  #   argument for F2 existing: a gyro observes the yaw the wheels cannot,
  #   and this is the error it is there to correct.

  # ---- what the node reads and how it is framed ----
  #
  # The joint names as they appear in the bridged JointState. The drive
  # name is looked for on topics.drive_speed_read_a and the steer name on
  # topics.joint_state; a name that is not in the message is a refusal
  # with the message's own name list in it, never a silent zero.
  drive_joint_name: "drive_wheel_joint"
  steer_joint_name: "steer_joint"
  # header.frame_id and child_frame_id of the published Odometry. THE
  # NODE BROADCASTS NO TRANSFORM on this edge and must not: odom ->
  # base_link has exactly one owner and in F2 that owner is the EKF
  # (ver2 invariant 10). The cheapest way to guarantee a second publisher
  # cannot appear is for the node to contain no broadcaster at all, and
  # it does not.
  odom_frame: "odom"
  base_frame: "base_link"
  # Subscription and publication queue depth. The plant publishes both
  # inputs once per physics step, so this is about four milliseconds of
  # slack, which is what a python callback needs and no more: a deep
  # queue on a 500 Hz channel does not prevent loss, it delays it and
  # then hands the estimator stale stamps.
  qos_depth: "10"
  # A STEER READING OLDER THAN THIS IS NO STEER READING. Both inputs
  # arrive once per physics step, so 0.3 s of silence is a dead
  # publisher and not a late one (m6/ipc/encoder_link.py's ENC_STALE_S,
  # same channel, same argument). The node then SKIPS the sample rather
  # than integrating against a stale angle - and skipping costs nothing
  # in distance, because the count grid is ABSOLUTE and the next accepted
  # sample differences against the last accepted one.
  steer_stale_s: "0.3"
  # How often the node writes a line of its own state to its log. It is a
  # log cadence and changes nothing the node computes; it is here rather
  # than inline because the file's header says nothing behavioural lives
  # inline and a cadence is close enough to the line to be argued about.
  log_every_s: "10"
  # THE SECOND HEARTBEAT'S CADENCE, AND IT IS THE ONE CLOCK ON THIS NODE
  # THAT IS NOT THE PLANT'S. log_every_s above rides the OUTPUT - it is
  # reached through publish() - so the state it can never report is the
  # one the log is most needed for: a node that is ALIVE and publishing
  # NOTHING, which is exactly what a dead steer topic produces (the held
  # angle stays None and every drive sample is skipped for ever).
  # nodes/wheel_odometry.py's alive() is a TIMER instead, on the
  # machine's own clock, so it ticks with the world stopped.
  #   5 s IS CHOSEN AGAINST THE OPERATOR AND NOT AGAINST THE PLANT.
  #   `m5v3.sh status` reports the child ALIVE, and the next thing an
  #   operator does is open logs/odom.log - which has to have something
  #   in it by then or the two instruments disagree. It costs one line
  #   per 5 s and only while the output is stopped: a run that is
  #   publishing never reaches the print at all.
  alive_every_s: "5"
  # HOW LONG SILENCE IS ALLOWED TO BE NORMAL BEFORE IT IS CALLED A FAULT.
  # The node is spawned before the world has necessarily advertised its
  # joint channels, so the first quiet seconds are a bringup and not a
  # defect - timing.startup_check_s (1 s) bounds a child DYING, not a
  # child becoming useful. A watchdog that cries at a normal start
  # teaches the operator to ignore it, which is the failure m6's own
  # escalation rule exists to prevent, so alive() prints info until this
  # much CONTINUOUS silence has passed and warn afterwards. Three ticks
  # of the cadence above: long enough that a world still loading is not
  # a fault, short enough that a stack which will never publish says so
  # inside the time it takes to read the log.
  alive_warn_after_s: "15"

  # ---- the covariances this node publishes, and their derivation ----
  #
  # STATIC DIAGONAL, THIS PHASE, AND THE COMMENT IS THE WHOLE OF THE
  # CLAIM. A covariance that moved with the steer angle and the speed
  # would be a better model; it is F2's to build if F2's EKF turns out to
  # need one. What is published here is a constant derived at ONE named
  # operating point, and naming the point is what makes it honest.
  #
  # The point: v = 0.7 m/s (wheel_slip.bench.cruise_mps, the speed this
  # vehicle spends its life at), delta = 0, dt = 0.002 s,
  # q = 6.13592e-3 rad, r = 0.1218 m, L = 1.05 m, d = 0.50 m.
  #
  #   dt IS THE WORLD'S PHYSICS STEP AND NOT A NODE RATE. The plant
  #   publishes this channel once per physics iteration and the node runs
  #   on every one of them, so in SIM time the interval is exactly
  #   warehouse_ver3.sdf's max_step_size, 0.002 s. The ~493 Hz quoted
  #   elsewhere is that same interval measured on a wall clock.
  covariance:
    # vx. Two terms.
    #   quantisation: the difference of two independent uniform
    #     quantisation errors has sigma q/sqrt(6) = 2.50498e-3 rad, so
    #     sigma_s = r * 2.50498e-3 = 3.05107e-4 m and
    #     sigma_v = 3.05107e-4 / 0.002 = 0.1525537 m/s
    #   radius scale: 1.5 % of 0.7 m/s = 0.0105 m/s
    #   sigma_vx = sqrt(0.1525537^2 + 0.0105^2) = 0.1529146 m/s
    #
    # READ THAT FIRST TERM AGAIN: AT THIS RATE THE REPORTED VELOCITY IS
    # 22 % NOISE. It is not a defect in the arithmetic, it is what
    # differencing a 0.74 mm grid over 2 ms is - at 0.7 m/s the truck
    # covers 1.9 counts per sample, so the count either lands or it does
    # not. ver2 ran its odometry at 50 Hz for exactly this reason
    # ("each cycle differences a real displacement rather than quantiser
    # dither"), where the same term falls to 0.01526 m/s, 2.2 %.
    #   THIS NODE STILL RUNS ON EVERY SAMPLE, because the POSE does not
    #   care - the grid is absolute, so quantisation does not accumulate
    #   in position - and because a quantiser that skips samples is a
    #   different device. What it costs is the TWIST, and the number
    #   below is the node saying so out loud to whatever fuses it. If
    #   F2's EKF cannot live with it, the fix is a decimated twist and
    #   the arithmetic for it is in this comment.
    vx: "2.3383e-2"
    # vyaw. yawrate = v * tan(delta) / L, so d(yawrate)/d(delta) at
    #   delta = 0 is v / L = 0.666667 1/s. The steer reading is NOT
    #   quantised on this track - the bias is the whole of its error -
    #   so there is one term and it is that bias carried through:
    #   0.005 * 0.666667 = 3.33333e-3 rad/s.
    #
    #   A BIAS IN A COVARIANCE IS A PRAGMATISM AND IS LABELLED ONE. It is
    #   a systematic error, not a noise, and no diagonal can represent it
    #   honestly; what it buys is an EKF that does not believe this
    #   heading more than it should. ver2 did the same with its steer
    #   zero offset.
    #
    #   Compare the IMU: model.sdf declares the gyro at 1.745e-3 rad/s of
    #   white noise, so the two sources are within a factor of two of
    #   each other on the SAME quantity and F2's filter will genuinely
    #   blend them rather than one drowning the other. Neither number was
    #   moved to arrange that.
    vyaw: "1.1111e-5"
    # vy is not measured. It is d * yawrate exactly, a kinematic
    # consequence of base_link standing 0.50 m forward of the rear axle,
    # so its variance is d^2 times vyaw's: 0.25 * 1.1111e-5.
    vy: "2.7778e-6"
    # EVERY AXIS THIS ESTIMATE DOES NOT MEASURE, and the whole pose.
    #   The pose of a dead-reckoned estimate has UNBOUNDED error and no
    #   honest fixed number exists for it, so a large constant is
    #   published and F2's EKF is to fuse the TWIST and never the pose.
    #   The value exists so the message is well formed, and so that
    #   anything which ignores that warning is told the pose is worth
    #   nothing. z, roll and pitch are the same story: this vehicle's
    #   wheels say nothing at all about them.
    unused: "1000.0"

# ------------------------------ DRIVE ROUTE -----------------------------
# tools/drive_route.py's profiles. It is the EVIDENCE DRIVER: it puts the
# truck through a known, repeatable manoeuvre so that the odometry and the
# ground truth can be read against each other over it. It closes no loop,
# reads no pose and corrects nothing - open loop is the honest shape for a
# bench, because a controller in the loop would make every divergence a
# statement about the controller as well.
#
# A SEGMENT IS (hold_s, tread_mps, steer_rad) AND THE CLOCK IS THE
# PLANT'S. Each segment publishes its two standing orders - the steer
# terminal first, then the traction terminal - and holds them for hold_s
# of SIM time, read off the bridged clock. Wall time is deliberately not
# used: the same profile then covers the same ground whatever the
# real-time factor was on the day, which is the difference between a
# repeatable manoeuvre and one that depends on the machine's load.
#
# THE SIGN IS IN THE TABLE, ONCE. Forward - forks first, the travel
# direction - is a NEGATIVE tread speed, because model yaw 0 points the
# forks at world -x (m6/ipc/follower.py's header). Every negative number
# in these tables is the truck going forwards. Astern is positive.
#
# WHERE THESE FIT ON THE FLOOR. The truck spawns at (-17.00, 10.00) yaw
# 3.14159, which is the NORTH RING LEG facing world +x, and the free band
# there is y in [6.00, 14.00] by x in [-24.00, +24.00]: every rack in
# warehouse_ver3.sdf ends at y = +6.00 (RackNW1 is a 0.5 x 3.5 m box at
# (-15.750, 4.250), so it spans y 2.50 to 6.00) and the north wall's
# inner face is y = +14.00. So there is 48 m of room along the leg and
# exactly 8 m across it, and the 8 m is what sizes the square below.
drive_route:
  # HOW LONG THE DRIVER WILL WAIT FOR A CLOCK MESSAGE before it refuses.
  # `gz topic -e` waits for its next message FOR EVER, so a stack that is
  # not up would hang the driver in silence rather than refuse it -
  # noise_probe.capture_timeout_s exists for the same reason. The clock
  # publishes at the world rate, so anything past a couple of seconds is
  # already an answer; 20 s is an order of magnitude of headroom over a
  # loaded rig and still a bound.
  clock_timeout_s: "20"
  profiles:
    # STRAIGHT: accelerate to cruise, hold, stop. About 11.9 m of travel
    # in 23.5 s of sim time, from x = -17.0 to about x = -5.1 with the
    # fork tips at -3.2 - the whole of it inside the ring band.
    #   THE RAMP IS IN THE TABLE BECAUSE THE PLANT HAS NONE. model.sdf's
    #   traction terminal is a raw velocity command with no ramp, so a
    #   single step to cruise would put the largest slip of the run into
    #   its first tenth of a second. Four quarters of cruise at 0.5 s
    #   each is the ramp, and it is the same shape on the way down.
    straight:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "15.0", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}

    # SQUARE: four straights joined by four steered corners, back towards
    # where it started. An open-loop square's CLOSURE ERROR is the classic
    # odometry reading, and it is why this profile exists: the truck comes
    # back to its start and what the estimate says about that is the
    # measurement.
    #
    # THE CORNER IS MEASURED AND NOT DERIVED, AND THE FIRST VERSION OF
    # THIS TABLE IS WHY. It was written from the kinematics - delta =
    # pi/4, R = L/tan(delta) = 1.05 m, corner = (pi/2)*L/(v*sin delta) =
    # 7.775 s - and driven on this rig on 2026-08-25. The plant turned
    # 2.912 rad in the four corners against the 6.283 asked for, and the
    # truck finished 4.45 m from its start instead of on it. THE TABLE
    # WAS NOT WRONG ARITHMETIC; IT WAS THE WRONG MODEL. A tricycle's
    # kinematics assumes the tyres do not slide sideways, and this
    # model's whole point is that they do (wheel_slip: above, lateral
    # compliance 7.0). At a hard steer the contact patch scrubs, and the
    # yaw the vehicle actually takes is a fraction of the yaw the
    # geometry promises.
    #
    #   MEASURED ON THIS RIG, one steady turn per row, ground truth over
    #   a 10 s window after the steer axis had slewed and the turn had
    #   established (instrument: a throwaway gz-side probe commanding the
    #   two terminals and integrating /forklift/gz/odom's yaw; the same
    #   two numbers can be read back off any drive_route run):
    #
    #     steer      kinematic      MEASURED      effective   fraction
    #     [rad]      [rad/s]        [rad/s]       R [m]       delivered
    #     -0.785398  0.20203        0.08104       2.632       0.401
    #     -1.250000  0.27114        0.17182       0.711       0.634
    #
    #   So the harder steer is not only tighter, it is also LESS lossy:
    #   0.63 of its geometry against 0.40. That is the direction a scrub
    #   term goes and it is why the table below uses -1.25 rad, 0.06 rad
    #   inside the 1.31 mechanical stop.
    #
    # THE GEOMETRY THAT FOLLOWS FROM THAT MEASUREMENT, checked against
    # the floor rather than chosen:
    #   A 90 deg corner is (pi/2) / 0.17182 = 9.142 s, and the rear axle
    #   traces it at R = 0.711 m. With 1.00 m straights the rear-axle
    #   path is a 2.42 m rounded square (2R + A) and the run is 53.9 s.
    #   THE BINDING CONSTRAINT IS THE TRUCK AND NOT THE SQUARE. The
    #   corridor is 8.00 m across and the fork tips reach 1.375 m ahead
    #   of the rear axle, so the worst point of the whole path is the
    #   middle of the second corner, where the tips reach y = 13.19
    #   against a wall at 14.00 - 0.81 m of margin. On the northbound
    #   straight they reach 13.09. That is what sizes A at 1.00 m.
    #   A 90 deg SQUARE AT pi/4 WOULD NOT FIT ANYWHERE ON THIS FLOOR:
    #   2R = 5.26 m plus the truck's own 3.8 m envelope needs 9.06 m of
    #   width and the widest clear road in warehouse_ver3 is 8.00 m.
    #   IT TURNS LEFT, TOWARDS THE WALL. Left and right are symmetric on
    #   this leg (4.00 m either way), but south of the square's own x
    #   range stands RackNW1 at x in [-16.00, -15.50] reaching y = 6.00,
    #   and a wall is a flatter thing to have 0.8 m away than a rack leg.
    #   A left turn while driving FORWARD is a NEGATIVE steer angle -
    #   positive is the driver's right (m6/tests/test_follower.py's
    #   header) - which is why every corner below is signed as it is.
    #   THE WHOLE SQUARE IS DRIVEN AT 0.3 m/s, the fleet's own corner
    #   speed (m6/ipc/follower.py CORNER_MPS). Cruise is what straight:
    #   and aisle: are for.
    #
    # AND IT STILL DOES NOT CLOSE EXACTLY, for a reason the table cannot
    # remove: the steer axis has to SLEW into each corner from dead
    # straight, and the measurement above was taken with it already
    # there, so every corner loses the yaw of its own first fraction of a
    # second. MEASURED OVER THE WHOLE PROFILE on this rig 2026-08-25,
    # ground truth from spawn: the truck turned 5.8418 rad of the 6.2832
    # asked (93.0 %) and came back to within 0.6831 m of its start.
    #   THAT RESIDUAL IS NOT AN ERROR TO TUNE OUT. It is the plant, it is
    #   open loop, and the ground truth is what says where the truck
    #   went. Driving the table until the truck closed perfectly would
    #   only mean the table had absorbed one day's slip, and the next run
    #   at a different load or a different speed would open it again.
    square:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "9.142", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "9.142", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "9.142", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "9.142", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}

    # AISLE: down the free aisle in front of the spawn and back, dead
    # straight both ways, 20.3 m each leg in about 72 s of sim time.
    #
    # WHICH AISLE, SAID PLAINLY. It is the NORTH RING LEG, y = +10.00 -
    # the 8.00 m cruise corridor the truck already stands in - and NOT
    # the pick aisle at y = 0.00, which this vehicle would have to leave
    # the ring and thread the spine to reach. The ring leg is what "the
    # free aisle in front of the spawn" means on this floor.
    #
    # THE WAYPOINTS. Forward from base_link x = -17.0 to a NOMINAL
    # x = +3.3 (fork tips +5.2), then astern back towards x = -17.0. The
    # east ring leg's centreline is x = +20.00 and the hall's inner face
    # is +24.00, so the turn point stands 17 m clear of anything.
    #   MEASURED ON THIS RIG 2026-08-25, ground truth from spawn: the
    #   round trip ends at x = -15.330, y = 10.000 - 1.670 m SHORT of
    #   where it began, and dead straight. The shortfall is not the
    #   profile drifting off line, it is slip, and it does not cancel
    #   between the two legs the way a symmetric table might suggest it
    #   would. It is left in rather than trimmed out: what the truck
    #   covers is the ground truth's to report, and a table tuned until
    #   it closed would only have absorbed one day's tyre.
    #
    # AND IT COMES BACK ASTERN RATHER THAN TURNING ROUND, for the reason
    # tools/slip_bench.sh gives for its own two segments: a profile that
    # only ever drives one way walks into the racking, a three-point turn
    # in an 8 m corridor is a manoeuvre this bench is not measuring, and
    # reversing over ground the truck has just cleared costs nothing and
    # catches a sign error that one leg would hide. The counterweight end
    # leads on the way back; the return leg is retracing swept floor.
    aisle:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "27.0", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.175", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.700", steer_rad: "0.000"}
      - {hold_s: "27.0", tread_mps: "0.700", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.175", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}

    # CORNER_CREEP: ONE corner, held long enough to have a steady state,
    # and the whole profile exists to answer ONE question the owner asked
    # on 2026-08-25: DOES THE TRICYCLE KINEMATIC MODEL HOLD AT CREEP
    # SPEED? A real truck's does - at 0.3 m/s a polyurethane tyre has
    # almost no lateral force to shed - so if this plant delivers a
    # FRACTION of the yaw its steer angle promises even at a crawl, that
    # is a statement about the wheel-slip system's lateral compliance and
    # not about the speed. F2's EKF and F3's controller both assume the
    # model somewhere, so the size of the gap is worth knowing.
    #
    # WHAT IT IS NOT: A TUNING RUN. Global constraint 7 - whatever the
    # ratio turns out to be is RECORDED. Nothing in wheel_slip: or in
    # square: moves because of it.
    #
    # THE FOUR NUMBERS AND WHERE EACH COMES FROM:
    #
    #   0.3 m/s     m6/ipc/follower.py CORNER_MPS, the speed the fleet
    #               takes a corner at, and the speed square: is driven
    #               at. Not a convenient number: the one the vehicle
    #               spends its cornering life at.
    #   -0.785398   pi/4, the MODERATE of the two steer angles this rig
    #               already has a measurement at (0.401 of geometry
    #               delivered, against 0.634 at 1.25 rad - the table in
    #               square: above). Comparable by construction: the same
    #               angle at the same speed, measured a second time by a
    #               named instrument that survives the run rather than by
    #               the throwaway probe that produced the table.
    #               NEGATIVE IS LEFT while driving forward, and left is
    #               towards the north wall - the same choice square:
    #               makes and for the same reason: 4.00 m either way, and
    #               a wall is a flatter thing to have a metre away than a
    #               rack leg.
    #   3.0 s       the run-in. 0.9 m of straight at creep, so the corner
    #               starts from a vehicle that is already moving and the
    #               steer axis slews into a rolling tyre rather than a
    #               parked one.
    #   14.0 s      the corner. tools/sensor_evidence.py discards the
    #               first evidence.corner.settle_s of the HELD steer
    #               angle - the axis has to slew, and the yaw of that
    #               slew is not a steady state - and averages the yaw
    #               rate over the evidence.corner.window_s after it. 14 s
    #               leaves 10 s of held corner for a 4 s settle and a 6 s
    #               window.
    #
    # IT FITS THE FLOOR AT EVERY YAW RATE IT COULD POSSIBLY DELIVER, and
    # that is checked rather than assumed because the delivered rate is
    # what this profile is measuring - so the geometry may not depend on
    # it. The rear axle starts at world (-16.50, 10.00) heading +x (the
    # spawn is base_link, 0.50 m ahead of the axle, at yaw pi). Turning
    # left at radius R the axle reaches y = 10 + R(1 - cos theta), and
    # the truck's own envelope corner stands 1.50 m from the axle at
    # 23.6 deg off the travel direction (fork tips 1.375 m ahead,
    # half-width 0.60 m). Three cases, against the north wall's inner
    # face at y = +14.00:
    #
    #   delivered      R [m]   turn in 14 s   worst envelope y   margin
    #   0.081 rad/s    2.62    65 deg         13.01              0.99 m
    #   (Task 3's measured 0.401 fraction - the expected case)
    #   0.14 rad/s     1.51    112 deg        12.88              1.12 m
    #   0.202 rad/s    1.05    162 deg        12.55              1.45 m
    #   (the full kinematic rate - the case that cannot happen)
    #
    # So the corridor holds it whatever the answer is, which is the
    # property a measurement profile has to have.
    corner_creep:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "14.0", tread_mps: "-0.300", steer_rad: "-0.785398"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}

# -------------------------------- PATHS --------------------------------
# Relative to the repository root. The pidfile is what stop reads and the
# only file it deletes; the log dir is one file per child, by name.
paths:
  log_dir: "m5_ver3/logs"
  pidfile: "m5_ver3/.m5v3_pids"
  # THE ONLY ABSOLUTE PATH IN THIS FILE, and it is absolute because it is
  # not this repository's: it is where ROS 2 Jazzy is installed inside
  # WSL. Both scripts source it before they call gz - gz itself comes from
  # gz_tools_vendor under /opt/ros, not only the ROS nodes - and both
  # refuse by name if it is not there. It lives here rather than at the
  # top of each script because it was written twice, and a constant
  # written twice is two opinions about one path.
  ros_setup: "/opt/ros/jazzy/setup.bash"

# -------------------------------- TIMING -------------------------------
# Seconds. Measured on this rig rather than guessed, and every one of them
# is a waiting budget - nothing here changes what the plant does.
timing:
  # Server up and warehouse_ver3.sdf loaded before the create service is
  # called. rtf_spike.sh uses 8 s against the same world on the same rig.
  world_load_s: "8"
  # The truck dropped from z = 0.05 onto its wheels and stopped moving,
  # before its resting pose is read back or anything is measured.
  settle_s: "5"
  # After the last spawn, before the pid file is walked for children that
  # died on their way up. A process that dies in its first fraction of a
  # second has not started, and saying "up" about it sends the operator to
  # the wrong log.
  startup_check_s: "1"
  # Between the TERM sweep and the KILL sweep. Past this, nothing is
  # exiting on its own.
  stop_grace_s: "2"
  # HOW OFTEN THE GUI GATE ASKS whether the scanner topic has appeared.
  # It is a `gz topic -l` per poll against a local daemon, so the cost is
  # nothing and the only thing this number buys is how much of the wait
  # is spent waiting after the answer is already yes.
  gui_gate_poll_s: "0.5"
  # AND HOW LONG IT WAITS AFTER THE ANSWER IS YES. The gate closes a race
  # inside gz-sim's GUI, not a race about the topic: the SensorTopic
  # components VisualizeLidar anchors on are created by the render thread
  # a beat after the sensor advertises, so a client let in on the advert
  # alone can still snapshot the world without them. This is that beat,
  # and it is m6's measured value (gazebo/m6_world.launch.py).
  gui_gate_settle_s: "2"
  # THE CREATE SERVICE'S OWN DEADLINE, in MILLISECONDS - that is gz
  # service's unit, not this file's choice. It has to outlast a cold
  # first spawn, where the model's four sensors and its physics are being
  # built for the first time; m6's rtf_spike.sh gives the same call the
  # same 10 s against the same model on this rig.
  spawn_service_timeout_ms: "10000"
  # HOW LONG spawn() WAITS FOR A CHILD TO WRITE ITS OWN PID before it
  # reports the pid as UNKNOWN. tries x wait_s is the budget: 50 x 0.1 s
  # = 5 s, which is two orders of magnitude more than the measured cost
  # of setsid, a redirect and one append. It is a budget and not a
  # deadline: a child that exceeds it is still started, still recorded
  # and still swept - only its pid line reads UNKNOWN and points at the
  # log. The startup check below is what decides whether it LIVED.
  pid_wait_tries: "50"
  pid_wait_s: "0.1"

# ------------------------------- RTF PROBE ------------------------------
# tools/rtf_probe.sh samples gz.msgs.WorldStatistics on the running
# world's stats topic and reports mean, median and floor over the sample.
#   THE TOPIC IS THE WORLD-SCOPED ONE, and `gz stats` is deliberately not
#   used: that is Gazebo CLASSIC's verb. gz-tools for Harmonic has no
#   stats verb at all - it prints the general help and exits 0 - so a
#   probe built on it would report nothing on a perfectly healthy sim.
#   30 s at the ~10 Hz that topic publishes is ~300 samples; the count
#   sags with the RTF, so the probe prints it as a reading of its own.
rtf_probe:
  sample_s: "30"

# ------------------------------ NOISE PROBE -----------------------------
# tools/noise_probe.sh captures a FIXED NUMBER OF FRAMES from one sensor
# topic, with the vehicle at rest, and reports how much each reading moves
# about its own mean. A count and not a duration: a duration would make
# the sample size depend on the real-time factor, and a noise figure that
# moves with the machine's load is not a noise figure.
noise_probe:
  # 60 scans is 4 s of a 15 Hz lidar. The standard deviation of a
  # standard deviation from n samples is about sigma/sqrt(2(n-1)), so at
  # n = 60 a 20 mm figure is known to about 1.8 mm - one significant
  # figure better than the number being checked, which is all this has to
  # be.
  scan_samples: "60"
  # 40 depth frames, because each one is 640 x 480 float32 and the
  # capture is base64 on a pipe: 40 costs about 65 MB of /tmp and 2.7 s
  # of a 15 Hz camera, and the same sqrt rule puts an 8 mm figure inside
  # 1 mm.
  depth_samples: "40"
  # THE BOUND ON WAITING, AND IT IS NOT THE SAMPLE. `gz topic -e -n N`
  # waits for its N messages FOR EVER: a misspelt topic, or a stack that
  # is not up, hangs the probe in silence rather than refusing - measured
  # by hanging it. The slowest honest capture on this rig is the 3D lidar
  # at 60 frames, 10 Hz, under the depressed real-time factor its own
  # subscription causes: about 7 s. 60 s is an order of magnitude of
  # headroom over that and still a bound.
  capture_timeout_s: "60"
  # THE GRID THE QUANTIZATION TEST MEASURES AGAINST, IN METRES, AND IT IS
  # NOT A PROPERTY OF THE PROBE. It is the <precision> a gz
  # gaussian_quantized noise would round every reading onto, and 1 mm is
  # what these sensors would declare if they could: it is the range
  # precision class of the instruments they model.
  #   THEY CANNOT, AND THE PROBE THEREFORE EXPECTS TO FAIL ITS OWN TEST.
  #   A gpu_lidar configured gaussian_quantized produces no noise at all
  #   on this gz - measured, all 710 beams byte-identical across five
  #   sweeps (EVIDENCE_MODEL_V3.md 9.2) - so the model declares plain
  #   gaussian and STATES the quantization it does not model rather than
  #   omitting it. The residual the probe prints against this grid,
  #   ~0.25 mean and ~0.5 max, is the evidence that the grid is absent
  #   from the wire; EVIDENCE_MODEL_V3.md 5.2 tabulates all four
  #   channels reading exactly that.
  #   ONE VALUE FOR BOTH MODES, because both are ranges in metres: the
  #   scan branch and the depth branch ask the same question of the same
  #   unit, and two keys would be two places for one answer to drift.
  quantization_grid_m: "0.001"

# --------------------------- SENSOR EVIDENCE ---------------------------
# tools/sensor_evidence.py, which is F1 Task 4's instrument and the only
# thing that writes EVIDENCE_SENSORS.md's measured column. It has two
# halves and they are deliberately not the same program:
#
#   record   attaches to the running plant, subscribes what the bridge
#            carries, and writes one headered CSV per stream under
#            evidence.dir. `record --drive PROFILE` starts
#            tools/drive_route.py itself so that ONE command produces ONE
#            complete run - a recording started by hand a second after
#            the drive is a recording with the reference pose missing
#            from it.
#   analyse  reads those CSVs and prints the tables. IT TOUCHES NO ROS
#            AND NO GAZEBO AT ALL: it runs on the owner's Windows python,
#            on a WSL shell with nothing sourced, or on a machine that
#            has never had either, because a figure that can only be
#            recomputed on the rig that produced it is a figure nobody
#            can check.
#
# WHAT IS *NOT* IN THIS BLOCK, AND IT IS THE POINT: THE CONFIGURED NOISE.
# The SDF governs every sensor (see the sensors: block's own header), and
# a python program - unlike a shell - CAN read SDF. So analyse reads the
# stddev, the bias and the update rate it compares against straight out
# of vehicle.model, and this file holds not one of them. The sensors:
# block above repeats the rates because a SHELL cannot do that, and it
# says so; that exception does not extend to a program that can.
evidence:
  # Where a session lands: one directory per run, named for what it is
  # and when it was taken, holding one CSV per stream plus session.txt.
  # Under paths.log_dir, so .gitignore already covers it - the CSVs are
  # evidence and they are BIG (a 60 s scan capture is 900 frames of 811
  # beams), so the evidence FILE quotes their md5 and the CSVs stay out
  # of the repository.
  dir: "m5_ver3/logs/evidence"
  # HOW LONG THE RECORDER WILL WAIT FOR THE FIRST MESSAGE ON EVERY STREAM
  # BEFORE IT REFUSES. This is the bound on waiting and it is not the
  # sample: a misspelt topic, a bridge that did not come up or a sensor
  # nothing subscribes to would otherwise hang the recorder in silence -
  # noise_probe.capture_timeout_s exists for exactly this and was
  # measured by hanging the probe. The slowest stream here publishes at
  # 10 Hz, so anything past a second is already an answer; 30 s is an
  # order of magnitude of headroom over a cold bridge and still a bound.
  wait_first_s: "30"
  # Below this many rows a stream did not deliver a capture, and analyse
  # refuses it by name rather than averaging four numbers into a figure
  # that looks like a measurement.
  min_samples: "5"
  # THE SUBSCRIPTION QUEUE, AND IT IS DEEP ON PURPOSE. The recorder is
  # one python process holding eight subscriptions, two of which arrive
  # at the world's own 500 Hz, and a shallow queue on a channel that fast
  # does not prevent loss - it just makes the loss happen sooner. A deep
  # queue lets a callback that is momentarily late catch up.
  #   IT DOES NOT MAKE THE RATE FIGURES SAFE AND NOTHING PRETENDS IT
  #   DOES: a drop shows up in the recorded stamps as an interval several
  #   times the median, so analyse prints dt_max beside every rate and
  #   the evidence file reads them together.
  qos_depth: "500"
  static:
    # THE VEHICLE IS AT REST FOR THIS ONE and the number is a duration
    # rather than a frame count, which is the opposite of what
    # noise_probe.sh does. The reason is that this capture carries EIGHT
    # streams at five different rates: a count would mean five different
    # durations, and the delivered-rate figures would then each be taken
    # over a different piece of the run. 60 s is 900 nav-lidar frames,
    # 6000 IMU samples and 900 depth frames - an order of magnitude more
    # than the 60 the noise figure needs, and the sqrt(2(n-1)) rule puts
    # a 20 mm spread inside 0.5 mm at that count.
    record_s: "60"
  drive:
    # RECORDED BEFORE THE DRIVE STARTS, with the truck standing where it
    # spawned. This is the reference pose every drift figure is measured
    # from: analyse checks the recorded ground truth against
    # vehicle.spawn and refuses if the truck is not where config says it
    # is, because a transform built on the wrong origin produces drift
    # figures that are wrong by a constant and look entirely plausible.
    pre_roll_s: "4"
    # And after drive_route.py exits, because the plant is still moving
    # when the last segment's standing zero lands.
    post_roll_s: "4"
    # THE BOUND ON THE DRIVE ITSELF. The profile's own sim-time length is
    # known from its table, and drive_route.py steps its schedule off the
    # plant's clock - so a real-time factor of 1/3 would triple the wall
    # time it takes. Past factor x nominal + margin the drive is not slow,
    # it is stuck, and the recorder ends it rather than waiting for ever.
    # The CSVs are written whatever happens: a partial recording of a run
    # that went wrong is evidence, and deleting it would not be.
    timeout_factor: "3"
    timeout_margin_s: "60"
  depth:
    # A CENTRAL PATCH AND NOT THE WHOLE IMAGE, tools/noise_probe.sh's
    # choice and its argument: 640 x 480 x 900 frames is 276 million
    # floats and the statistic does not get better for it. 8 gives a
    # 16 x 16 patch at the image centre, which is where the optical axis
    # lands - on this camera the floor about 2.2 m ahead.
    patch_half: "8"
  safety:
    # THE SAFETY SCANNER IS NOT BRIDGED (Global Constraint 6 freezes
    # those three sensors and F2 owns their consumer), so the recorder
    # takes it GZ-SIDE with `gz topic -e -n`, in a phase of its own after
    # the ROS capture has finished. Separately, because subscribing makes
    # gz render a sensor that nothing else is rendering, and an RTF or a
    # delivered rate measured beside that subscription is a reading about
    # a different stack (EVIDENCE_MODEL_V3.md 6).
    # 60 frames is 6 s of a 10 Hz scanner and matches noise_probe.sh's
    # own scan sample, so the two figures are comparable.
    frames: "60"
    # The bound on waiting for those frames. noise_probe.capture_timeout_s
    # is the same number for the same reason: `gz topic -e -n N` waits
    # for its N messages FOR EVER.
    capture_timeout_s: "60"
  gz_rate:
    # THE GZ-SIDE DELIVERED RATE, `gz topic -f`, which reports a rolling
    # 10-interval window every ten messages. It is the only instrument
    # that can see the unbridged sensors at all, and it is what
    # EVIDENCE_MODEL_V3.md 2's gz column was taken with.
    #   THE TOPICS ARE NAMED BY THEIR KEY IN topics: above and never by
    #   address, so no channel is spelled twice in this file.
    topics: "scan_nav, imu, cam_depth, cam_info, safety_scan_back, points3d"
    # Per topic. At 10 Hz that is ~20 windows, which is the sample size
    # the gz column of EVIDENCE_MODEL_V3.md 2 was read over.
    sample_s: "20"
    # `gz topic -f` does not stop on its own - measured on this rig,
    # `-d 8` ran until it was killed - so it is run under `timeout` and
    # this is the bound. It is longer than sample_s because the process
    # is ENDED at sample_s and this is only the deadline for that ending.
    timeout_s: "40"
  analyse:
    # THE SPAWN POSE CHECK. The drift transform is built on vehicle.spawn,
    # and if the truck is not standing there when the recording opens the
    # transform is wrong by however far it moved. 0.05 m and 0.02 rad are
    # two orders of magnitude tighter than the 0.875 m of rack penetration
    # Task 1 measured a bad spawn slide by, and an order of magnitude
    # looser than the ground truth's own resolution.
    spawn_tolerance_m: "0.05"
    spawn_tolerance_rad: "0.02"
    # HOW FAR THE INTERPOLATION MAY REACH. The estimate arrives at
    # ~500 Hz and the truth at 20 Hz, so the honest pairing is to
    # interpolate the estimate onto the truth's stamps, and this is the
    # bound on that interpolation. 0.5 s is 250 estimate samples: past
    # it, the estimator was not publishing and the answer is a refusal
    # rather than a straight line drawn across the gap.
    max_pair_gap_s: "0.5"
    # HOW CLOSE TO range_min A BEAM'S OWN MEAN HAS TO BE to count as
    # PINNED there rather than as measuring the room. gz clamps a return
    # closer than <range><min> to the minimum instead of dropping it
    # (EVIDENCE_MODEL_V3.md 8), and a clamped beam has no spread, so
    # averaging it into a noise figure drags that figure down - on the
    # back safety scanner, which sees this truck's own counterweight,
    # by up to a third. So they are separated and BOTH counts are
    # reported.
    #   IT IS A FLOAT-EQUALITY EPSILON AND NOT A BAND. A clamped reading
    #   is EXACTLY range_min in every frame, so its mean is exactly
    #   range_min; 1e-6 m is a micrometre, four orders of magnitude below
    #   the 0.02 m noise and far outside anything a real reading could
    #   land on by accident. It is here rather than inline because it
    #   decides which readings enter a published figure, and that is
    #   behavioural whatever its size.
    clamp_tolerance_m: "0.000001"
    # THE FACTOR THE ACCEPTANCE IS STATED IN. A measured temporal spread
    # inside [1/1.25, 1.25] of the SDF's own stddev passes; outside it,
    # the discrepancy is diagnosed rather than smoothed (global
    # constraint 7). 1.25 is chosen against what the statistic can do,
    # not against what the sensors did: the standard deviation of a
    # standard deviation from n frames is about sigma/sqrt(2(n-1)), which
    # at a 40-frame capture is 11 %, so a band of +-25 % is about two of
    # those and will not fire on sampling noise alone.
    noise_factor: "1.25"
  corner:
    # WHICH PROFILE THE CORNER FIGURE IS DEFINED OVER, and it is one
    # rather than "any profile with a steer angle in it". square: holds
    # -1.25 rad too, but for 9.142 s with the axis slewing into every
    # corner - not long enough for the settle and the window below - so
    # measuring it there would either refuse a good square run or average
    # a yaw rate over a manoeuvre that never reached a steady state.
    profile: "corner_creep"
    # THE STEADY-STATE WINDOW corner_creep: is measured over. The steer
    # axis has to SLEW into the corner and the yaw taken during the slew
    # is not a steady state - config.yaml's square: block says the same
    # thing about why that profile does not close. analyse finds the
    # longest stretch where the steer READING is at the profile's own
    # corner angle and the vehicle is moving, discards settle_s of it,
    # and averages ALL of what is left.
    settle_s: "4"
    # window_s IS A MINIMUM AND NOT A CAP, and that was measured rather
    # than chosen. The delivered yaw rate WANDERS inside a held corner -
    # binned at 2 s on the first corner_creep run it ran 0.0722 to
    # 0.0968 rad/s about a mean of 0.0812 - so a short window lands
    # wherever it lands: the first 6 s of that run's steady state gave
    # 0.0785 and the whole 13.6 s gave 0.0812, a 3 % swing that is the
    # sampling and not the vehicle. So the whole steady state is
    # averaged, this is the least of it that will be accepted, and the
    # wander itself is REPORTED (bin_s below) rather than averaged away.
    window_s: "6"
    # The sub-bin the steadiness is reported at. It decides nothing about
    # the headline figure - that is the whole window - and only how
    # finely the wander underneath it is printed. 1 s at 0.08 rad/s is
    # 0.08 rad of yaw, three orders of magnitude above the ground truth's
    # own resolution, so a bin is a measurement and not a difference of
    # two noisy numbers.
    bin_s: "1.0"
    # ---- THE OTHER REDUCTION: EVERY corner of a repeated-corner run ----
    #
    # THE TWO ARE NOT THE SAME MEASUREMENT AND MUST NOT SHARE CONSTANTS.
    # settle_s above is for ONE long sustained corner, where the held
    # stretch ends when the corner does and there is nothing to trim off
    # the far end (measured on corner_creep: the axis leaves tolerance
    # 1.0 s AFTER the segment ends and the vehicle is still at full creep
    # speed in every sub-bin of the window). square: is the opposite
    # shape - four corners of 9.142 s each, at ONE steer angle and ONE
    # speed, which is what makes it the instrument for the heading
    # dependence in EVIDENCE_SENSORS.md 4.2 - and on a corner that short
    # BOTH ends have to come off:
    #
    #   slew_in_s   the axis slewing INTO the angle. It is inside the
    #               tolerance band for the last part of that slew, so the
    #               criterion opens the run before the corner has
    #               established. 1.0 s at 0.3 m/s is 0.3 m of travel.
    #   exit_s      the axis slewing back OUT of it, and - the reason
    #               this end needs trimming at all - the TREAD command
    #               changes at the same instant, so the last fraction of
    #               a second carries a yaw rate taken at a falling speed
    #               and reads high. 0.3 s is a sixth of a 1.8 s corner
    #               entry and an order of magnitude more than the 0.05 s
    #               the ground truth is sampled at.
    #
    # A CORNER THAT HAS NOTHING LEFT AFTER THE TRIM IS DROPPED AND
    # COUNTED, never shrunk to fit: analyse prints how many corners were
    # FOUND beside how many were measured, so a table with three rows
    # over a four-corner profile says so out loud. window_s below is the
    # minimum for these too (a square corner leaves 7.8 s of the 9.142).
    slew_in_s: "1.0"
    exit_s: "0.3"
    # How close the steer READING has to be to the table's angle to count
    # as held. The steer axis is a position controller with no
    # quantisation modelled on this track, so this is about the
    # controller's own residual and not about a sensor: 0.02 rad is
    # 2.5 % of the 0.785398 rad corner.
    steer_tol_rad: "0.02"
    # And the vehicle has to be MOVING, or a stationary truck with the
    # wheel turned would open a window and report a yaw rate of zero as
    # a fidelity of zero. 0.05 m/s is a sixth of the creep speed.
    speed_min_mps: "0.05"
  sdf_names:
    # THE <sensor name> AS model.sdf SPELLS IT, which is how analyse
    # finds the configured noise to compare against. These are names in
    # the model file and not topics - the topics are in topics: - and
    # they are here because analyse has to be told WHICH sensor a
    # recorded stream came from, which no CSV can say for itself.
    nav_lidar: "nav_lidar"
    safety_scanner: "safety_scanner_back"
    pallet_cam: "pallet_cam"
    imu: "imu"
    lidar_3d: "nav_lidar_3d"
