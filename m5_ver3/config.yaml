# config.yaml - every constant the m5-ver3 scripts obey, and the only
# place any of them is written down.
#
# THE RULE THIS FILE EXISTS FOR: no behavioural constant lives inline in a
# script on this track - not a partition, not a pose, not a topic, not a
# waiting budget, and not the path to ROS. m5v3.sh and tools/rtf_probe.sh
# read this file once per invocation through tools/_common.sh, which
# refuses by the key's DOTTED name if it cannot. So a constant that has to
# move moves HERE, once, and both scripts move with it. A constant spelled
# in two places is two opinions about one number, and the first one to be
# edited is the one that is right.
#
# EVERY VALUE IS A STRING WHERE A SCRIPT PASSES IT THROUGH. The spawn
# coordinates go onto a gz service request as text; quoting them keeps
# "-3.00" from reaching the wire as "-3.0" and keeps the evidence file's
# comparison against the table exact rather than approximately exact.
#
# It grows. Task 1 owns launch and isolation; the sensor profiles, the
# fusion parameters and the Nav2 stack of F1-F5 land under keys of their
# own beside these.

# ------------------------------ ISOLATION ------------------------------
# WHAT KEEPS THIS TRACK OFF M6's GRAPH, and what decides what stop may
# kill. m6 runs partition m6 on domain 96; step5 ran m5demo. Both may be
# up on this machine at the same time as this one, and a shared graph
# would put one stack's publishers on the other's topics.
#   GZ_PARTITION IS THE ONE THAT SCOPES GAZEBO. gz transport is not DDS,
#   so ROS_DOMAIN_ID does not isolate the simulator at all; it isolates
#   the ROS side (the bridge and everything that will subscribe to it).
#   Both are set on every child, and m5v3.sh's ours() reads GZ_PARTITION
#   back out of a candidate process's environment to decide whether the
#   sweep may touch it. That is why the partition is NOT overridable from
#   the environment: start and stop must never be able to disagree about
#   which graph this is.
isolation:
  gz_partition: "m5v3"
  ros_domain_id: "97"
  # ---- WHERE AN OFFLINE REPLAY LIVES, AND IT IS NOT HERE ----
  #
  # F3 Task 1's map is built by playing a recorded bag into slam_toolbox,
  # and that bag CARRIES /tf. Replaying it onto domain 97 would put a
  # second publisher of odom -> base_link on the same graph as the live
  # EKF - the exact failure F2's whole one-authority-per-edge argument is
  # about, with the difference that tf2 would not complain, it would just
  # carry whichever message arrived last.
  #   SO THE REPLAY IS A DIFFERENT GRAPH AND NOT A CAREFUL ONE.
  #   tools/build_map.sh sets this domain on every child it starts and
  #   refuses if the two values are equal, so the offline run cannot
  #   reach the live stack even while the live stack is up.
  #   THERE IS NO GZ_PARTITION FOR IT because there is no simulator in
  #   it: an offline SLAM run is a bag, a mapper and two transforms.
  map_ros_domain_id: "98"

# --------------------------------- GPU ---------------------------------
# RENDERING ON THIS TRACK IS THE GPU's, AND THAT IS A GATE RATHER THAN A
# PREFERENCE. WSL's default GL stack is llvmpipe - measured on this rig,
# `glxinfo -B` with neither variable set reports
# "llvmpipe (LLVM 20.1.2, 256 bits)" - and software rasterisation is what
# made m6 gate a four-truck fleet at RTF 0.30. This track adds cameras and
# a heavier lidar load to ONE truck, so it starts from the other end: the
# two exports below select Mesa's d3d12 gallium driver and pin it to the
# NVIDIA adapter, and m5v3.sh refuses to start anything at all unless the
# renderer string then names required_renderer.
#   THE REFUSAL IS THE POINT. A silent llvmpipe fallback does not fail, it
#   just measures a different machine, and every figure taken under it is
#   a figure about software rendering wearing this rig's name.
gpu:
  gallium_driver: "d3d12"
  d3d12_adapter_name: "NVIDIA"
  # The substring the renderer string must contain. Measured with the two
  # exports above: "D3D12 (NVIDIA GeForce RTX 4050 Laptop GPU)".
  required_renderer: "NVIDIA"

# -------------------------------- WORLD --------------------------------
# M6's FLOOR, BY REFERENCE AND NOT BY COPY. warehouse_ver3.sdf is the
# 48 x 32 m two-road-class relayout M6.6 built and M6.7 drove; it is
# spawn-free (no vehicle include anywhere in it), so one track can spawn
# four trucks into it and another can spawn one, and neither edits it.
# COPYING IT WOULD BE THE MISTAKE: two floors that start identical and
# drift are two floors, and a route table measured on one of them is then
# a claim about neither.
#   The world NAME inside the file is "warehouse" and stays that way -
#   every /world/warehouse/* service and topic on this track keys on it.
# Paths are relative to the repository root, which m5v3.sh resolves from
# its own location.
world:
  file: "m6/gazebo/warehouse_ver3.sdf"
  name: "warehouse"

# ------------------------------- VEHICLE -------------------------------
# ONE TRUCK. m5-ver3 is the showcase vehicle rebuilt around real sensors;
# the fleet is M6's and stays M6's (vault AMR-DEC-003).
#   THE MODEL IS THIS TRACK'S OWN FORK, gazebo/forklift_ver3/model.sdf,
#   which is m6/gazebo/forklift_ver2/model.sdf byte for byte but for its
#   name. It is forked rather than referenced because F1 rewrites its
#   sensors, and m6's figures are measured on the file it was forked from.
#
# THE SPAWN POSE IS f1's, READ OUT OF m6/ipc/status_contract.py's VEHICLES
# TABLE - the values that table holds TODAY, which are not the ones this
# track's plan quoted. The plan asked for (-3.00, -5.50, 0.05) yaw 0.0.
# That pair is real, but it is the pose of an EARLIER FLOOR: it is
# sim/launch/warehouse_bringup.launch.py's _SPAWN_X/_SPAWN_Y, what step5
# and M6.1 spawned at on warehouse_ver2, and M6.6's relayout put a rack
# column across it. The table moved with the floor; the quotation did not.
#
# IT WAS MEASURED RATHER THAN ARGUED, AND THE ARITHMETIC AGREES WITH THE
# MEASUREMENT TO THE MILLIMETRE (EVIDENCE_BRINGUP.md 7):
#   The model's forks reach x = -1.875 in its own frame. At (-3.00, -5.50)
#   with yaw 0 the fork tips therefore land at world x = -4.875, and
#   RackSW3 stands at x in [-4.500, -4.000], y in [-6.000, -2.500], from
#   the floor up - so the truck is spawned with 0.875 m of fork inside a
#   rack leg. gz accepts it (`data: true` says the request was accepted,
#   never that the truck is clear of geometry), the contact solver then
#   ejects it, and it slides to rest at x = -2.125 - fork tips flush on
#   the rack face at -4.000, exactly the 0.875 m of penetration undone.
#   Measured three ways: warehouse_ver2 settles at (-3.000000, -5.500000)
#   from the same request; warehouse_ver3 slides for m6's own
#   forklift_ver2 model exactly as it does for this fork; and spawn z made
#   no difference.
#
# WHERE THE TABLE'S POSE LANDS: the NORTH RING LEG, y = +10.00, an 8.00 m
# clear cruise corridor with no rack, station or bay in it. The racks
# nearest it end at y = +6.00. yaw 3.14159 points the forks at world +x
# (model yaw 0 puts them at -x), so the truck stands facing east down the
# leg. Measured on this world: it settles at exactly (-17.000000,
# 10.000000, -0.000001), RPY (0, 0, 3.141590), and does not move again.
#
# A POSE THIS TRACK CHOOSES FOR ITSELF IS FINE - one truck does not owe a
# fleet formation anything - but it has to be CHECKED against the floor
# the way this one was, and the check is the fork reach above, not a look
# at the map.
vehicle:
  model: "m5_ver3/gazebo/forklift_ver3/model.sdf"
  # The name the truck is SPAWNED under, which is what a gz service
  # addressing this one truck has to say. Independent of the <model name>
  # inside the file; both are forklift_ver3 here so there is nothing to
  # remember.
  name: "forklift_ver3"
  spawn:
    x: "-17.00"
    y: "10.00"
    z: "0.05"
    yaw: "3.14159"
  # ------------------------- THE GEOMETRY -------------------------
  # THE FOUR NUMBERS A NODE NEEDS TO TURN A JOINT INTO A POSE, seeded
  # from agv/forklift/config.yaml's `model:` block, which is ver2's
  # mirror of model.sdf and derived every one of them there:
  #
  #   steer_link      <pose>  0.55 0 0.24 ...   the steer axis
  #   rear_wheel_left <pose> -0.50 0.36 0.12    rear axle
  #   rear_wheel_right<pose> -0.50 -0.36 0.12   rear axle
  #
  # so the wheelbase is 0.55 - (-0.50) = 1.05 m, and the rear axle
  # midpoint sits at x = -0.50 in base_link.
  #   THAT OFFSET IS NOT COSMETIC. The rear axle midpoint is the only
  #   point of a tricycle whose velocity is purely longitudinal, so
  #   base_link necessarily has a LATERAL velocity component d*yawrate
  #   whenever the vehicle turns, and a wheel odometry that ignores it
  #   reports a body twist the vehicle does not have.
  # THEY ARE COPIED AND NOT REFERENCED because agv/ is ver2's tree and
  # this track may not read it at run time (CONTEXT.md); the source is
  # named above so the copy can be checked against it by hand.
  wheelbase_m: "1.05"
  rear_axle_offset_m: "-0.50"
  # The drive_wheel collision cylinder's radius, read from model.sdf.
  # Not a parameter of anything: it is what the truck rolls on. It lived
  # under wheel_slip: until F1 Task 3, and moved here when the odometry
  # node needed the same number - a constant spelled in two places is
  # two opinions about one number.
  wheel_radius_m: "0.12"
  # ---- WHERE THE IMU IS BOLTED, and why a shell needs to know ----
  #
  # model.sdf's `imu_link` <pose>, repeated here for the reason the
  # sensors: block repeats the update rates: a SHELL cannot read XML, and
  # F2's stack has to put this offset on the wire as a TF before
  # robot_localization will accept a single IMU sample.
  #   IT IS CHECKED AGAINST THE MODEL AND NOT TRUSTED. `sensor_evidence.py
  #   analyse` reads imu_link's pose out of vehicle.model and prints a
  #   WARNING if these three numbers disagree with it, exactly as it
  #   already does for the sensor rates. So this is a copy that says when
  #   it has gone stale.
  #   WHY THE STACK NEEDS IT AT ALL. The IMU stamps its messages
  #   `imu_link` (model.sdf's <gz_frame_id>), and robot_localization
  #   transforms every sample into base_link_frame before fusing it. With
  #   no base_link -> imu_link transform on /tf it drops the whole sensor
  #   AND SAYS NOTHING - measured on this rig 2026-08-26, EVIDENCE_FUSION
  #   §2.2 - so this is not decoration, it is the difference between a
  #   filter with a gyro in it and one without.
  #   ONLY THE ROTATION REACHES THE FILTER, and the rotation is identity:
  #   robot_localization rotates an IMU's angular velocity and linear
  #   acceleration into base_link and does NOT correct for the lever arm
  #   (there is a `@todo` in its own source saying so). §2.4 measures
  #   what that costs. The translation below is what makes the lookup
  #   succeed and is otherwise unused by the filter.
  imu_mount:
    x: "-0.50"
    y: "0.00"
    z: "0.25"
  # ---- WHERE THE NAV LIDAR IS BOLTED - F2 Task 3's addition ----
  #
  # model.sdf's `nav_lidar_link` <pose>, repeated here for the reason
  # imu_mount above is: a SHELL cannot read XML, and the optional rf2o
  # arm has to put this offset on the wire as a TF before
  # rf2o_laser_odometry will produce anything meaningful at all.
  #   IT IS CHECKED AGAINST THE MODEL AND NOT TRUSTED - BUT NOT BY THE
  #   CHECK imu_mount GETS, and the difference matters. `analyse`'s
  #   cross-check reads imu_mount and WARNS; it does not read this key at
  #   all. What checks this one is `nodes/rf2o_twist.py`'s
  #   mount_from_model(), which reads nav_lidar_link's pose out of
  #   model.sdf at startup, compares it with the copy below, and REFUSES
  #   the bringup by name on a disagreement - a refusal rather than a
  #   warning, because the correction that node applies is a geometry
  #   claim and a stale copy would silently move the lever arm it is
  #   built on.
  #   IT IS THEREFORE ONLY CHECKED ON THE --rf2o ARM. Nothing else on
  #   this track reads this key, so on the default stack and on --fuse a
  #   drifted copy sits here unremarked until the arm is next brought up.
  #   WHY THE ARM NEEDS IT, AND THE FAILURE IS WORSE THAN THE IMU's.
  #   rf2o looks up base_link <- the scan's own frame ONCE, on its first
  #   scan, in CLaserOdometry2DNode::setLaserPoseFromTf(). On a failed
  #   lookup it logs the exception and then USES THE DEFAULT-CONSTRUCTED
  #   TransformStamped anyway - an all-zero quaternion, which is not a
  #   rotation - so the laser pose becomes a zero matrix and every pose
  #   it ever publishes is built on it. The IMU's version of this
  #   failure is silent; this one is a single ERROR line at bringup
  #   followed by numbers.
  #   BOTH THE TRANSLATION AND THE ROTATION MATTER HERE, unlike the
  #   IMU's. The mount has no rotation in this model, and that is what
  #   lets nodes/rf2o_twist_core.py's lever-arm correction be two terms
  #   rather than a full frame transform; the node refuses if the model
  #   ever grows one.
  nav_lidar_mount:
    x: "0.55"
    y: "-0.40"
    z: "1.80"
  # steer_joint's mechanical stop, symmetric. tools/drive_route.py checks
  # every steer angle in a profile against it before it drives anything,
  # and REFUSES the profile if one is outside - it does not clamp.
  #   THE DIFFERENCE IS WHICH THING IS BEING CORRECTED.
  #   agv/forklift/scripts/forklift_io.py clamps, and is right to: it is
  #   taking commands from a live stack in real time and has to make one
  #   of them legal. drive_route.py is reading a table somebody wrote
  #   down, so a clamp there would silently drive a manoeuvre the table
  #   does not describe - and the geometry argued in drive_route:'s own
  #   comments would then be a claim about a run nobody performed. A
  #   table that asks for an impossible angle is a table to correct.
  steer_limit_rad: "1.31"
  # steer_joint's <velocity> in the same <limit> block, and it is the
  # AXIS's own slew rate: 2.0 rad/s. F4 Task 1's addition, read by
  # nodes/cmd_vel_tricycle.py, which ramps its OWN output at it so that a
  # step steer command leaves that node as a ramp.
  #   WHY A NODE RAMPS SOMETHING THE PLANT WILL RAMP ANYWAY. The axis
  #   cannot slew faster than this whatever is commanded, and square:
  #   below records what the difference costs when nobody accounts for
  #   it - every corner loses the yaw of its own first fraction of a
  #   second, MEASURED at 0.057250 rad per corner, and the corner time
  #   had to be re-derived around it. A command that is already a ramp is
  #   a command whose delivered arc is a function of the ramp the
  #   converter wrote, and not of a slew somebody has to measure
  #   afterwards.
  #   IT IS CHECKED AGAINST THE MODEL AND NOT TRUSTED, exactly as
  #   steer_limit_rad above now is: tests/test_cmd_vel_tricycle_core.py
  #   reads steer_joint's <lower>, <upper> and <velocity> out of
  #   vehicle.model and fails if this file disagrees with any of them. A
  #   copy that cannot say when it has gone stale is a copy that will.
  steer_rate_limit_radps: "2.0"

# -------------------------------- TOPICS -------------------------------
# WHAT THE BRIDGE CARRIES, AND NOTHING ELSE YET. A bridged channel with no
# consumer is a claim the run does not make, so this list is exactly what
# Task 1 measures and F1 will grow it.
topics:
  # The simulation clock. One world, one clock.
  clock: "/clock"
  # MEASUREMENT REFERENCE ONLY. This is the OdometryPublisher system's
  # ground-truth pose - no wheel slip, no encoder quantisation, no drift -
  # and on this track it is an instrument, never an input.
  #   F1 KEPT IT, AND KEEPING IT WAS THE POINT. What F1 added is the
  #   wheel odometry below, BESIDE this channel and scored against it; a
  #   phase that deleted its own reference in the same breath as it built
  #   the thing that needs one would have nothing to publish a drift
  #   figure against. Taking it out of the model belongs to whatever
  #   phase has a fused estimate to put in its place, and the EKF that
  #   would be that estimate is F2's. Until then anything that NAVIGATES
  #   on it is measuring its own answer.
  odom_ground_truth: "/forklift/gz/odom"
  # The navigation lidar. 15 Hz, 270 deg, 25.0 m range max since F1 Task 2
  # gave it the TiM571 profile - the SDF is the authority for all three
  # and sensors.nav_lidar.rate_hz below is the figure the hz check quotes.
  scan_nav: "/forklift/gz/scan_nav"
  # The IMU, 100 Hz, six axes and NO orientation. Bridged since F1 Task 2:
  # it is one of the two inputs the F2 EKF fuses, and a channel that will
  # be fused has to be watched from the run before it is.
  imu: "/forklift/gz/imu"
  # THE PALLET CAMERA'S TWO BRIDGED CHANNELS, AND THE POINT CLOUD IS NOT
  # ONE OF THEM. gz's rgbd_camera also advertises <topic>/points, and
  # bridging a point cloud is what took ros_gz issue #368's rig from 90%
  # RTF to 31% (docs/reports/m5v3-03 5). The depth image plus its
  # camera_info carries the same information at a fraction of the wire
  # cost and ROS reconstructs the cloud where a consumer needs it.
  #   THE DEPTH IMAGE GOES OVER ros_gz_image's image_bridge, not the
  #   parameter bridge, and camera_info over the parameter bridge - they
  #   are two different processes for that reason.
  cam_depth: "/forklift/gz/cam/depth_image"
  cam_info: "/forklift/gz/cam/camera_info"
  # NOT BRIDGED, AND NOT AN OVERSIGHT. The 3D lidar's ROS consumer arrives
  # in F2; until it does, bridging 32768 points at 10 Hz would buy nothing
  # and cost the RTF every figure on this track is measured against. Named
  # here because EVIDENCE_MODEL_V3.md measures its gz-side rate.
  #   gz advertises this name as a gz.msgs.LaserScan and, because the scan
  #   has 32 vertical samples, a companion <topic>/points cloud.
  points3d: "/forklift/gz/points3d"
  # THE TRACTION TERMINAL, and tools/slip_bench.sh is the only thing on
  # this track that publishes to it. It is the MOTOR terminal, not the
  # vehicle stack's command topic (model.sdf, COMMAND TOPICS): m5-ver3
  # runs no vehicle stack yet, so the bench addresses the motor directly.
  traction_cmd: "/forklift/gz/actuator/traction_cmd"
  # THE STEER TERMINAL, its pair. tools/drive_route.py publishes both, one
  # after the other, at every segment boundary of a profile, and it is the
  # only thing on this track that publishes to this one.
  #   IT LIVES HERE BECAUSE IT IS A BEHAVIOURAL CONSTANT AND NOT BECAUSE
  #   IT IS BRIDGED. It spent F1 Task 3 spelled inline in drive_route.py
  #   under the argument that this block lists what the bridge carries -
  #   which this block does not: traction_cmd above it, points3d and
  #   safety_scan_back are all here and none is on a bridge line. An
  #   address that decides WHICH ACTUATOR a bench drives is exactly the
  #   kind of constant this file's own header says may not sit inline in a
  #   script, and the header of a section is not a licence to break it.
  steer_cmd: "/forklift/gz/actuator/steer_cmd"
  # The three driven joints' position and rate, published once per physics
  # iteration. The bench reads the drive joint's ACHIEVED rate off it, so
  # a shortfall in the controller can be told apart from slip at the tyre.
  #   BRIDGED SINCE F1 TASK 3, because it is where the STEER angle is
  #   published and nodes/wheel_odometry.py cannot do tricycle kinematics
  #   without it. It carries three joints at the world's own rate, which
  #   is the traffic a wheel odometry costs; EVIDENCE_SENSORS.md 5 is
  #   where what it costs the RTF is measured rather than assumed - the
  #   full sensor set with the estimator on top of it, against the same
  #   probe's baseline without either.
  joint_state: "/forklift/gz/joint_state"
  # THE DRIVE SHAFT'S READING CHANNEL A, and the odometry's only input
  # from the traction axis. model.sdf runs TWO JointStatePublisher
  # systems on drive_wheel_joint and publishes read_a and read_b; what
  # that arrangement is, in m6/ipc/encoder_link.py's own words, is a
  # SINGLE-CHANNEL TESTED SYSTEM - one shaft, one measured quantity, two
  # readings of it - and never a two-channel one.
  #   SO THE ODOMETRY RIDES ONE HEAD. read_b is deliberately NOT bridged
  #   and NOT consumed here: averaging the two would claim a redundancy
  #   the shaft does not have, and it would halve a quantisation that is
  #   common to both readings anyway. The cross-comparison of a against b
  #   is the PLC's function and lives in m6, not on this track.
  drive_speed_read_a: "/forklift/gz/drive_speed/read_a"
  # WHERE THE ESTIMATE COMES OUT. nav_msgs/Odometry, odom -> base_link,
  # at the rate read_a arrives at. It is an ESTIMATE and not a pose: it
  # is scored against odom_ground_truth above and must never be compared
  # with it by an equality - see wheel_odom: below for the two errors it
  # is built to make.
  wheel_odom: "/m5v3/wheel_odom"
  # WHERE THE FUSED ESTIMATE COMES OUT - F2 Task 1's addition, and the
  # first thing on this track that is a pose the vehicle could navigate
  # on. robot_localization's ekf_node publishes it, fusing the wheel
  # odometry's TWIST with the IMU's yaw rate; see the ekf: block below
  # for what is fused and ekf.yaml for the matrices that say so.
  #   IT IS A REMAP AND NOT A PARAMETER. ekf_node's publisher is named
  #   `odometry/filtered` in its own source and the package offers no
  #   parameter to rename it, so m5v3.sh remaps it to this address on
  #   the command line. The name lives here either way, once.
  odometry_filtered: "/m5v3/odometry/filtered"
  # ---- THE OPTIONAL LASER-ODOMETRY ARM, F2 Task 3 - TWO TOPICS ----
  #
  # NOTHING PUBLISHES ON EITHER OF THESE UNLESS `m5v3.sh start --rf2o`
  # WAS GIVEN. Without the flag the two children that own them are never
  # spawned, ekf.yaml is the whole of the filter's configuration, and the
  # stack is the one EVIDENCE_FUSION.md 9.3 measured.
  #
  # WHY THERE ARE TWO AND NOT ONE. rf2o_laser_odometry publishes an
  # Odometry whose twist covariance is ALL ZEROS - it is never assigned
  # in the upstream node, and there is no parameter to set it (pinned
  # commit b38c68e, src/CLaserOdometry2DNode.cpp publish()). A zero
  # variance on a channel robot_localization is fusing is not ignored: it
  # is replaced by 1e-9 and the filter then believes that channel almost
  # absolutely. So the raw stream is consumed by nodes/rf2o_twist.py,
  # which puts a MEASURED covariance on it (rf2o.covariance below) and
  # corrects the lever arm the upstream node does not, and the FILTER
  # reads only the second topic. EVIDENCE_FUSION.md 10.2 is the
  # derivation and 10.1 is what the raw stream actually contains.
  #   THE RAW ONE IS NOT BRIDGED, RECORDED OR SCORED. It has exactly one
  #   consumer, the relay, and the relay's output is what every
  #   instrument on this track reads - so there is one stream in the
  #   evidence and it is the one the filter fused.
  rf2o_odom_raw: "/m5v3/rf2o/odom_raw"
  rf2o_odom: "/m5v3/rf2o/odom"
  # ---- THE OPTIONAL FACTOR-GRAPH ARM'S OUTPUT, F2 Task 4 - ONE TOPIC ---
  #
  # NOTHING PUBLISHES ON THIS UNLESS `m5v3.sh start --fuse` WAS GIVEN.
  # That flag runs `fuse`'s fixed-lag smoother INSTEAD OF ekf_node, so on
  # that arm nothing publishes on odometry_filtered above either: the two
  # estimators are alternatives and never neighbours, because they would
  # otherwise both claim odom -> base_link and tf2 would carry whichever
  # arrived last.
  #
  # WHY IT IS A SECOND ADDRESS AND NOT THE SAME ONE. It would have been
  # cheaper to publish the smoother's output on odometry_filtered and let
  # the arm= label carry the whole difference - every instrument
  # downstream would then need no change at all. It is a second address
  # for frames.rf2o_odom's reason, one level up: a second opinion about
  # this vehicle's pose may not wear the name of the estimate the
  # shipping stack publishes, not even while the shipping estimator is
  # not running. An operator with `ros2 topic echo` open, a recorded bag,
  # or a later task that runs the two side by side all read the address
  # before they read any label, and an address that means two different
  # things depending on a flag is the failure the arm label exists to
  # prevent, moved one layer down where no refusal can see it.
  #   AND THE INSTRUMENTS ARE PARAMETERISED BY ARM RATHER THAN FORKED.
  #   tools/ekf_health.py and tools/sensor_evidence.py both read the
  #   running stack's arm= line and pick the topic from it
  #   (evidence_core.fused_topic_key), so there is ONE gate and ONE
  #   recorder and neither has a copy of the other's arithmetic. The
  #   recorded CSV keeps its name - the fused stream is the fused stream
  #   - and the session's arm= line says which estimator filled it.
  fuse_odometry_filtered: "/m5v3/fuse/odometry/filtered"
  # THE BACK SAFETY SCANNER'S MEASUREMENT CHANNEL, NOT BRIDGED, AND IT HAS
  # TWO CONSUMERS ON THIS TRACK - which is why it is named for the SENSOR
  # and not for either job.
  #   THE GUI WAITS ON IT. gz-sim's GuiRunner discards world state that
  #   arrives before its first snapshot, so a GUI client started before
  #   the model's sensors advertise anchors every lidar fan at the world
  #   origin for the life of the window (measured in m6,
  #   gazebo/m6_world.launch.py). Gating the client on this topic
  #   appearing on the gz side puts the sensors inside that snapshot. It
  #   is this topic rather than another because it is the last sensor the
  #   model brings up, not because of anything it measures.
  #   THE EVIDENCE RECORDER CAPTURES IT. F1 Task 4 scores one safety
  #   scanner's beam noise against the SDF, and these three sensors are
  #   deliberately not bridged (Global Constraint 6 freezes them and F2
  #   has their consumer), so tools/sensor_evidence.py takes them gz-side.
  # IT WAS SPELLED `gui_gate` UNTIL F1 TASK 4, and it was renamed rather
  # than copied for the reason wheel_radius_m moved in Task 3: a constant
  # spelled in two places is two opinions about one number, and the first
  # one to be edited is the one that is right. A key named after the JOB
  # of its first consumer cannot be shared with its second without lying
  # about one of them.
  safety_scan_back: "/forklift/gz/safety_scanner_back/measurement"
  # ---- THE TRANSFORM TREE ITSELF, F3 Task 1's addition ----
  #
  # NOT A SENSOR AND NOT A BRIDGE LINE. /tf is where the ONE transform
  # this stack emits comes out - the EKF's odom -> base_link, 50 Hz - and
  # /tf_static is where the IMU's mount sits. They are named here for one
  # reason: tools/sensor_evidence.py's `record --bag` has to name the
  # topics it puts in a rosbag2, and an OFFLINE SLAM RUN is a consumer of
  # the transform tree exactly as it is a consumer of the scan. A topic
  # this track records is a topic this file spells.
  #   THE NAMES ARE tf2_ros's OWN and are not namespaced, for frames:'s
  #   reason one level up: every off-the-shelf consumer - tf2, rviz,
  #   slam_toolbox, Nav2 - looks for /tf and /tf_static and nothing else.
  tf: "/tf"
  tf_static: "/tf_static"
  # ---- THE LOCALISATION ARM'S THREE, F3 Task 2's addition ----
  #
  # PRESENT ONLY WITH `--localize`, and nothing publishes or subscribes
  # any of them on the default stack. They are spelled here for
  # topics.rf2o_odom's reason: a topic this track RECORDS or a topic a
  # tool has to reach is a topic this file names, whether or not today's
  # bringup carries it.
  #   THE NAMES ARE nav2_amcl's OWN and are not namespaced. That node
  #   advertises `amcl_pose` and `particle_cloud` and subscribes
  #   `initialpose` and `map` in its own private namespace, which is the
  #   root here because m5v3.sh starts it with no namespace at all -
  #   frames:'s argument applied to topics, and the same one that keeps
  #   /tf bare.
  #   `map` IS SERVED AND NOT MEASURED. map_server publishes the frozen
  #   grid there, transient-local, and amcl reads it once. Nothing on
  #   this track records it: the artifact is committed and its md5 is
  #   checked at bringup, so a recording of the same 2.0 MB in every
  #   session would be a copy that could not disagree with anything.
  amcl_pose: "/amcl_pose"
  initialpose: "/initialpose"
  map: "/map"
  # ---- AND THE SECOND LOCALISER'S OWN POSE, F3 Task 3's addition ----
  #
  # `--localize slam` runs slam_toolbox's localization node instead of
  # nav2_amcl, and the two do not publish their own pose at the same
  # address: nav2_amcl advertises `amcl_pose` and slam_toolbox advertises
  # `pose`. So the ADDRESS follows the arm, exactly as the two
  # ESTIMATORS' fused topics do (topics.fuse_odometry_filtered), and
  # tools/evidence_core.py's loc_pose_topic_key() is the one place that
  # mapping lives - refusing a localiser it has never heard of rather
  # than defaulting to the other one's address, where the symptom would
  # be an empty stream and not an error.
  #   `/pose` IS A GENERIC NAME AND IT IS LEFT ALONE ANYWAY, which is
  #   this block's own rule two paragraphs up: the names are the NODE's
  #   own, unnamespaced, because m5v3.sh starts these nodes with no
  #   namespace. What scopes them is isolation.ros_domain_id, which
  #   scopes everything else on this track too, and a remap here would
  #   be a second spelling of a name for one node and not the other.
  #   BOTH ARMS' POSE STREAM LANDS IN THE SAME CSV, and that is
  #   deliberate: `amcl_pose.csv` is what every localised session since
  #   F3 Task 2 calls it, exactly as `ekf_odom.csv` is what every fused
  #   session calls the estimator's output on the `--fuse` arm where no
  #   ekf_node ran. Renaming it by arm would make the two arms' sessions
  #   structurally different, which is the one thing an A/B may not have.
  #   The session's own `loc=` line says which localiser filled it.
  slam_pose: "/pose"
  # ---- THE COMMAND PATH'S FOUR, F4 Task 1's addition ----
  #
  # THE FIRST THREE ARE nav2's OWN NAMES AND ARE NOT NAMESPACED, which is
  # this block's own rule two entries up applied to the other direction
  # of travel: `map`, `/tf` and `initialpose` are bare because every
  # off-the-shelf PRODUCER or CONSUMER looks for exactly those strings,
  # and `cmd_vel`, `cmd_vel_smoothed` and `speed_limit` are the same
  # three-way agreement between nav2's controller server, nav2's velocity
  # smoother, rviz's teleop panel and anything an operator will type at a
  # terminal. What scopes them is isolation.ros_domain_id, which scopes
  # everything else on this track too.
  #
  # THE COMMAND PATH IS ONE LINE AND THESE ARE ITS JOINTS (F4 constraint
  # 18). Nav2's controller -> cmd_vel -> the velocity smoother ->
  # cmd_vel_smoothed -> nodes/cmd_vel_tricycle.py -> steer_cmd and
  # traction_cmd above, which are model.sdf's own motor terminals. There
  # is no bypass and nothing on this path reads odom_ground_truth.
  #
  # NOTHING PUBLISHES ON EITHER TWIST TOPIC AT REST. MEASURED on this rig
  # 2026-08-27 with the smoother ACTIVE and nothing commanding: `ros2
  # topic hz /cmd_vel_smoothed` reported no messages at all over 4 s, and
  # the converter publishes only while it is engaged. That is what keeps
  # tools/drive_route.py and tools/slip_bench.sh - which address the gz
  # side of the same two terminals directly - from being fought by a
  # stack child publishing zeros twenty times a second.
  cmd_vel: "/cmd_vel"
  cmd_vel_smoothed: "/cmd_vel_smoothed"
  # THE COLLISION MONITOR'S OUTPUT, AND IT EXISTS ONLY ON THE --monitor
  # ARM. F4 Task 3 puts nav2_collision_monitor between the smoother and
  # the converter - which is the only place on this track a Twist still
  # exists downstream of the smoother, because everything after the
  # converter is a Float64 at an actuator terminal. With the flag the
  # line is
  #
  #   /cmd_vel -> smoother -> /cmd_vel_smoothed -> collision_monitor
  #            -> /cmd_vel_monitored -> converter -> the two terminals
  #
  # and WITHOUT it the converter subscribes /cmd_vel_smoothed exactly as
  # it always has. The insertion is done by REMAPPING THE CONVERTER'S
  # INPUT on its command line - not by re-pointing the smoother's output
  # - so every address above keeps meaning what its name says and the
  # only thing that moves is which topic the last node reads. F4
  # constraint 18 is still one line with no bypass; it is one link
  # longer on this arm and m5v3.sh says so where it spawns.
  #   NOTHING ON THIS PATH IS A SAFETY FUNCTION. nav2's own
  #   documentation for this node is quoted verbatim in
  #   collision_monitor.yaml and in EVIDENCE_NAV_V3.md: it "does not
  #   provide hard real-time safety certifications" and does not replace
  #   a safety-rated PLC. It complements the F-PLC; it is not the F-PLC.
  cmd_vel_monitored: "/cmd_vel_monitored"
  # WHAT THE MONITOR SAYS IT IS DOING. nav2_msgs/CollisionMonitorState -
  # the action type in force and the polygon that caused it - published
  # on every processing cycle. It is namespaced for topics.navcmd_status'
  # reason: it is THIS stack's business and nothing off the shelf looks
  # for it.
  collision_monitor_state: "/m5v3/collision_monitor/state"
  # THE ENVELOPE HOOK. nav2_msgs/SpeedLimit, and F4 constraint 18 says
  # what it is and what it is not: it is WIRED and DEMONSTRATED here, by
  # a test publisher, because the PLC that will drive it arrives in a
  # later integration phase. It is a demonstrated interface and NOT a
  # safety claim - nothing on this path inhibits motion or latches
  # anything, and the disclaimer this track keeps verbatim is that the
  # collision monitor "does not provide hard real-time safety
  # certifications" and does not replace a safety-rated PLC. It
  # complements the F-PLC; it is not the F-PLC.
  #   TWO SUBSCRIBERS ARE EXPECTED AND THEY COMPOSE. F4 Task 2's
  #   controller server subscribes this same topic through its own
  #   `speed_limit_topic` parameter and clamps the speed it PLANS at;
  #   nodes/cmd_vel_tricycle.py clamps the speed it DELIVERS, last,
  #   where no upstream publisher can get round it. Two ceilings on one
  #   quantity is a min(), which is idempotent - and the second one is
  #   the only one that is still true when the thing publishing cmd_vel
  #   is a bench rather than a planner.
  speed_limit: "/speed_limit"
  # AND THE CONVERTER'S OWN DIAGNOSTIC, which is namespaced because it is
  # THIS NODE's business and nothing off the shelf looks for it. One
  # diagnostic_msgs/DiagnosticStatus carrying the counters the clamps
  # raise - a clamp nobody can see is the failure the whole clamp-versus-
  # refuse argument is trying to avoid, moved one layer down.
  navcmd_status: "/m5v3/navcmd/status"

# -------------------------------- FRAMES -------------------------------
# THE COORDINATE FRAMES THIS STACK NAMES, AND THEY HAVE TWO READERS NOW.
# They lived under wheel_odom: until F2 Task 1, where they were one
# node's private business: nothing broadcast a transform and the names
# were only strings in a message header. F2's EKF publishes the first
# TRANSFORM on this track - odom -> base_link - and it has to stamp it
# with the same two names the wheel odometry stamps its Odometry with, or
# the filter is fusing a message from a frame it has never heard of.
#   A KEY NAMED FOR ITS FIRST CONSUMER CANNOT BE SHARED WITH ITS SECOND
#   WITHOUT LYING ABOUT ONE OF THEM - which is topics.safety_scan_back's
#   argument, applied a second time. So they moved here, once, and
#   nodes/wheel_odometry.py and m5v3.sh both read them from this block.
#
# THE NAMES ARE REP-105's AND ARE NOT NAMESPACED. m5-ver2's vehicle
# spelled them `forklift/odom` and `forklift/base_link` because it was
# one truck in a FLEET graph and the prefix is what kept four trucks'
# transform trees apart. This track has one truck in a partition of its
# own, so the prefix would be ceremony: there is nothing here for it to
# disambiguate, and REP-105's bare names are what every off-the-shelf
# consumer (Nav2, rviz, robot_localization's own defaults) expects.
frames:
  # WHERE THE ESTIMATE LIVES. Continuous and drifting, by definition -
  # it is the frame a dead-reckoned pose is honest in.
  odom: "odom"
  # THE VEHICLE. base_link stands 0.50 m FORWARD of the rear axle
  # (vehicle.rear_axle_offset_m) and the model's canonical link carries
  # the same name.
  base_link: "base_link"
  # THE IMU's OWN FRAME, and it is model.sdf's <gz_frame_id> spelled
  # again for the shell - the bridged message arrives stamped with it and
  # the static transform m5v3.sh publishes has to name the same string.
  imu: "imu_link"
  # THE NAV LIDAR'S OWN FRAME - model.sdf's <gz_frame_id> for the same
  # reason imu above is: the bridged LaserScan arrives stamped with it,
  # and with `--rf2o` the static transform m5v3.sh publishes has to name
  # the same string or rf2o's one and only TF lookup fails.
  nav_lidar: "nav_lidar_link"
  # WHERE THE LASER ODOMETRY'S OWN POSE LIVES, AND IT IS DELIBERATELY NOT
  # `odom`. rf2o integrates its own drifting pose and stamps it with
  # whatever odom_frame_id it is given; if that were this stack's odom
  # frame there would be two different estimates of the same edge wearing
  # one name, and the fact that this stack fuses only rf2o's TWIST would
  # be the only thing keeping them apart. A separate name makes the
  # separation structural: nothing broadcasts this frame (rf2o runs with
  # publish_tf false), nothing looks it up, and it appears only in the
  # header of a message whose pose is flagged do-not-fuse.
  rf2o_odom: "rf2o_odom"
  # DECLARED, NEVER PUBLISHED, AND THAT IS DELIBERATE. ekf_node requires
  # a map_frame parameter to exist; this stack's world_frame is the odom
  # frame above, so the filter publishes exactly ONE transform and never
  # map -> odom. That edge belongs to F3's localisation and nothing in F2
  # may quietly become its owner (ver2 invariant 10, and prior art
  # agv/forklift/ekf.yaml says the same about the same parameter).
  map: "map"

# ------------------------------- SENSORS -------------------------------
# THE SDF GOVERNS EVERY SENSOR. Geometry, mount pose, sample count, field
# of view, range, noise and update rate are written in
# gazebo/forklift_ver3/model.sdf and nowhere else, each beside the
# datasheet line it came from. What is repeated HERE is only what a SHELL
# has to know to check the plant: the nominal rate a `ros2 topic hz` or a
# `gz topic -hz` reading is compared against. A shell cannot read SDF, and
# a rate written twice is two opinions about one number - so the rule for
# this section is that it may hold NOTHING the SDF does not already
# decide, and EVIDENCE_MODEL_V3.md diffs the two columns by hand.
#   Every figure below is the CONFIGURED rate. What the plant DELIVERS is
#   a measurement, it is lower, and it lives in the evidence file.
sensors:
  nav_lidar:
    # SICK TiM571 profile: 15 Hz, 811 samples over 270 deg, 0.05-25.0 m.
    rate_hz: "15"
  safety_scanner:
    # FROZEN BY THE PLC FIELD CONTRACT. 10 Hz, 275 samples over 275 deg,
    # 0.10-8.0 m, unchanged from forklift_ver2 - F1 added a noise block to
    # these three sensors and nothing else (Global Constraint 6).
    rate_hz: "10"
  lidar_3d:
    # Ouster OS0 class: 1024 x 32 over 360 x 90 deg, 0.3-50.0 m.
    rate_hz: "10"
  imu:
    # Bosch BMI088 class, six axes, no orientation.
    rate_hz: "100"
  pallet_cam:
    # Intel RealSense D455 class: 640 x 480, 87 deg HFOV, 0.6-6.0 m.
    rate_hz: "15"

# ------------------------------ WHEEL SLIP -----------------------------
# THE DRIVE WHEEL IS ALLOWED TO SLIP, AND THAT IS THE POINT OF F1's
# ODOMETRY. Wheel odometry computed from a joint that cannot slip is
# ground truth with extra steps: the F2 EKF would have nothing to correct
# and every localisation figure taken against it would be circular. The
# gz-sim-wheel-slip-system in model.sdf gives the tyre a finite
# longitudinal and lateral compliance so the contact patch creeps under
# traction, the way a polyurethane tyre on concrete does.
#
# THE TWO PHYSICAL CONSTANTS ARE DERIVED FROM THE MODEL'S OWN NUMBERS,
# never chosen. Both derivations are written out beside the plugin in
# model.sdf and repeated here because a shell and a report need them:
#
#   wheel_radius_m 0.12   is the drive_wheel collision cylinder's radius,
#                         read from model.sdf. Not a parameter.
#
#   wheel_normal_force_n  is the STATIC load the drive wheel carries. The
#                         model's sixteen links total 1165.95 kg with the
#                         centre of mass at x = -0.083323 m; the drive
#                         contact is at x = +0.55 and the rear axle at
#                         x = -0.50, a 1.05 m wheelbase. So
#                           W       = 1165.95 x 9.80665 = 11434.06 N
#                           N_drive = W x (0.50 - 0.083323) / 1.05
#                                   = 11434.06 x 0.396835 = 4537.4 N
#                         Treating the 50 kg of wheel and yoke as unsprung
#                         and carrying it straight to the ground instead
#                         gives 4537.4 N as well - the two agree to
#                         0.01 N - so the beam model above is used and
#                         the distinction is not drawn.
#
# THE TWO COMPLIANCES ARE MEASURED, NOT DERIVED. gz's compliance is
# unitless and the slip it produces depends on the contact solver, so the
# only honest way to a number is to command a cruise and measure what the
# ground truth did. The tuning table, including the rejected values, is
# EVIDENCE_MODEL_V3.md section 7; tools/slip_bench.sh is the instrument.
#
# WHERE wheel_radius_m WENT. It used to be the first key of this block.
# F1's odometry needs the same 0.12 m, and a constant spelled in two
# places is two opinions about one number, so it moved UP to
# vehicle.wheel_radius_m - beside the wheelbase and the steer limit,
# where a reader looking for the truck's geometry looks. The derivation
# above is unchanged and still governs; only the key moved.
#
# CORRECTED BY MEASUREMENT 2026-08-26 (F1.5) - EVIDENCE_LATERAL_TUNE.md.
# Everything above stands. What changed is WHICH WHEELS carry the system:
# the two rear wheels now do, at the same compliances and at their own
# normal force, and the block below carries their derivation. The reason
# is measured and it is not a preference: with the rear pair rigid the
# plant delivered 0.410 of its kinematic yaw at creep, and 99.5 % of that
# deficit was the STEERED wheel sliding sideways to overcome two rigid
# rear patches that could not be yawed without sliding. With the pair
# given the same 7.0 the same corner delivers 1.005. Neither compliance
# number moved.
wheel_slip:
  wheel_normal_force_n: "4537.4"
  # THE REAR PAIR'S LOAD, from the same beam and the same total weight:
  #   N_rear_total = W - N_drive = 11434.06 - 4537.4 = 6896.66 N
  # and the model's centre of mass sits on the centreline (sum of
  # mass x y over the sixteen links is -0.32 kg m on 1165.95 kg, so
  # y = -0.27 mm), so it halves without a lateral term. 3448.3 N each is
  # 30 % of the vehicle per rear wheel against the drive wheel's 39 %,
  # and the three account for the whole of it.
  #   AND THE SUM BEHIND THEM IS THE COMPOSED ONE, checked 2026-08-26:
  #   SDFormat reads an <inertial><pose> in the LINK frame, so a link's
  #   centre of mass is <link><pose> composed with it. base_link and mast
  #   carry ONLY an <inertial><pose> and no <link><pose>, so for those two
  #   there is nothing to compose and their inertial poses are already
  #   model-frame. Summed the wrong way - link poses alone - the total is
  #   -93.551 kg m, not the -97.151 above. Both -97.151 and 4537.4 are
  #   therefore correct as they stand. EVIDENCE_LATERAL_TUNE.md 7 carries
  #   the check and retracts a claim to the contrary this file briefly
  #   made on the same day.
  rear_wheel_normal_force_n: "3448.3"
  # Longitudinal is the one the odometry feels: it is the traction
  # direction, and it is what makes a wheel revolution mean slightly less
  # than 2 pi r of ground.
  #   CORRECTED BY MEASUREMENT 2026-08-26 (F1.5): THAT IS THE OTHER KEY.
  #   EVIDENCE_LATERAL_TUNE.md 3.1. The sentence above describes what the
  #   NAME promises, and on this rig the two elements' effects are swapped
  #   relative to their names: moving <slip_compliance_lateral> alone
  #   takes the straight-line longitudinal slip from 0.96162 % to
  #   0.10688 % and 0.01070 %, while moving <slip_compliance_longitudinal>
  #   alone leaves it at 0.95842 % and 0.96140 % - unchanged to within the
  #   figure's own repeatability. So it is the key BELOW, the one named
  #   lateral, that the wheel odometry actually feels.
  #     SCOPE OF THAT MEASUREMENT, STATED SO IT IS NOT OVER-READ: gz-sim
  #     8.11.0, the gz-sim-wheel-slip-system as this model configures it,
  #     this vehicle, this rig. Whether the plugin emits the pair in the
  #     other order or the solver's two friction directions are simply not
  #     the wheel's was NOT chased - EVIDENCE_LATERAL_TUNE.md 3.1 says so.
  #   WHY IT CHANGES NOTHING HERE AND EVERYTHING FOR AN EDITOR: both keys
  #   are 7.0, so the plant is isotropic and the labels do not reach it.
  #   The moment anyone sets them apart the names will lie. Measure, do
  #   not assume, and read that section first.
  slip_compliance_longitudinal: "7.0"
  # Lateral is the tyre's sideways give. It is held at the same value
  # rather than tuned: this track measures no lateral manoeuvre yet, and a
  # number tuned against nothing is a number invented.
  #   CONFIRMED BY MEASUREMENT 2026-08-26 (F1.5). The lateral manoeuvre is
  #   measured now and the number did not have to move: the ladder in
  #   EVIDENCE_LATERAL_TUNE.md 3 took the steered wheel's lateral
  #   compliance to 1.0 (delivered 0.713) and to 0.1 (0.697, worse than
  #   1.0) with the rear pair still rigid, and neither reached the target.
  #   Holding it EQUAL is now a measured property rather than a placeholder:
  #   every setting that made one direction of a contact stiffer than the
  #   other brought back the heading dependence of EVIDENCE_SENSORS.md 4.2
  #   (in-corner wander 1.0 % at lateral 3.0 against 0.0 % at 7.0), which
  #   is what an axis-aligned friction pyramid does to a tyre that is not
  #   isotropic. Six equal compliances, three per-wheel normal forces.
  slip_compliance_lateral: "7.0"
  # ------------------------- THE SLIP BENCH --------------------------
  # tools/slip_bench.sh commands the traction terminal directly, lets the
  # plant reach a steady speed, and then measures the ground truth over a
  # window. Every constant it obeys is here.
  bench:
    # The cruise the fleet actually runs at (m6/ipc/follower.py
    # CRUISE_MPS). Slip is a function of speed, so it is measured at the
    # speed the vehicle spends its life at and not at a convenient one.
    cruise_mps: "0.7"
    # Discarded before the window opens: the drive joint accelerating from
    # rest, which is where the largest slip of the whole run happens and
    # is exactly not what "slip at steady cruise" means. 5 s at 0.7 m/s is
    # 3.5 m, an order of magnitude more than the plant needs to settle.
    settle_s: "5"
    # The window itself. 10 s is 7 m of travel, so a 1 % slip shows up as
    # 70 mm of ground-truth displacement - three orders of magnitude above
    # the ground truth's own resolution.
    sample_s: "10"
    # Between the two segments: the traction terminal is commanded to a
    # standing zero and the vehicle has to actually stop before it is
    # driven back the other way.
    rest_s: "3"

# ------------------------------ THE WET PATCH ---------------------------
# `m5v3.sh start --slippery` - THE SAME TRUCK ON A FLOOR IT CANNOT GRIP,
# and the scenario F2 Task 2 exists to measure. The plant above is a
# polyurethane tyre on dry concrete and it slips 0.956 % at cruise, which
# is small enough that the wheel odometry's DISTANCE error is dominated by
# the believed radius (wheel_odom.wheel_radius_scale) rather than by the
# tyre. Raise the compliance and the tyre takes over: the revolution the
# encoder counts buys steadily less ground, the estimator has no way to
# know, and the two errors fusion CAN and CANNOT fix come apart where an
# evidence table can see them (EVIDENCE_FUSION.md 8).
#
# IT IS A RUNTIME OVERRIDE AND model.sdf IS NOT TOUCHED, which is F2's
# constraint 12 and also the only honest way to run both plants in one
# afternoon. gz-sim 8.11's UserCommands system advertises
#
#     /world/<world>/wheel_slip/blocking
#         gz.msgs.WheelSlipParametersCmd -> gz.msgs.Boolean
#
# and m5v3.sh calls it once per wheel AFTER the truck is spawned. The
# committed model stays byte-identical between a nominal run and a
# slippery one; the difference is three service calls and nothing else.
# EVIDENCE_FUSION.md 8.1 records the investigation, including the two
# checks that make the reply worth believing.
#
# THE VALUES ARE IN EFFECT SPACE, AND THAT SENTENCE IS LOAD-BEARING.
# EVIDENCE_LATERAL_TUNE.md 3.1 measured that on this rig the element
# named <slip_compliance_lateral> is the one that governs the wheel's
# LONGITUDINAL slip - the two are swapped relative to their names - and
# the same swap is in this message's two fields, because they reach the
# same code. Both keys below are therefore set to the SAME number, which
# is the setting wheel_slip: above also ships and for the same measured
# reason: every value that made one direction of a contact stiffer than
# the other brought back the heading dependence of EVIDENCE_SENSORS.md
# 4.2. Six equal compliances, three per-wheel normal forces, and the
# normal forces are NOT overridden - the truck's weight did not change,
# only the floor under it.
#
# THE LADDER THAT CHOSE THE NUMBER, every row one fresh
# `start --headless --slippery` and one tools/slip_bench.sh, is
# EVIDENCE_FUSION.md 8.2 with the rejected rows kept. The target was
# > 5 % longitudinal slip at the 0.7 m/s cruise with the truck still
# able to finish `straight` and `square`.
slippery:
  slip_compliance_lateral: "16.0"
  slip_compliance_longitudinal: "16.0"
  # How long a wheel_slip service call may take before the bringup
  # refuses. It is a BLOCKING call - the reply comes back after the
  # command has run inside the simulation loop and found the entity,
  # which is what makes `data: true` worth checking - so the budget has
  # to cover one server iteration and not just a round trip. The spawn
  # service next door is given 10 s for a heavier job; 5 s here is the
  # same order and still a bound.
  service_timeout_ms: "5000"

# ----------------------------- WHEEL ODOMETRY ---------------------------
# WHAT nodes/wheel_odometry.py OBEYS, and every one of its errors is a
# number in this block rather than a line in that file.
#
# THE HONESTY RULE THAT GOVERNS EVERY VALUE BELOW is ver2's, quoted from
# agv/forklift/config.yaml's odometry: block because it has not improved
# with age: none of these was chosen to make the drift come out at a
# convenient size. Each is a stated property of the modelled hardware, the
# derivation is written beside it, and the drift that results is reported
# whatever it turns out to be.
#
# WHAT IS *NOT* HERE, AND THAT IS THE POINT: WHEEL SLIP. The physics
# engine already produces it - that is what wheel_slip: above exists for -
# and adding a slip term here would be inventing an error the simulation
# already has.
wheel_odom:
  # ---- the reading head ----
  #
  # ONE COUNT IS 2 pi / 1024 = 6.13592e-3 rad OF SHAFT, which at the
  # 0.12 m wheel is 0.7363 mm of tread. That is the quantum every
  # displacement this node reports is a whole multiple of.
  #   WHY 1024 AND NOT ver2's 4096. agv/forklift/config.yaml records this
  #   same shaft's encoder as 1024 pulses read in QUADRATURE, 4096
  #   counts/rev, 0.184 mm of tread per count. This track models the LINE
  #   grid instead of the quadrature-decoded one, and that is a choice
  #   rather than a discovery: F1 exists to give F2's EKF something to
  #   correct, and an error has to be VISIBLE in the run that measures it
  #   before it is worth filtering. A 0.184 mm quantum on a 20 m aisle
  #   run is not. The cost, stated: this encoder is four times coarser
  #   than the one ver2's vehicle carries, and any figure compared across
  #   the two tracks has to say which grid it was taken on.
  counts_per_rev: "1024"

  # ---- the radius the vehicle BELIEVES ----
  #
  # A scale on vehicle.wheel_radius_m, and it is deliberately not 1.0.
  # A loaded polyurethane drive tyre's effective rolling radius is
  # SMALLER than its free radius, so a truck calibrated on a free or new
  # tyre over-reports distance for ever: 0.12 * 1.015 = 0.1218 m.
  #   THE SIGN IS THE PESSIMISTIC ONE ON PURPOSE, and this is ver2's
  #   argument (odometry.rolling_radius_m) applied to a plant that now
  #   really does slip. The wheel_slip: system above makes the wheel
  #   OVER-TURN relative to the ground, so an error that over-reports
  #   distance COMPOUNDS with slip instead of cancelling it. The other
  #   sign would have flattered every figure by 1.5 % and there would
  #   have been no way to see it in the output.
  #   1.5 % rather than ver2's 0.5 % for the reason 1024 is not 4096:
  #   over the 20 m aisle profile it is 0.30 m of divergence, three
  #   orders of magnitude above the ground truth's own resolution and
  #   readable off a plot rather than out of a residual.
  wheel_radius_scale: "1.015"

  # ---- the steer zero the vehicle BELIEVES ----
  #
  # SENSOR SIDE, ADDED TO THE READING, never to a command. A steer
  # encoder's zero is set against mechanical straight-ahead by a
  # calibration, and no calibration is exact; what is modelled is that
  # calibration's residual. The wheel goes where it is told and the
  # estimator is wrong about where that is.
  #   WHAT IT COSTS, WRITTEN OUT. Driving dead straight, the estimator
  #   believes it is turning at v * tan(0.005) / L = 3.33 mrad/s at
  #   0.7 m/s: 11.5 deg of invented heading per 60 s of straight running.
  #   That is the term that dominates a tricycle's heading error, and it
  #   is the one an EKF with a gyro in it exists to observe.
  # The sign is positive and arbitrary - a real vehicle's is whatever its
  # last calibration left - and nothing downstream may assume it.
  steer_bias_rad: "0.005"

  # ---- the error NOT in this block, and it is the biggest one ----
  #
  # LATERAL TYRE SCRUB, WHICH DEAD RECKONING CANNOT SEE AT ALL. The
  # kinematics this node integrates assumes the tyres do not slide
  # sideways. wheel_slip: above gives them a lateral compliance on
  # purpose, so at a hard steer the contact patch scrubs and the vehicle
  # takes a FRACTION of the yaw its steer angle promises - measured on
  # this rig at 0.401 of it at 0.785 rad and 0.634 at 1.25 rad
  # (drive_route: below carries the table). The node has no term for
  # this and must not be given one: it is not modelling an instrument
  # error, it is the vehicle failing to go where its wheels point, and
  # nothing readable at the shaft or the steer axis contains it.
  #   MEASURED END TO END on the square profile, 2026-08-25: the plant
  #   turned 5.8418 rad and this node reported 10.1408 - it over-rotates
  #   by 1.74x through four hard corners. On a STRAIGHT the same run's
  #   heading error is 0.058 rad. That gap is the single strongest
  #   argument for F2 existing: a gyro observes the yaw the wheels cannot,
  #   and this is the error it is there to correct.
  #
  # CORRECTED BY MEASUREMENT 2026-08-26 (F1.5) - THE FRACTIONS ABOVE ARE
  # THE PRE-TUNE PLANT'S. EVIDENCE_LATERAL_TUNE.md. They are kept because
  # they are what this node was scored against in EVIDENCE_SENSORS.md 3,
  # and because the ARGUMENT they support is unchanged. The tuned plant
  # delivers 1.005 at 0.785 rad and a four-corner mean of 0.909 at
  # 1.25 rad, and the over-rotation on the re-tabled square falls from
  # 1.74x to 1.084x (plant 6.3124 rad, node 6.8416). NOT ONE LINE OF THIS
  # NODE MOVES BECAUSE OF THAT, and no term is added: the shortfall the
  # node cannot see got smaller because the VEHICLE stopped scrubbing,
  # which is the only honest way for it to get smaller. F2's gyro is
  # still what observes the rest - 0.53 rad of heading error over a 42 s
  # square is not an estimate anything may navigate on.

  # ---- what the node reads and how it is framed ----
  #
  # The joint names as they appear in the bridged JointState. The drive
  # name is looked for on topics.drive_speed_read_a and the steer name on
  # topics.joint_state; a name that is not in the message is a refusal
  # with the message's own name list in it, never a silent zero.
  drive_joint_name: "drive_wheel_joint"
  steer_joint_name: "steer_joint"
  # THE FRAME NAMES MOVED TO frames: IN F2 TASK 1 and are not repeated
  # here. They were this node's alone while nothing broadcast a
  # transform; F2's EKF now stamps the same two names on the odom ->
  # base_link TF and had to read them from somewhere, and a name spelled
  # in two places is two opinions about one frame.
  #   WHAT HAS NOT CHANGED: THIS NODE BROADCASTS NO TRANSFORM and must
  #   not. That edge has exactly one owner and since F2 it is the EKF
  #   (ver2 invariant 10). The cheapest way to guarantee a second
  #   publisher cannot appear is for the node to contain no broadcaster
  #   at all, and it still does not.
  # Subscription and publication queue depth. The plant publishes both
  # inputs once per physics step, so this is about four milliseconds of
  # slack, which is what a python callback needs and no more: a deep
  # queue on a 500 Hz channel does not prevent loss, it delays it and
  # then hands the estimator stale stamps.
  qos_depth: "10"
  # A STEER READING OLDER THAN THIS IS NO STEER READING. Both inputs
  # arrive once per physics step, so 0.3 s of silence is a dead
  # publisher and not a late one (m6/ipc/encoder_link.py's ENC_STALE_S,
  # same channel, same argument). The node then SKIPS the sample rather
  # than integrating against a stale angle - and skipping costs nothing
  # in distance, because the count grid is ABSOLUTE and the next accepted
  # sample differences against the last accepted one.
  steer_stale_s: "0.3"
  # How often the node writes a line of its own state to its log. It is a
  # log cadence and changes nothing the node computes; it is here rather
  # than inline because the file's header says nothing behavioural lives
  # inline and a cadence is close enough to the line to be argued about.
  log_every_s: "10"
  # THE SECOND HEARTBEAT'S CADENCE, AND IT IS THE ONE CLOCK ON THIS NODE
  # THAT IS NOT THE PLANT'S. log_every_s above rides the OUTPUT - it is
  # reached through publish() - so the state it can never report is the
  # one the log is most needed for: a node that is ALIVE and publishing
  # NOTHING, which is exactly what a dead steer topic produces (the held
  # angle stays None and every drive sample is skipped for ever).
  # nodes/wheel_odometry.py's alive() is a TIMER instead, on the
  # machine's own clock, so it ticks with the world stopped.
  #   5 s IS CHOSEN AGAINST THE OPERATOR AND NOT AGAINST THE PLANT.
  #   `m5v3.sh status` reports the child ALIVE, and the next thing an
  #   operator does is open logs/odom.log - which has to have something
  #   in it by then or the two instruments disagree. It costs one line
  #   per 5 s and only while the output is stopped: a run that is
  #   publishing never reaches the print at all.
  alive_every_s: "5"
  # HOW LONG SILENCE IS ALLOWED TO BE NORMAL BEFORE IT IS CALLED A FAULT.
  # The node is spawned before the world has necessarily advertised its
  # joint channels, so the first quiet seconds are a bringup and not a
  # defect - timing.startup_check_s (1 s) bounds a child DYING, not a
  # child becoming useful. A watchdog that cries at a normal start
  # teaches the operator to ignore it, which is the failure m6's own
  # escalation rule exists to prevent, so alive() prints info until this
  # much CONTINUOUS silence has passed and warn afterwards. Three ticks
  # of the cadence above: long enough that a world still loading is not
  # a fault, short enough that a stack which will never publish says so
  # inside the time it takes to read the log.
  alive_warn_after_s: "15"
  # HOW MANY WARNS THE FULL CADENCE IS ALLOWED, and what happens after.
  # The rate above is bounded and the TOTAL was not: the failure this
  # watchdog reports - a node ALIVE and publishing nothing - does not
  # clear itself, so one line per 5 s is 17 280 identical lines in a day,
  # and the line an operator actually needs is the FIRST one, with the
  # reason in it. Past the cap the same statement is printed once per
  # alive_warn_backoff_s and says how many ticks it stands for.
  #   12 IS ONE MINUTE AT THE CADENCE ABOVE, and the minute is chosen
  #   against the operator again: `m5v3.sh status` says ALIVE, they open
  #   logs/odom.log, and everything they read in that first minute is at
  #   full rate. Nothing inside the window an operator is actually
  #   reading in gets throttled.
  #   300 s IS THE BACKOFF AND NOT INFINITY. A watchdog that stops
  #   printing leaves a last line whose timestamp reads like the moment
  #   the fault ended, and the next reader dates the failure from it. One
  #   line per five minutes keeps the statement current for 12 lines an
  #   hour against 720.
  alive_warn_max: "12"
  alive_warn_backoff_s: "300"

  # ---- the covariances this node publishes, and their derivation ----
  #
  # STATIC DIAGONAL, THIS PHASE, AND THE COMMENT IS THE WHOLE OF THE
  # CLAIM. A covariance that moved with the steer angle and the speed
  # would be a better model; it is F2's to build if F2's EKF turns out to
  # need one. What is published here is a constant derived at ONE named
  # operating point, and naming the point is what makes it honest.
  #
  # The point: v = 0.7 m/s (wheel_slip.bench.cruise_mps, the speed this
  # vehicle spends its life at), delta = 0, dt = 0.002 s,
  # q = 6.13592e-3 rad, r = 0.1218 m, L = 1.05 m, d = 0.50 m.
  #
  #   dt IS THE WORLD'S PHYSICS STEP AND NOT A NODE RATE. The plant
  #   publishes this channel once per physics iteration and the node runs
  #   on every one of them, so in SIM time the interval is exactly
  #   warehouse_ver3.sdf's max_step_size, 0.002 s. The ~493 Hz quoted
  #   elsewhere is that same interval measured on a wall clock.
  covariance:
    # vx. Two terms.
    #   quantisation: the difference of two independent uniform
    #     quantisation errors has sigma q/sqrt(6) = 2.50498e-3 rad, so
    #     sigma_s = r * 2.50498e-3 = 3.05107e-4 m and
    #     sigma_v = 3.05107e-4 / 0.002 = 0.1525537 m/s
    #   radius scale: 1.5 % of 0.7 m/s = 0.0105 m/s
    #   sigma_vx = sqrt(0.1525537^2 + 0.0105^2) = 0.1529146 m/s
    #
    # READ THAT FIRST TERM AGAIN: AT THIS RATE THE REPORTED VELOCITY IS
    # 22 % NOISE. It is not a defect in the arithmetic, it is what
    # differencing a 0.74 mm grid over 2 ms is - at 0.7 m/s the truck
    # covers 1.9 counts per sample, so the count either lands or it does
    # not. ver2 ran its odometry at 50 Hz for exactly this reason
    # ("each cycle differences a real displacement rather than quantiser
    # dither"), where the same term falls to 0.01526 m/s, 2.2 %.
    #   THIS NODE STILL RUNS ON EVERY SAMPLE, because the POSE does not
    #   care - the grid is absolute, so quantisation does not accumulate
    #   in position - and because a quantiser that skips samples is a
    #   different device. What it costs is the TWIST, and the number
    #   below is the node saying so out loud to whatever fuses it. If
    #   F2's EKF cannot live with it, the fix is a decimated twist and
    #   the arithmetic for it is in this comment.
    vx: "2.3383e-2"
    # vyaw. yawrate = v * tan(delta) / L, so d(yawrate)/d(delta) at
    #   delta = 0 is v / L = 0.666667 1/s. The steer reading is NOT
    #   quantised on this track - the bias is the whole of its error -
    #   so there is one term and it is that bias carried through:
    #   0.005 * 0.666667 = 3.33333e-3 rad/s.
    #
    #   A BIAS IN A COVARIANCE IS A PRAGMATISM AND IS LABELLED ONE. It is
    #   a systematic error, not a noise, and no diagonal can represent it
    #   honestly; what it buys is an EKF that does not believe this
    #   heading more than it should. ver2 did the same with its steer
    #   zero offset.
    #
    #   Compare the IMU: model.sdf declares the gyro at 1.745e-3 rad/s of
    #   white noise, so the two sources are within a factor of two of
    #   each other on the SAME quantity and F2's filter will genuinely
    #   blend them rather than one drowning the other. Neither number was
    #   moved to arrange that.
    vyaw: "1.1111e-5"
    # vy is not measured. It is d * yawrate exactly, a kinematic
    # consequence of base_link standing 0.50 m forward of the rear axle,
    # so its variance is d^2 times vyaw's: 0.25 * 1.1111e-5.
    vy: "2.7778e-6"
    # EVERY AXIS THIS ESTIMATE DOES NOT MEASURE, and the whole pose.
    #   The pose of a dead-reckoned estimate has UNBOUNDED error and no
    #   honest fixed number exists for it, so a large constant is
    #   published and F2's EKF is to fuse the TWIST and never the pose.
    #   The value exists so the message is well formed, and so that
    #   anything which ignores that warning is told the pose is worth
    #   nothing. z, roll and pitch are the same story: this vehicle's
    #   wheels say nothing at all about them.
    unused: "1000.0"

# --------------------------------- EKF ---------------------------------
# THE FUSED ESTIMATE, AND THIS BLOCK IS DELIBERATELY NOT ALL OF IT.
# F2 Task 1 adds robot_localization's `ekf_node` (3.8.3, installed on the
# rig) as a stack child. Its parameters are a ROS parameter file with a
# shape this file does not have and cannot borrow - a top-level node name,
# a `ros__parameters:` mapping, fifteen-entry boolean arrays - so they
# live in their own file, `m5_ver3/ekf.yaml`, which ekf_node reads
# directly.
#
# WHICH FILE OWNS WHAT, AND NO NUMBER IS IN BOTH.
#
#   HERE:      the topic names, the frame names (frames: above), the
#              output rate, the node's name and the path to the other
#              file. Everything a SHELL has to know to start the child,
#              plus everything that is already spelled somewhere else on
#              this track and must not be spelled twice.
#   ekf.yaml:  what is fused and what is refused - the two fifteen-entry
#              configuration matrices - the sensor timeout, two_d_mode,
#              and the arguments for all of it. Everything that is about
#              the FILTER rather than about this stack.
#
# m5v3.sh passes the first group on ekf_node's command line as `-p`
# overrides, so ekf.yaml carries no topic, no frame and no rate at all
# and cannot drift away from the rest of this file.
#
# THE COVARIANCES ARE IN NEITHER FILE, AND THAT IS THE RIGHT PLACE FOR
# THEM. robot_localization reads each measurement's covariance out of the
# MESSAGE. The wheel odometry's is wheel_odom.covariance above, derived
# from F1's measured quantiser dither; the IMU's is filled by ros_gz from
# the stddevs model.sdf declares, and EVIDENCE_FUSION.md §2.1 measures
# what arrives on the wire against them. So the weighting between the two
# sensors is set by two measured numbers and by no hand in a launch file.
ekf:
  # The parameter file, relative to the repository root.
  params_file: "m5_ver3/ekf.yaml"
  # THE OPTIONAL ARM'S OVERLAY, AND IT IS A SECOND FILE RATHER THAN A
  # SECOND SECTION OF THE FIRST ONE. `m5v3.sh start --rf2o` passes this
  # as a SECOND --params-file after the one above; without the flag it is
  # never named on any command line and never read, so the default
  # stack's parameter set is not merely equivalent to the shipping
  # filter's - it is the same bytes, off the same one file.
  #   WHY NOT ONE FILE WITH THE odom1 BLOCK ALWAYS IN IT. ekf_node
  #   auto-declares every override it is handed, so an `odom1:` line
  #   sitting in ekf.yaml would be FOUND by robot_localization's sensor
  #   loop and the arm would be on by default with the flag doing
  #   nothing. Keeping the arm's entries in their own file means the
  #   OFF path cannot be reached by a typo in the ON path's block.
  #   THE TOPIC ITSELF IS STILL ON THE COMMAND LINE, exactly as odom0
  #   and imu0 are: this track's split is that ekf.yaml (and this
  #   overlay) hold what is FUSED, and config.yaml holds every name.
  rf2o_params_file: "m5_ver3/ekf_rf2o.yaml"
  # The node's name, and it has to match ekf.yaml's top-level key or the
  # parameters in that file belong to nobody. m5v3.sh renames the process
  # to this with `-r __node:=`; ekf.yaml's own header carries the same
  # obligation from the other side.
  node_name: "m5v3_ekf"
  # HOW OFTEN THE FILTER PREDICTS AND PUBLISHES, in Hz.
  #
  # 50 AND NOT 500, AND THE ARGUMENT IS ABOUT INFORMATION AND NOT COST.
  # The inputs are a 500 Hz wheel odometry and a 100 Hz IMU. Nothing is
  # lost by publishing slower than either: robot_localization queues every
  # measurement and integrates all of them, in stamp order, inside the
  # cycle they land in - so a 50 Hz cycle consumes ten wheel-odom samples
  # and two IMU samples rather than discarding eight and one.
  #   500 Hz OUTPUT WOULD BE WASTE AND WORSE THAN WASTE. The wheel
  #   odometry publishes at the world's physics step because a quantiser
  #   that skips samples is a different device (nodes/wheel_odometry.py's
  #   header), and it pays for that with a twist that is 22 % quantiser
  #   dither at 2 ms. A filter that re-published at the same rate would
  #   be emitting more opinions per second than there is information in
  #   the inputs, and every consumer downstream would pay to transport
  #   them.
  #   50 Hz IS WHAT THE CONSUMERS WANT. It is the rate m5-ver2's forklift
  #   EKF ran at (agv/forklift/ekf.yaml), so a figure compared across the
  #   two tracks is compared at the same output cadence; and it is 2.5x
  #   Nav2's controller rate and 25x its costmap rate, which is what F4
  #   will ask this transform for.
  #   IT IS THE TF RATE TOO. publish_tf is on, so this is how often
  #   odom -> base_link is stamped and how stale the freshest transform
  #   can be: 20 ms, against a vehicle that covers 14 mm in that time at
  #   its 0.7 m/s cruise.
  frequency_hz: "50.0"

  # ------------------- DID THE FILTER COME UP BROKEN? -------------------
  # WHAT tools/ekf_health.py OBEYS, and it is a BRINGUP GATE rather than
  # an instrument: m5v3.sh runs it once, after every child is confirmed
  # alive and while the truck is still standing where it was spawned, and
  # refuses the whole bringup if it says no.
  #
  # IT EXISTS BECAUSE THIS FILTER FAILED SILENTLY AND NOTHING ASKED.
  # robot_localization's ekf_node can diverge during its first cycles on
  # this stack - covariance 5.0e-4 to 2.42e84 in ONE 20 ms cycle, the
  # pose to 1e48 m - while the process stays up, `status` reads ALIVE,
  # the publisher holds its configured rate and the evidence recorder's
  # stream arrives on time. Every check this stack had was GREEN over a
  # filter that had already stopped being one. EVIDENCE_FUSION.md 8.6
  # measured it at 13 of 14 bringups with the IMU's ax channel fused and
  # 6 of 6 on the exact tree that produced section 3's tables; section 9
  # is what dropping that channel did.
  #   THE CHANNEL IS GONE AND THIS GATE STAYS. An instability that was
  #   silent once is a thing this stack asks about out loud from now on,
  #   so that a later change cannot reintroduce it and be found out three
  #   tables later.
  startup_check:
    # THE CEILING, ON THE LARGEST MAGNITUDE ANYWHERE IN THE PUBLISHED
    # COVARIANCE - not on the pose, which is ambiguous at bringup (a
    # truck may legitimately have been driven), and not on the xx
    # diagonal alone, which on a diverged message reads 5.74e87 against
    # an off-diagonal 5.08e91 and is therefore the SMALLER of the two by
    # four orders of magnitude.
    #   MEASURED, 6 bringups of the shipping configuration with the truck
    #   at spawn: the worst entry reads 0.08244 to 0.22776. The filter's
    #   pose covariance grows at the process noise's 0.05 per second
    #   while the vehicle is not aided in position, so a stack that
    #   reached this line a minute late would read about 3 - which is why
    #   the ceiling is not 1.0.
    #   100.0 is 440x the largest healthy reading and the failure misses
    #   it by EIGHTY-TWO ORDERS OF MAGNITUDE, so nothing rides on the
    #   exact number. It is a line between an estimate and a wreck, not a
    #   tolerance, and nothing is compared against it.
    covariance_max: "100.0"
    # How long that one read may wait. `ros2 topic echo --once` waits for
    # its message FOR EVER, so a filter that never published at all would
    # hang the bringup in silence instead of refusing it - which is
    # tools/noise_probe.sh's lesson, learned there by hanging the probe.
    # 20 s is the same budget drive_route.clock_timeout_s takes for the
    # same shape of question, and this topic publishes at 50 Hz.
    timeout_s: "20"

# --------------------- THE OPTIONAL LASER-ODOMETRY ARM -------------------
# F2 Task 3. `rf2o_laser_odometry` estimates the vehicle's planar motion
# by matching consecutive scans of the nav lidar - a THIRD opinion about
# the twist, alongside the wheel odometry's and the gyro's, and the only
# one on this stack that observes the FLOOR rather than the vehicle.
#
# IT IS OFF BY DEFAULT AND THAT IS THE WHOLE POINT OF THE FLAG.
# `m5v3.sh start` brings up exactly the six children EVIDENCE_FUSION.md
# 9.3's figures were taken on; `--rf2o` adds three more and one extra
# --params-file. Nothing in this block is read at all without it.
#
# IT IS BUILT FROM SOURCE, IN THE USER'S HOME, WITHOUT ROOT.
# tools/install_rf2o.sh is how it reproduces and F2 constraint 14 is why
# that is a committed script rather than a paragraph. The package is not
# in the Jazzy archive for any distribution, so there is nothing to
# apt-get and m6/tools/install_broker.sh's vendoring shape has nothing to
# vendor; what this track keeps from it is its discipline.
rf2o:
  repo: "https://github.com/MAPIRlab/rf2o_laser_odometry"
  # THE PIN. `ros2` is a moving branch and this is the revision every
  # number in EVIDENCE_FUSION.md 10 was measured on: the branch tip on
  # 2026-08-26, authored 2023-04-28. install_rf2o.sh detaches onto it and
  # then reads the revision back off the tree, because `git checkout`
  # accepts a branch name and an abbreviated sha alike.
  commit: "b38c68e46387b98845ecbfeb6660292f967a00d3"
  # THE BUILD TREE, AND IT IS THE USER'S AND NOT THE REPOSITORY'S. Under
  # m5_ver3/ it would be a hundred megabytes of object files one stray
  # `git add` from being committed. The leading ~/ is expanded against
  # $HOME by both readers - tools/install_rf2o.sh and m5v3.sh - and the
  # path is written once so the two cannot disagree about where the
  # binary is.
  workspace: "~/m5v3_rf2o_ws"
  package: "rf2o_laser_odometry"
  executable: "rf2o_laser_odometry_node"
  # Release, and it is not a preference. This node solves a weighted
  # least-squares system over 811 beams at five pyramid levels five times
  # per scan; EVIDENCE_FUSION.md 10.4 measures what that costs on this
  # rig and a debug build would be measuring a different program.
  build_type: "Release"
  # THE NODE'S OWN LOOP RATE, in Hz, and it is NOT the scan rate.
  # rf2o's main() is a `while(ok) { spin_some; process; rate.sleep; }`
  # loop on the WALL clock: process() consumes at most one buffered scan
  # per pass and warns when there is none. Below the scan rate it drops
  # scans; at exactly the scan rate it would drop one whenever the two
  # cadences beat. 30 is twice the nav lidar's 15 Hz, so every scan is
  # taken on the pass after it lands, and the cost of the extra passes is
  # a WARN line and a predicate.
  #   IT IS A WALL-CLOCK RATE ON A SIM-TIME STACK, unavoidably -
  #   rclcpp::Rate does not follow /clock - so what this number really
  #   bounds is passes per second of the MACHINE. At this rig's ~1.0
  #   real-time factor the two coincide; on a slower one the margin is
  #   larger, not smaller, which is the safe direction.
  freq_hz: "30.0"
  # ---------------- WHAT THE RELAY BELIEVES THE ARM IS WORTH ------------
  # THE COVARIANCE rf2o DOES NOT PUBLISH. The upstream node default-
  # constructs its Odometry and never assigns twist.covariance, so every
  # message carries 36 zeros, and it exposes no parameter to change that
  # (pinned commit, src/CLaserOdometry2DNode.cpp). robot_localization
  # does not ignore a zero variance on a channel it is fusing - it
  # substitutes 1e-9 - so the arm would arrive weighted about seven
  # orders of magnitude above the wheel odometry it is supposed to be
  # checked against.
  #
  # SO THESE ARE MEASURED, AND THEY ARE MEASURED WITHOUT GROUND TRUTH.
  # The derivation is EVIDENCE_FUSION.md 10.2 and it is two readings of
  # rf2o's OWN output, the larger of the two taken per channel:
  #   AT REST   the temporal spread of the whole twist over a 60 s
  #             `record --static`, 912 samples. The reference is that the
  #             truck is not moving, which is a fact about the experiment
  #             and not a signal.
  #   AT CRUISE the residual of the same channel about a 2 s moving mean
  #             of ITSELF, over the steady window of a `straight` run
  #             (the wheel odometry within 5 % of its own peak), 231
  #             samples. The reference is the signal's own local level.
  # Neither reading touches /forklift/gz/odom, so F2 global constraint 13
  # holds inside the calibration and not only at run time.
  # tools/noise_probe.sh takes the plant's own sensor noise by exactly
  # this instrument, at rest, for exactly this reason.
  #
  #   channel   at rest       at cruise     SHIPPED
  #   vx        2.6403e-03    2.2663e-03    2.6403e-03   (sd 0.0514 m/s)
  #   vyaw      9.3723e-05    2.5445e-05    9.3723e-05   (sd 0.00968 rad/s)
  #
  # WHAT THESE NUMBERS DO NOT CONTAIN, STATED RATHER THAN HIDDEN, and it
  # is the single most important line in this block. A covariance
  # describes DISPERSION. rf2o also has a large SCALE error on this
  # plant - it under-reports the vehicle's true forward speed by
  # 9.5 - 17.4 %, measured over eight sessions (EVIDENCE_FUSION.md 10.5;
  # nodes/rf2o_twist_core.py's header calls it "about a sixth") - and
  # that is a BIAS, which no covariance
  # can express and which this block deliberately does not inflate
  # itself to disguise.
  #   THAT IS wheel_odom.covariance's OWN RULING, APPLIED AGAIN. That
  #   block derives its vyaw from the steer bias alone and refuses to
  #   invent a term for the tyre scrub that actually dominates a corner,
  #   because inventing one would be a hand in the weighting. The same
  #   rule here means the filter is told rf2o's vx is PRECISE - eight
  #   times more precise than the wheel odometry's quantiser dither -
  #   while it is also 9.5 - 17.4 % low, and it will weight it
  #   accordingly.
  #   EVIDENCE_FUSION.md 10.5 measures what that costs, and the answer
  #   is the whole verdict on this arm. A gain fitted against the ground
  #   truth would have made the arm's own error vanish into a constant
  #   and left nothing to A/B.
  #   VALUES ARE VARIANCES, in (m/s)^2 and (rad/s)^2, to match the
  #   wheel_odom.covariance block above.
  covariance:
    vx: "2.6403e-03"
    vyaw: "9.3723e-05"
    # THE DO-NOT-FUSE FLAG, and it is wheel_odom.covariance.unused's
    # number for wheel_odom.covariance.unused's reason. rf2o integrates
    # a POSE and this relay passes it through untouched, so the message
    # has one; it has unbounded error and no honest fixed covariance
    # exists for it. ekf_rf2o.yaml's six false pose flags are the second,
    # independent refusal.
    unused: "1000.0"
  # HOW FAR THE APERTURE'S CENTRE MAY BE FROM 0 OR pi BEFORE THE ARM IS
  # REFUSED, as |sin(centre)| rather than as an angle.
  #
  # WHAT IT GUARDS. nodes/rf2o_twist_core.py turns rf2o's velocity by
  # the aperture's centre bearing, and the x component of that rotation
  # is `vx*cos(c) - vy*sin(c)`. The `vy` it is handed is upstream's
  # hard-coded 0.0 - not the scanner's real lateral speed, which never
  # leaves that process - so the `-vy*sin(c)` term is ALWAYS missing and
  # the correction is exact only where it vanishes: sin(c) = 0. This
  # plant's window is centred on pi on purpose (model.sdf) so it does.
  # On a vehicle whose lidar is centred anywhere else the same code
  # would leak the scanner's unknown lateral speed into the one channel
  # this arm contributes, as a BIAS through every turn, with nothing
  # downstream able to see it. So it is a refusal at bringup and not a
  # comment in a header.
  #   IT IS A SINE AND NOT AN ANGLE so that -pi and 3*pi - the same
  #   aperture, equally exact - are accepted rather than refused by an
  #   `abs(c) < eps or abs(c - pi) < eps` written the obvious way.
  #   1e-6 AND NOT ZERO, AND THE SIZE IS DERIVED. sensor_msgs/LaserScan
  #   carries angle_min and angle_max as FLOAT32, whose quantum near pi
  #   is 2^-22 = 2.384e-07, so a window that IS centred on pi arrives a
  #   little off it: measured on this rig the wire reads +3.1415926 rad,
  #   |sin| = 5.359e-08, which this clears by about 19x.
  #   AND WHAT IT LETS THROUGH IS BELOW THE NOISE. At |sin(c)| = 1e-6 a
  #   scanner lateral speed of 1 m/s leaks 1e-6 m/s onto the fused
  #   forward speed - six orders of magnitude under the 0.0514 m/s
  #   dispersion rf2o.covariance.vx above is derived from. A larger
  #   tolerance would start hiding a real misalignment, which is the
  #   failure this exists for: a BIG one shows up as a wrong-signed
  #   speed on the first drive, and only a small one needs a check.
  aperture_sin_epsilon: "1e-6"
  # The relay's subscription and publication depth. 10 is two thirds of a
  # second of this 15 Hz stream and the same depth every other node on
  # this track uses.
  qos_depth: "10"
  # One line in logs/rf2ocov.log every this many seconds of SIM time -
  # nodes/wheel_odometry.py's heartbeat, at the same cadence, so a child
  # that is up and producing nothing is readable as such.
  log_every_s: "10"

# --------------------- THE OPTIONAL FACTOR-GRAPH ARM ---------------------
# F2 Task 4. `fuse` is a nonlinear least-squares state estimator: it does
# not carry a state and a covariance forward the way an extended Kalman
# filter does, it builds a FACTOR GRAPH of every measurement inside a
# sliding window and re-solves the whole window with Ceres each time it
# optimises. The variables are re-linearised at each solve, so a
# measurement that arrives late, or out of order, or that would have been
# linearised about a bad estimate, is not stuck with the linearisation
# point it happened to land on.
#
# IT REPLACES ekf_node RATHER THAN JOINING IT, AND THAT IS ENFORCED.
# `m5v3.sh start --fuse` does not spawn the `ekf` child at all. Both
# estimators publish odom -> base_link and tf2 has no notion of two
# authorities for one edge - whichever transform arrived last is the one
# every listener reads - so running them together would not produce a
# comparison, it would produce a coin toss at 50 Hz. `--fuse` and
# `--rf2o` are refused TOGETHER for the same reason one level up: a
# three-way arm is not this task's, and the overlay ekf_rf2o.yaml is a
# robot_localization parameter file that this node cannot read.
#
# IT IS OFF BY DEFAULT AND NOTHING IN THIS BLOCK IS READ WITHOUT THE FLAG.
# `m5v3.sh start` brings up exactly the six children EVIDENCE_FUSION.md
# 9.3's figures were taken on, hands the filter one --params-file, and
# never names fuse.yaml, the vendored prefix or this block's topic.
#
# IT IS VENDORED INTO THE USER'S HOME WITHOUT ROOT, AND THAT IS THE OTHER
# HALF OF WHY IT IS A BLOCK HERE. Unlike rf2o - which is in no ROS
# archive for any distribution and therefore had to be built from source -
# every package this arm needs IS in the Jazzy archive, so
# tools/install_fuse.sh is m6/tools/install_broker.sh's shape rather than
# tools/install_rf2o.sh's: `apt-get download` + `dpkg-deb -x` into a
# prefix under $HOME, no sudo at any point, and the exact versions pinned
# below. F2 constraint 14 is why that is a committed script and not a
# paragraph in a report.
fuse:
  # EVERY PACKAGE THIS ARM ADDS TO THE RIG, PINNED TO THE EXACT VERSION
  # EVIDENCE_FUSION.md 11 WAS MEASURED ON, as `name=version` pairs.
  #
  # WHY A STRING AND NOT A YAML LIST. tools/_common.sh's config reader
  # walks this file to `CFG_<DOTTED_KEY>` shell scalars, and a shell has
  # no arrays that survive that trip; a mapping keyed by package name
  # would produce variable names containing hyphens, which are not
  # variable names at all. One scalar, split on whitespace by the one
  # script that reads it.
  #
  # HOW THIS LIST WAS ARRIVED AT, AND WHY IT IS NINE AND NOT A HUNDRED.
  # `apt-cache depends --recurse` over the seven fuse packages names 654
  # distinct packages, because it follows every alternative of every
  # Depends line - six versions of flang, five of gcc, three DDS
  # implementations this rig does not use. What was actually MISSING on
  # this rig, checked one by one with `dpkg-query -W`, is the eight fuse
  # packages plus `tf2_2d`, and nothing else: libceres4t64 2.2.0,
  # libsuitesparse's libcholmod5 / libccolamd3 / libspqr3, libgoogle-glog,
  # libboost-serialization1.83.0, liborocos-kdl1.5, libtinyxml2-10 and
  # libconsole-bridge1.0 were all already installed here, and `ldd` over
  # the vendored binary reports no unresolved object. install_fuse.sh
  # re-runs that check and vendors ONLY what its own rig is missing, so a
  # rig without them fetches them and this list records what THIS one
  # needed. EVIDENCE_FUSION.md 11.1.
  #   THE -dev PACKAGES ARE DELIBERATELY NOT HERE. ros-jazzy-fuse-core
  #   Depends on libceres-dev, libboost-all-dev, libeigen3-dev and
  #   libgoogle-glog-dev - build dependencies that ROS's packaging
  #   promotes to runtime Depends. `dpkg-deb -x` runs no dependency
  #   resolution at all, and a node that is already linked needs headers
  #   from none of them. Vendoring them would be fetching 400 MB to
  #   satisfy a checker that is not running.
  packages: >-
    ros-jazzy-fuse-msgs=1.1.5-1noble.20260615.111618
    ros-jazzy-fuse-core=1.1.5-1noble.20260615.142407
    ros-jazzy-fuse-variables=1.1.5-1noble.20260615.155054
    ros-jazzy-fuse-graphs=1.1.5-1noble.20260615.154436
    ros-jazzy-fuse-constraints=1.1.5-1noble.20260615.155948
    ros-jazzy-fuse-publishers=1.1.5-1noble.20260615.155943
    ros-jazzy-fuse-optimizers=1.1.5-1noble.20260615.161308
    ros-jazzy-fuse-models=1.1.5-1noble.20260615.161302
    ros-jazzy-tf2-2d=1.4.1-1noble.20260615.153930
  # WHERE THE EXTRACTED TREE LIVES, AND IT IS THE USER'S AND NOT THE
  # REPOSITORY'S - rf2o.workspace's argument, and the same leading ~/
  # expanded against $HOME by both readers (tools/install_fuse.sh and
  # m5v3.sh). Under m5_ver3/ it would be forty megabytes of shared
  # objects one stray `git add` from being committed, and it must not
  # need root, which rules out /opt and /usr alike.
  prefix: "~/m5v3_fuse_prefix"
  # WHERE INSIDE THAT PREFIX THE ROS TREE LANDS. A ROS deb's payload is
  # rooted at /opt/ros/jazzy, so `dpkg-deb -x pkg.deb $prefix` produces
  # $prefix/opt/ros/jazzy/{lib,share,include} - and THAT path, not
  # $prefix, is what AMENT_PREFIX_PATH and LD_LIBRARY_PATH have to name.
  # It is spelled here rather than derived from paths.ros_setup because
  # it is a fact about the DEBIAN PACKAGE's layout and not about where
  # this rig installed ROS; the two agree today and are not the same
  # claim.
  deb_prefix: "opt/ros/jazzy"
  # The package and executable m5v3.sh spawns, by absolute path under the
  # prefix - `ros2 run` would work once AMENT_PREFIX_PATH names the
  # prefix, and is not used, for the reason install_rf2o.sh gives: there
  # is then no wrapper shell between this script and the child, and the
  # pid in the pidfile is the process doing the work.
  package: "fuse_optimizers"
  executable: "fixed_lag_smoother_node"
  # The node's name, and it has to match fuse.yaml's top-level key or
  # every parameter in that file belongs to nobody at all. m5v3.sh
  # renames the process to this with `-r __node:=` and greps the file for
  # it before anything starts - check_fuse_params(), which is
  # check_ekf_params()'s argument applied to this node.
  node_name: "m5v3_fuse"
  # The parameter file, relative to the repository root. It holds what is
  # FUSED and what is REFUSED and nothing else - no topic, no frame, no
  # rate - exactly as ekf.yaml does, and for the same reason: this is a
  # ROS parameter file and config.yaml is not one.
  params_file: "m5_ver3/fuse.yaml"

  # ---------------------- WHAT THE SMOOTHER DOES ------------------------
  # HOW LONG THE WINDOW IS, in seconds of sim time. This is the one
  # number that makes this arm a SMOOTHER rather than a filter: every
  # measurement inside the window is re-solved, and re-linearised, on
  # every optimisation pass, and everything older is marginalised out
  # into a prior.
  #   0.5 s HERE, AND IT IS A RULING RATHER THAN A MEASUREMENT. Longer
  #   buys more re-linearisation and costs Ceres a bigger problem on
  #   every pass; shorter converges on the EKF, which would make the A/B
  #   compare two spellings of the same thing. 0.5 s is 25 optimisation
  #   passes of overlap at optimization_frequency_hz below, 250 wheel
  #   odometry samples and 50 IMU samples - a window with real history in
  #   it on a vehicle that covers 0.35 m of its 0.7 m/s cruise inside it.
  #   What it COSTS is measured rather than argued: EVIDENCE_FUSION.md
  #   11.4 is the CPU, against the EKF's on the same bringup pair.
  lag_duration_s: "0.5"
  # HOW OFTEN THE GRAPH IS RE-SOLVED, in Hz. It is NOT the output rate:
  # the publisher below runs at ekf.frequency_hz and predicts forward
  # from the last solved state with the motion model between passes,
  # which is the smoother's analogue of the EKF's predict step.
  #   20 Hz AGAINST THE EKF's 50. An optimisation pass is a Ceres solve
  #   over the whole window and not a 15x15 matrix update, so this is the
  #   knob that decides what the arm costs. 20 Hz gives every pass 50 ms
  #   of wall budget at RTF 1.0 and every measurement at most 50 ms of
  #   sim time before it is first solved - a quarter of ekf.yaml's
  #   sensor_timeout and well inside the window above.
  optimization_frequency_hz: "20.0"
  # HOW LONG A SENSOR MAY MAKE THE GRAPH WAIT for a motion-model segment
  # to be generated for its stamp, in seconds. A transaction that cannot
  # be connected to the graph inside this is dropped with a log line.
  #   0.10 s IS fuse's OWN DEFAULT and it is left there deliberately, for
  #   ekf.yaml's process-noise reason: it is a knob a drift figure can be
  #   flattered with, and this task's job is to measure what a factor
  #   graph buys on this vehicle rather than to arrange it.
  transaction_timeout_s: "0.10"

  # ------------------- DID THE SMOOTHER COME UP BROKEN? ----------------
  # THERE IS NO fuse.startup_check BLOCK, AND ITS ABSENCE IS A DECISION.
  # tools/ekf_health.py gates EVERY bringup on both arms, and it reads
  # ekf.startup_check.covariance_max on both - because that ceiling is a
  # claim about A FILTER THAT HAS JUST STARTED WITH THE TRUCK AT SPAWN
  # (100.0, against a measured healthy band of 0.08 to 0.23 and a
  # divergence that misses it by eighty-two orders of magnitude), and not
  # a claim about robot_localization. A second copy of that number,
  # keyed by arm, would be a second thing to keep in step with the first
  # and would let one arm's ceiling drift away from the other's - which
  # on an A/B is a way of grading the two estimators against different
  # standards without anybody deciding to. What IS parameterised by arm
  # is the TOPIC the gate reads, because the two arms publish on
  # different addresses; that mapping is
  # tools/evidence_core.py's fused_topic_key() and it is tested there.
# ------------------------------ DRIVE ROUTE -----------------------------
# tools/drive_route.py's profiles. It is the EVIDENCE DRIVER: it puts the
# truck through a known, repeatable manoeuvre so that the odometry and the
# ground truth can be read against each other over it. It closes no loop,
# reads no pose and corrects nothing - open loop is the honest shape for a
# bench, because a controller in the loop would make every divergence a
# statement about the controller as well.
#
# A SEGMENT IS (hold_s, tread_mps, steer_rad) AND THE CLOCK IS THE
# PLANT'S. Each segment publishes its two standing orders - the steer
# terminal first, then the traction terminal - and holds them for hold_s
# of SIM time, read off the bridged clock. Wall time is deliberately not
# used: the same profile then covers the same ground whatever the
# real-time factor was on the day, which is the difference between a
# repeatable manoeuvre and one that depends on the machine's load.
#
# THE SIGN IS IN THE TABLE, ONCE. Forward - forks first, the travel
# direction - is a NEGATIVE tread speed, because model yaw 0 points the
# forks at world -x (m6/ipc/follower.py's header). Every negative number
# in these tables is the truck going forwards. Astern is positive.
#
# WHERE THESE FIT ON THE FLOOR. The truck spawns at (-17.00, 10.00) yaw
# 3.14159, which is the NORTH RING LEG facing world +x, and the free band
# there is y in [6.00, 14.00] by x in [-24.00, +24.00]: every rack in
# warehouse_ver3.sdf ends at y = +6.00 (RackNW1 is a 0.5 x 3.5 m box at
# (-15.750, 4.250), so it spans y 2.50 to 6.00) and the north wall's
# inner face is y = +14.00. So there is 48 m of room along the leg and
# exactly 8 m across it, and the 8 m is what sizes the square below.
drive_route:
  # HOW LONG THE DRIVER WILL WAIT FOR A CLOCK MESSAGE before it refuses.
  # `gz topic -e` waits for its next message FOR EVER, so a stack that is
  # not up would hang the driver in silence rather than refuse it -
  # noise_probe.capture_timeout_s exists for the same reason. The clock
  # publishes at the world rate, so anything past a couple of seconds is
  # already an answer; 20 s is an order of magnitude of headroom over a
  # loaded rig and still a bound.
  clock_timeout_s: "20"
  profiles:
    # STRAIGHT: accelerate to cruise, hold, stop. About 11.9 m of travel
    # in 23.5 s of sim time, from x = -17.0 to about x = -5.1 with the
    # fork tips at -3.2 - the whole of it inside the ring band.
    #   THE RAMP IS IN THE TABLE BECAUSE THE PLANT HAS NONE. model.sdf's
    #   traction terminal is a raw velocity command with no ramp, so a
    #   single step to cruise would put the largest slip of the run into
    #   its first tenth of a second. Four quarters of cruise at 0.5 s
    #   each is the ramp, and it is the same shape on the way down.
    straight:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "15.0", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}

    # SQUARE: four straights joined by four steered corners, back towards
    # where it started. An open-loop square's CLOSURE ERROR is the classic
    # odometry reading, and it is why this profile exists: the truck comes
    # back to its start and what the estimate says about that is the
    # measurement.
    #
    # THE CORNER IS MEASURED AND NOT DERIVED, AND THE FIRST VERSION OF
    # THIS TABLE IS WHY. It was written from the kinematics - delta =
    # pi/4, R = L/tan(delta) = 1.05 m, corner = (pi/2)*L/(v*sin delta) =
    # 7.775 s - and driven on this rig on 2026-08-25. The plant turned
    # 2.912 rad in the four corners against the 6.283 asked for, and the
    # truck finished 4.45 m from its start instead of on it. THE TABLE
    # WAS NOT WRONG ARITHMETIC; IT WAS THE WRONG MODEL. A tricycle's
    # kinematics assumes the tyres do not slide sideways, and this
    # model's whole point is that they do (wheel_slip: above, lateral
    # compliance 7.0). At a hard steer the contact patch scrubs, and the
    # yaw the vehicle actually takes is a fraction of the yaw the
    # geometry promises.
    #
    #   MEASURED ON THIS RIG, one steady turn per row, ground truth over
    #   a 10 s window after the steer axis had slewed and the turn had
    #   established (instrument: a throwaway gz-side probe commanding the
    #   two terminals and integrating /forklift/gz/odom's yaw; the same
    #   two numbers can be read back off any drive_route run):
    #
    #     steer      kinematic      MEASURED      effective   fraction
    #     [rad]      [rad/s]        [rad/s]       R [m]       delivered
    #     -0.785398  0.20203        0.08104       2.632       0.401
    #     -1.250000  0.27114        0.17182       0.711       0.634
    #
    #   So the harder steer is not only tighter, it is also LESS lossy:
    #   0.63 of its geometry against 0.40. That is the direction a scrub
    #   term goes and it is why the table below uses -1.25 rad, 0.06 rad
    #   inside the 1.31 mechanical stop.
    #
    #   CORRECTED BY MEASUREMENT 2026-08-26 (F1.5) - THE TWO FACTORS
    #   ABOVE ARE THE PRE-TUNE PLANT'S AND THE TABLE BELOW IS NO LONGER
    #   BUILT FROM THEM. EVIDENCE_LATERAL_TUNE.md. Both rows are kept
    #   because they are what sized the 9.142 s corner this profile drove
    #   until today, and because the reason they are gone is the point:
    #   the deficit they record was two rigid rear contact patches, and
    #   the rear pair now carries the wheel-slip system (wheel_slip:
    #   above). Re-measured on the tuned plant, same instrument,
    #   sensor_evidence.py's per-corner table over
    #   drive-square-20260826-064858:
    #
    #     steer      kinematic      MEASURED      effective   fraction
    #     [rad]      [rad/s]        [rad/s]       R [m]       delivered
    #     -0.785398  0.202666       0.203768      0.986       1.005
    #     -1.250000  0.271136       0.246312*     0.331       0.909*
    #
    #   * the mean of the four corners of one square run. At -1.25 rad
    #     the four do NOT agree - 0.2277 to 0.2624 rad/s, 14.1 % apart -
    #     because the heading dependence of EVIDENCE_SENSORS.md 4.2
    #     SHRANK from 16.6 % but did not vanish at this steer angle,
    #     while at -0.785 rad it did (in-corner wander 10.1 % -> 0.0 %).
    #     A single delivered fraction at -1.25 rad is therefore still an
    #     average over headings, and the corner time below is sized from
    #     that average with its spread stated rather than hidden.
    #   AND THE ARGUMENT FOR -1.25 RAD IS GONE WITH THE FIGURES, though
    #   the angle is not. The harder steer was chosen because it was less
    #   lossy; on the tuned plant the softer one is the better-behaved of
    #   the two. -1.25 rad is kept anyway, because changing the steer
    #   angle would change what this profile IS - the closure figure and
    #   the four-corner heading table would both stop being comparable
    #   with every run in EVIDENCE_SENSORS.md - and re-sizing the corner
    #   is the change this gate was asked for. A square at pi/4 would now
    #   fit the floor (2R = 2.09 m against the 5.26 m the untuned plant
    #   needed); whether to drive one is F2's to decide, not this file's.
    #
    # THE GEOMETRY THAT FOLLOWS FROM THAT MEASUREMENT, checked against
    # the floor rather than chosen:
    #   A 90 deg corner is (pi/2) / 0.17182 = 9.142 s, and the rear axle
    #   traces it at R = 0.711 m. With 1.00 m straights the rear-axle
    #   path is a 2.42 m rounded square (2R + A) and the run is 53.9 s.
    #     CORRECTED BY MEASUREMENT 2026-08-26 (F1.5): 6.145 s, R = 0.331 m,
    #     a 1.66 m rounded square, 41.9 s of profile. EVERY MARGIN BELOW
    #     GETS LARGER AND NONE OF THEM GETS SMALLER, which is why the
    #     floor check is not re-derived: the path is strictly inside the
    #     one it was written against (2R falls from 1.42 m to 0.66 m and
    #     the straights are unchanged), and the ground truth of
    #     drive-square-20260826-065230 confirms it - the rear axle stayed
    #     inside x [-16.9443, -15.2816], y [9.9576, 11.6469], so the
    #     truck's 1.50 m envelope corner cannot have passed y = 13.147
    #     against a wall at 14.00: 0.85 m of margin, taken as the axle's
    #     worst y plus the whole envelope radius at every bearing at once,
    #     which is a bound and not a reconstruction.
    #   THE BINDING CONSTRAINT IS THE TRUCK AND NOT THE SQUARE. The
    #   corridor is 8.00 m across and the fork tips reach 1.375 m ahead
    #   of the rear axle, so the worst point of the whole path is the
    #   middle of the second corner, where the tips reach y = 13.19
    #   against a wall at 14.00 - 0.81 m of margin. On the northbound
    #   straight they reach 13.09. That is what sizes A at 1.00 m.
    #   A 90 deg SQUARE AT pi/4 WOULD NOT FIT ANYWHERE ON THIS FLOOR:
    #   2R = 5.26 m plus the truck's own 3.8 m envelope needs 9.06 m of
    #   width and the widest clear road in warehouse_ver3 is 8.00 m.
    #   IT TURNS LEFT, TOWARDS THE WALL. Left and right are symmetric on
    #   this leg (4.00 m either way), but south of the square's own x
    #   range stands RackNW1 at x in [-16.00, -15.50] reaching y = 6.00,
    #   and a wall is a flatter thing to have 0.8 m away than a rack leg.
    #   A left turn while driving FORWARD is a NEGATIVE steer angle -
    #   positive is the driver's right (m6/tests/test_follower.py's
    #   header) - which is why every corner below is signed as it is.
    #   THE WHOLE SQUARE IS DRIVEN AT 0.3 m/s, the fleet's own corner
    #   speed (m6/ipc/follower.py CORNER_MPS). Cruise is what straight:
    #   and aisle: are for.
    #
    # AND IT STILL DOES NOT CLOSE EXACTLY, for a reason the table cannot
    # remove: the steer axis has to SLEW into each corner from dead
    # straight, and the measurement above was taken with it already
    # there, so every corner loses the yaw of its own first fraction of a
    # second. MEASURED OVER THE WHOLE PROFILE on this rig 2026-08-25,
    # ground truth from spawn: the truck turned 5.8418 rad of the 6.2832
    # asked (93.0 %) and came back to within 0.6831 m of its start.
    #   THAT RESIDUAL IS NOT AN ERROR TO TUNE OUT. It is the plant, it is
    #   open loop, and the ground truth is what says where the truck
    #   went. Driving the table until the truck closed perfectly would
    #   only mean the table had absorbed one day's slip, and the next run
    #   at a different load or a different speed would open it again.
    #
    # CORRECTED BY MEASUREMENT 2026-08-26 (F1.5), AND THE SLEW IS NOW IN
    # THE ARITHMETIC INSTEAD OF IN THE RESIDUAL. EVIDENCE_LATERAL_TUNE.md
    # 5. The paragraph above is right that the slew cannot be removed; it
    # was wrong that it cannot be MEASURED. Two runs, both on the tuned
    # plant:
    #   1. drive-square-20260826-064858, corner 5.762 s (a provisional
    #      time, not published as a table). Held rate over the four
    #      corners 0.246312 rad/s; the truck turned 5.9060 rad in four
    #      corners, which is 1.476500 rad each against the 1.419250 the
    #      held rate accounts for over 5.762 s. THE DIFFERENCE, 0.057250
    #      rad per corner, IS THE SLEW - and it is POSITIVE: the axis
    #      slews back out over the following segment and the truck keeps
    #      turning while it does, which is more yaw than the hold window
    #      contains and not less.
    #   2. So the corner is (pi/2 - 0.057250) / 0.246312 = 6.1448 s, and
    #      the table below carries 6.145. Driven as
    #      drive-square-20260826-065230: 6.3124 rad turned of the 6.2832
    #      asked (100.5 %), CLOSURE 0.0670 m against the 0.6786 m the
    #      untuned plant managed with the untuned table.
    #   THE RESIDUAL IS STILL NOT AN ERROR TO TUNE OUT and 0.067 m is not
    #   a target that was driven at. What is left is the four corners
    #   disagreeing with each other by 11.5 % (they are at four different
    #   headings), which no single corner time can remove and which the
    #   per-corner table reports run by run.
    square:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "6.145", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "6.145", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "6.145", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "3.333", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "6.145", tread_mps: "-0.300", steer_rad: "-1.250000"}
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}

    # AISLE: down the free aisle in front of the spawn and back, dead
    # straight both ways, 20.3 m each leg in about 72 s of sim time.
    #
    # WHICH AISLE, SAID PLAINLY. It is the NORTH RING LEG, y = +10.00 -
    # the 8.00 m cruise corridor the truck already stands in - and NOT
    # the pick aisle at y = 0.00, which this vehicle would have to leave
    # the ring and thread the spine to reach. The ring leg is what "the
    # free aisle in front of the spawn" means on this floor.
    #
    # THE WAYPOINTS. Forward from base_link x = -17.0 to a NOMINAL
    # x = +3.3 (fork tips +5.2), then astern back towards x = -17.0. The
    # east ring leg's centreline is x = +20.00 and the hall's inner face
    # is +24.00, so the turn point stands 17 m clear of anything.
    #   MEASURED ON THIS RIG 2026-08-25, ground truth from spawn: the
    #   round trip ends at x = -15.330, y = 10.000 - 1.670 m SHORT of
    #   where it began, and dead straight. The shortfall is not the
    #   profile drifting off line, it is slip, and it does not cancel
    #   between the two legs the way a symmetric table might suggest it
    #   would. It is left in rather than trimmed out: what the truck
    #   covers is the ground truth's to report, and a table tuned until
    #   it closed would only have absorbed one day's tyre.
    #
    # AND IT COMES BACK ASTERN RATHER THAN TURNING ROUND, for the reason
    # tools/slip_bench.sh gives for its own two segments: a profile that
    # only ever drives one way walks into the racking, a three-point turn
    # in an 8 m corridor is a manoeuvre this bench is not measuring, and
    # reversing over ground the truck has just cleared costs nothing and
    # catches a sign error that one leg would hide. The counterweight end
    # leads on the way back; the return leg is retracing swept floor.
    aisle:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "27.0", tread_mps: "-0.700", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "-0.175", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.175", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.700", steer_rad: "0.000"}
      - {hold_s: "27.0", tread_mps: "0.700", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.525", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.350", steer_rad: "0.000"}
      - {hold_s: "0.5", tread_mps: "0.175", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}

    # CORNER_CREEP: ONE corner, held long enough to have a steady state,
    # and the whole profile exists to answer ONE question the owner asked
    # on 2026-08-25: DOES THE TRICYCLE KINEMATIC MODEL HOLD AT CREEP
    # SPEED? A real truck's does - at 0.3 m/s a polyurethane tyre has
    # almost no lateral force to shed - so if this plant delivers a
    # FRACTION of the yaw its steer angle promises even at a crawl, that
    # is a statement about the wheel-slip system's lateral compliance and
    # not about the speed. F2's EKF and F3's controller both assume the
    # model somewhere, so the size of the gap is worth knowing.
    #
    # WHAT IT IS NOT: A TUNING RUN. Global constraint 7 - whatever the
    # ratio turns out to be is RECORDED. Nothing in wheel_slip: or in
    # square: moves because of it.
    #   AND THAT HELD, WHICH IS WHY F1.5 EXISTS. F1 recorded 0.410 and
    #   changed nothing; the owner read the number and approved a gate to
    #   act on it (2026-08-26). wheel_slip: and square: both moved THEN,
    #   under a plan, with the ladder and the rejected rows published in
    #   EVIDENCE_LATERAL_TUNE.md - which is a different thing from a
    #   measurement run quietly tuning the plant it is measuring. This
    #   profile is still not a tuning run: it is now the ACCEPTANCE run,
    #   and it reads 1.005 where it read 0.410.
    #
    # THE FOUR NUMBERS AND WHERE EACH COMES FROM:
    #
    #   0.3 m/s     m6/ipc/follower.py CORNER_MPS, the speed the fleet
    #               takes a corner at, and the speed square: is driven
    #               at. Not a convenient number: the one the vehicle
    #               spends its cornering life at.
    #   -0.785398   pi/4, the MODERATE of the two steer angles this rig
    #               already has a measurement at (0.401 of geometry
    #               delivered, against 0.634 at 1.25 rad - the table in
    #               square: above). Comparable by construction: the same
    #               angle at the same speed, measured a second time by a
    #               named instrument that survives the run rather than by
    #               the throwaway probe that produced the table.
    #               NEGATIVE IS LEFT while driving forward, and left is
    #               towards the north wall - the same choice square:
    #               makes and for the same reason: 4.00 m either way, and
    #               a wall is a flatter thing to have a metre away than a
    #               rack leg.
    #   3.0 s       the run-in. 0.9 m of straight at creep, so the corner
    #               starts from a vehicle that is already moving and the
    #               steer axis slews into a rolling tyre rather than a
    #               parked one.
    #   14.0 s      the corner. tools/sensor_evidence.py discards the
    #               first evidence.corner.settle_s of the HELD steer
    #               angle - the axis has to slew, and the yaw of that
    #               slew is not a steady state - and averages the yaw
    #               rate over the evidence.corner.window_s after it. 14 s
    #               leaves 10 s of held corner for a 4 s settle and a 6 s
    #               window.
    #                 window_s IS 3 SINCE 2026-08-26 and this segment is
    #                 unchanged by it: the minimum came down for square:'s
    #                 re-tabled corner (see it there), and 14 s still
    #                 leaves 9.6 s of steady state after the settle, all
    #                 of which is averaged. A minimum is not a cap.
    #
    # IT FITS THE FLOOR AT EVERY YAW RATE IT COULD POSSIBLY DELIVER, and
    # that is checked rather than assumed because the delivered rate is
    # what this profile is measuring - so the geometry may not depend on
    # it. The rear axle starts at world (-16.50, 10.00) heading +x (the
    # spawn is base_link, 0.50 m ahead of the axle, at yaw pi). Turning
    # left at radius R the axle reaches y = 10 + R(1 - cos theta), and
    # the truck's own envelope corner stands 1.50 m from the axle at
    # 23.6 deg off the travel direction (fork tips 1.375 m ahead,
    # half-width 0.60 m). Three cases, against the north wall's inner
    # face at y = +14.00:
    #
    #   delivered      R [m]   turn in 14 s   worst envelope y   margin
    #   0.081 rad/s    2.62    65 deg         13.01              0.99 m
    #   (Task 3's measured 0.401 fraction - the expected case)
    #   0.14 rad/s     1.51    112 deg        12.88              1.12 m
    #   0.202 rad/s    1.05    162 deg        12.55              1.45 m
    #   (the full kinematic rate - the case that cannot happen)
    #     IT HAPPENED. 2026-08-26, on the tuned plant: 0.203768 rad/s,
    #     which is the bottom row and slightly past it. MEASURED on
    #     drive-corner_creep-20260826-064158, the rear axle stayed inside
    #     x [-16.5000, -14.8324], y [9.9982, 11.9598], so the envelope
    #     corner cannot have passed y = 13.460 - 0.54 m of margin, taken
    #     as the whole 1.50 m radius at every bearing at once. Less than
    #     the 1.45 m the row predicts, because the row's arithmetic stops
    #     at 162 deg of turn and the vehicle now completes the arc and
    #     comes back round. The check did its job: the profile was
    #     written to fit at every rate it could deliver, and the rate it
    #     turned out to deliver was the one nobody expected.
    #
    # So the corridor holds it whatever the answer is, which is the
    # property a measurement profile has to have.
    corner_creep:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "14.0", tread_mps: "-0.300", steer_rad: "-0.785398"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}

    # MAPPING: THE COMMISSIONING DRIVE. F3 Task 1's profile, and the only
    # one on this track that is not a bench manoeuvre - it exists to put
    # the nav lidar over every piece of drivable floor in
    # warehouse_ver3 once, so that an offline SLAM run has a recording to
    # build a map out of. 227.0 m of straight, nine 90 deg corners,
    # 774.7 s of sim time, and it ends where the route ends rather than
    # where it started.
    #
    # THE ROUTE IS THE FLEET'S OWN ROAD GRAPH AND NOT A SHAPE. It is
    # m6/ipc/route.py's `build_graph()` - read READ-ONLY, the way this
    # track reads the floor - which is the aisle centrelines of
    # warehouse_ver3 and nothing else. Twelve edges, 180.00 m:
    #
    #   RING   x = +-20.00 and y = +-10.00, a closed loop 120.00 m round,
    #          8.00 m clear (the CRUISE road class)
    #   SPINE  x = 0.00 from y = -10.00 to +10.00, 20.00 m, 8.00 m clear
    #   PICK   y = 0.00 from x = -20.00 to +20.00, 40.00 m, and it is the
    #          one corridor that is 5.00 m clear (the CREEP class)
    #
    # THE WALK, AND WHY IT IS 227 m RATHER THAN 180. Four of the graph's
    # junctions have ODD degree - (0, 10), (0, -10), (+20, 0) and
    # (-20, 0) each carry three edges - so no walk traverses every edge
    # exactly once (Euler). Some edges have to be driven twice, and the
    # table below drives the ring's four legs a second time. The route,
    # junction by junction, with the turn each one takes:
    #
    #     leg  from          to            m     road        corner at the far end
    #     L1   (-17, +10)    ( 0, +10)    17.0   ring N      C1 RIGHT  E -> S
    #     L2   (  0, +10)    ( 0, -10)    20.0   SPINE       C2 RIGHT  S -> W
    #     L3   (  0, -10)    (-20, -10)   20.0   ring S      C3 RIGHT  W -> N
    #     L4   (-20, -10)    (-20,  0)    10.0   ring W      C4 RIGHT  N -> E
    #     L5   (-20,   0)    (+20,  0)    40.0   PICK        C5 LEFT   E -> N
    #     L6   (+20,   0)    (+20, +10)   10.0   ring E      C6 LEFT   N -> W
    #     L7   (+20, +10)    (-20, +10)   40.0   ring N      C7 LEFT   W -> S
    #     L8   (-20, +10)    (-20, -10)   20.0   ring W      C8 LEFT   S -> E
    #     L9   (-20, -10)    (+20, -10)   40.0   ring S      C9 LEFT   E -> N
    #     L10  (+20, -10)    (+20,   0)   10.0   ring E      (stops)
    #
    # Every graph edge is covered: the north leg by L1 + L7, the east by
    # L6 + L10, the south by L3 + L9, the west by L4 + L8, the spine by
    # L2 and the pick aisle by L5. L2 drives straight THROUGH the
    # crossing at (0, 0) and L5 drives straight through it the other way,
    # which is why neither costs a corner.
    #
    # THE PICK AISLE IS DRIVEN FIFTH, AND THAT ORDERING IS THE SAFETY
    # ARGUMENT. It is the only 5.00 m corridor on this floor: the rack
    # faces stand at y = +-2.50 and the truck is 1.20 m wide, so the rear
    # axle has +-1.90 m of room, against +-3.40 m in every 8.00 m
    # corridor. This is an OPEN LOOP profile - nothing reads a pose and
    # nothing corrects - so the error budget is spent as the run goes on,
    # and the tightest corridor is therefore driven while four corners
    # and 67 m have been spent rather than nine and 200 m. The route was
    # re-ordered for that reason and for no other.
    #
    # IT ALSO CLOSES LOOPS ON PURPOSE, which no other profile here does.
    # L7 re-drives the north leg the run started on, 180 m later; L8
    # re-drives L4's floor and L9 re-drives L3's. Those revisits are what
    # slam_toolbox's loop closure has to work with, and a mapping drive
    # that never crosses its own track hands the optimiser nothing to
    # close (m5_ver3/slam.yaml, do_loop_closing).
    #
    # ---- THE FOUR PLANT CONSTANTS THE TABLE IS BUILT FROM ----
    #
    # MEASURED ON THIS RIG 2026-08-26, on the F1.5 tuned plant, nominal
    # traction, default arm, ground truth only. The instrument was a
    # throwaway probe of tools/drive_route.py's own two classes
    # (SimClock + Terminals) with `gz topic -e` on
    # topics.odom_ground_truth beside it - the same shape of throwaway
    # probe the square: table above was first sized by, and every figure
    # it produced is reproduced by any run of THIS profile because
    # tools/sensor_evidence.py records the same stream.
    #
    #   1. STRAIGHT GROUND SPEED AT A COMMANDED 0.300 m/s: 0.2990 m/s.
    #      60 s of held command, four disjoint 5-20 s windows after the
    #      first 10 s, all four reading 0.2990. 0.33 % of slip, which is
    #      the same order as the 0.95 % EVIDENCE_FUSION 8.1 measures at
    #      cruise. Lateral drift over the 17.24 m: -0.0138 m, and the
    #      heading moved -0.00007 rad. A straight leg on this plant is
    #      straight; what it is not is the length the command asks for.
    #
    #   2. START-UP DEFICIT 0.704 m and STOP COAST 0.555 m. From rest the
    #      first 5 s of a 0.300 command covers 0.7907 m against the
    #      1.4950 m steady travel would give - a deficit of 0.704 m - and
    #      after the command returns to zero the truck runs on for
    #      0.5548 m before it stops. THE TWO DO NOT CANCEL and neither is
    #      ignored: L1 below is lengthened by the first and L10 is
    #      shortened by the second, each once.
    #        A STANDING ZERO ON THIS MODEL IS THEREFORE NOT A BRAKE, and
    #        tools/drive_route.py's header should be read with that
    #        beside it. It is a standing order to stop DRIVING, which is
    #        what stops the truck running away; it is not 0.5 m of
    #        stopping distance the profile may spend somewhere else.
    #
    #   3. THE pi/4 CORNER, BOTH HANDS, AND THEY ARE THE SAME CORNER.
    #      Two full circles at a held steer of -0.785398 and +0.785398,
    #      0.300 m/s, 31 s each - one revolution and a bit, so the rate
    #      is averaged over every heading rather than one:
    #
    #        hand    steady yaw rate      base_link radius   circle fit
    #        LEFT    +0.203658 rad/s      1.1190 m           rms 0.00041
    #        RIGHT   -0.203887 rad/s      1.1171 m           rms 0.00059
    #
    #      0.11 % apart. THAT SYMMETRY IS WHY THIS ROUTE MAY TURN BOTH
    #      WAYS: square: and corner_creep: only ever turn left, so
    #      nothing on this track had measured a right-hand corner before,
    #      and a route round a ring cannot avoid one hand or the other.
    #      Four of the nine corners below are right and five are left.
    #        THE RADIUS IS base_link's AND NOT THE REAR AXLE'S, and it is
    #        1.119 m rather than the 1.05 m the wheelbase promises
    #        because this vehicle's STEERED WHEEL TRAILS: model.sdf puts
    #        steer_link at x = +0.55 and the two load wheels at x = -0.50,
    #        and the travel direction is model -x, so the wheel that
    #        steers is at the counterweight end and base_link swings 0.13
    #        m the WRONG WAY at the start of every corner before it comes
    #        round. Measured, and it is why the corner's geometry below
    #        is taken from the recording rather than from R.
    #
    #   4. THE CORNER BLOCK, MEASURED WHOLE RATHER THAN DERIVED. The
    #      steer axis has to slew in and slew out, and neither is a
    #      steady state: over the first 5 s of a held steer the truck
    #      takes 0.27706 rad LESS than the steady rate accounts for, and
    #      after the steer returns to zero it takes 0.27781 rad MORE
    #      while the axis slews back out (LEFT hand; RIGHT reads -0.27426
    #      and -0.28037). THE TWO CANCEL to 0.00075 rad, so a corner is
    #      (hold at the steer) + (a straight segment long enough for the
    #      axis to come out), and the pair turns the vehicle by the
    #      steady rate times the hold. The slew-out is complete inside
    #      3.0 s at 0.300 m/s - the following segment reads 0.0008 rad of
    #      further yaw - and every corner below is followed by a straight
    #      segment of at least that.
    #
    #      SO A 90 deg CORNER IS A 7.748 s HOLD. Measured directly rather
    #      than divided: a 7.7086 s hold plus its 3.0 s slew-out turned
    #      the truck 1.55919 rad (LEFT) and 1.56649 rad (RIGHT) against
    #      the 1.5707963 asked, so both hands want 0.021-0.057 s more and
    #      the table carries the mean. The residual spread is 0.42 deg
    #      between the hands and it is NOT tuned out: it is the plant,
    #      and what it costs is 0.42 deg of heading per corner, which
    #      over the longest leg that follows one (40.00 m) is 0.29 m of
    #      lateral - inside every margin below.
    #
    #      AND THE LANE IT CONSUMES IS MEASURED THE SAME WAY. Over the
    #      whole block (hold + slew-out) the truck's displacement in the
    #      frame it entered on is
    #
    #        forward along the ENTRY lane   1.95 m
    #        sideways along the EXIT lane   0.93 m
    #
    #      which is not (R, R) and could not be, for the trailing-steer
    #      reason in 3 above. So a corner at junction J is COMMANDED
    #      1.95 m BEFORE J, and when the block ends the truck is already
    #      0.93 m PAST J on the new lane. That is the whole of the
    #      arithmetic below.
    #
    # ---- THE TABLE, LEG BY LEG ----
    #
    # A straight row between two corners holds for
    #
    #     3.000 s  (the slew-out of the corner it follows)
    #   + (D - 0.93 - 1.95) / 0.2990        D = the leg's length
    #
    # L1 starts from rest, so it carries the 0.704 m start-up deficit and
    # no slew-out: (17.00 - 1.95 + 0.704) / 0.2990 = 52.689 s.
    # L10 ends at rest, so it carries the 0.555 m coast instead of a
    # corner at its far end: 3.000 + (10.00 - 0.93 - 0.555) / 0.2990.
    #
    #     leg   D [m]   straight [m]   hold_s
    #     L1    17.00   15.754*        52.689     * includes the deficit
    #     L2    20.00   17.12          60.257
    #     L3    20.00   17.12          60.257
    #     L4    10.00    7.12          26.813
    #     L5    40.00   37.12         127.147
    #     L6    10.00    7.12          26.813
    #     L7    40.00   37.12         127.147
    #     L8    20.00   17.12          60.257
    #     L9    40.00   37.12         127.147
    #     L10   10.00    8.515         31.478
    #
    # ---- WHERE IT FITS, CHECKED CORRIDOR BY CORRIDOR ----
    #
    # The truck's envelope is 1.20 m wide and its fork tips reach 1.375 m
    # ahead of the rear axle; the circumscribed radius about the axle is
    # 1.50 m at 23.6 deg off the travel direction, which is the bound
    # square: and corner_creep: both use. Against that bound:
    #
    #     corridor          clear    axle budget   nominal margin
    #     ring, all four    8.00 m   +-2.50 m      2.50 m
    #     spine             8.00 m   +-2.50 m      2.50 m
    #     PICK AISLE        5.00 m   +-1.00 m      1.00 m
    #
    # and taking the true outline instead of the circumscribed circle the
    # pick aisle's budget is +-1.90 m, because the 1.375 m of fork
    # overhang is LONGITUDINAL and a straight leg does not point it at a
    # rack. The nine corners all happen where two corridors cross - an
    # 8.00 x 8.00 m box at the four ring corners, and the spine and pick
    # aisle mouths - so the corner sweep itself is never the binding
    # case. WHAT THE OPEN LOOP SPENDS IS CHECKED AFTER THE FACT AND NOT
    # ASSUMED: EVIDENCE_MAP_V3.md carries the clearance of the recorded
    # ground truth against every obstacle rectangle in
    # m6/gazebo/warehouse_ver3.sdf, which is the measurement this
    # paragraph is a prediction of.
    #
    # AND IT IS DRIVEN AT ONE SPEED FROM END TO END, which none of the
    # other profiles is. 0.300 m/s everywhere: no cruise leg, no ramp,
    # no speed change at a corner. Three reasons and they all point the
    # same way. The pick aisle is a CREEP corridor in the floor's own
    # spec, so part of the route is at this speed whatever happens. Every
    # constant in 1-4 above was measured AT this speed, and a profile
    # that changed speed would need the corner block measured again at
    # the other one. And a slower drive is a denser recording - 15 Hz of
    # nav lidar over 774.7 s is about 11,600 scans over 227 m, which is
    # one scan per 20 mm of travel. A commissioning map is not a lap
    # time.
    mapping:
      - {hold_s: "2.0", tread_mps: "0.000", steer_rad: "0.000"}
      # L1  (-17, +10) -> ( 0, +10)   north ring leg, east
      - {hold_s: "52.689", tread_mps: "-0.300", steer_rad: "0.000"}
      # C1  RIGHT at ( 0, +10)   E -> S, onto the spine
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "0.785398"}
      # L2  ( 0, +10) -> ( 0, -10)   the SPINE, through the crossing
      - {hold_s: "60.257", tread_mps: "-0.300", steer_rad: "0.000"}
      # C2  RIGHT at ( 0, -10)   S -> W
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "0.785398"}
      # L3  ( 0, -10) -> (-20, -10)  south ring leg, west
      - {hold_s: "60.257", tread_mps: "-0.300", steer_rad: "0.000"}
      # C3  RIGHT at (-20, -10)  W -> N
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "0.785398"}
      # L4  (-20, -10) -> (-20, 0)   west ring leg, north
      - {hold_s: "26.813", tread_mps: "-0.300", steer_rad: "0.000"}
      # C4  RIGHT at (-20, 0)    N -> E, onto the PICK AISLE
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "0.785398"}
      # L5  (-20, 0) -> (+20, 0)     the PICK AISLE, through the crossing
      - {hold_s: "127.147", tread_mps: "-0.300", steer_rad: "0.000"}
      # C5  LEFT at (+20, 0)     E -> N
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "-0.785398"}
      # L6  (+20, 0) -> (+20, +10)   east ring leg, north
      - {hold_s: "26.813", tread_mps: "-0.300", steer_rad: "0.000"}
      # C6  LEFT at (+20, +10)   N -> W
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "-0.785398"}
      # L7  (+20, +10) -> (-20, +10) north ring leg, west - THE LOOP
      - {hold_s: "127.147", tread_mps: "-0.300", steer_rad: "0.000"}
      # C7  LEFT at (-20, +10)   W -> S
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "-0.785398"}
      # L8  (-20, +10) -> (-20, -10) west ring leg, south
      - {hold_s: "60.257", tread_mps: "-0.300", steer_rad: "0.000"}
      # C8  LEFT at (-20, -10)   S -> E
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "-0.785398"}
      # L9  (-20, -10) -> (+20, -10) south ring leg, east
      - {hold_s: "127.147", tread_mps: "-0.300", steer_rad: "0.000"}
      # C9  LEFT at (+20, -10)   E -> N
      - {hold_s: "7.748", tread_mps: "-0.300", steer_rad: "-0.785398"}
      # L10 (+20, -10) -> (+20, 0)   east ring leg, north, and it stops
      - {hold_s: "31.478", tread_mps: "-0.300", steer_rad: "0.000"}
      - {hold_s: "3.0", tread_mps: "0.000", steer_rad: "0.000"}

# -------------------------------- PATHS --------------------------------
# Relative to the repository root. The pidfile is what stop reads and the
# only file it deletes; the log dir is one directory PER BRINGUP, one
# file per child inside it, by name.
paths:
  # THE ROOT, AND SINCE F4's CLOSING WAVE EVERY BRINGUP GETS ITS OWN
  # SUBDIRECTORY UNDER IT: `<log_dir>/run-<YYYYmmdd-HHMMSS>/<child>.log`.
  #
  # WHY, AND IT IS MEASURED RATHER THAN TIDY. Until this change every
  # bringup TRUNCATED the previous one's logs, because `spawn` redirects
  # to `<log_dir>/<child>.log` and the next start opens the same name.
  # The cost was paid twice in F4 Task 3: two runs aborted with
  # `error_code 205` and by the time anybody read the evidence the
  # planner log that would have named the refusal had been overwritten
  # by the next bringup, so EVIDENCE_NAV_V3.md 17.3 and 17.4 decode that
  # code from the ACTION DEFINITION and the recorded plan streams rather
  # than quoting the line the planner actually printed. On a track whose
  # whole method is "every figure names its instrument", a log that
  # cannot be quoted is an instrument that was thrown away.
  #
  # WHY A DIRECTORY PER BRINGUP AND NOT A COPY INTO THE SESSION. The
  # obvious alternative is for `stop` to copy the logs into whatever
  # tools/drive_goal.py recorded. It loses exactly the cases that matter
  # most: a bringup can produce NO session at all - a refusal, a health
  # gate that failed, `--rf2o`'s constraint-20 bringup below - and those
  # are the runs whose logs nothing else explains. It can also produce
  # SEVERAL, and then the same log is copied into each and the copies
  # drift apart from the run they describe. A bringup is the thing the
  # logs belong to, so a bringup is what they are filed under.
  #
  # AND THE DIRECTORY IS FOUND THE WAY THE TRACTION FILE IS FOUND.
  # `start` writes `log_dir=` into paths.traction_file, and `status` and
  # `stop` read it back - the same runtime-state idiom, for the same
  # reason: three commands must not be able to disagree about which
  # bringup they are talking about. With no state file (a crash, or a
  # `status` after `stop`) they fall back to the root, and `stop` prints
  # the preserved path on its way out.
  log_dir: "m5_ver3/logs"
  # HOW MANY BRINGUPS' LOGS ARE KEPT. `start` prunes the oldest beyond
  # this before it makes its own, because a directory that grows without
  # bound is the reason people delete log directories wholesale and lose
  # the one they wanted.
  #   THIRTY IS THREE SESSIONS OF WORK. F4 Task 3 took 16 driven
  # bringups plus its demonstrations in one afternoon; thirty holds that
  # afternoon and the one before it, which is the window in which
  # somebody reads an evidence file and asks what the log said.
  #   IT PRUNES BY NAME AND THE NAMES SORT CHRONOLOGICALLY, which is why
  # the stamp is `%Y%m%d-%H%M%S` - the same format every session
  # directory on this track already uses.
  log_keep_runs: "30"
  pidfile: "m5_ver3/.m5v3_pids"
  # WHAT TRACTION THE RUNNING PLANT IS ON, written by `start` and deleted
  # by `stop` exactly as the pidfile is. It is NOT a constant and it is
  # not configuration: it is the one piece of RUNTIME state this stack
  # keeps, because after F2 Task 2 the same command can bring up two
  # different plants (see slippery: above) and every figure taken off one
  # of them has to say which.
  #   IT EXISTS SO THAT NO SESSION CAN BE UNLABELLED.
  #   tools/sensor_evidence.py's `record` reads it and writes what it
  #   says into the session's own session.txt, and REFUSES if it is not
  #   there - a slippery run recorded without a label is a row that would
  #   sit in the no-slip tables looking like one of them, which is the
  #   single worst thing this section can produce.
  traction_file: "m5_ver3/.m5v3_traction"
  # THE ONLY ABSOLUTE PATH IN THIS FILE, and it is absolute because it is
  # not this repository's: it is where ROS 2 Jazzy is installed inside
  # WSL. Both scripts source it before they call gz - gz itself comes from
  # gz_tools_vendor under /opt/ros, not only the ROS nodes - and both
  # refuse by name if it is not there. It lives here rather than at the
  # top of each script because it was written twice, and a constant
  # written twice is two opinions about one path.
  ros_setup: "/opt/ros/jazzy/setup.bash"

# -------------------------------- TIMING -------------------------------
# Seconds. Measured on this rig rather than guessed, and every one of them
# is a waiting budget - nothing here changes what the plant does.
timing:
  # Server up and warehouse_ver3.sdf loaded before the create service is
  # called. rtf_spike.sh uses 8 s against the same world on the same rig.
  world_load_s: "8"
  # The truck dropped from z = 0.05 onto its wheels and stopped moving,
  # before its resting pose is read back or anything is measured.
  settle_s: "5"
  # After the last spawn, before the pid file is walked for children that
  # died on their way up. A process that dies in its first fraction of a
  # second has not started, and saying "up" about it sends the operator to
  # the wrong log.
  startup_check_s: "1"
  # Between the TERM sweep and the KILL sweep. Past this, nothing is
  # exiting on its own.
  stop_grace_s: "2"
  # HOW OFTEN THE GUI GATE ASKS whether the scanner topic has appeared.
  # It is a `gz topic -l` per poll against a local daemon, so the cost is
  # nothing and the only thing this number buys is how much of the wait
  # is spent waiting after the answer is already yes.
  gui_gate_poll_s: "0.5"
  # AND HOW LONG IT WAITS AFTER THE ANSWER IS YES. The gate closes a race
  # inside gz-sim's GUI, not a race about the topic: the SensorTopic
  # components VisualizeLidar anchors on are created by the render thread
  # a beat after the sensor advertises, so a client let in on the advert
  # alone can still snapshot the world without them. This is that beat,
  # and it is m6's measured value (gazebo/m6_world.launch.py).
  gui_gate_settle_s: "2"
  # THE CREATE SERVICE'S OWN DEADLINE, in MILLISECONDS - that is gz
  # service's unit, not this file's choice. It has to outlast a cold
  # first spawn, where the model's four sensors and its physics are being
  # built for the first time; m6's rtf_spike.sh gives the same call the
  # same 10 s against the same model on this rig.
  spawn_service_timeout_ms: "10000"
  # HOW LONG spawn() WAITS FOR A CHILD TO WRITE ITS OWN PID before it
  # reports the pid as UNKNOWN. tries x wait_s is the budget: 50 x 0.1 s
  # = 5 s, which is two orders of magnitude more than the measured cost
  # of setsid, a redirect and one append. It is a budget and not a
  # deadline: a child that exceeds it is still started, still recorded
  # and still swept - only its pid line reads UNKNOWN and points at the
  # log. The startup check below is what decides whether it LIVED.
  pid_wait_tries: "50"
  pid_wait_s: "0.1"

# ------------------------------- RTF PROBE ------------------------------
# tools/rtf_probe.sh samples gz.msgs.WorldStatistics on the running
# world's stats topic and reports mean, median and floor over the sample.
#   THE TOPIC IS THE WORLD-SCOPED ONE, and `gz stats` is deliberately not
#   used: that is Gazebo CLASSIC's verb. gz-tools for Harmonic has no
#   stats verb at all - it prints the general help and exits 0 - so a
#   probe built on it would report nothing on a perfectly healthy sim.
#   30 s at the ~10 Hz that topic publishes is ~300 samples; the count
#   sags with the RTF, so the probe prints it as a reading of its own.
rtf_probe:
  sample_s: "30"

# ------------------------------ NOISE PROBE -----------------------------
# tools/noise_probe.sh captures a FIXED NUMBER OF FRAMES from one sensor
# topic, with the vehicle at rest, and reports how much each reading moves
# about its own mean. A count and not a duration: a duration would make
# the sample size depend on the real-time factor, and a noise figure that
# moves with the machine's load is not a noise figure.
noise_probe:
  # 60 scans is 4 s of a 15 Hz lidar. The standard deviation of a
  # standard deviation from n samples is about sigma/sqrt(2(n-1)), so at
  # n = 60 a 20 mm figure is known to about 1.8 mm - one significant
  # figure better than the number being checked, which is all this has to
  # be.
  scan_samples: "60"
  # 40 depth frames, because each one is 640 x 480 float32 and the
  # capture is base64 on a pipe: 40 costs about 65 MB of /tmp and 2.7 s
  # of a 15 Hz camera, and the same sqrt rule puts an 8 mm figure inside
  # 1 mm.
  depth_samples: "40"
  # THE BOUND ON WAITING, AND IT IS NOT THE SAMPLE. `gz topic -e -n N`
  # waits for its N messages FOR EVER: a misspelt topic, or a stack that
  # is not up, hangs the probe in silence rather than refusing - measured
  # by hanging it. The slowest honest capture on this rig is the 3D lidar
  # at 60 frames, 10 Hz, under the depressed real-time factor its own
  # subscription causes: about 7 s. 60 s is an order of magnitude of
  # headroom over that and still a bound.
  capture_timeout_s: "60"
  # THE GRID THE QUANTIZATION TEST MEASURES AGAINST, IN METRES, AND IT IS
  # NOT A PROPERTY OF THE PROBE. It is the <precision> a gz
  # gaussian_quantized noise would round every reading onto, and 1 mm is
  # what these sensors would declare if they could: it is the range
  # precision class of the instruments they model.
  #   THEY CANNOT, AND THE PROBE THEREFORE EXPECTS TO FAIL ITS OWN TEST.
  #   A gpu_lidar configured gaussian_quantized produces no noise at all
  #   on this gz - measured, all 710 beams byte-identical across five
  #   sweeps (EVIDENCE_MODEL_V3.md 9.2) - so the model declares plain
  #   gaussian and STATES the quantization it does not model rather than
  #   omitting it. The residual the probe prints against this grid,
  #   ~0.25 mean and ~0.5 max, is the evidence that the grid is absent
  #   from the wire; EVIDENCE_MODEL_V3.md 5.2 tabulates all four
  #   channels reading exactly that.
  #   ONE VALUE FOR BOTH MODES, because both are ranges in metres: the
  #   scan branch and the depth branch ask the same question of the same
  #   unit, and two keys would be two places for one answer to drift.
  quantization_grid_m: "0.001"

# --------------------------- SENSOR EVIDENCE ---------------------------
# tools/sensor_evidence.py, which is F1 Task 4's instrument and the only
# thing that writes EVIDENCE_SENSORS.md's measured column. It has two
# halves and they are deliberately not the same program:
#
#   record   attaches to the running plant, subscribes what the bridge
#            carries, and writes one headered CSV per stream under
#            evidence.dir. `record --drive PROFILE` starts
#            tools/drive_route.py itself so that ONE command produces ONE
#            complete run - a recording started by hand a second after
#            the drive is a recording with the reference pose missing
#            from it.
#   analyse  reads those CSVs and prints the tables. IT TOUCHES NO ROS
#            AND NO GAZEBO AT ALL: it runs on the owner's Windows python,
#            on a WSL shell with nothing sourced, or on a machine that
#            has never had either, because a figure that can only be
#            recomputed on the rig that produced it is a figure nobody
#            can check.
#
# WHAT IS *NOT* IN THIS BLOCK, AND IT IS THE POINT: THE CONFIGURED NOISE.
# The SDF governs every sensor (see the sensors: block's own header), and
# a python program - unlike a shell - CAN read SDF. So analyse reads the
# stddev, the bias and the update rate it compares against straight out
# of vehicle.model, and this file holds not one of them. The sensors:
# block above repeats the rates because a SHELL cannot do that, and it
# says so; that exception does not extend to a program that can.
evidence:
  # Where a session lands: one directory per run, named for what it is
  # and when it was taken, holding one CSV per stream plus session.txt.
  # Under paths.log_dir, so .gitignore already covers it - the CSVs are
  # evidence and they are BIG (a 60 s scan capture is 900 frames of 811
  # beams), so the evidence FILE quotes their md5 and the CSVs stay out
  # of the repository.
  dir: "m5_ver3/logs/evidence"
  # HOW LONG THE RECORDER WILL WAIT FOR THE FIRST MESSAGE ON EVERY STREAM
  # BEFORE IT REFUSES. This is the bound on waiting and it is not the
  # sample: a misspelt topic, a bridge that did not come up or a sensor
  # nothing subscribes to would otherwise hang the recorder in silence -
  # noise_probe.capture_timeout_s exists for exactly this and was
  # measured by hanging the probe. The slowest stream here publishes at
  # 10 Hz, so anything past a second is already an answer; 30 s is an
  # order of magnitude of headroom over a cold bridge and still a bound.
  wait_first_s: "30"
  # Below this many rows a stream did not deliver a capture, and analyse
  # refuses it by name rather than averaging four numbers into a figure
  # that looks like a measurement.
  min_samples: "5"
  # THE SUBSCRIPTION QUEUE, AND IT IS DEEP ON PURPOSE. The recorder is
  # one python process holding eight subscriptions, two of which arrive
  # at the world's own 500 Hz, and a shallow queue on a channel that fast
  # does not prevent loss - it just makes the loss happen sooner. A deep
  # queue lets a callback that is momentarily late catch up.
  #   IT DOES NOT MAKE THE RATE FIGURES SAFE AND NOTHING PRETENDS IT
  #   DOES: a drop shows up in the recorded stamps as an interval several
  #   times the median, so analyse prints dt_max beside every rate and
  #   the evidence file reads them together.
  qos_depth: "500"
  static:
    # THE VEHICLE IS AT REST FOR THIS ONE and the number is a duration
    # rather than a frame count, which is the opposite of what
    # noise_probe.sh does. The reason is that this capture carries EIGHT
    # streams at five different rates: a count would mean five different
    # durations, and the delivered-rate figures would then each be taken
    # over a different piece of the run. 60 s is 900 nav-lidar frames,
    # 6000 IMU samples and 900 depth frames - an order of magnitude more
    # than the 60 the noise figure needs, and the sqrt(2(n-1)) rule puts
    # a 20 mm spread inside 0.5 mm at that count.
    record_s: "60"
  drive:
    # RECORDED BEFORE THE DRIVE STARTS, with the truck standing where it
    # spawned. This is the reference pose every drift figure is measured
    # from: analyse checks the recorded ground truth against
    # vehicle.spawn and refuses if the truck is not where config says it
    # is, because a transform built on the wrong origin produces drift
    # figures that are wrong by a constant and look entirely plausible.
    pre_roll_s: "4"
    # And after drive_route.py exits, because the plant is still moving
    # when the last segment's standing zero lands.
    post_roll_s: "4"
    # THE BOUND ON THE DRIVE ITSELF. The profile's own sim-time length is
    # known from its table, and drive_route.py steps its schedule off the
    # plant's clock - so a real-time factor of 1/3 would triple the wall
    # time it takes. Past factor x nominal + margin the drive is not slow,
    # it is stuck, and the recorder ends it rather than waiting for ever.
    # The CSVs are written whatever happens: a partial recording of a run
    # that went wrong is evidence, and deleting it would not be.
    timeout_factor: "3"
    timeout_margin_s: "60"
  depth:
    # A CENTRAL PATCH AND NOT THE WHOLE IMAGE, tools/noise_probe.sh's
    # choice and its argument: 640 x 480 x 900 frames is 276 million
    # floats and the statistic does not get better for it. 8 gives a
    # 16 x 16 patch at the image centre, which is where the optical axis
    # lands - on this camera the floor about 2.2 m ahead.
    patch_half: "8"
  safety:
    # THE SAFETY SCANNER IS NOT BRIDGED (Global Constraint 6 freezes
    # those three sensors and F2 owns their consumer), so the recorder
    # takes it GZ-SIDE with `gz topic -e -n`, in a phase of its own after
    # the ROS capture has finished. Separately, because subscribing makes
    # gz render a sensor that nothing else is rendering, and an RTF or a
    # delivered rate measured beside that subscription is a reading about
    # a different stack (EVIDENCE_MODEL_V3.md 6).
    # 60 frames is 6 s of a 10 Hz scanner and matches noise_probe.sh's
    # own scan sample, so the two figures are comparable.
    frames: "60"
    # The bound on waiting for those frames. noise_probe.capture_timeout_s
    # is the same number for the same reason: `gz topic -e -n N` waits
    # for its N messages FOR EVER.
    capture_timeout_s: "60"
  # ---- THE ROSBAG, F3 Task 1's addition, AND IT IS OPT-IN ----
  #
  # WHY A BAG AT ALL WHEN THIS TOOL ALREADY WRITES CSVs. The CSVs are an
  # ANALYSIS format - one row per message, one column per number, read by
  # `analyse` on a machine with no ROS on it - and nothing can replay
  # them into a ROS graph. F3's map is built by slam_toolbox from a
  # RECORDING, offline and sync, which is the only shape of SLAM run that
  # gives the same map twice (docs/reports/m5v3-01 a), and slam_toolbox
  # consumes ROS messages on a wire. rosbag2 is the container that turns
  # one into the other, so `record --bag` starts `ros2 bag record` inside
  # the session directory and stops it with the rest of the run.
  #   IT IS THE SAME SESSION AND THAT IS THE POINT. The bag lands beside
  #   the CSVs, under the same session.txt, carrying the same traction
  #   and arm labels and refused by the same two refusals - so a map
  #   built from a slippery run or from the --fuse arm cannot become an
  #   unlabelled artifact. A second recorder with a second directory
  #   naming scheme would have been a second place for a label to go
  #   missing.
  #   IT IS OFF BY DEFAULT because it is not free: 15 Hz of 811-beam scan
  #   and 500 Hz of clock is about 150 MB over a 775 s mapping drive, and
  #   the eight sessions EVIDENCE_FUSION 10 is built from want none of it.
  bag:
    # WHICH TOPICS, BY THEIR DOTTED KEY IN topics: ABOVE rather than by
    # their address. One spelling of /clock in this file, and a bag that
    # cannot name a topic the stack does not carry.
    #   THESE FOUR AND NO MORE, and each is something the offline SLAM
    #   run reads:
    #     clock       slam_toolbox runs use_sim_time; without the plant's
    #                 own clock on the wire every stamp in the bag is in
    #                 the future and every TF lookup fails.
    #     scan_nav    the measurement. The TiM571-profile nav lidar, and
    #                 the ONLY sensor in the map.
    #     tf          odom -> base_link, the EKF's. This is the odometry
    #                 slam_toolbox corrects; it is F2's estimate and not
    #                 the ground truth, which is the whole point of
    #                 building the map from the real sensor chain.
    #     tf_static   the IMU's mount. Recorded for provenance and NOT
    #                 depended on: it is published transient-local before
    #                 this recorder subscribes, so rosbag2 may or may not
    #                 catch it, and the offline run needs the nav lidar's
    #                 mount rather than the IMU's - which the default arm
    #                 does not publish at all and tools/build_map.sh
    #                 puts on the replay's own wire.
    #   THE GROUND TRUTH IS DELIBERATELY NOT IN IT. /forklift/gz/odom is
    #   a measurement reference (topics: above, F2 global constraint 13)
    #   and a bag that carried it into a SLAM run would be one careless
    #   remap away from being the thing the map was built on. It is in
    #   the session's CSVs, where nothing can replay it.
    topics: "clock, scan_nav, tf, tf_static"
    # The bag's directory INSIDE the session. rosbag2 makes it itself and
    # refuses to write into one that exists, which is a check and not an
    # obstacle: a session directory is created fresh by new_session().
    dir: "bag"
    # rosbag2's storage plugin. mcap is Jazzy's own default and is what
    # `ros2 bag play` reads without being told; it is written here rather
    # than left implicit so the evidence can say what the container was.
    storage: "mcap"
    # HOW LONG THE RECORDER WAITS FOR `ros2 bag record` TO BE UP before
    # it refuses - measured by the bag's own metadata file appearing.
    # Starting the drive first would put the first seconds of the run
    # outside the recording, and the reference pose is in those seconds.
    start_timeout_s: "30"
    # And how long it waits for the bag to CLOSE after the SIGINT. mcap
    # is finalised on shutdown; a bag killed before it finishes writing
    # its summary is a bag `ros2 bag play` refuses.
    stop_timeout_s: "60"
  gz_rate:
    # THE GZ-SIDE DELIVERED RATE, `gz topic -f`, which reports a rolling
    # 10-interval window every ten messages. It is the only instrument
    # that can see the unbridged sensors at all, and it is what
    # EVIDENCE_MODEL_V3.md 2's gz column was taken with.
    #   THE TOPICS ARE NAMED BY THEIR KEY IN topics: above and never by
    #   address, so no channel is spelled twice in this file.
    topics: "scan_nav, imu, cam_depth, cam_info, safety_scan_back, points3d"
    # Per topic. At 10 Hz that is ~20 windows, which is the sample size
    # the gz column of EVIDENCE_MODEL_V3.md 2 was read over.
    sample_s: "20"
    # `gz topic -f` does not stop on its own - measured on this rig,
    # `-d 8` ran until it was killed - so it is run under `timeout` and
    # this is the bound. It is longer than sample_s because the process
    # is ENDED at sample_s and this is only the deadline for that ending.
    timeout_s: "40"
  analyse:
    # HOW FAR AN ESTIMATE MAY BE FROM WHERE THE VEHICLE SWITCHED ON
    # BEFORE IT IS A BROKEN FILTER RATHER THAN A DRIFTING ONE. Every
    # other score on this track is ABSOLUTE and deliberately unbounded -
    # a dead-reckoned pose may drift as far as it likes and
    # EVIDENCE_FUSION.md 5 is about exactly that - so this is not a
    # tolerance and nothing is compared against it. It is the line
    # between an estimate and a number.
    #   THE VALUE IS THE FLOOR's. warehouse_ver3 is 48 m by 32 m, so its
    #   longest diagonal is 57.7 m; an odom-frame estimate a hundred
    #   metres from its own origin describes a place the vehicle could
    #   not be even if every metre of the run had been driven wrong.
    #   MEASURED HEADROOM, over every fused stream this track has
    #   recorded: the largest distance an honest estimate ever reaches
    #   from its own origin is 12.13 m (a `straight` run, which drives
    #   11.6 m and believes it drove 12.1), so the bound is 8.2x the
    #   largest true value - and the failure it catches misses it by
    #   FORTY-SEVEN ORDERS OF MAGNITUDE (1e48 m). Nothing is riding on
    #   the exact number.
    #   WHY IT HAD TO EXIST, MEASURED 2026-08-26: ekf_node diverges at
    #   startup on most bringups of this stack and says nothing at all -
    #   ALIVE, at rate, stream arriving. EVIDENCE_FUSION.md 8.6.
    #   `record` checks it BEFORE the drive is spent and `analyse`
    #   refuses to score a session that failed it.
    fused_sanity_m: "100.0"
    # THE SPAWN POSE CHECK. The drift transform is built on vehicle.spawn,
    # and if the truck is not standing there when the recording opens the
    # transform is wrong by however far it moved. 0.05 m and 0.02 rad are
    # two orders of magnitude tighter than the 0.875 m of rack penetration
    # Task 1 measured a bad spawn slide by, and an order of magnitude
    # looser than the ground truth's own resolution.
    spawn_tolerance_m: "0.05"
    spawn_tolerance_rad: "0.02"
    # HOW FAR THE INTERPOLATION MAY REACH. The estimate arrives at
    # ~500 Hz and the truth at 20 Hz, so the honest pairing is to
    # interpolate the estimate onto the truth's stamps, and this is the
    # bound on that interpolation. 0.5 s is 250 estimate samples: past
    # it, the estimator was not publishing and the answer is a refusal
    # rather than a straight line drawn across the gap.
    max_pair_gap_s: "0.5"
    # HOW CLOSE TO range_min A BEAM'S OWN MEAN HAS TO BE to count as
    # PINNED there rather than as measuring the room. gz clamps a return
    # closer than <range><min> to the minimum instead of dropping it
    # (EVIDENCE_MODEL_V3.md 8), and a clamped beam has no spread, so
    # averaging it into a noise figure drags that figure down - on the
    # back safety scanner, which sees this truck's own counterweight,
    # by up to a third. So they are separated and BOTH counts are
    # reported.
    #   IT IS A FLOAT-EQUALITY EPSILON AND NOT A BAND. A clamped reading
    #   is EXACTLY range_min in every frame, so its mean is exactly
    #   range_min; 1e-6 m is a micrometre, four orders of magnitude below
    #   the 0.02 m noise and far outside anything a real reading could
    #   land on by accident. It is here rather than inline because it
    #   decides which readings enter a published figure, and that is
    #   behavioural whatever its size.
    clamp_tolerance_m: "0.000001"
    # THE FACTOR THE ACCEPTANCE IS STATED IN. A measured temporal spread
    # inside [1/1.25, 1.25] of the SDF's own stddev passes; outside it,
    # the discrepancy is diagnosed rather than smoothed (global
    # constraint 7). 1.25 is chosen against what the statistic can do,
    # not against what the sensors did: the standard deviation of a
    # standard deviation from n frames is about sigma/sqrt(2(n-1)), which
    # at a 40-frame capture is 11 %, so a band of +-25 % is about two of
    # those and will not fire on sampling noise alone.
    noise_factor: "1.25"
  corner:
    # WHICH PROFILE THE CORNER FIGURE IS DEFINED OVER, and it is one
    # rather than "any profile with a steer angle in it". square: holds
    # -1.25 rad too, but for 9.142 s with the axis slewing into every
    # corner - not long enough for the settle and the window below - so
    # measuring it there would either refuse a good square run or average
    # a yaw rate over a manoeuvre that never reached a steady state.
    profile: "corner_creep"
    # THE STEADY-STATE WINDOW corner_creep: is measured over. The steer
    # axis has to SLEW into the corner and the yaw taken during the slew
    # is not a steady state - config.yaml's square: block says the same
    # thing about why that profile does not close. analyse finds the
    # longest stretch where the steer READING is at the profile's own
    # corner angle and the vehicle is moving, discards settle_s of it,
    # and averages ALL of what is left.
    settle_s: "4"
    # window_s IS A MINIMUM AND NOT A CAP, and that was measured rather
    # than chosen. The delivered yaw rate WANDERS inside a held corner -
    # binned at 2 s on the first corner_creep run it ran 0.0722 to
    # 0.0968 rad/s about a mean of 0.0812 - so a short window lands
    # wherever it lands: the first 6 s of that run's steady state gave
    # 0.0785 and the whole 13.6 s gave 0.0812, a 3 % swing that is the
    # sampling and not the vehicle. So the whole steady state is
    # averaged, this is the least of it that will be accepted, and the
    # wander itself is REPORTED (bin_s below) rather than averaged away.
    #
    # CORRECTED BY MEASUREMENT 2026-08-26 (F1.5): 6 -> 3.
    # EVIDENCE_LATERAL_TUNE.md. This is a MINIMUM and it was sized
    # against square:'s 9.142 s corner, which existed because the untuned
    # plant needed 9.142 s to turn 90 degrees. The tuned plant needs about
    # 5.8 s: the run that re-tabled it drove 5.762 s corners and the steer
    # READING stayed inside steer_tol_rad for 5.11-5.17 s of each
    # (measured over the four corners of drive-square-20260826-064858),
    # so 1.0 s of slew-in and 0.3 s of exit leave 3.81-3.87 s. A minimum of 6 - or of 4 - would
    # therefore have REFUSED every corner of the re-tabled square, which
    # is a reduction sized against a plant that no longer exists.
    #   3 s is what the figure needs and not the largest number that
    #   still fits: at the yaw rate the re-tabled corner actually
    #   DELIVERS - 0.246312 rad/s, the mean of its four corners, not the
    #   0.2715 the kinematics promises - 3 s is 0.74 rad of yaw, six
    #   orders of magnitude above the ground truth's own 1e-6 rad, and the tuned plant's wander inside a held corner is
    #   0.0 % (sd 0.000045 rad/s over nine 1 s bins of corner_creep), so
    #   there is nothing left for a longer window to average out. It also
    #   keeps 0.8 s of margin under the shortest corner this profile
    #   produces, which a value of 3.8 would not.
    # corner_creep's own window is untouched by this: its steady state
    # runs 9.6 s after the settle, and a minimum is not a cap.
    window_s: "3"
    # The sub-bin the steadiness is reported at. It decides nothing about
    # the headline figure - that is the whole window - and only how
    # finely the wander underneath it is printed. 1 s at 0.08 rad/s is
    # 0.08 rad of yaw, three orders of magnitude above the ground truth's
    # own resolution, so a bin is a measurement and not a difference of
    # two noisy numbers.
    bin_s: "1.0"
    # ---- THE OTHER REDUCTION: EVERY corner of a repeated-corner run ----
    #
    # THE TWO ARE NOT THE SAME MEASUREMENT AND MUST NOT SHARE CONSTANTS.
    # settle_s above is for ONE long sustained corner, where the held
    # stretch ends when the corner does and there is nothing to trim off
    # the far end (measured on corner_creep: the axis leaves tolerance
    # 1.0 s AFTER the segment ends and the vehicle is still at full creep
    # speed in every sub-bin of the window). square: is the opposite
    # shape - four corners of 9.142 s each, at ONE steer angle and ONE
    # speed, which is what makes it the instrument for the heading
    # dependence in EVIDENCE_SENSORS.md 4.2 - and on a corner that short
    # BOTH ends have to come off:
    #
    #   slew_in_s   the axis slewing INTO the angle. It is inside the
    #               tolerance band for the last part of that slew, so the
    #               criterion opens the run before the corner has
    #               established. 1.0 s at 0.3 m/s is 0.3 m of travel.
    #   exit_s      the axis slewing back OUT of it, and - the reason
    #               this end needs trimming at all - the TREAD command
    #               changes at the same instant, so the last fraction of
    #               a second carries a yaw rate taken at a falling speed
    #               and reads high. 0.3 s is a sixth of a 1.8 s corner
    #               entry and an order of magnitude more than the 0.05 s
    #               the ground truth is sampled at.
    #
    # A CORNER THAT HAS NOTHING LEFT AFTER THE TRIM IS DROPPED AND
    # COUNTED, never shrunk to fit: analyse prints how many corners were
    # FOUND beside how many were measured, so a table with three rows
    # over a four-corner profile says so out loud. window_s below is the
    # minimum for these too (a square corner leaves 7.8 s of the 9.142).
    slew_in_s: "1.0"
    exit_s: "0.3"
    # How close the steer READING has to be to the table's angle to count
    # as held. The steer axis is a position controller with no
    # quantisation modelled on this track, so this is about the
    # controller's own residual and not about a sensor: 0.02 rad is
    # 2.5 % of the 0.785398 rad corner.
    steer_tol_rad: "0.02"
    # And the vehicle has to be MOVING, or a stationary truck with the
    # wheel turned would open a window and report a yaw rate of zero as
    # a fidelity of zero. 0.05 m/s is a sixth of the creep speed.
    speed_min_mps: "0.05"
    # ---- WHEN THE SCRUB SPLIT'S PERCENTAGES STOP MEANING ANYTHING ----
    #
    # evidence_core.scrub_split() charges the yaw deficit to the steered
    # wheel and to the rear axle as FRACTIONS OF THE DEFICIT, and a
    # fraction of a number that has gone to nothing is two small numbers
    # divided. On the untuned plant the deficit was 58.6 % of kinematic
    # and the split read 99.5 / 0.5; after F1.5 the same corner delivers
    # 100.5 % and the deficit is -5.9 %, where the same arithmetic prints
    # 149 % and -49 % - which says nothing about the vehicle and is
    # entirely an artefact of dividing by a residual.
    #   SO THE SHARES ARE SUPPRESSED, NOT SMOOTHED, below this fraction
    #   of the kinematic rate, and the two TERMS in rad/s - which are
    #   measurements and stay meaningful at any size - are printed either
    #   way. 0.10 is chosen against the plant: F1.5's tuned corner sits
    #   at 5.9 % and its two terms are 0.017 and 0.006 rad/s, so a
    #   threshold below that would print percentages built on a deficit
    #   smaller than either of the terms it is splitting.
    split_min_deficit: "0.10"
  sdf_names:
    # THE <sensor name> AS model.sdf SPELLS IT, which is how analyse
    # finds the configured noise to compare against. These are names in
    # the model file and not topics - the topics are in topics: - and
    # they are here because analyse has to be told WHICH sensor a
    # recorded stream came from, which no CSV can say for itself.
    nav_lidar: "nav_lidar"
    safety_scanner: "safety_scanner_back"
    pallet_cam: "pallet_cam"
    imu: "imu"
    lidar_3d: "nav_lidar_3d"

# --------------------------------- MAP ---------------------------------
# F3 TASK 1's BLOCK: what the map is built FROM, what it is scored
# AGAINST, and where the frozen artifact lives. Two programs read it -
# tools/build_map.sh, which runs the offline SLAM, and
# tools/map_register.py, which fits the result to the building and scores
# it - and neither carries a constant of its own.
#
# THE MAP IS FROZEN ONCE IT IS SCORED (F3 global constraint 16). The grid,
# the pose graph and the registration are committed together with their
# md5s in EVIDENCE_MAP_V3.md, and `load_registration` refuses a
# registration whose grid has changed underneath it. A REBUILD IS A NEW
# ARTIFACT UNDER A NEW NAME and never an overwrite: build_map.sh refuses
# an output directory that already exists, which is the mechanism behind
# that sentence rather than a note asking people to be careful.
map:
  # Where frozen maps live, one directory per named artifact.
  dir: "m5_ver3/maps"
  # THIS artifact's name. It names the directory, the .pgm, the .yaml and
  # the two pose-graph files, so a map and its graph cannot be separated
  # by a rename.
  name: "warehouse_v3"
  # THE BUILD MANIFEST, BESIDE THE ARTIFACTS IT DESCRIBES, and F3 Task 3
  # is what made it a file something READS rather than a file somebody
  # opens. tools/build_map.sh writes it: the session, the profile, the
  # mapper's parameters, and the md5 of every one of the four artifacts
  # the build produced.
  #   IT IS THE POSE GRAPH's HALF OF THE FREEZE. registration.yaml
  #   carries the md5 of the .pgm and the .yaml, because those are what
  #   the registration was fitted to and what nav2_map_server serves -
  #   and it says nothing about the .posegraph and .data, because AMCL
  #   never reads them. `--localize slam` DOES read them, and nothing
  #   else on this track states what they should hash to. So this file
  #   is that statement, and `start --localize slam` checks both against
  #   it before it starts anything (F3 constraint 16).
  #   AND IT IS WHAT BINDS THE TWO ARMS' ARTIFACTS TO ONE BUILD. The
  #   slam arm localises in the pose graph and is scored through a
  #   registration fitted to the grid; this manifest is the only place
  #   that says the two came out of the same run.
  build_file: "build.txt"
  slam:
    # The ROS parameter file. It is a SECOND file beside config.yaml for
    # ekf.yaml's reason, spelled out in that block's own header:
    # slam_toolbox reads a `<node>: ros__parameters:` mapping and this
    # file is not one and is not bent into one. m5_ver3/slam.yaml holds
    # what the MAPPER does and nothing else; what is here is what the
    # SHELL has to know to run it, and no number is in both.
    params_file: "m5_ver3/slam.yaml"
    package: "slam_toolbox"
    # SYNC AND NOT ASYNC, and the reason is repeatability rather than
    # accuracy. The async node drops scans when it cannot keep up, so two
    # runs of the same recording process different scans and produce
    # different maps; the sync node queues them and processes every one.
    # docs/reports/m5v3-01 (a) ranks offline-sync first for exactly this
    # and calls it "deterministic - repeatable evidence, no dropped
    # scans". EVIDENCE_MAP_V3.md checks the claim rather than repeating
    # it: the map is built TWICE from the same bag and the two grids'
    # md5s are compared.
    executable: "sync_slam_toolbox_node"
    node_name: "slam_toolbox"
    # HOW FAST THE BAG IS PLAYED BACK. Not 1.0: the mapper is doing work
    # per scan that the plant was not doing per scan when it recorded
    # them, and a replay that outruns the subscriber loses messages at
    # the QoS layer where no queue inside slam_toolbox can catch them.
    # Half speed is about 8 scans a second into a matcher that is offline
    # and has nowhere to be. It is a REPEATABILITY setting and not a
    # quality one, and the md5 comparison above is what says whether it
    # is slow enough.
    play_rate: "0.5"
    # sync_slam_toolbox_node is a LIFECYCLE node: it declares its
    # parameters in on_configure and advertises serialize_map only after
    # on_activate. build_map.sh drives both transitions itself rather
    # than through slam_toolbox's own launch file, for the reason
    # m5v3.sh spawns children rather than launching them - one process,
    # one log, one refusal that names it.
    lifecycle_timeout_s: "60"
    # AFTER THE BAG ENDS, BEFORE ANYTHING IS SAVED. The mapper is still
    # working through its queue when the last message is played, and the
    # occupancy grid is only re-rastered every map_update_interval
    # (slam.yaml). Saving into that gap would freeze a map missing its
    # last stretch of floor - which would look like a map.
    settle_s: "30"
    serialize_timeout_s: "180"
    save_timeout_s: "180"
    # AND THE SAVER'S OWN INTERNAL DEADLINE, WHICH IS A DIFFERENT NUMBER
    # FROM THE ONE ABOVE AND HAD TO BE MEASURED. nav2's map_saver_cli
    # declares `save_map_timeout` at 2.0 s and gives up on the
    # subscription when it expires - "Failed to spin map subscription",
    # exit 1, no file. Measured on this rig 2026-08-26: against
    # slam_toolbox's /map at the end of a 750-node run the default 2.0 s
    # is NOT enough and the build refused at the last step with a
    # complete pose graph already on disk. save_timeout_s above is the
    # shell's bound on the whole process and cannot help: the process
    # exits on its own, quickly and non-zero.
    #   AND IT IS SPELLED WITH A DECIMAL POINT ON PURPOSE. The parameter
    #   is declared as a DOUBLE, and `-p save_map_timeout:=120` is parsed
    #   as an integer: "Wrong parameter type, parameter
    #   {save_map_timeout} is of type {double}, setting it to {integer}
    #   is not allowed", exit 255, no file. Measured the same way the
    #   2.0 s default was - by losing a build to it.
    save_map_timeout_s: "120.0"
    # ---- THE TWO THRESHOLDS THE SAVED GRID CARRIES, AND THEY ARE
    #      map_saver_cli's OWN AND NOT THIS FILE'S ----
    #
    # nav2 1.3.12's map_saver_cli advertises `--occ <threshold_occupied>`
    # and `--free <threshold_free>` in its own --help and then IGNORES
    # BOTH. Measured on this rig 2026-08-26 against a grid published by
    # hand: saved with `--occ 0.77 --free 0.33`, the yaml it writes reads
    # `occupied_thresh: 0.65` and `free_thresh: 0.196` - its defaults,
    # unchanged, with no warning.
    #   SO THESE ARE NOT PASSED, THEY ARE CHECKED. tools/build_map.sh
    #   saves the grid with no threshold flags at all and then READS THE
    #   WRITTEN YAML BACK and refuses if either value is not the one
    #   below. A flag that does nothing is worse than no flag: it makes
    #   the shell look like it decided something.
    #   AND WHICH VALUE LANDED MATTERS, which is why this is not a
    #   footnote. slam_toolbox writes 0, 205 and 254 into the grid for
    #   occupied, unknown and free; 205 is a shade of 50/255 = 0.19608,
    #   which is a whisker ABOVE 0.196 - so a consumer reading this yaml
    #   classifies the unknown cells as UNKNOWN, correctly. Had the free
    #   threshold been the 0.25 this file first asked for, every one of
    #   the 1,484,112 unknown cells in warehouse_v3 would have read as
    #   FREE FLOOR. The right value landed, and it did not land because
    #   this file asked for it.
    occupied_thresh: "0.65"
    free_thresh: "0.196"
  registration:
    # The committed transform, beside the grid it belongs to.
    file: "registration.yaml"
    # THE TRIM, IN CELLS. It has to sit ABOVE the wall's own scatter and
    # BELOW the standoff of the nearest surface that is not the wall. On
    # this floor the nearest non-wall surface to any FITTED wall is a
    # long way off - the rack block ends 8.00 m from the north wall and
    # the ring corridors are 8.00 m wide - so the upper bound is
    # generous and the lower one is what binds: 3 cells is 0.15 m against
    # a scan whose statistical error is 0.02 m and whose per-run bias
    # draw is another 0.02 (model.sdf, nav_lidar). tests/test_map_core.py
    # asserts the answer does not move across 2-6 cells; the SEED is what
    # is load-bearing, not this.
    trim_cells: "3"
    # Below this many surviving candidates a wall is a REMNANT and is
    # refused rather than fitted. Each fitted wall here is 32-48 m long
    # at 0.05 m, so a healthy one carries 600-960 candidates; 100 is an
    # order of magnitude under that and still an order over the number
    # that would fit a straight line to anything.
    min_points: "100"
    # The rotation search, in degrees either side of zero, and how many
    # steps. No initial guess is trusted; a minimum that lands on the
    # scan's own EDGE is refused rather than reported.
    span_deg: "8"
    steps: "401"
    # ---- WHICH WALLS ANCHOR THE FIT, AND WHICH ONE CANNOT ----
    #
    # `nx`/`ny` is the OUTWARD normal - the direction the wall faces AWAY
    # from the hall - and tools/map_core.py takes the inner face as
    # min(n.p) over the model's own box, so the offset is read out of the
    # world rather than typed in here. warehouse_ver3's floor is centred
    # on y = -2.00 and not on the origin, which is why the face is
    # computed from the box and not from abs(centre) - half.
    #
    # THREE WALLS AND NOT FOUR. The south wall of this hall is NOT
    # OBSERVABLE from the drivable floor, and that is a property of the
    # building rather than of the drive:
    #   - the dock annex (AnnexW/A/B/C/E) stands from y = -18.00 to
    #     -14.00 and is 4.00 m tall, so over 28.00 m of the wall's 48.60
    #     m length the nav lidar sees the ANNEX FRONT at y = -14.00 and
    #     nothing behind it;
    #   - in the four bay openings the bay backs (BayS9-12Back) stand at
    #     y = -17.90, one tenth of a metre in front of the wall, over the
    #     other 20.00 m.
    # So the outermost occupied cell in -y is a different true surface
    # depending on where you look, and a single line fitted to all of
    # them would be a line through neither. Three walls spanning two
    # directions determine a rigid SE(2) completely (map_core's
    # solve_translation refuses a set that does not), so nothing is lost
    # but the north-south redundancy - and what replaces that redundancy
    # is better than it was: the annex front becomes a HELD-OUT surface
    # the fit never sees, which is the closest thing to an independent
    # check this method has.
    walls:
      - {model: "WallNorth", nx: "0", ny: "1"}
      - {model: "WallEast", nx: "1", ny: "0"}
      - {model: "WallWest", nx: "-1", ny: "0"}
    # ---- WHAT THE FIT IS NOT ALLOWED TO SEE ----
    #
    # The annex front, extracted from the columns the derived transform
    # says stand in front of an annex, and measured against the north
    # wall. IT IS NOT IN walls: ABOVE, so no part of the transform was
    # solved to make this number come out - which is what makes it worth
    # quoting. The window is the annex models' OWN x extents, taken from
    # the world SDF and pushed through the transform; it is a selection
    # along the wall and never across it (map_core.extract_extremes'
    # header carries the measurement that says why the difference
    # matters).
    held_out:
      name: "annex_front"
      nx: "0"
      ny: "-1"
      models: "AnnexW, AnnexA, AnnexB, AnnexC, AnnexE"
      # Which fitted wall it is measured against, and what the world says
      # that distance is. 14.000 + 14.000 by construction of the floor.
      against: "WallNorth"
  score:
    # ---- THE ABSOLUTE SPANS, AND THEY NEED NO TRANSFORM ----
    #
    # A span is a distance between two surfaces INSIDE the map, so the
    # registration cannot flatter it: a grid whose metres are one per
    # cent long reports a 48.00 m hall as 48.48 m however it is
    # registered. THIS IS THE SCORE. The m5_ver1 lineage's whole lesson
    # (WAREHOUSE_SLAM_EVIDENCE.md 12.8) is that a figure taken by
    # anchoring an estimate onto truth is zero at the anchor by
    # construction; nothing here is anchored to anything.
    #   `true_m` is what the WORLD says, and it is written here so the
    #   check can be read without an SDF open. tools/map_register.py
    #   RE-DERIVES both numbers from m6/gazebo/warehouse_ver3.sdf and
    #   refuses if they disagree with these, so this is a copy that says
    #   when it has gone stale rather than a second opinion.
    spans:
      - {name: "hall width, east to west", a: "WallEast", b: "WallWest",
         true_m: "48.000"}
      - {name: "north wall to annex front", a: "WallNorth",
         b: "annex_front", true_m: "28.000"}
    # ---- DOES THE MAP COVER THE DRIVABLE FLOOR ----
    #
    # The four faces of the hall, as models and the direction each one
    # faces AWAY from the inside. tools/map_core.py turns each into a
    # half-plane (n.p <= d) and the four into a rectangle, so the
    # building's inner extent is READ OUT OF THE WORLD and not typed
    # here. WallSouth appears in this list and NOT in
    # registration.walls: above - it is not observable from the drivable
    # floor and cannot anchor a fit, but where it IS is still a fact
    # about the building.
    #   WHAT IT IS FOR. Every cell of the saved grid is classified once -
    #   occupied, free or unknown - and the ones that are not unknown are
    #   pushed back through the registration and asked whether they fall
    #   inside this rectangle. Two numbers come out and they answer
    #   different halves of one question: how much of the open floor the
    #   map marks FREE, which is coverage, and how much of what the map
    #   claims falls OUTSIDE the building at all, which is the shape a
    #   diverged run takes and should be zero.
    hall:
      - {model: "WallWest", nx: "-1", ny: "0"}
      - {model: "WallEast", nx: "1", ny: "0"}
      - {model: "WallSouth", nx: "0", ny: "-1"}
      - {model: "WallNorth", nx: "0", ny: "1"}
  # ---- DOES THE DRIVE FIT THE FLOOR ----
  #
  # The vehicle's outline, for the clearance the mapping drive is
  # measured against. It is a BOUND and not the model's silhouette:
  # tools/map_core.py sweeps this rectangle along the recorded GROUND
  # TRUTH and reports the worst gap to any obstacle in the world, and a
  # rectangle that is too small would report a clearance the truck did
  # not have.
  #   fore   1.875   the fork tips, in base_link. The rear axle stands at
  #                  x = -0.50 (vehicle.rear_axle_offset_m) and the tips
  #                  reach 1.375 m ahead of it. TOWARDS MODEL -x, which
  #                  is the travel direction.
  #   aft    0.90    the counterweight's far face is at x = +0.86
  #                  (model.sdf, counterweight_collision at 0.74 with a
  #                  0.24 box); rounded out, and it is behind the back
  #                  safety scanner at +0.72.
  #   half   0.60    the widest thing modelled is +-0.46 (the two outer
  #                  safety scanner mounts) and the overhead guard roof
  #                  is 0.88 wide. 0.60 is the bound square: and
  #                  corner_creep: already argue their own floor checks
  #                  with, kept the same so the three read together.
  clearance:
    fore_m: "1.875"
    aft_m: "0.90"
    half_width_m: "0.60"

# ----------------------------- LOCALISATION -----------------------------
# F3 Task 2's ARM, AND IT IS THE FIRST THING ON THIS TRACK THAT KNOWS
# WHERE THE VEHICLE IS RATHER THAN HOW FAR IT HAS COME.
#
# `m5v3.sh start --localize` puts three more children up - the nav
# lidar's static transform, nav2's map_server serving maps/warehouse_v3,
# and nav2_amcl localising in it - and AMCL becomes the sole publisher of
# `map` -> `odom`. F2's EKF keeps `odom` -> `base_link` and nothing here
# may become that edge's owner (F3 global constraint 15: this phase adds
# exactly ONE transform).
#
# WHAT IS HERE AND WHAT IS IN amcl.yaml, AND IT IS ekf.yaml's SPLIT A
# FOURTH TIME. nav2_amcl and nav2_map_server read ROS *parameter* files -
# a top-level node name, a `ros__parameters:` mapping - and this file is
# not one and is not bent into one. So m5_ver3/amcl.yaml holds what the
# LOCALISER DOES: its motion model, its sensor model, its particle
# counts, and the argument for every one of them. What is HERE is what
# the SHELL has to know: which package, which executable, which node
# name, which artifact, which budget. **No number is in both.**
#   AND THE ADDRESSES ARE OVERRIDES, NOT COPIES. m5v3.sh passes the scan
#   topic and the three frame names on the command line as `-p`
#   overrides, exactly as it does for ekf_node and as build_map.sh does
#   for slam_toolbox, so amcl.yaml cannot hold a second spelling of a
#   name config.yaml already owns. An override WINS over a params file,
#   which is the safe direction: a copy that reappears in amcl.yaml is
#   inert rather than authoritative.
localization:
  # ---- WHICH LOCALISER `--localize` MEANS WITH NO VALUE ----
  #
  # F3 TASK 3 GAVE THE FLAG AN ARGUMENT, AND THIS IS THE VALUE IT TAKES
  # WITHOUT ONE. `--localize` and `--localize amcl` are the same command;
  # `--localize slam` is the other arm. It is spelled here rather than
  # inline in m5v3.sh for the reason nothing behavioural on this track is
  # spelled inline: which localiser SHIPS is a decision
  # EVIDENCE_LOCALIZATION_V3.md 13 argues from a measurement, and a
  # decision that has been re-argued moves ONE line in ONE file.
  #   IT MUST NAME A BLOCK BELOW. m5v3.sh refuses a value that is not one
  #   of the arms in this file, by name, listing the ones that are.
  default_arm: "amcl"
  # ---- THE TWO ARMS, AND THEY ARE NEVER ALIVE TOGETHER ----
  #
  # Both publish `map` -> `odom` and tf2 has no notion of two authorities
  # for one edge (F3 global constraint 15), so the exclusion is
  # STRUCTURAL - a `case` with two branches in m5v3.sh, not two `if`s
  # that could both be true - exactly as `--fuse` is an else-branch of
  # the `ekf` child and not a flag beside it.
  #   EACH ARM CARRIES ITS OWN LABEL, ITS OWN PARAMETER FILE AND ITS OWN
  #   NODE. The label is what every downstream instrument reads: `start`
  #   writes it into paths.traction_file, `record` copies it into every
  #   session, `status` prints it, and `analyse` REFUSES a set that mixes
  #   two of them. The two arms produce sessions that are identical in
  #   every respect a table can see - same floor, same profiles, same CSV
  #   columns, same `map` -> `odom` edge - so nothing but the label can
  #   tell them apart afterwards. It is the traction and estimator
  #   chain's argument applied to a third axis, twice.
  #   AND THE LABEL CARRIES AN md5 OF THE ARTIFACT THAT ARM CONSUMED.
  #   AMCL localises in the GRID and slam_toolbox localises in the POSE
  #   GRAPH; they are two files, out of one build, and each arm's label
  #   binds to the one it actually read (F3 constraint 16).
  #   `loc=amcl@735cdbc6` and `loc=slam@4bb88852` say which, in eight
  #   characters, in every session file. tools/evidence_core.py's
  #   loc_md5_artifact() is the one place that mapping lives.
  amcl:
    label: "amcl"
    # The localiser's ROS parameter file. BOTH nav2 nodes are addressed
    # in it, by the node names below, and m5v3.sh greps for both before
    # it starts anything - check_ekf_params()'s idiom, which exists
    # because rclcpp applies NOTHING from a block addressed to somebody
    # else and says nothing at all about it.
    params_file: "m5_ver3/amcl.yaml"
    package: "nav2_amcl"
    executable: "amcl"
    node_name: "amcl"
  slam:
    label: "slam"
    # A FILE OF ITS OWN, AND NOT A SECOND BLOCK IN slam.yaml. It began as
    # one - amcl.yaml's shape, two nodes addressed in one file - and it
    # was moved out because slam.yaml is an INPUT THE FROZEN MAP's
    # MANIFEST HASHES: tools/build_map.sh writes `slam_params_md5` into
    # maps/<name>/build.txt, that manifest is COMMITTED and read-only (F3
    # constraint 16), and tools/map_register.py's load_build_manifest()
    # feeds it to the bringup gate and to `analyse`. Editing a file a
    # frozen manifest names moves that file's hash off the record, and a
    # manifest with known-false lines in it is one nothing downstream can
    # lean on. So the optional arm gets its own file and the default
    # path's file is left alone - which is ekf.yaml / ekf_rf2o.yaml's
    # split, one layer down, for the same reason.
    #   THE VALUES ARE NOT SHARED WITH THE MAPPER'S AND COULD NOT BE.
    #   rcl_yaml_param_parser implements no YAML anchors or merge keys at
    #   all, so `<<: *mapper` is not available at any price; and every
    #   value had to be argued again for a node that TRACKS in a frozen
    #   graph rather than one that BUILDS one, which is a different
    #   argument even where it lands on the same number. slam_loc.yaml's
    #   own header says which ones came out different.
    params_file: "m5_ver3/slam_loc.yaml"
    # ---- WHAT THE FILE ABOVE MUST SAY, AND IT IS CHECKED RATHER THAN
    #      PASSED ----
    #
    # `mode` is the single line that makes that file a LOCALISER's
    # rather than a MAPPER's: it is what makes
    # loadPoseGraphByParams() deserialise map_file_name instead of
    # starting an empty graph, and what makes the serialize service
    # refuse. slam_toolbox's package default is `mapping`, so a file
    # that lost this one line would leave the node building a NEW map
    # of whatever it could see and publishing map -> odom out of it -
    # alive, at rate, looking exactly like a localiser, and every
    # absolute figure a pose in a map that was invented as the truck
    # drove.
    #   IT IS NOT PASSED AS AN OVERRIDE, WHICH WOULD BE THE OTHER WAY
    #   TO GUARANTEE IT. An override would make the parameter file
    #   silently optional on the one line it cannot be optional on,
    #   and slam_loc.yaml would then describe a node this stack does
    #   not run. So the file OWNS the value and m5v3.sh READS IT BACK
    #   and refuses - which is exactly map.slam.occupied_thresh /
    #   free_thresh's shape ("these are not passed, they are
    #   CHECKED"), one arm over.
    required_mode: "localization"
    package: "slam_toolbox"
    # LOCALIZATION AND NOT map_and_localization. slam_toolbox 2.8.5 ships
    # five node executables; `localization_slam_toolbox_node` is the one
    # that deserialises a graph and REFUSES to serialise one back
    # ("LocalizationSlamToolbox: Cannot call serialize map in
    # localization mode!", measured in the shipped binary), which is F3
    # constraint 16 enforced by the vendor rather than by this track.
    # `map_and_localization_slam_toolbox_node` is the experimental node
    # that can switch back into mapping at runtime, and a localiser that
    # can start editing the frozen artifact is not one this phase wants.
    executable: "localization_slam_toolbox_node"
    # NOT `slam_toolbox`, WHICH IS THE MAPPER'S NODE NAME AND THE NAME OF
    # THE OTHER BLOCK IN THE PARAMETER FILE. rclcpp matches a params-file
    # block against the node's own name, so two nodes that share a file
    # must not share a name - and `slam_loc` is what the `slam_loc:`
    # block above is addressed to. It is also what `status` reports and
    # what m5v3.sh's log is named for.
    node_name: "slam_loc"
  # THE GRID SERVER, AND IT IS THE AMCL ARM'S ALONE. nav2_amcl subscribes
  # a map and does not read one; slam_toolbox's localisation node
  # deserialises the pose graph itself and PUBLISHES a grid rastered from
  # it, so on that arm a map_server would be a second publisher of
  # topics.map serving a different rendering of the same building.
  # `status` counts nine children on the amcl arm and eight on the slam
  # one for exactly this reason.
  map_server:
    package: "nav2_map_server"
    executable: "map_server"
    node_name: "map_server"
  # BOTH ARE LIFECYCLE NODES AND BOTH MUST BE TRANSITIONED, and this is
  # the silent failure this budget exists to bound. Started and left
  # UNCONFIGURED, amcl subscribes to no scan, advertises no /amcl_pose
  # and publishes no transform, while logging nothing that looks wrong -
  # `status` reads ALIVE and every other check on the stack is green.
  # tools/build_map.sh drives slam_toolbox's two transitions the same way
  # and for the same reason: one process, one log, one refusal that names
  # it. There is no nav2 lifecycle_manager here - see amcl.yaml's note on
  # the bond.
  #   THE ORDER IS map_server FIRST AND IT IS NOT TIDINESS. amcl's
  #   on_activate waits for a map on the latched `map` topic and an
  #   INACTIVE map_server never publishes one, so configuring amcl first
  #   leaves it blocked in a transition with no error at all
  #   (agv/forklift/launch/localization.launch.py records the same
  #   ordering, measured on the m5_ver1 rig).
  #   AND THE SLAM ARM IS THE SAME KIND OF NODE WITH THE SAME BUDGET.
  #   slam_toolbox's localisation node is a lifecycle node too - started
  #   and left UNCONFIGURED it deserialises nothing, subscribes no scan
  #   and publishes no transform - and its configure transition is the
  #   slow one on that arm, because it is where a 48.7 MB pose graph is
  #   read off disk. One budget covers both: it is generous enough for a
  #   1712 x 1196 grid on one arm and for that graph on the other, and
  #   the alternative to a bound is a bringup that hangs in silence.
  lifecycle_timeout_s: "60"
  # ---- THE INITIAL POSE ----
  #
  # THE BRINGUP TELLS THE LOCALISER WHERE IT IS, ONCE, AND THAT IS AN
  # HONEST LABEL RATHER THAN A CAPABILITY. What is published on
  # topics.initialpose is vehicle.spawn carried into the map frame
  # through the COMMITTED registration - the same transform every score
  # in EVIDENCE_LOCALIZATION_V3.md passes through - because a map pose is
  # the only thing amcl will accept and this simulation is the only place
  # a world pose exists at all.
  #   IT IS THE MEASUREMENT HARNESS AND NOT THE VEHICLE. On a real
  #   forklift there is no world frame and no world -> map transform;
  #   what there is is an operator typing a pose into a screen, and that
  #   is exactly what this stands in for.
  #   agv/forklift/launch/localization.launch.py makes the same split and
  #   keeps the conversion out of the vehicle's own launch file.
  #   A KIDNAPPED-ROBOT RECOVERY IS NOT CLAIMED. amcl.yaml runs with
  #   recovery_alpha_slow/fast at zero and set_initial_pose false, so
  #   this stack cannot relocalise from nothing and does not pretend to.
  #   EVIDENCE_LOCALIZATION_V3.md records it as a known limitation.
  #
  # ---- AND THE SLAM ARM IS SEEDED WITH THE SAME POSE THROUGH A
  #      DIFFERENT MECHANISM, WHICH IS A DIFFERENCE AND NOT A DETAIL ----
  #
  # slam_toolbox's localisation node takes its start pose as a PARAMETER
  # - `map_start_pose: [x, y, theta]`, read in loadPoseGraphByParams() on
  # the CONFIGURE transition, before there is a graph to be lost in. With
  # neither it nor `map_start_at_dock` the node logs "Map starting pose
  # not specified" and starts at the pose graph's own origin. So m5v3.sh
  # passes the SAME three numbers - vehicle.spawn through the SAME
  # committed registration - as a `-p` override on that node's command
  # line, and nothing is published on topics.initialpose at all.
  #   THE COVARIANCE BELOW THEREFORE DOES NOT REACH THAT ARM. A
  #   parameter is three doubles and carries no uncertainty; the operator
  #   gesture it stands in for is the same one, but what the node is told
  #   is only WHERE and never HOW SURE.
  #   AND THE GATE MUST NOT SEND ONE EITHER, which is the part that
  #   matters. That node DOES subscribe topics.initialpose - it is how a
  #   running localiser is re-placed - so a gate that seeded it would
  #   move the localiser to the pose the gate already believes, and its
  #   own pose-against-seed check would then be a check on the gate. On
  #   the slam arm the gate SUBSCRIBES AND READS, and what it is reading
  #   is whether `map_start_pose` arrived. tools/localization_health.py
  #   prints which of the two it did.
  initial_pose:
    # THE PRIOR'S OWN UNCERTAINTY, AND IT IS THE OPERATOR'S AND NOT THE
    # SIMULATOR'S. The harness knows the spawn pose exactly; a prior that
    # SAID so - a covariance of 1e-9 - would be a claim no field bringup
    # can make, and it would start the filter so peaked that its first
    # scan could not move it. These are nav2's own figures for an RViz
    # "2D Pose Estimate", which is the gesture being stood in for: half a
    # metre of standoff each way and fifteen degrees of heading.
    #   THEY ARE VARIANCES AND NOT SIGMAS. The message carries a 6x6
    #   covariance; 0.25 is (0.50 m)^2 and 0.06854 is (pi/12 rad)^2.
    cov_x_m2: "0.25"
    cov_y_m2: "0.25"
    cov_yaw_rad2: "0.06854"
  # ---- THE BRINGUP GATE ----
  #
  # ekf.startup_check's ARGUMENT, APPLIED TO THE LAYER ABOVE IT. That
  # gate exists because ekf_node can diverge in its first cycles and stay
  # ALIVE, at rate, saying nothing. This one exists because a lifecycle
  # node can be ALIVE and never have been configured at all, and because
  # a localiser whose seed was lost still publishes a pose - from
  # wherever it last saved one. Both failures are silent and both look
  # exactly like a healthy stack from every other angle.
  startup_check:
    # HOW LONG THE GATE WAITS FOR AMCL'S FIRST ANSWER. It is generous
    # because what has to happen inside it is a 1712 x 1196 grid being
    # read, two lifecycle transitions, a scan arriving and a filter
    # update - and because the alternative to a bound is
    # tools/noise_probe.sh's lesson: a `--once` read waits FOR EVER, so a
    # localiser that never published would hang the bringup in silence
    # instead of refusing it.
    timeout_s: "30"
    # THE CEILING THE FIRST POSE'S COVARIANCE HAS TO BE UNDER, and it is
    # derived from the seed above rather than from nav2. The prior this
    # bringup publishes has 0.25 m2 as its largest entry, so a filter
    # that received it reports about that and less; a filter that did NOT
    # receive it and fell back on a GLOBAL prior would report the
    # variance of a uniform distribution over a 48 m hall, which is
    # 48^2/12 = 192 m2. 1.0 sits four times above the seed and two
    # hundred times below the failure, which is the gap a ceiling wants
    # to sit in.
    covariance_max: "1.0"
    # AND HOW FAR THE FIRST POSE MAY BE FROM THE POSE IT WAS SEEDED WITH.
    # This is the check that catches a LOST seed, which the covariance
    # cannot: amcl's own untouched prior carries the same 0.25 m2, so a
    # filter that never heard the bringup would pass a covariance ceiling
    # while sitting at the map origin. 0.50 m is the seed's own one
    # sigma - the filter may move the pose by as much as the prior said
    # it was unsure by, and no further, with the truck standing where it
    # was spawned and nothing having commanded it.
    pose_tolerance_m: "0.50"
    # HOW LONG THE GATE WAITS BEFORE IT SENDS THE SEED A SECOND TIME.
    # The gate does not send until BOTH ends are discovered - amcl
    # subscribed to topics.initialpose and advertising topics.amcl_pose -
    # so the ordinary case needs one seed and gets one answer, and the
    # printed line says how many went out. This exists for the case that
    # discovery reports a match a beat before the transport can carry
    # one, which is a race no count can close from the outside.
    #   RE-SEEDING IS HARMLESS AND IS NOT A RETRY LOOP. Each seed is the
    #   SAME pose, so a filter that took the first is re-initialised
    #   where it already was; three of them inside the 30 s budget is
    #   the most this can ever send, and the line it prints says so
    #   rather than hiding it.
    reseed_s: "10"
  # ---- WHAT THE EVIDENCE READS ----
  analyse:
    # THE SEARCH RADIUS `map_register.py support` USES, and it is the
    # bound that separates the SENSOR's error from the MAP's silence. A
    # return within it of a mapped surface is a noisy hit and belongs in
    # sigma_hit; one beyond it is a surface the grid does not contain and
    # belongs in z_rand. 0.30 m is ten times the measured hit rms
    # (0.0292 m) and two and a half times the registration's own MAX
    # residual (0.1179 m), and the reading barely moves when it is raised
    # to 1.00 m - 7.31 % unexplained against 7.37 % - which is what says
    # the two populations are genuinely separate and not a threshold
    # effect.
    support_radius_m: "0.30"
    # ONE SCAN IN N, for the same reading. The whole mapping drive is
    # 11901 scans of 811 beams; one in 200 is 60 scans and 48660 beams,
    # which is three orders of magnitude more than any figure here needs
    # and under three seconds of arithmetic.
    support_every: "200"
    # HOW FAR APART TWO `map` -> `odom` BROADCASTS MAY BE before the gap
    # is a refusal rather than an interpolation. amcl re-sends that edge
    # on every scan, so the nominal interval is 1/15 s = 0.0667 s and
    # this is fifteen of them. A localiser that went quiet for longer
    # than a second did not slow down, and a straight line drawn through
    # that second would be a jitter figure about the instrument rather
    # than about the stack.
    map_gap_s: "1.0"

# ================================ NAVCMD ================================
# THE TRICYCLE COMMAND PATH, F4 Task 1. This block is what
# nodes/cmd_vel_tricycle.py obeys; the CONVERSION itself is geometry and
# lives in nodes/cmd_vel_tricycle_core.py with its derivation, tested
# without a simulator. What is here is the four limits the geometry stops
# at and the three timings the wiring needs.
#
# THE COMMAND PATH IS ONE LINE AND THIS IS ITS LAST JOINT (F4 constraint
# 18):
#
#     Nav2's controller (F4 Task 2)
#       -> topics.cmd_vel
#         -> nav2_velocity_smoother          (smoother: below)
#           -> topics.cmd_vel_smoothed
#             -> nodes/cmd_vel_tricycle.py   (this block)
#               -> topics.steer_cmd + topics.traction_cmd
#                  = model.sdf's own motor terminals
#
# There is no bypass and no branch. GROUND TRUTH IS NOT IN IT: nothing on
# this path subscribes topics.odom_ground_truth. The one thing that COULD
# have closed a loop here - the smoother's feedback - is handed the
# ESTIMATE and never the reference (F2 global constraint 13), and since
# smoother.yaml's A/B it ships OPEN_LOOP and does not read even that. The
# whole path is open loop; every correction it will ever make is F4 Task
# 2's controller, one layer up.
#
# NOTHING HERE IS A SAFETY PARAMETER. The converter inhibits nothing,
# latches nothing and stops nothing; a refused command is a command not
# issued and not a machine state. Protective stop, e-stop and safe torque
# off are onboard and hardwired in the plant this models, and no message
# on any of these topics can trigger or release one.
navcmd:
  # THE COMMAND RATE, AND IT IS THE SMOOTHER'S TOO. One command in, one
  # command out: smoother.yaml's smoothing_frequency carries the same
  # number and tests/test_cmd_vel_tricycle_core.py fails if the two ever
  # disagree. A converter slower than its smoother drops commands; a
  # converter faster than its smoother republishes them, and a
  # republished command on a terminal that holds its last order for ever
  # buys nothing at all.
  #   20 Hz IS ALSO THE CONTROLLER RATE F4 Task 2 WILL RUN AT, so the
  #   whole chain ticks once per controller cycle.
  rate_hz: "20.0"

  # ---- THE SPEED CEILING, AND IT IS A MEASUREMENT AND NOT A CHOICE ----
  #
  # 0.700 m/s of TREAD is the cruise every straight-line figure on this
  # track was taken at: drive_route.profiles.straight and .aisle both
  # hold it, tools/slip_bench.sh drives it, and EVIDENCE_SENSORS.md and
  # EVIDENCE_FUSION.md are measured on it. Above it this plant is
  # unmeasured.
  #   IT IS NOT THE MECHANICAL CEILING AND IT IS NOWHERE NEAR IT.
  #   model.sdf's drive_wheel_joint carries <velocity>40.0</velocity>,
  #   which is 4.8 m/s of tread - 6.9 times this. So what this number
  #   bounds is MEASUREMENT COVERAGE, not the motor, and it is the
  #   honest ceiling for a phase whose whole subject is what the plant
  #   actually does.
  #   IT IS APPLIED TO THE WHEEL'S OWN TREAD SPEED, which is what the
  #   terminal carries, and therefore bounds the BODY speed too:
  #   v = v_w cos(delta) <= v_w. At cruise ANY curvature asks the wheel
  #   for more than the body is doing (v_w = v / cos delta), so a corner
  #   at cruise meets this ceiling and is slowed - CURVATURE PRESERVING,
  #   because scaling v_w with delta held scales v and w together and
  #   the arc is unchanged. smoother.yaml's max_velocity carries the
  #   same number for the same reason and the test checks it.
  speed_max_mps: "0.700"

  # ---- THE ACCELERATION, ALSO MEASURED AND ALSO A TABLE'S ----
  #
  # 0.35 m/s^2 is drive_route.profiles.straight's own ramp: four
  # quarters of cruise at 0.5 s each, which is 0.175 m/s per 0.5 s. That
  # ramp is in the TABLE because THE PLANT HAS NONE - model.sdf's
  # traction terminal is a raw velocity command, and its plugin comment
  # says so in as many words - so a single step to cruise puts the
  # largest slip of a run into its first tenth of a second. Every figure
  # on this track was taken behind that ramp, so it is the acceleration
  # this plant is characterised at.
  #   IT IS ENFORCED TWICE, ON TWO DIFFERENT QUANTITIES. The smoother
  #   limits the BODY twist's acceleration; the converter limits the
  #   WHEEL's, because v_w = v / cos(delta) can step when v does not -
  #   a controller that swings the steer angle while holding v asks the
  #   wheel for a jump the smoother never saw. Same number, two frames.
  accel_mps2: "0.35"

  # ---- THE CURVATURE CEILING, EXPRESSED AS THE ANGLE THAT WAS MEASURED
  #
  # 1.25 rad. model.sdf's steer stop is 1.31 (vehicle.steer_limit_rad),
  # which is a turning radius of L/tan(1.31) = 0.2802 m - and this plant
  # has never been driven there. The hardest steer it HAS been driven at
  # is 1.25 rad: drive_route.profiles.square's four corners, and the
  # two-row delivered table above them.
  #   SO THE CEILING IS THE MEASUREMENT AND THE STOP IS THE BACKSTOP.
  #   A twist clamped at 1.25 rad can never reach 1.31, so a steer clamp
  #   firing on this stack is a bug rather than a manoeuvre - which is
  #   why the converter counts the two separately and says so.
  #   WHAT IT IS AS A CURVATURE: tan(1.25)/1.05 = 2.8662568 1/m, a
  #   COMMANDED radius of 0.3488871 m.
  #   cmd_vel_tricycle_core.curvature_max() is the one place that
  #   arithmetic lives, because three consumers want it - the clamp,
  #   smoother.yaml's angular limits and the F4 Task 2 handover row.
  #   AND WHAT THE PLANT DELIVERS THERE IS LESS, WHICH IS THE POINT OF
  #   HAVING MEASURED IT (EVIDENCE_LATERAL_TUNE.md, and the table above
  #   drive_route.profiles.square): 0.246312 rad/s against a kinematic
  #   0.271136 at 0.300 m/s of tread - 0.908 of the geometry - so the
  #   DELIVERED radius at this ceiling is 0.3841 m at the four-corner
  #   mean and 0.4154 m at the worst single corner, the four being
  #   11.5 % apart because they are at four different headings. THAT is
  #   the number a planner's minimum_turning_radius has to respect, and
  #   it is handed to F4 Task 2 in EVIDENCE_NAV_V3.md rather than
  #   applied here: this node converts, it does not plan.
  steer_command_limit_rad: "1.25"

  # ---- WHERE THE GEOMETRY STOPS BEING DEFINED AT ALL ----
  #
  # THE CREEP DEADBAND. Below this |v| the ratio w/v is not a curvature
  # anybody meant - its denominator is rounding and the smoother's own
  # ramp - so the converter commands zero traction and HOLDS the steer
  # axis.
  #   THE VALUE IS AN UPPER BOUND FROM THE LAYER ABOVE AND NOT A TUNING
  #   KNOB (docs/LESSONS.md 2026-08-05, the deadlock entry). From REST
  #   the smoother's output per tick cannot exceed max_accel * dt on the
  #   most restrictive axis - which is true of BOTH feedback modes, and
  #   is why this number did not move when smoother.yaml's ruling did:
  #
  #       dt              = 1 / rate_hz            = 0.05 s
  #       a_v * dt        = 0.35 * 0.05            = 0.017500 m/s
  #       a_w * dt / kmax = (0.35 * 2.8662568) * 0.05 / 2.8662568
  #                                                = 0.017500 m/s
  #
  #   - the two are EQUAL at every curvature, because the angular
  #   acceleration is the linear one times the same kappa_max, which is
  #   what makes the ramp proportional and the arc survive it. So the
  #   floor is 0.017500 m/s and a deadband at or above it is a DEADLOCK,
  #   not a margin: the converter zeroes traction, the plant does not
  #   move, the estimate reads zero, the smoother stays pinned at the
  #   floor, and the leg stalls until something times out. The crib's
  #   0.02 armed exactly that loop. 0.005 is 3.5 times inside the floor
  #   and is checked against it by the suite.
  creep_speed_mps: "0.005"
  # A STANDSTILL, and it is NARROWER than the deadband on purpose. A
  # refusal means the request has NO (steer, tread) pair at all, which is
  # true only when a yaw rate is demanded of a vehicle that is not
  # moving. The crib counted the whole creep band instead and the counter
  # became useless - 27 "rotation in place" refusals for a goal that was
  # reached, every one of them the tail of a deceleration through the
  # band. 1 mm/s.
  zero_speed_mps: "0.001"
  # AND WHAT COUNTS AS A YAW RATE RATHER THAN AS NOISE. The corner rates
  # this plant delivers are 0.2028 and 0.2463 rad/s (the table above
  # drive_route.profiles.square), twenty times this; nav2's Spin sends
  # v = 0 exactly with a yaw rate that is meant.
  yawrate_refusal_radps: "0.01"

  # ---- THE DEAD-MAN, AND IT IS THE SECOND ONE ON THIS PATH ----
  #
  # If nothing arrives on topics.cmd_vel_smoothed for this long the
  # converter ramps the traction to zero at accel_mps2, holds the steer
  # axis, publishes one standing zero and DISENGAGES.
  #   SHORTER THAN THE SMOOTHER'S OWN 1.0 s velocity_timeout ON PURPOSE:
  #   the layer nearer the plant must not be the slower one to notice.
  #   The smoother's timeout is "my controller stopped talking"; this one
  #   is "my smoother stopped talking", and in normal operation it never
  #   fires because the smoother sends its own decel ramp first.
  #   NEITHER IS A SUPERVISION WATCHDOG AND NEITHER IS A SAFETY FUNCTION.
  command_timeout_s: "0.5"

  # ---- ENGAGEMENT, WHICH IS WHAT KEEPS THE BENCHES USABLE ----
  #
  # The converter publishes NOTHING until a command has arrived, and it
  # stops publishing again once it has brought the vehicle to a standing
  # zero after the commands stop. That is not politeness: model.sdf's
  # JointController holds its last order FOR EVER, so a stack child
  # publishing zeros twenty times a second would OVERWRITE every command
  # tools/drive_route.py and tools/slip_bench.sh put on the same two
  # terminals from the gz side. An idle converter is a subscriber and
  # nothing else.
  #   AND THE STANDING ZERO IS STILL LEFT BEHIND, which is drive_route's
  #   own exit rule: a silent terminal on this model is a standing order,
  #   not an absence, and a standing zero is what pins the shaft. It is
  #   NOT a brake for a safety purpose.
  # HOW MANY TICKS OF A STANDING ZERO before it disengages. Three, so
  # that a dropped message on a lossy graph cannot be read as the end of
  # a drive.
  disengage_ticks: "3"

  # ---- THE BRINGUP GATE'S OWN BUDGET ----
  #
  # How long tools/navcmd_health.py waits, at each of its two reads, for
  # a message that should already be flowing. It is a BUDGET on a loaded
  # rig and not a deadline for anything anybody is driving: the status
  # heartbeat is at status_every_s and the terminal answers within one
  # tick of the command reaching it, so anything past a couple of seconds
  # is already an answer. 20 s is an order of magnitude of headroom and
  # still a bound - drive_route.clock_timeout_s's own reasoning.
  health_timeout_s: "20"

  # ---- THE PLUMBING ----
  qos_depth: "10"
  # How often the node states its counters on topics.navcmd_status,
  # engaged or not. It is a heartbeat as well as a diagnostic: a
  # converter that is ALIVE and has never heard a command looks exactly
  # like one whose subscription is misspelt, and this is the difference.
  status_every_s: "1.0"
  # The floor under every repeated log line - a clamp that fires on
  # every tick of a long corner must not write 20 lines a second into a
  # log an operator will open once.
  log_throttle_s: "2.0"

# =============================== SMOOTHER ===============================
# nav2_velocity_smoother, AHEAD OF THE CONVERTER, and this block is the
# ekf: block's split applied a fifth time: config.yaml keeps the TOPICS,
# the NODE NAME, the RATE and the PATH to the other file, m5v3.sh passes
# all of those on the command line, and smoother.yaml holds WHAT IS
# LIMITED AND TO WHAT and nothing else. No number is in both.
#
# WHAT IT IS FOR. model.sdf's traction terminal is a raw velocity command
# with no ramp, and a controller's output is a step every time its plan
# changes. The smoother is where a step becomes an acceleration - in the
# BODY twist, before the geometry - and it is also the dead-man that puts
# the vehicle down when the thing commanding it stops talking.
#
# WHAT WAS MEASURED ABOUT IT ON THIS RIG, 2026-08-27, and it CORRECTS the
# research this phase was planned from (docs/reports/m5v3-02 section 5
# says "Jazzy defaults to TwistStamped"):
#   enable_stamped_cmd_vel DEFAULTS TO FALSE on this Jazzy. `ros2 node
#   info` on the running node reads geometry_msgs/msg/Twist on BOTH
#   /cmd_vel and /cmd_vel_smoothed. smoother.yaml states the parameter
#   explicitly anyway, because a default that the published research
#   disagrees with is exactly the kind of default that moves.
#   autostart_node: true DRIVES IT TO ACTIVE BY ITSELF - measured, the
#   node logs "Auto-starting node", "Configuring", "Activating" and
#   `ros2 lifecycle get` reads `active [3]` with no external transition
#   at all. So this stack does NOT drive it the way it drives the
#   localisation arm's lifecycle nodes; m5v3.sh POLLS for the state
#   instead, which is a different mechanism and not a second copy of one.
#   IT PUBLISHES NOTHING WHEN IDLE - `ros2 topic hz /cmd_vel_smoothed`
#   reported no messages at all over 4 s with the node ACTIVE and
#   nothing commanding - and on a command timeout it emits its own
#   deceleration ramp to zero and then stops. That is what lets this
#   child be part of the DEFAULT stack without touching the two benches
#   that address the same terminals from the gz side.
smoother:
  package: "nav2_velocity_smoother"
  executable: "velocity_smoother"
  # The name the parameter file has to be addressed to. rclcpp applies
  # NOTHING from a block addressed to a node that is not running and does
  # not complain about it, so m5v3.sh greps for this string in
  # params_file before anything starts - check_ekf_params()'s argument,
  # for a node whose package defaults (0.5 m/s, 2.5 rad/s, OPEN_LOOP)
  # would look exactly like a working smoother.
  node_name: "velocity_smoother"
  params_file: "m5_ver3/smoother.yaml"
  # HOW LONG start WAITS for it to reach ACTIVE on its own. It
  # self-transitions on construction (measured above), so this is a
  # budget for a loaded rig and not a deadline for a transition anybody
  # is driving. The localisation arm's own budget is
  # localization.lifecycle_timeout_s and it is a different question
  # against a different mechanism.
  active_timeout_s: "30"

# =========================== COLLISION MONITOR ==========================
# F4 TASK 3, AND IT IS AN OPTIONAL LINK IN A LINE THAT IS ALREADY THERE.
# `--monitor` puts nav2_collision_monitor between the velocity smoother
# and the tricycle converter; without the flag nothing changes and the
# command path is byte for byte the one F4 Task 1 measured.
#
# ------------------------- THE DISCLAIMER, VERBATIM --------------------
# nav2's own documentation for this node, quoted and not paraphrased:
#
#   "does not provide hard real-time safety certifications"
#
# It does not replace a safety-rated PLC. It complements the F-PLC; it
# is not the F-PLC. Protective stop, e-stop and safe torque off are
# onboard and hardwired in the plant this models, and nothing on this
# path can trigger or release one. What this node does is slow and stop
# an AUTONOMY command stream on a scan it reads at 15 Hz over a ROS
# graph, in a simulator, with no diverse channel, no self-test, no
# latching fault and no performance level. Every figure this track
# publishes about it is a measurement of a convenience function.
#
# ---------------- WHY IT IS A FLAG AND NOT PART OF --nav ---------------
# THREE REASONS, AND THE FIRST IS THE EVIDENCE'S.
#   THE ACCEPTANCE SET WAS DRIVEN WITHOUT IT. EVIDENCE_NAV_V3.md 16.5's
# eleven runs and F4 Task 3's own driving cases go through the F4 Task 1
# command path with nothing inserted in it. A monitor that went up with
# --nav would put an extra node between the smoother and the converter
# on every one of those runs, and every arrival figure would then be a
# figure about a different path.
#   IT KNOWS NOTHING ABOUT NAV2. It subscribes a Twist and a LaserScan
# and publishes a Twist. There is no planner, no costmap and no goal in
# it, so tying it to the arm that has those would be a claim about its
# dependencies that is not true - and it would make the honest
# open-loop demonstration below impossible, because that one wants the
# path with NO Nav2 in the room (F4 Task 1's own rule).
#   AND THE SHIPPING DECISION IS A MEASUREMENT AND NOT A DEFAULT.
# --rf2o and --fuse are the precedent: an optional arm, off, with the
# A/B that says why in the evidence. EVIDENCE_NAV_V3.md 19.7 is this
# one's.
#
# --------------------- WHAT IT CAN AND CANNOT SEE ----------------------
# THE ONLY PERCEPTION ON THIS TRACK IS THE NAV LIDAR AT z = 1.80 m.
# The two safety scanners at z = 0.15 m are in model.sdf and are NOT
# bridged to ROS (topics:, and EVIDENCE_MODEL_V3.md 2), so at the height
# this monitor watches, a pallet, a dropped load and a person are all
# invisible. Its honest scope is STRUCTURE ABOVE 1.80 m - and the
# obstacle the demonstration spawns is 2.40 m tall for exactly that
# reason, which is stated in the evidence rather than arranged quietly.
#   AND IT CANNOT USE THE `approach` ACTION TYPE, WHICH IS THE ONE THAT
# WOULD HANDLE A TURN. `approach` projects the ROBOT'S OWN FOOTPRINT
# forward along the commanded velocity, and this truck's footprint
# contains three pieces of itself that the nav scanner sees:
# nav_lidar_3d's housing at base_link (+0.026, -0.019) and the two mast
# rails at (-0.747, +0.285) and (-0.746, -0.302), 50 of 811 rays
# (EVIDENCE_NAV_V3.md 14.4). The costmap's obstacle layer clears them
# with footprint_clearing_enabled; this node has no such mechanism, so
# an `approach` polygon would report a collision with the vehicle at
# t = 0 on every cycle for ever. THAT IS WHY THE POLYGONS BELOW ARE
# RECTANGLES BEYOND THE BODY rather than a swept footprint, and it is
# also the reason each of them starts at a body EDGE: every zone here
# is outside the hull, so none of them contains a self-return.
monitor:
  package: "nav2_collision_monitor"
  executable: "collision_monitor"
  # The name the parameter file has to be addressed to. smoother's rule
  # and its reason: rclcpp applies nothing from a block addressed to a
  # node that is not running and says nothing about it, and this node's
  # package defaults are a 0.3 x 0.3 m box at the origin - which on this
  # vehicle sits inside the chassis and would fire on the mast rails.
  node_name: "collision_monitor"
  params_file: "m5_ver3/collision_monitor.yaml"
  # How long m5v3.sh waits for it to reach ACTIVE. It is a lifecycle
  # node with no manager on this track - the same shape as `smoother`,
  # and driven the same way.
  active_timeout_s: "30"
  # AND HOW LONG THE BRINGUP WATCHES ITS LOG AFTERWARDS, which is a
  # SECOND question and the only one that catches the failure below.
  #   MEASURED 2026-08-27, with the `lasertf` child absent: the node
  # activated at t+0.02 s, RELAYED EVERY TWIST for ten seconds, and then
  # published nothing at all from the moment the first scan it could not
  # transform arrived - first ERROR at t+9.9 s. tools/navcmd_health.py
  # ran inside that window and PASSED, truthfully, over a command path
  # that was cut ten seconds later; the same gate re-run three minutes
  # afterwards refused. Every child was ALIVE, the node was ACTIVE and
  # every parameter read back correctly.
  #   15 s IS THE 9.9 s WITH HALF AGAIN. It is the only bringup cost
  # this arm carries and it buys the difference between a refusal and a
  # stack that reports itself healthy with its command path cut.
  transform_check_s: "15"

  # -------------------- THE NUMBERS THE POLYGONS ARE ------------------
  # EVERY ONE OF THESE IS MEASURED ON THIS RIG AND
  # tests/test_collision_monitor_params.py RECOMPUTES EVERY POLYGON IN
  # collision_monitor.yaml FROM THEM. A polygon edited by hand and not
  # here is a test failure.
  geometry:
    # THE BODY EDGES, off gazebo/forklift_ver3/model.sdf's own convex
    # hull (evidence_core.sdf_footprint, EVIDENCE_NAV_V3.md 14.3). They
    # are the REAL hull and NOT the grown one nav2.yaml's costmaps
    # carry: that growth is F3's LOCALISATION error, +0.54 m along and
    # +0.11 m across, and this node has no map, no localiser and no
    # pose. It works in base_link off a live scan, so the only geometry
    # it is entitled to is the truck's own.
    fork_tip_x_m: "-1.875"
    counterweight_x_m: "0.860"
    half_width_m: "0.559"
    # AND THE ONE MARGIN THAT IS ADDED TO THE WIDTH, which is the
    # SCANNER'S and not the vehicle's: 3 sigma of the nav lidar's own
    # per-ray range noise, 0.02 m in model.sdf. 0.559 + 0.060 = 0.619,
    # rounded up.
    lateral_margin_m: "0.061"
  speeds:
    # THE TWO SPEEDS THE STOP TABLE WAS MEASURED AT
    # (EVIDENCE_NAV_V3.md 8), and they are the two bands the velocity
    # polygons switch between.
    #   transit 0.300 m/s IS nav2.yaml's own vx_max and is what every
    #   driven goal on this track runs at; 8's `creep` profile measured
    #   it stopping in 0.208 m.
    #   cruise 0.700 m/s is what the COMMAND PATH can deliver - a bench
    #   publishing a twist, or a future consumer that is not nav2 - and
    #   8's `straight` profile measured 1.019 m and `speed_limit`
    #   1.041 m, dead time included.
    transit_mps: "0.300"
    cruise_mps: "0.700"
  stop_m:
    # THE MEASURED STOPPING DISTANCES, ROUNDED UP. Not v^2/2a: 8
    # measured 1.019-1.041 m against the ramp's own prediction of
    # 0.690 m, and the 48 % is DEAD TIME - the truck holds its speed for
    # about 0.25 s after the zero arrives. A polygon sized on the
    # arithmetic would be 0.33 m short at cruise.
    transit: "0.25"
    cruise: "1.05"
  slowdown_m:
    # THE SLOWDOWN ZONE IS THE STOP ZONE PLUS THE DISTANCE IT TAKES TO
    # GET DOWN TO THE OTHER BAND, so that a vehicle warned at cruise is
    # already at transit speed by the time it reaches the stop zone -
    # at which point the velocity polygon has SHRUNK to the transit
    # rectangle, which is the whole reason this is a velocity polygon
    # and not a fixed one.
    #   cruise: 1.05 (the stop zone) + 0.25 s of dead time at 0.700
    #   (0.175 m) + (0.700^2 - 0.300^2) / (2 x 0.35) = 0.571 m
    #   = 1.796, rounded up to 1.80.
    #   transit: there is nothing below 0.300 m/s this converter will
    #   still deliver - navcmd.creep_speed_mps is the deadband - so the
    #   transit slowdown zone buys no braking at all. It is a WARNING
    #   band and it is one stop zone deep again, so the state topic
    #   says `something is close` a full stopping distance before the
    #   stop zone is entered.
    transit: "0.50"
    cruise: "1.80"
  # WHAT A SLOWDOWN MULTIPLIES THE COMMAND BY, and it is a ratio between
  # two numbers this file already holds: transit / cruise = 0.300 /
  # 0.700 = 0.428571. A cruise command slowed by it IS the transit
  # ceiling, which is the speed the small polygons are sized for.
  slowdown_ratio: "0.428571"
  # HOW MANY SCAN POINTS INSIDE A POLYGON COUNT AS AN OBSTACLE. The nav
  # lidar puts 811 rays over 270 deg, 0.0058178 rad apart, so a 0.40 m
  # wide object at 3.50 m subtends 0.114 rad and about 19 rays; at the
  # stop zone's own 0.25 m from the tips it is hundreds. FOUR is a
  # quarter of what the smallest interesting object returns at the
  # furthest interesting range, and it is above any single-ray noise
  # excursion - the range noise is 0.02 m and moves a ray ALONG its own
  # bearing, never across it.
  min_points: "4"
  # HOW LONG A SOURCE MAY BE SILENT before the monitor treats it as
  # failed and stops the vehicle. The nav lidar is 15 Hz, so 1.0 s is
  # fifteen periods - localization.analyse.map_gap_s's own argument, one
  # sensor over.
  source_timeout_s: "1.0"
  # HOW LONG WITHOUT AN INPUT TWIST before it publishes one stop message
  # of its own. The command path is silent at rest by construction
  # (topics.cmd_vel_smoothed), so this fires on every idle stack - and
  # what it publishes is a ZERO, into a converter that is already
  # holding one. 2.0 s is nav2's own default and nothing here needs it
  # to be different.
  stop_pub_timeout_s: "2.0"

  # ------------------- THE DEMONSTRATION'S OBSTACLE -------------------
  # A BOX SPAWNED INTO THE RUNNING WORLD, through gz-sim's own
  # /world/<name>/create service, and REMOVED again through /remove. It
  # is not in warehouse_ver3.sdf and this track does not edit that file
  # (CONTEXT.md: the floor is referenced, never copied, never edited).
  obstacle:
    name: "m5v3_monitor_box"
    # 2.40 m TALL, AND THE HEIGHT IS THE WHOLE POINT. The nav lidar's
    # scan plane is z = 1.80 m; a box shorter than that is invisible to
    # this monitor and the demonstration would measure nothing. Stating
    # it here is the honest form of the limitation above.
    size_x_m: "0.60"
    size_y_m: "0.60"
    size_z_m: "2.40"
    # WHERE, and it is on the north ring leg east of the spawn - the
    # headline route's own corridor, y = +10.00 on the centreline, so a
    # truck driving east down the leg meets it head on. 8.00 m from the
    # spawn is far enough that the vehicle is at its commanded speed
    # before the first polygon reaches the box.
    x_m: "-9.00"
    y_m: "10.00"
    # It is spawned STATIC: a box with mass that the truck could push is
    # a collision experiment, and this is a monitor experiment.
    static: true

  # ---------------------- THE DEMONSTRATION ITSELF --------------------
  # tools/monitor_demo.py's own table. It drives a CONSTANT twist at the
  # top of the command path - not a goal - because the measurement is
  # the RATIO of two adjacent streams and a speed that changes for the
  # controller's own reasons makes that ratio a measurement of nothing.
  demo:
    # AT CRUISE AND NOT AT THE TRANSIT CEILING, and the choice is what
    # makes both actions observable. At 0.300 m/s the slowdown zone is
    # 0.50 m deep and the slowdown would take the command to 0.129 m/s;
    # at 0.700 m/s the zone is 1.80 m and the slowdown lands exactly on
    # the transit ceiling, which is the speed the small polygons are
    # sized for. It is written as a SPEED and monitor_demo.py adds the
    # sign: forks-first is NEGATIVE linear.x on this vehicle.
    speed_mps: "0.700"
    # HOW LONG THE BOX STANDS. The fork tips start 5.825 m from its near
    # face and the drive covers that in about 8.3 s, so 20 s leaves the
    # vehicle standing in the stop zone for about ten seconds - which is
    # what makes `held` distinguishable from `stopped once`.
    approach_s: "20.0"
    # AND HOW LONG THE SAME COMMAND RUNS AFTER IT IS REMOVED. A guard
    # that cannot be released is worse than none, so the release is a
    # measured phase and not an assumption. 10 s at 0.700 m/s is 7 m,
    # which the north ring leg has east of the box.
    release_s: "10.0"
    # Standing still before the drive and after the standing zero. It is
    # what gives the relay identity check a phase with nothing in any
    # zone, and what lets the truck actually stop before the recording
    # ends (1.02 m and 2.07 s from cruise, EVIDENCE_NAV_V3.md 8).
    settle_s: "5.0"
    # THE PUBLISH RATE, and it is the controller's own 20 Hz
    # (nav2.yaml controller_frequency) rather than a number of this
    # bench's choosing: what this demonstration stands in for is a
    # controller publishing at that rate, and the smoother's own
    # behaviour depends on how often it is fed.
    rate_hz: "20.0"

# ============================== TWIST ROUTE =============================
# THE COMMAND PATH'S OWN BENCH, F4 Task 1, read by tools/drive_twist.py.
#
# WHY IT IS NOT drive_route: WITH A SECOND SHAPE OF ROW. drive_route.py
# addresses the two motor terminals ON THE GZ SIDE and imports no rclpy
# at all - that is what lets it drive a plant with no ROS node running
# and what its whole header is about. A twist profile is a ROS publisher
# by construction: it enters the chain at topics.cmd_vel, above a
# lifecycle node and a converter, in a different message type and a
# different unit. Bolting it onto that file would put an rclpy import at
# the top of the one driving tool that does not need one. So it is a
# sibling, with the same idioms - a config-tabled profile, the plant's
# own clock, a standing zero on every exit path - and the same refusal to
# clamp a table.
#
# AND THE TABLE IS STILL REFUSED RATHER THAN CLAMPED, which is exactly
# the line vehicle.steer_limit_rad's comment draws: this is a table
# somebody wrote down, and a table that asks for something the converter
# would have to clamp is a table to correct. The CONVERTER clamps,
# because it is taking live commands; the BENCH refuses, because it is
# reading a table. tools/drive_twist.py checks every row against
# navcmd:'s ceilings before it publishes anything - except where a row
# says `expect_clamp`, which is how a profile ASKS for a clamp it is
# there to observe.
twist_route:
  # The clock budget, and it is drive_route.clock_timeout_s's twin for
  # its reason: a stack that is not up would otherwise hang the bench in
  # silence rather than refuse it.
  clock_timeout_s: "20"
  # HOW LONG THE BENCH WAITS FOR THE FIRST SMOOTHED COMMAND to come back
  # before it refuses. It publishes into cmd_vel and the answer has to
  # come out of the smoother; nothing arriving means the smoother is not
  # ACTIVE, and a bench that drove on regardless would be measuring an
  # open circuit.
  chain_timeout_s: "10"
  profiles:
    # STRAIGHT: the command path's version of drive_route's own straight,
    # and deliberately the same manoeuvre so the two can be compared. The
    # RAMP IS NOT IN THIS TABLE and that is the difference being
    # measured: drive_route has to write the ramp out row by row because
    # it addresses a terminal with no ramp in it, and this profile steps
    # straight to cruise because the smoother and the converter are what
    # the step is being handed to. What comes out at the terminals is the
    # measurement.
    straight:
      - {hold_s: "3.0", v_mps: "0.000", w_radps: "0.000"}
      - {hold_s: "16.0", v_mps: "-0.700", w_radps: "0.000"}
      - {hold_s: "4.0", v_mps: "0.000", w_radps: "0.000"}

    # CREEP: the same step at the fleet's corner speed, so the ramp and
    # the delivered fraction can be read at a speed where the tyre has
    # almost no lateral force to shed. 0.3 m/s is m6/ipc/follower.py's
    # CORNER_MPS and the speed drive_route.profiles.corner_creep and
    # .square are both driven at.
    creep:
      - {hold_s: "3.0", v_mps: "0.000", w_radps: "0.000"}
      - {hold_s: "16.0", v_mps: "-0.300", w_radps: "0.000"}
      - {hold_s: "4.0", v_mps: "0.000", w_radps: "0.000"}

    # CORNER_CREEP: ONE corner, commanded as a CURVATURE rather than as a
    # steer angle, held long enough to have a steady state - and it is
    # drive_route.profiles.corner_creep's twin ON PURPOSE. That profile
    # commands -0.785398 rad of steer at 0.300 m/s of tread and the plant
    # delivers 0.203768 rad/s of yaw (EVIDENCE_LATERAL_TUNE.md). The same
    # manoeuvre asked for through a twist is
    #
    #     v = v_w cos(delta) = -0.300 * cos(-0.785398) = -0.212132 m/s
    #     w = v_w sin(delta) / L
    #                        = -0.300 * sin(-0.785398) / 1.05
    #                        = +0.202030 rad/s
    #
    # AND THE YAW RATE IS POSITIVE WHILE THE STEER ANGLE IS NEGATIVE,
    # which is the mirror this track's sign discipline is built on and
    # not a typo. Forward travel is a NEGATIVE tread speed, so
    # v_w sin(delta) has TWO negative factors: a driver-LEFT wheel
    # (negative delta) travelling forward turns the model's yaw UP. That
    # is the same left turn towards the north wall drive_route's own
    # corner_creep takes - its ground truth ran the rear axle from
    # y = 9.9982 to y = 11.9598, northward - and it is taken for the same
    # reason: 4.00 m either way, and a wall is a flatter thing to have a
    # metre away than a rack leg.
    #   THE KINEMATIC RATE HERE IS 0.202030 rad/s AND THE TABLE ABOVE
    #   drive_route.profiles.square PRINTS 0.202666 FOR THE SAME ROW.
    #   The two are 0.31 % apart and the difference is that column's, not
    #   this one's: what is written here is exactly
    #   v_w sin(delta) / L for the tread and steer that table drives.
    #   Nothing on this track is scored against the third decimal of a
    #   kinematic prediction - the DELIVERED rate is what both profiles
    #   report - but a number that disagrees with a neighbour is worth
    #   the sentence.
    #   SO THE TWO PROFILES ARE THE SAME MANOEUVRE THROUGH TWO ENTRY
    #   POINTS, and the delivered yaw rate of one is directly comparable
    #   with the delivered yaw rate of the other. What the comparison
    #   measures is everything the command path adds: the smoother's
    #   ramp, the converter's arithmetic, the steer slew this node
    #   applies that the table did not, and the bridge.
    #   IT FITS THE FLOOR FOR corner_creep's OWN REASON, and with margin
    #   to spare: the arc is the one that profile measured at 0.54 m of
    #   clearance, and this table's run-in is 1 s longer at the same
    #   speed, which moves the entry 0.2 m along a ring leg that is
    #   8.00 m wide.
    corner_creep:
      - {hold_s: "3.0", v_mps: "0.000", w_radps: "0.000"}
      - {hold_s: "4.0", v_mps: "-0.212132", w_radps: "0.000"}
      - {hold_s: "14.0", v_mps: "-0.212132", w_radps: "0.202030"}
      - {hold_s: "4.0", v_mps: "0.000", w_radps: "0.000"}

    # CORNER_CRUISE: the same CURVATURE at cruise, which is where the
    # traction ceiling bites and this profile exists to observe it doing
    # so at the terminals. The curvature is corner_creep's exactly -
    # kappa = tan(0.785398)/1.05 = 0.952381 1/m, R = 1.050 m, one
    # wheelbase - so at v = -0.700 m/s the yaw rate is +0.666666 rad/s
    # and the wheel is asked for 0.700 / cos(0.785398) = 0.989949 m/s of
    # tread against navcmd.speed_max_mps of 0.700. The converter clamps
    # the TREAD - CURVATURE PRESERVING - and the truck drives the same
    # arc at 0.700 * cos(0.785398) = 0.494975 m/s of body speed.
    #   THE ROW SAYS SO: expect_clamp is what stops the bench refusing a
    #   table that asks for a clamp on purpose.
    #   THE ARC IS THE SAME ONE corner_creep TAKES, so the floor check is
    #   that profile's; the turn is driven for 8 s rather than 14, and a
    #   shorter arc on the same radius from the same entry cannot reach
    #   further from the wall than a longer one.
    corner_cruise:
      - {hold_s: "3.0", v_mps: "0.000", w_radps: "0.000"}
      - {hold_s: "3.0", v_mps: "-0.700", w_radps: "0.000"}
      - {hold_s: "8.0", v_mps: "-0.700", w_radps: "0.666666",
         expect_clamp: "traction"}
      - {hold_s: "4.0", v_mps: "0.000", w_radps: "0.000"}

    # SPEED_LIMIT: the envelope hook, DEMONSTRATED. Cruise, then the same
    # cruise with 0.3 m/s published on topics.speed_limit, then cruise
    # again with the limit lifted (0.0, which nav2_msgs/SpeedLimit's own
    # comment defines as NO LIMIT and not as a stop). What the evidence
    # reads is the TRACTION TERMINAL: 0.700 m/s of tread before,
    # 0.300 m/s while the limit stands, 0.700 m/s after.
    #   IT IS A DEMONSTRATED INTERFACE AND NOT A SAFETY CLAIM. See
    #   topics.speed_limit for the whole of that sentence and for the
    #   disclaimer this track keeps verbatim beside it.
    #   EIGHT SECONDS A SEGMENT, AND THE LENGTH IS THE INSTRUMENT'S. A
    #   figure is read over evidence.corner.window_s of steady state
    #   AFTER evidence.corner.settle_s has been discarded, so a segment
    #   has to be at least 4 + 3 = 7 s long to produce a row at all - and
    #   the 0.700 -> 0.300 transition is a 1.14 s ramp at accel_mps2,
    #   which the settle already covers.
    #   IT IS DRIVEN ON THE RING LEG AND IT FITS: two cruise segments at
    #   0.700 m/s and one at 0.300 is about 13.9 m of travel along the
    #   y = +10.00 leg, whose `aisle` profile already covers 20.3 m from
    #   the same spawn in one direction.
    speed_limit:
      - {hold_s: "3.0", v_mps: "0.000", w_radps: "0.000"}
      - {hold_s: "8.0", v_mps: "-0.700", w_radps: "0.000"}
      - {hold_s: "8.0", v_mps: "-0.700", w_radps: "0.000",
         speed_limit_mps: "0.300"}
      - {hold_s: "8.0", v_mps: "-0.700", w_radps: "0.000",
         speed_limit_mps: "0.000"}
      - {hold_s: "4.0", v_mps: "0.000", w_radps: "0.000"}

# ============================== THE NAV ARM ============================
# F4 Task 2, and it is the first thing on this track that DECIDES where
# the vehicle goes. Everything before it either drives a table
# (drive_route, drive_twist) or answers where the vehicle IS
# (--localize); this block is the addresses, the paths and the goal
# table for a planner and a controller that close the loop between the
# two.
#
# WHAT IS HERE AND WHAT IS IN nav2.yaml. The split is ekf.yaml's, a
# sixth time: this block holds ADDRESSES - packages, executables, node
# names, file paths - and the GOAL TABLE, which is a set of poses
# somebody chose and has to defend. nav2.yaml holds what is PLANNED and
# what is FOLLOWED, and the argument for every number in it. No number
# is in both.
#   WITH ONE EXCEPTION THAT IS A CHECK RATHER THAN A COPY. nav2's two
#   COSTMAPS are sub-nodes with no command line of their own, so the
#   addresses they need - topics.map, topics.scan_nav, frames.map,
#   frames.odom, frames.base_link - can only be written in nav2.yaml.
#   m5v3.sh's check_nav_params() READS THEM BACK and refuses a
#   disagreement before anything starts. That is tools/build_map.sh's
#   own idiom: these are not passed, they are CHECKED.
nav:
  # THE ARM'S TWO FILES. Both are consumed read-only; neither is written
  # by anything at run time.
  params_file: "m5_ver3/nav2.yaml"
  # THE TREE, AND IT IS PASSED AS AN ABSOLUTE PATH. bt_navigator's
  # default_nav_to_pose_bt_xml is resolved against the PROCESS's working
  # directory, and m5v3.sh may be run from anywhere - so the path is
  # built from $REPO and handed over on the command line rather than
  # written into nav2.yaml, where it would be a claim about where
  # somebody's shell was standing.
  bt_xml: "m5_ver3/behavior_trees/navigate_to_pose_tricycle_v3.xml"

  # ---------------------- THE FIVE CHILDREN ----------------------------
  # Four servers and one lifecycle manager. Every one of them is a
  # `ros2 run <package> <executable>`, which FORKS - so the pid m5v3.sh
  # records is the wrapper's and the sweep in tools/_common.sh is what
  # catches the node itself. The patterns there are the four EXECUTABLE
  # names (each a substring of both command lines, and none of them an
  # ordinary word) and the manager's PACKAGE name, because
  # `lifecycle_manager` on its own is ordinary enough to nominate a
  # stranger - which is nav2_amcl's argument and velocity_smoother's,
  # one each way.
  planner:
    package: "nav2_planner"
    executable: "planner_server"
    node_name: "planner_server"
  controller:
    package: "nav2_controller"
    executable: "controller_server"
    node_name: "controller_server"
  behavior:
    package: "nav2_behaviors"
    executable: "behavior_server"
    node_name: "behavior_server"
  bt:
    package: "nav2_bt_navigator"
    executable: "bt_navigator"
    node_name: "bt_navigator"
  lifecycle:
    package: "nav2_lifecycle_manager"
    executable: "lifecycle_manager"
    node_name: "nav_lifecycle_manager"

  # THE TWO COSTMAP SECTIONS, WHICH ARE NOT CHILDREN. They are
  # nav2_costmap_2d sub-nodes constructed inside controller_server and
  # planner_server, in namespaces of their own - so they have no process
  # and no command line, and `status` never names them. They are listed
  # because check_nav_params() has to prove nav2.yaml is ADDRESSED to
  # them: a costmap block under a misspelt top-level key applies nothing
  # and the server comes up on the package defaults, which is a 3 x 3 m
  # window and a CIRCULAR footprint of radius 0.1 m.
  costmap_sections: "local_costmap global_costmap"

  # ------------------- THE COSTMAP'S OWN READER ------------------------
  # tools/costmap_probe.py, F5 Task 1. `nav_health.py` asks whether the
  # arm can PLAN; this asks what it would plan THROUGH, which is a
  # question about a grid and is answered by reading the grid.
  #   IT EXISTS BECAUSE F5 TASK 1 ADDS A LAYER TO ONE OF THEM.
  # EVIDENCE_NAV_V3.md 19.9 deferred the global obstacle layer partly
  # on "it changes what the PLANNER plans through on every goal on every
  # arm", and F4 constraint 20 makes that a RE-MEASUREMENT. nav2.yaml's
  # own header then makes a prediction off `combination_method: 1` - on
  # a floor whose obstacles are all in the frozen map the layer can only
  # ADD cells the map already carries, so the grids should agree - and a
  # prediction with no instrument behind it is a hope.
  costmap_probe:
    # BOTH COSTMAPS AND NOT ONLY THE ONE THAT CHANGED. The local one is
    # the CONTROL: it is untouched by this task, so a difference there
    # between two captures is a difference in the RUN (a scan that
    # arrived, a pose that moved) rather than in the file, and it is
    # what says how much of any global difference is attributable to
    # the layer at all.
    topics: "/global_costmap/costmap /local_costmap/costmap"
    # HOW LONG THE PROBE SPINS AFTER THE FIRST GRID BEFORE IT KEEPS ONE.
    # An obstacle layer's FIRST published grid can predate its first
    # scan - the costmap publishes on its own 1 Hz timer and the layer
    # marks on the scanner's 15 Hz - so a capture taken the instant the
    # subscription matched would be a measurement of a layer that had
    # not run yet. 10 s is ten global-costmap update periods and 150
    # scan periods, which is a long way past either.
    settle_s: "10"


  # ---------------------- THE BRINGUP GATE -----------------------------
  # tools/nav_health.py, and it is ekf_health.py's and
  # localization_health.py's argument in a third currency: every check
  # m5v3.sh already makes is satisfied by five processes that have never
  # spoken to each other. A planner_server that is ALIVE and ACTIVE with
  # an EMPTY costmap plans nothing and says nothing about it; a
  # controller_server whose costmap never received a map reports a tf
  # timeout once and then goes quiet. So the gate asks the one question
  # none of the others can: compute a path.
  health:
    # The whole gate, on the wall clock. It covers waiting for six
    # lifecycle nodes and one action round trip.
    timeout_s: 90
    # THE TRIVIAL PLAN. A goal goal_ahead_m along the vehicle's own
    # heading from the seed pose, which is a straight line down the ring
    # leg the truck spawns on - 2.00 m of an 8.00 m corridor with the
    # nearest obstacle 3.44 m away (m6/gazebo/warehouse_ver3.sdf,
    # WallNorth). It is deliberately not one of the goals below: a gate
    # that planned a real route would take seconds and could fail for
    # reasons that are the route's rather than the stack's.
    goal_ahead_m: "2.00"
    # A path with fewer poses than this is not a path. The planner
    # returns SUCCESS with a near-empty path when the start is already
    # inside its own tolerance of the goal, and that looks the same from
    # the action's status as a plan through an unconfigured costmap.
    min_poses: 2
    # How long the action itself may take, inside the budget above.
    action_timeout_s: 30

  # ------------------------- THE GOAL TABLE ----------------------------
  # THREE POSES, EVERY ONE OF THEM A NODE OF m6/ipc/route.py's ROAD
  # GRAPH, and that graph is read-only to this track (CONTEXT.md). They
  # are copied here as VALUES for config.yaml's own reason - a shell and
  # a bench may not import m6 at run time - and
  # tests/test_nav2_params.py rebuilds the graph and asserts every one
  # of them is a node in it, so the copy says when it has gone stale.
  #
  #   WHY THE ROAD GRAPH AT ALL, when the planner is a FREESPACE planner
  #   that will ignore it. Because a goal has to be somewhere a vehicle
  #   is MEANT to be, and the graph is the only place on this floor
  #   where that is written down: it is the aisle centrelines, chosen by
  #   the owner over grid planning precisely so that a route drives
  #   aisle middles by construction. The PATH between two of its nodes
  #   is Nav2's business here and is expected NOT to follow the graph -
  #   which is itself one of the things EVIDENCE_NAV_V3.md reports.
  #
  # THE HEADING IS WRITTEN AS A TRAVEL HEADING AND NOT AS A POSE YAW,
  # AND THAT IS THE ONE PLACE THIS TABLE COULD SILENTLY LIE. This
  # vehicle's forks are at model -x, so the direction it TRAVELS is
  # yaw + pi (gazebo/forklift_ver3/model.sdf, and nav2.yaml section D).
  # A table of pose yaws would have every entry a half turn from the
  # direction a reader pictures, and an entry written the obvious way
  # would arrive COUNTERWEIGHT-FIRST with the nav lidar's blind sector
  # leading - and would still look like a successful goal. So the table
  # says which way the truck is POINTED WHEN IT ARRIVES, and
  # tools/drive_goal.py adds the pi. One place, tested.
  #
  # AND THEY ARE WORLD POSES, NOT MAP POSES. The map frame is the frozen
  # grid's and is about a half turn from the building (registration.yaml
  # theta_rad = -3.1383). Every pose on this track is written in the
  # BUILDING's frame and carried into the map by the committed
  # registration at the moment it is used, through
  # tools/map_register.py's MapFrame - the same one piece of arithmetic
  # that seeds the localiser.
  # AND WHICH WAY THE TRUCK IS FACING WHEN IT STARTS DECIDES WHICH
  # GOALS ARE FORKS-FIRST, WHICH IS THE THING THIS TABLE GOT WRONG ONCE
  # AND WAS CORRECTED BY A MEASUREMENT. vehicle.spawn.yaw is pi, so the
  # COUNTERWEIGHT (model +x) points at world -x and the FORKS point at
  # world +x: from the spawn, FORKS-FIRST TRAVEL IS EASTWARD. That is
  # not a deduction - EVIDENCE_MAP_V3.md 2.2's first leg is "ring N
  # east" and it is drive_route.profiles.straight's own -0.700 m/s.
  #   THE FIRST CUT OF THIS TABLE PUT ALL THREE GOALS WEST AND SOUTH OF
  #   THE SPAWN, on a belief about the spawn heading that was a half
  #   turn out. Every one of them was therefore BEHIND the forks, the
  #   freespace planner solved the first one counterweight-first, and
  #   EVIDENCE_NAV_V3.md's first-goals section carries what that run
  #   measured. The run is kept: a wrong turn that has been measured is
  #   worth more than one that has been tidied away.
  #
  # AND THE SECOND CUT WAS CORRECTED BY A MEASUREMENT TOO, WHICH IS THE
  # PHASE'S LARGEST FINDING. SmacPlannerHybrid is a FREESPACE planner
  # and m6/ipc/route.py's road graph is an OPERATIONAL constraint, not
  # a geometric one: the floor between two rack blocks is genuinely
  # open, so a straight line from the spawn to anything south of the
  # racks cuts diagonally through a 5.00 m gap. Four runs measured what
  # that costs a 3.815 m vehicle - START_OCCUPIED twice and MPPI
  # reporting every one of 1000 sampled trajectories in collision once -
  # and nav2.yaml's inflation and cost_penalty were re-derived from the
  # floor's two road classes because of them. It moved the boundary and
  # it did not remove it: at the inflation that separates a 5.00 m
  # corridor from an 8.00 m one, a diagonal that saves 5 m still beats
  # the ring. The goals below are therefore chosen so that the
  # FREESPACE route and the ROAD GRAPH route are the same route, and
  # `aisle_end` is deliberately the one where they are not.
  #   THE RIGHT ANSWER IS NOT A COSTMAP PARAMETER. It is nav2's Route
  #   Server (docs/reports/m5v3-02 4), which is edge-constrained and
  #   maps onto this graph one edge for one edge. It is a whole server
  #   and it belongs to a later phase.
  goals:
    # THE HEADLINE, AND IT IS THE ONE THAT IS REPEATED. 17.00 m due east
    # along the north ring leg to the SPINE's north junction, arriving
    # still headed east - the pose a truck stands in before it turns
    # down the spine. Forks-first from end to end, in an 8.00 m cruise
    # corridor whose freespace straight line IS the graph's own edge.
    #   ARRIVING HEADED EAST means the forks point at +x, so the pose
    #   yaw is pi - and tools/drive_goal.py is what adds it.
    #   IT IS THE SHORTEST OF THE THREE, WHICH IS WHY IT IS THE ONE
    #   REPEATED: a repeatability claim wants three runs of the same
    #   thing more than it wants one run of a longer thing.
    spine_north:
      x: "0.00"
      y: "10.00"
      travel_yaw_rad: "0.0"
      repeat: "3"
      note: "the SPINE's north junction, straight down the ring's north leg"
    # THE TRANSIT ONE. 37.00 m due east along the same leg to the ring's
    # north-east corner, arriving still headed east - the pose a truck
    # stands in before it takes that corner. It is the goal that spends
    # the most time at the transit ceiling, so it is where the
    # along-track offset of EVIDENCE_LOCALIZATION_V3.md 9 has the most
    # room to build, and it is what says what this controller does with
    # a long straight.
    ring_corner:
      x: "20.00"
      y: "10.00"
      travel_yaw_rad: "0.0"
      repeat: "1"
      note: "the ring's NORTH-EAST corner, approached along the north leg"
    # THE ONE WHERE THE FREESPACE ROUTE AND THE GRAPH ROUTE DISAGREE,
    # AND IT IS IN THE TABLE FOR THAT REASON. The pick aisle's EAST end,
    # where it meets the ring's east leg. The graph's route is 47 m -
    # east along the north leg, round the corner above, south down the
    # east leg - and every metre of it is in an 8.00 m corridor. The
    # freespace route is 38 m and threads the rack block. Nav2 is free
    # to choose and this is the goal that reports which it chose and
    # what happened.
    aisle_end:
      x: "20.00"
      y: "0.00"
      travel_yaw_rad: "-1.5707963"
      repeat: "1"
      note: "the pick aisle's EAST end, on the ring's east leg"
    # ------------------------------------------------------------------
    # AND SINCE F4 TASK 3, TWO MORE - BOTH ROAD-GRAPH NODES, BOTH ADDED
    # FOR THE DRIVING CASES BELOW rather than for the acceptance set.
    # `repeat: 0` and `case_only: true` on each: what has to be repeated
    # is a CASE and nav.cases owns that count, so a goal that is only
    # ever reached through a case carries no repeat of its own.
    #   `case_only` IS A FLAG AND NOT AN INFERENCE, for `route_node:
    # false`'s reason one row down. `repeat: 0` alone would be
    # indistinguishable from a goal somebody forgot to count, and
    # tests/test_nav2_params.py checks BOTH directions of this flag too:
    # a case_only goal must be named by at least one case and must carry
    # repeat 0, and a goal that is NOT case_only must carry repeat >= 1.
    # ------------------------------------------------------------------
    # THE STATION CLASS, AND IT IS A REAL STATION. S5 / PICK-NE-1 in
    # m6/ipc/stations.py, world (+7.00, +4.25), declared arrive_m 0.25 -
    # entered SOUTHWARD off the ring band through a 4.00 m bay mouth at
    # y = +6.00, on a 4.80 m spur from the ring centreline. It is a node
    # of the road graph (route.py links (7.0, 4.25) to (7.0, 10.0)) and
    # tests/test_nav2_params.py checks that, like every other goal here.
    #   IT IS AN APPROACH AND NOT A DOCK. EVIDENCE_NAV_V3.md 16.6
    #   measured that the (position, heading) pair is not reachable in
    #   ONE approach on this machine, and the goal checker this stack
    #   ships is position-only at 0.60 m. So what this goal measures is
    #   the APPROACH: where the truck ends and which way it is pointed
    #   when a 0.60 m box latches on a 4.80 m spur. Docking precision is
    #   F5's and inherits the numbers, not the tolerance.
    #   THE TRAVEL HEADING IS SOUTH because the bays face the ring
    #   (stations.py, revision B): a truck enters forks-first off the
    #   8.00 m ring band, which is the geometry m6 rebuilt the floor to
    #   get. -1.5707963 is stations.py's own _S.
    station_s5:
      x: "7.00"
      y: "4.25"
      travel_yaw_rad: "-1.5707963"
      repeat: "0"
      case_only: true
      note: "S5 / PICK-NE-1 - the station class, entered off the ring"
    # AND THE WAY BACK OUT OF IT, WHICH IS THE ONE THAT CANNOT BE DRIVEN
    # FORKS-FIRST. (7.00, +10.00) is the ring junction directly above S5
    # and the only node the spur connects to. A truck standing in the
    # bay has its forks pointed SOUTH at a wall 4.00 m deep and its
    # minimum turning radius is 1.25 m: it cannot turn round in there,
    # so the first segment of any route out is COUNTERWEIGHT-FIRST -
    # nav2's own FORWARD - and the leg that follows it, eastward along
    # the ring, is forks-first again. The direction change between them
    # is a Reeds-Shepp CUSP, which is what nav.cases.reverse_out exists
    # to drive and what nav2 issue #5714 is about (F4 constraint 19).
    ring_s5_junction:
      x: "7.00"
      y: "10.00"
      travel_yaw_rad: "0.0"
      repeat: "0"
      case_only: true
      note: "the ring junction above S5 - the way OUT of the bay"
    # ------------------------------------------------------------------
    # AND ONE GOAL THAT CANNOT BE REACHED, WHICH IS THE ONLY ONE OF THESE
    # THAT IS NOT A PLACE TO DRIVE TO. F4 Task 2.5's fail-fast has to be
    # demonstrated in BOTH directions and a guard that has only ever been
    # seen not firing is not a guard that has been seen.
    #
    # (-4.250, -4.250) IS THE CENTRE OF RackSW3, a 0.500 x 3.500 x 4.000
    # box in m6/gazebo/warehouse_ver3.sdf - a real object on this floor
    # with a name, spanning x -4.50..-4.00 and y -6.00..-2.50. It is
    # LETHAL in the frozen grid, it is a metre and a half inside the
    # nearest thing a 3.815 m truck could stand in, and no configuration
    # of this stack can drive there. It is the same rack CONTEXT.md
    # records being put across the m5_ver2 spawn pose.
    #   IT IS DELIBERATELY NOT A NODE OF THE ROAD GRAPH and it carries
    # `route_node: false` to say so. tests/test_nav2_params.py checks
    # BOTH directions off that flag: every other goal must still be a
    # node of m6/ipc/route.py's graph, and this one must still NOT be,
    # because a demonstration of an unreachable goal that had quietly
    # become reachable would pass every test and demonstrate nothing.
    #   `repeat: 0` because it is not part of the shipped evidence set -
    # the acceptance set is spine_north x3, ring_corner and aisle_end.
    # ------------------------------------------------------------------
    rack_sw3:
      x: "-4.250"
      y: "-4.250"
      travel_yaw_rad: "0.0"
      repeat: "0"
      route_node: false
      note: "INSIDE RackSW3 - unreachable BY CONSTRUCTION, the fail-fast demonstration"
  # ONE GOAL IS DRIVEN ONCE PER `record`, AND THE HEADLINE IS DRIVEN
  # THREE TIMES. `repeat` above is not a loop this bench runs - it is
  # what the EVIDENCE has to contain, and tools/drive_goal.py's
  # `analyse` prints it beside the number of sessions it actually found,
  # so a repeatability claim cannot be made over one run by accident.
  default_goal: "spine_north"

  # -------------------------- THE CASE TABLE ---------------------------
  # F4 TASK 3. A GOAL IS A POSE; A CASE IS WHAT AN OPERATOR ASKS FOR.
  # nav.goals above is the acceptance set - one pose, sent once, scored
  # at rest - and every figure in EVIDENCE_NAV_V3.md 16 is off it. It
  # does not exercise three things m6's autopilot cases did, and this
  # table is those three plus the one the acceptance set left at 2 of 3:
  #
  #   a goal that CHANGES while the vehicle is driving       (preempt)
  #   an approach into a STATION-class pose                   (approach)
  #   a leg the vehicle can only drive COUNTERWEIGHT-FIRST    (#5714)
  #   the leg that is marginally stable, repeated             (residual)
  #
  # A CASE IS ONE OR TWO GOALS AND ONE RULE FOR THE SECOND. `goal` is
  # sent first; if `then` is present, `when` says how the second arrives:
  #
  #   when: preempt   the second goal is sent WHILE the first is still
  #                   running, the moment the BELIEVED distance to the
  #                   first falls below preempt_at_m. navigate_to_pose
  #                   is a single-goal action server, so this is a real
  #                   preemption: nav2 aborts the running goal and takes
  #                   the new one. What that costs at the terminals -
  #                   whether the truck stops, how long the command
  #                   stream is interrupted, how long until a plan to
  #                   the new goal exists - is the measurement.
  #   when: after     the second goal is sent once the first has
  #                   RETURNED and the vehicle has settled. It is not a
  #                   preemption; it is a second errand from wherever
  #                   the first one ended, which is the only way this
  #                   bench can start a run from a pose that is not the
  #                   spawn.
  #
  # THE TRIGGER IS THE BELIEVED POSE AND NOT THE GROUND TRUTH, and that
  # is deliberate even though this is a bench and not a controller: the
  # pose the trigger fires on is map -> base_link, the same one the goal
  # checker and the no-progress watchdog see, so the three cannot
  # disagree about where the vehicle was. Ground truth stays an
  # instrument (F2 constraint 13).
  cases:
    # THE HEADLINE, AND IT IS THE ONE REPEATED THREE TIMES. A truck is
    # sent down the ring's north leg to the spine junction and re-tasked
    # half way there to the pick aisle's east end - the ordinary fleet
    # event that nav.goals cannot produce, because every goal in it is
    # sent to a standing vehicle.
    #   BOTH ENDS ARE KNOWN GROUND: spine_north arrived 6 of 6 and
    #   aisle_end 2 of 2 in 16.5, so what this case adds over them is
    #   the SWITCH and nothing else.
    #   8.00 m OF REMAINING DISTANCE is a little under half of the
    #   17.00 m first leg. It is chosen to fire while the vehicle is at
    #   the transit ceiling and well outside GoalCritic's 1.4 m
    #   threshold_to_consider, so the preemption lands in the middle of
    #   a transit rather than in an endgame - which would be a different
    #   measurement wearing this one's name.
    aisle_transit:
      goal: "spine_north"
      then: "aisle_end"
      when: "preempt"
      preempt_at_m: "8.00"
      repeat: "3"
      note: "aisle transit, re-tasked mid-path (the HEADLINE case)"
    # THE APPROACH. One goal, the station class, scored the way 16.6
    # scores an approach: where the 0.60 m box latched, what the heading
    # was there, and what the whole corridor table would have cost.
    station_approach:
      goal: "station_s5"
      repeat: "1"
      note: "forks-first into S5 - approach semantics, not docking"
    # THE REVERSE LEG, AND THE ONLY WAY TO GET ONE ON THIS FLOOR IS TO
    # PARK THE TRUCK FIRST. A Reeds-Shepp cusp needs a start pose from
    # which the goal cannot be reached in one direction, and from the
    # spawn - the middle of an 8.00 m corridor - there is no such goal
    # on the road graph: the planner always has room to arc. So the
    # first leg drives INTO the bay and the second asks for the ring
    # junction it came from, with the truck's forks 4.00 m from a back
    # panel and its turning radius 1.25 m.
    #   IF THE PLANNER STILL REFUSES TO PRODUCE A CUSP, THAT IS THE
    #   FINDING AND IT IS RECORDED AS ONE. `drive_goal.py probe` asks
    #   the planner alone, commands no motion, and reports the cusp
    #   count of the path it would drive - which is how this pair was
    #   chosen rather than guessed.
    reverse_out:
      goal: "station_s5"
      then: "ring_s5_junction"
      when: "after"
      repeat: "1"
      note: "into the bay, then OUT of it - the #5714 reverse leg"
    # THE RESIDUAL. 16.4c left ring_corner at 2 of 3 with the mechanism
    # UNCONFIRMED and two levers deliberately unpulled. Three more runs
    # on the same parameter tree take that sample from 3 to 6, which is
    # what a bimodal outcome needs before anything is changed on account
    # of it.
    ring_stress:
      goal: "ring_corner"
      repeat: "3"
      note: "the 37 m leg, x3 - 16.4c's residual gets its sample"

  # ------------------------- THE DRIVEN RUN ----------------------------
  # How long ONE navigate_to_pose may take before the bench cancels it.
  # The longest goal here is about 47 m; at the transit ceiling of
  # 0.300 m/s that is 157 s of driving, and the corners, any cusps and
  # the stop are on top. 480 s is three times the driving time -
  # a budget for a stack that is struggling rather than one that is
  # stuck.
  goal_timeout_s: 480

  # --------------------- THE FAIL-FAST, F4 TASK 2.5 --------------------
  # `goal_timeout_s` above is a LAST RESORT and not a fail-fast: it is
  # the bench giving up, three times the driving time, on a run nobody
  # is watching. EVIDENCE_NAV_V3.md 15.7 item 2 is the finding it is the
  # wrong answer to - "a goal that cannot be reached should fail FAST,
  # and nothing in this configuration makes it" - measured as 130.199 m
  # driven and 459 plans published for a goal 2.910 m away.
  #
  # THERE ARE TWO GUARDS AND THEY ANSWER DIFFERENT QUESTIONS. Neither is
  # a safety function and neither inhibits motion.
  budget:
    # THE TREE'S GUARD - a BT.CPP `<Timeout>` decorator wrapping the
    # whole of behavior_trees/navigate_to_pose_tricycle_v3.xml. It is
    # nav2-side, so it protects ANY consumer of navigate_to_pose and not
    # only this bench, and when it fires the action ABORTS.
    #   It is a TIME bound and it is honest about that: it cannot tell a
    # slow legitimate route from an orbit. What it bounds is the thing
    # that must never happen again - an unbounded drive.
    #
    # THE NUMBER, AND tests/test_nav2_params.py RECOMPUTES IT FROM THESE
    # THREE AND THE XML:
    #
    #   budget_s = ceil(longest_route_m / (vx_max * speed_fraction)
    #                   + recovery_allowance_s)
    #            = ceil(45.709 / (0.300 * 0.5) + 30.0)
    #            = ceil(334.73) = 335
    #
    # 45.709 m is the longest FIRST PLAN this track has measured -
    # aisle_end's, which is the road graph's own 47 m route
    # (EVIDENCE_NAV_V3.md 15.5). vx_max is nav2.yaml's transit ceiling
    # and is read from there, because that file owns it.
    longest_route_m: "45.709"
    # HALF the transit ceiling, averaged over the whole route. A healthy
    # run averages far more than that - the fixed controller drove
    # 16.554 m in 57.5 s, 0.288 m/s, 96 % of the ceiling - so this
    # allows a route to be half-speed from end to end and still arrive.
    speed_fraction: "0.5"
    # The tree's own recovery set: six retries of a `Wait 5.0`.
    recovery_allowance_s: "30.0"
  watchdog:
    # THE BENCH'S GUARD, and it is the GOAL-RELATIVE one. It watches the
    # BELIEVED pose - map -> base_link, the same pose the goal checker
    # sees - and requires the vehicle to keep CLOSING on the goal.
    #   A vehicle that has driven past its goal and is orbiting satisfies
    # nav2's own SimpleProgressChecker completely (any 0.30 m of movement
    # in 15 s), which is why that checker cannot be the answer: it asks
    # whether the vehicle MOVED, and the question is whether it moved
    # TOWARD anything.
    #
    # THE RULE: from the last mark, the straight-line distance to the
    # goal must improve by at least `required_closing_m` within
    # `closing_allowance_s`, or the run is abandoned as `no_progress` -
    # a NAMED outcome in the session file, not a timeout.
    #
    # BOTH NUMBERS ARE SIZED ON THE RECORDED FAILURES AND THE RULE WAS
    # RUN AGAINST EVERY SESSION ON DISK BEFORE IT WAS WRITTEN. It was
    # first sized on the twelve that existed then; the separation below
    # is the one measured over all 44 driven-goal sessions
    # (EVIDENCE_NAV_V3.md 16.7b, replayed by drive_goal.no_progress_at):
    #
    #   it fires on 0 of the 20 runs that ARRIVED
    #   it fires on 20 of the 24 runs that MISSED
    #
    # NO FALSE POSITIVES, AND IT IS NOT A COMPLETE CATCH - the claim is
    # stated that way round because an earlier draft of this comment
    # said "the failures ALWAYS do", and they do not. Of the four
    # misses this replay does not catch, one (`ring_corner-...180823`)
    # WAS abandoned by the live watch and is simply not reproduced by
    # the offline replay - the rule is one object but `record` composes
    # map -> base_link with a zero-order hold and `analyse` interpolates
    # it, which is enough to move a mark on a run whose distance is
    # swinging by metres. The other three ended on their own in 18.2 s,
    # 112.0 s and 140.0 s: a guard with a 30 s allowance has nothing to
    # catch in a run that fails inside its own window.
    #   30.0 s is 9.0 m of travel at the transit ceiling for less than
    # half a metre of net approach, which no legitimate leg of this
    # floor's road graph does. 0.50 m is where the two populations
    # separate: no arrival has ever gone 30 s without closing half a
    # metre on its best.
    #   A LOCALISATION JUMP CANNOT FALSELY TRIP IT, and the asymmetry is
    # why. The rule fires on a FAILURE TO IMPROVE. A map -> odom
    # correction that moves the belief AWAY from the goal cannot satisfy
    # the improvement test and so cannot reset the mark either - it
    # simply is not an improvement; one that moves the belief TOWARD the
    # goal resets the mark and makes the rule MORE lenient. The worst
    # such correction measured under a closed loop is 0.8310 m
    # (EVIDENCE_LOCALIZATION_V3.md 13.10a, over all 44 sessions), and in
    # either direction it can only delay this guard, never provoke it.
    #
    # WHAT IT ASSUMES, STATED: that the route CLOSES on the goal. A goal
    # whose road-graph route must first travel AWAY from it would trip
    # this rule legitimately, and the tree's time budget above is the
    # guard that covers that case. None of nav.goals is such a route.
    required_closing_m: "0.50"
    closing_allowance_s: 30.0
  # After the action returns, keep recording. The result arrives when
  # the GOAL CHECKER passes, and the truck is still moving then: it
  # takes up to 2.07 s and 1.02 m to stop from cruise
  # (EVIDENCE_NAV_V3.md 8). An arrival scored at the instant the action
  # returned would be scored before the vehicle had arrived.
  settle_s: 5.0
  # Before the goal is sent, record this long standing still. It is what
  # gives the jump statistics a baseline and what shows the command path
  # was silent until Nav2 spoke.
  prelude_s: 3.0

  analyse:
    # The window at the END of the recording over which the resting pose
    # is averaged. 1.0 s is 50 samples of the estimator's 50 Hz output
    # and about 15 of the localiser's own broadcasts.
    arrival_window_s: 1.0
    # A truck still moving at the end of the settle has not arrived, and
    # averaging its pose would report a place it drove through. Below
    # this it is at rest; it is navcmd.zero_speed_mps times ten, an
    # order under the creep deadband.
    at_rest_mps: "0.010"
    # THE JUMP RESPONSE WINDOW. After each map -> odom step, how long to
    # look at what the controller did about it. 1.0 s is 20 controller
    # ticks and 15 scan periods - long enough for the step to have
    # reached the controller through the costmap and for its answer to
    # have reached the terminals through the smoother's ramp.
    jump_response_s: 1.0
    # A hole in the map -> odom stream wider than this is a REFUSAL and
    # not a straight line drawn through the part of the run where the
    # absolute pose was unknown. It is localization.analyse.map_gap_s's
    # number and its argument: fifteen scan periods.
    map_gap_s: "1.0"
    # THE SPEED BELOW WHICH A COMMAND IS NOT SCORED FOR CURVATURE
    # FOLLOWING. The plan's curvature is a demand PER METRE and the yaw
    # rate it implies is that demand times the speed, so at a stop the
    # demand is real and the yaw rate it asks for is zero. A vehicle
    # standing at a cusp would contribute a pile of (0, 0) pairs and
    # flatter any gain towards its own intercept. 0.05 m/s is a sixth of
    # the transit ceiling and ten times the cusp deadband below.
    follow_speed_mps: "0.05"
    # HOW MANY PLAN POSES THE CURVATURE IS TAKEN OVER. One segment is a
    # difference of two yaws over 0.1 m and carries the planner's own
    # quantisation; four poses is about 0.4 m on this floor's measured
    # 0.083-0.105 m spacing - well inside the 1.25 m radius being
    # measured and well outside the spacing.
    curvature_span: 4
    # THE CANDIDATE GOAL BOXES THE APPROACH CORRIDOR IS REPORTED AT.
    # These are not tolerances and nothing is evaluated against them:
    # they are the rungs of a table that says what each WOULD have cost
    # in arrival heading, because a smaller box drives the vehicle
    # deeper into an endgame that has no heading term in it. 0.25 is the
    # station class (m6/ipc/stations.py) and 0.60 is the box this file's
    # nav2.yaml actually ships; the rest bracket them.
    corridor_boxes: ["2.00", "1.50", "1.00", "0.75", "0.60", "0.50",
                     "0.40", "0.30", "0.25", "0.20", "0.15", "0.10"]
    # A run that misses comes BACK at its goal, through a Reeds-Shepp
    # loop, from a heading the first pass never had. The corridor is a
    # table about ONE approach, so the walk is cut at the first local
    # minimum the run then backs this far out of.
    #   THE ARGUMENT FOR HALF A METRE IS A WALK AND NOT A STEP, AND AN
    # EARLIER CUT OF THIS COMMENT GOT THE INEQUALITY BACKWARDS. It said
    # "half a metre is above the worst closed-loop map -> odom
    # correction measured (0.6490 m)", which is false in the direction
    # it matters - 0.50 is BELOW 0.6490, and below every figure that one
    # has since become. THE AMENDMENT IS NOW 13.10b AND NOT 13.10a, and
    # the bound moved twice: 0.8310 m closed loop (13.10a), then
    # 1.1919 m on the `amcl` arm and 0.8845 m on `slam` (13.10b), with
    # NO established maximum. The comparison was never the right one
    # either way: a map -> odom correction is a STEP in the believed
    # pose between two consecutive broadcasts, and this threshold is a
    # cumulative BACKING-OUT of a local minimum in the distance-to-goal
    # walk. A single 1.19 m step away from the goal would indeed end
    # the walk one sample early -
    # and that is the conservative direction, because the corridor is a
    # table about the FIRST approach and cutting it early can only drop
    # rungs, never invent one. What the number has to be under is the
    # Reeds-Shepp loop a missing run flies (metres), and it is.
    corridor_give_up_m: "0.50"
    # HOW FAR SHORT OF THE GOAL THE TRANSIT ENDS, along track. The
    # heading account (drive_goal.heading_account) integrates
    # |v|*sin(psi) over the approach, and past this point the vehicle is
    # in an endgame where psi sweeps through a right angle as it hooks
    # round - integrating that would be an account of the pirouette
    # rather than of the transit the miss accumulated over. 3.0 m is
    # twice GoalCritic's own threshold_to_consider (1.4 m), which is
    # where the path critics hand over to a point attraction.
    transit_margin_m: "3.0"
    # A CUSP is a sign change in the commanded linear.x. Below this the
    # command is inside the converter's own creep deadband and its sign
    # is not a direction, so a crossing is counted only where a real
    # command changed hands (navcmd.creep_speed_mps).
    cusp_speed_mps: "0.005"

# ------------------------------ DOCK -----------------------------------
# F5 Task 1. Station furniture arithmetic: where the marker stands, where
# the truck is docked when the forks are in the load, and where it STAGES.
# tools/tag_core.py computes all three from m6/ipc/stations.py's station
# point plus the four distances below. No pose in this block is typed in.
#
# THE SHOWCASE STATION IS S5 / PICK-NE-1. EVIDENCE_NAV_V3.md 20.5 item 1
# is the only station-class arrival this track has; F5 docks there first.
# The other eleven stations share the same four distances on the pick
# bays; annex bays (S9-S12) are a later pass.
dock:
  station: "S5"
  # tag36h11: 6x6 data + 1-cell black border = width_at_border 8, plus
  # the 1-cell quiet zone apriltag_to_image draws = total_width 10.
  # apriltag_ros `size` is the BLACK SQUARE, not the printed tile.
  family: "tag36h11"
  tag_id: "0"
  size_m: "0.40"
  width_at_border: "8"
  total_width: "10"
  # station point -> back-panel face, along travel. S5 is at y = 4.25
  # and stations.py puts that face at y = 2.60; 4.25 - 2.60 = 1.65.
  marker_ahead_m: "1.65"
  # base_link -> fork tips, UNGROWN, off model.sdf. Same number as
  # monitor.geometry.fork_tip_x_m with the sign stripped; tests/test_tag_core.py
  # refuses a drift between the two.
  fork_reach_m: "1.875"
  tip_standoff_m: "0.10"
  # docked pose -> staging pose, backwards along the spur. EVIDENCE_NAV_V3.md
  # 16.6 / 20.5 item 2 measured the heading still inside 0.10 rad at a
  # 1.50 m box on a station spur. 2.00 m is that run-in plus the
  # START_OCCUPIED trap-zone clearance (item 3): tests/test_tag_core.py
  # recomputes the margin from nav2.yaml's grown footprint and refuses
  # a staging pose that would land inside it.
  staging_run_in_m: "2.00"
  # Height of the tag CENTRE in the world, metres. The pallet camera sits
  # at z = 1.10 and looks 30 deg down (model.sdf pallet_cam_link). At the
  # staging range (~4 m) a centre at 0.80 m is 4.3 deg below the camera
  # horizon, inside the 35 deg vertical half-aperture; at the docked
  # range it is still above the 0.6 m near clip.
  marker_z_m: "0.80"
  # Board thickness. Collision AND visual. Thick enough for the nav
  # lidar (z = 1.80) to miss it - the tag is below the scan plane on
  # purpose - and for the GLOBAL costmap's obstacle layer to still see
  # it once a pallet or a back-board that DOES reach 1.80 is spawned
  # beside it. This thickness is the printed tile, not the pallet.
  tag_thickness_m: "0.02"
