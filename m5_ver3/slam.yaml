# slam.yaml - what slam_toolbox does on this track, in TWO blocks:
# `slam_toolbox:` is the MAPPER that built the frozen map (F3 Task 1,
# read by tools/build_map.sh) and `slam_loc:` is the LOCALISER that
# tracks in it (F3 Task 3, read by `m5v3.sh start --localize slam`).
#
# TWO NODES IN ONE FILE IS amcl.yaml's SHAPE AND IT IS DELIBERATE.
# rclcpp applies NOTHING from a block addressed to a node that is not
# running, and says nothing at all about it, so the file that holds both
# is the file a reader can compare them in - which is the whole point
# when the localiser's values are the mapper's values RE-ARGUED for a
# node that tracks in a graph rather than one that builds it. m5v3.sh and
# build_map.sh each grep for their own node's top-level key before
# starting anything, for check_ekf_params()'s reason.
#   THE TWO BLOCKS SHARE NO LINES AND CANNOT. rcl_yaml_param_parser is a
#   hand-written C parser with no support for YAML anchors, aliases or
#   merge keys, so `<<: *mapper` is not available here at any price. The
#   duplication is therefore forced - and it is also the honest shape,
#   because every value in the second block had to be argued again and
#   several of them came out different.
#
# ---- ONE STALE HASH THIS FILE CREATED, STATED RATHER THAN LEFT TO BE
#      FOUND ----
#
# maps/warehouse_v3/build.txt records `slam_params_md5:
# 076ae1e9d38fbbab7c7d6c03dc296975` - the md5 of THIS FILE as it stood
# when the map was built, when it held the mapper block alone. F3 Task 3
# APPENDED the `slam_loc:` block below, so the file no longer hashes to
# that value and build.txt is a frozen artifact that may not be edited
# (F3 constraint 16). Both facts are true and neither is a defect:
#   - the MAPPER block is byte-unchanged, which git proves rather than
#     asserts: `git diff <F3-T2-tip> -- m5_ver3/slam.yaml` is additions
#     below the mapper block and this header, and nothing else;
#   - the localiser block is addressed to `slam_loc:` and
#     sync_slam_toolbox_node never reads a line of it;
#   - and a rebuild is a NEW artifact under a new map.name with its own
#     build.txt (F3 constraint 16), which would record the md5 of the
#     file as it is now.
# EVIDENCE_LOCALIZATION_V3.md 13 carries the same statement where the
# figures are.
#
# WHY IT IS A SECOND FILE BESIDE config.yaml, and it is ekf.yaml's
# argument applied a third time. slam_toolbox's nodes read a ROS
# *parameter* file - a top-level node name, a `ros__parameters:` mapping,
# and names they declare themselves - and config.yaml is not one and is
# not bent into one. So config.yaml keeps the paths, the playback rate,
# the timeouts and the name of this file, tools/build_map.sh and m5v3.sh
# pass them on the command line, and THIS file holds what the mapper and
# the localiser are configured to DO. NO NUMBER IS IN BOTH.
#
# THE VERSION IS 2.8.5, jazzy, and it matters twice below. Every default
# quoted here was READ OFF THE RUNNING NODE on this rig 2026-08-26
# (`ros2 param get /slam_toolbox <name>` after the configure and
# activate transitions - a lifecycle node declares nothing before them),
# not copied from a README - which is how the two paragraphs about
# missing parameters below came to be written at all.
#
# NOTHING IN THIS FILE WAS MOVED BECAUSE THE MAP LOOKED BETTER
# AFTERWARDS. Each non-default below is argued from a MEASURED property
# of this sensor, this vehicle or this floor, and each would be the same
# value if the map had come out worse. The knobs a map is most easily
# flattered with - the correlation search space, the loop-closure
# response thresholds and the scan-matcher penalties - are left at their
# shipped values ENTIRELY, and that is a deliberate refusal: this gate's
# job was to find out what warehouse_ver3 does to a scan matcher, not to
# arrange it.
#
# ---- TWO PARAMETERS THE SHIPPED OFFLINE FILE HAS AND THIS BUILD DOES
#      NOT DECLARE, WHICH IS WHY THEY ARE ABSENT RATHER THAN SET ----
#
# /opt/ros/jazzy/share/slam_toolbox/config/mapper_params_offline.yaml
# carries `min_laser_range: 0.0` and `max_laser_range: 20.0`. This build
# declares NEITHER. Measured on this rig 2026-08-26: the node was started
# bare, driven through configure AND activate, and
# `ros2 param list /slam_toolbox` then returns 68 names (the four
# qos_overrides aside) - among them `map_update_interval` and
# `transform_publish_period`, which are declared in on_activate rather
# than on_configure, and NOT either laser range. Both keys in the vendor
# file are therefore read by nothing. Setting them here would have looked
# like a decision about how far this map ray-traces and would have been a
# comment.
#   WHAT DECIDES THE RANGE INSTEAD IS THE SCAN MESSAGE. The nav lidar
#   publishes range_min 0.05 and range_max 25.0 (the TiM571 profile in
#   gazebo/forklift_ver3/model.sdf), and those two fields are what the
#   mapper is given. EVIDENCE_MAP_V3.md checks that rather than asserting
#   it: the built grid carries returns from the far side of a 48 m hall
#   seen from the ring, which is only reachable at more than 20 m.
#
# ---- WHAT IS NOT CONFIGURED HERE AT ALL ----
#
# The offline run's WIRING - which bag, which topics, which frames get a
# static transform, which domain the replay lives on - is
# tools/build_map.sh and config.yaml's map: block. This file would be the
# same file if the recording had been made a different way.

slam_toolbox:
  ros__parameters:

    # ================= SOLVER =================
    # THE SHIPPED BLOCK, UNCHANGED, ALL FIVE LINES. Ceres with a sparse
    # normal Cholesky and Levenberg-Marquardt is what every slam_toolbox
    # config in the package ships and what the package is tuned around.
    # A different linear solver is a different optimiser and would make
    # this map incomparable with anything, for no reason anybody here
    # has.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ================= THE CONTRACT, AND IT IS NOT IN THIS FILE =========
    #
    # FOUR NAMES BELONG HERE BY SUBJECT AND ARE ABSENT BY RULE:
    #
    #     scan_topic   config.yaml topics.scan_nav      /forklift/gz/scan_nav
    #     base_frame   config.yaml frames.base_link     base_link
    #     odom_frame   config.yaml frames.odom          odom
    #     map_frame    config.yaml frames.map           map
    #
    # tools/build_map.sh passes all four on the mapper's command line as
    # `-p` OVERRIDES, read from those config.yaml keys. THIS FILE MAY NOT
    # HOLD A COPY OF THEM, and the values in the middle column above are
    # written here to be READ rather than to be applied - an override
    # wins over a params file, so a copy in this file would not even fail
    # loudly, it would sit here disagreeing with the stack until somebody
    # believed it.
    #   IT IS m5v3.sh's RULE FOR ekf.yaml AND fuse.yaml, APPLIED A THIRD
    #   TIME (m5v3.sh, the ekf child: "everything here is a name or a
    #   rate that is already written down elsewhere on this track ... and
    #   is passed as a `-p` override so that ekf.yaml cannot hold a
    #   second copy of it"). What ekf.yaml holds is what is FUSED and
    #   what is REFUSED; what this file holds is what the MAPPER DOES.
    #   Neither holds an address.
    #   AND THE COST OF THE COPY WAS NOT HYPOTHETICAL HERE. Until F3's
    #   first fix round these four were keys in this file AND four
    #   `load_config` entries in build_map.sh that were only printed into
    #   build.txt - so a divergence would have produced a manifest
    #   describing a map that had been built with the other four values.
    #
    # WHY EACH ONE IS NOT THE PACKAGE DEFAULT, which is the part that IS
    # this file's business:
    #
    #   scan_topic   slam_toolbox defaults to `/scan`. The bridged nav
    #                lidar is the ONLY sensor in this map: the 3D lidar
    #                is not bridged, the three safety scanners are frozen
    #                by the PLC field contract, and the depth camera is
    #                not a 2D scan.
    #   base_frame   slam_toolbox defaults to `base_footprint`. This
    #                track carries no URDF and no robot_state_publisher,
    #                so there IS no base_footprint frame - the odometry,
    #                the filter and the static sensor mounts all name
    #                base_link, and the default would make every
    #                transform lookup fail.
    #   odom_frame   the package default happens to match, and it is
    #                F2's EKF that owns odom -> base_link. THIS NODE OWNS
    #                map -> odom AND NOTHING ELSE, which is the whole of
    #                F3 constraint 15: two publishers of one edge is a
    #                tree tf2 resolves by arrival order.
    #   map_frame    the package default happens to match.

    # THE RUN IS OFFLINE AND THE CLOCK IS THE PLANT'S. The bag carries
    # /clock as it was recorded, `ros2 bag play` republishes it, and every
    # stamp in the recording is on that timeline. With use_sim_time false
    # this node's now() would be wall time, every recorded transform
    # would look hours stale, and the tf2 message filter would drop the
    # entire scan stream.
    use_sim_time: true

    mode: mapping
    debug_logging: false
    # EVERY SCAN IS OFFERED TO THE MAPPER (default). Throttling here
    # would be a second, blunter travel gate on top of the three below,
    # and it would make the node spacing depend on the SPEED the profile
    # happened to drive at.
    throttle_scans: 1
    # map -> odom, at 50 Hz. Nothing consumes it in an offline run - the
    # bag is the only source of motion - but it is what the same
    # parameter file would publish live, and it costs nothing.
    transform_publish_period: 0.02
    # The shipped offline file's value, and this parameter carries no
    # default of its own - `ros2 param get` on a node that was given none
    # answers "Parameter not set" - so it is given rather than assumed.
    #   IT IS A RASTER OF THE WHOLE GRAPH EACH TIME, so it is not free:
    #   at the end of this run the graph is about 800 nodes of 811 beams.
    #   It does not change the map that is finally saved - the saved grid
    #   is the LAST one published, and config.yaml's map.slam.settle_s
    #   keeps the node alive long enough after the bag ends for at least
    #   one more.
    map_update_interval: 10.0
    # 0.05 m cells, the default, and it is a CONTRACT rather than a
    # taste: whatever localises against this map later has to raster its
    # own costmaps at a resolution that divides into it, and 0.05 is what
    # every Nav2 default in this repository already assumes.
    #   IT IS ALSO THE INSTRUMENT FLOOR'S FIRST TERM. A cell is 0.05 m,
    #   so a wall's position in this grid is quantised to +-0.025 m
    #   before any noise, any drift or any fit is considered.
    resolution: 0.05
    restamp_tf: false
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    # NO RVIZ AND NO HUMAN. An offline replay has no interactive markers
    # to serve and nothing to drag; the default is already false and it
    # is written down because `mapper_params_offline.yaml` ships it TRUE
    # and a reader comparing the two files should see the difference is
    # meant.
    enable_interactive_mode: false
    # NON-DEFAULT (true). THERE IS EXACTLY ONE MAP EXPORTER AND IT IS
    # nav2's map_saver_cli, run by tools/build_map.sh with the two
    # thresholds config.yaml's map.slam block states. slam_toolbox's own
    # saver would be a second path to the same artifact with its own
    # unstated thresholds, and a grid is the thing everything downstream
    # is scored against.
    use_map_saver: false

    # ================= WHEN A SCAN BECOMES A NODE =================
    #
    # THREE GATES AND ALL THREE HAVE TO PASS. A scan enters the graph
    # only when it is far enough, turned enough AND late enough since the
    # last one, so the slowest of the three is what actually decides the
    # spacing. That is why the time gate is here at all: at this
    # profile's 0.2990 m/s the shipped 0.5 s would fix the spacing at
    # 0.15 m and the travel gates below would never get a vote.
    #
    # minimum_travel_distance  NON-DEFAULT, 0.5 -> 0.30
    #   The floor's own scale. warehouse_ver3's rack bays repeat every
    #   5.75 m and its rack segments are 0.50 and 1.00 m long, so the
    #   along-corridor features a scan matcher can use on the ring are
    #   the rack ENDS - and at 0.50 m spacing a 0.50 m rack segment can
    #   be crossed between two nodes. 0.30 m puts at least two nodes on
    #   the shortest feature the floor has. Over the 225.0 m the mapping
    #   drive covered it is about 750 nodes, which is a graph Ceres
    #   solves in well under a second.
    # minimum_travel_heading   NON-DEFAULT, 0.5 -> 0.20 rad
    #   The mapping drive takes NINE 90 degree corners
    #   (config.yaml drive_route.profiles.mapping). At the shipped
    #   0.5 rad a corner is three nodes about 28.6 degrees apart, which
    #   is inside coarse_search_angle_offset (0.349 rad = 20.0 deg) by
    #   nothing at all - the coarse match would be searching from an
    #   angle further away than its own window. 0.20 rad makes a corner
    #   eight nodes and every one of them a match the search window
    #   comfortably contains.
    # minimum_time_interval    NON-DEFAULT, 0.5 -> 0.20 s
    #   Two scan periods at this sensor's 15 Hz (0.1333 s), so it is a
    #   floor that never binds at any speed this vehicle drives: at
    #   0.2990 m/s the distance gate wants a node every 1.00 s and at the
    #   0.7 m/s the other profiles use it wants one every 0.43 s. It is
    #   here to stop a STOPPED truck filling the graph, and for nothing
    #   else.
    minimum_travel_distance: 0.30
    minimum_travel_heading: 0.20
    minimum_time_interval: 0.20
    check_min_dist_and_heading_precisely: false

    # ================= THE RUNNING SCAN =================
    #
    # scan_buffer_size  NON-DEFAULT, 10 -> 30
    #   The chain of recent nodes each new scan is matched against. At
    #   0.30 m spacing the shipped 10 is 3.0 m of history against a
    #   sensor that sees 25.0 m, so the running scan would be a small
    #   patch inside a horizon it cannot fill. 30 nodes is 9.0 m, which
    #   is longer than the 8.00 m width of every cruise corridor on this
    #   floor and longer than the 5.75 m rack pitch - so the running scan
    #   always contains at least one rack END, which is the only
    #   along-corridor feature there is.
    #   IT DOES NOT FIX A DEGENERATE CORRIDOR AND NOTHING CAN. Where a
    #   scan carries no along-aisle information, a longer memory only
    #   remembers more of the same; what it buys is that the memory
    #   spans the pitch of the features that DO exist.
    # scan_buffer_maximum_scan_distance  NON-DEFAULT, 10.0 -> 25.0
    #   Nodes further than this from the running scan's barycentre are
    #   dropped out of the chain. The shipped 10.0 is BELOW this
    #   sensor's own 25.0 m range, so it would throw away exactly the
    #   long-range returns - the far wall of a 48 m hall - that carry
    #   the most geometry. It is set to the scanner's range and not past
    #   it: a value larger than what the sensor can see would only keep
    #   nodes whose scans do not overlap.
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 25.0
    # NON-DEFAULT, 1 -> 10. The tf2 message filter's queue: how many
    # scans may wait for their transform before the oldest is dropped.
    # Live, at 15 Hz against a 50 Hz transform, nothing ever waits and 1
    # is right. IN A REPLAY the interleaving of two recorded topics is
    # not the interleaving the plant produced - rosbag2 plays by receive
    # time - so a scan CAN arrive a beat before the transform that
    # brackets it. A queue of 10 costs 10 scans of memory and removes the
    # one place a replay could silently drop a measurement the plant
    # delivered, which is the property the whole offline-sync choice was
    # made for.
    scan_queue_size: 10

    # ================= SCAN MATCHING =================
    # Both default. use_scan_matching false would make this dead
    # reckoning with a raster on top, and the odometry it would be dead
    # reckoning on accumulates 9.86 m over this drive (EVIDENCE_MAP_V3).
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ================= LOOP CLOSURE =================
    #
    # THE DRIVE CROSSES ITS OWN TRACK ON PURPOSE and this is what reads
    # that. config.yaml's mapping: profile re-drives the north leg 180 m
    # after it started, and the west and south legs after that; the spine
    # and the pick aisle cross at (0, 0) and the drive passes through
    # that crossing twice, about 200 s apart.
    #
    # loop_search_maximum_distance  NON-DEFAULT, 3.0 -> 5.0
    #   How far from the current pose a candidate for closure may be. It
    #   has to be LARGER than the drift the corrected trajectory has
    #   accumulated when it comes back, and SMALLER than the distance at
    #   which this floor starts to look like itself.
    #     THE UPPER BOUND IS THE FLOOR'S OWN PITCH AND IT IS 5.75 m. The
    #     rack segments stand at x = +-4.25, +-10.00 and +-15.75, so the
    #     rack block repeats every 5.75 m along both rack rows and a
    #     search radius past that can find a bay that is not the bay it
    #     is standing in. 5.0 m is inside it.
    #     THE LOWER BOUND IS MEASURED. The odometry this map is built on
    #     - F2's EKF, which is what the recording carries - drifts
    #     9.86 m of position and 23.4 degrees of heading over the 225.0 m
    #     of this drive (EVIDENCE_MAP_V3.md 3). The CORRECTED trajectory
    #     is not that bad, because every node is scan-matched onto the
    #     running map before it is added - but 3.0 m is smaller than the
    #     raw drift over even a quarter of the run (1.70 m at 25 %,
    #     6.44 m at 50 %), so the shipped value is a radius that could
    #     plausibly be smaller than the error closure exists to remove.
    #     THE COST IS STATED RATHER THAN HIDDEN: between 3.0 m and 5.0 m
    #     nothing in this configuration answers the aliasing question,
    #     and what guards it is that BOTH response thresholds below are
    #     left at their shipped values, so a bay that merely resembles
    #     the right one still has to beat 0.35 coarse and 0.45 fine.
    # loop_search_space_dimension   NON-DEFAULT, 8.0 -> 10.0
    #   The side of the correlation grid the candidate chain is matched
    #   in. It brackets the search radius above: +-5.0 m needs 10.0 m of
    #   grid, and the shipped 8.0 would have made the last metre of the
    #   radius unreachable - a radius that admits candidates the
    #   correlator cannot then look at is a radius that is not really
    #   there.
    # EVERY OTHER LINE IN THIS BLOCK IS SHIPPED AND UNTOUCHED, including
    # both response thresholds and the chain size, for the reason in the
    # header: these are the numbers a map is flattered with.
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 5.0

    # ================= CORRELATION, ALL SHIPPED =================
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 10.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ================= PENALTIES, ALL SHIPPED =================
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
    # The covariance the pose graph is handed for each constraint,
    # unscaled. Both default. Scaling them is how a factor graph is told
    # to trust the matcher more or less than the odometry, and this run
    # has no reading that would justify moving either.
    position_covariance_scale: 1.0
    yaw_covariance_scale: 1.0

# ======================================================================
#  slam_loc: - WHAT THE LOCALISER DOES, F3 Task 3
# ======================================================================
#
# `m5v3.sh start --localize slam` runs slam_toolbox's
# localization_slam_toolbox_node over the SAME frozen pose graph the
# block above produced, as the alternative to nav2_amcl over the same
# build's grid. The research this phase is built on could not settle
# which is better: docs/reports/m5v3-01 ranks pose-graph localisation
# ABOVE AMCL on a published comparison, m5v3-04 ranks it BELOW on field
# reports of imprecision and "snap" relocalisations (slam_toolbox issue
# #285). EVIDENCE_LOCALIZATION_V3.md 13 is this rig's answer.
#
# ---- WHAT IS *NOT* IN THIS BLOCK, AND WHY ----
#
# SEVEN NAMES BELONG HERE BY SUBJECT AND ARE ABSENT BY RULE - the four
# the mapper block already lists, plus three of this arm's own:
#
#     scan_topic     config.yaml topics.scan_nav     /forklift/gz/scan_nav
#     base_frame     config.yaml frames.base_link    base_link
#     odom_frame     config.yaml frames.odom         odom
#     map_frame      config.yaml frames.map          map
#     map_name       config.yaml topics.map          /map
#     map_file_name  config.yaml map.dir + map.name  the frozen graph,
#                                                    without its suffix
#     map_start_pose vehicle.spawn THROUGH the committed registration
#
# m5v3.sh passes all seven as `-p` OVERRIDES. The first five are
# ADDRESSES config.yaml already owns; the sixth is the path to a frozen
# artifact whose md5 that script checks against build.txt before it
# starts anything; and the seventh is DERIVED at bringup and could not
# be written down here even if the rule allowed it.
#   map_start_pose IS THE SEED, AND ITS MECHANISM DIFFERS FROM AMCL's.
#   This node reads it in loadPoseGraphByParams() on the CONFIGURE
#   transition - before there is a graph to be lost in - and with
#   neither it nor map_start_at_dock it logs "Map starting pose not
#   specified" and starts at the graph's own origin. So the slam arm is
#   seeded by a PARAMETER where the amcl arm is seeded by a MESSAGE on
#   topics.initialpose, with the same three numbers out of the same
#   registration. config.yaml's localization.initial_pose block carries
#   the difference and what follows from it (the covariance that message
#   carries has no counterpart here, and the bringup gate must not
#   publish a seed on this arm or its own pose-against-seed check would
#   be checking the gate).
#   map_start_at_dock IS NEVER SET. The binary's own string for it reads
#   "Starting localization at first node (dock) is correctly not
#   supported"; the graph's first node is where the MAPPING drive
#   started, which is not where a run starts.
#
# ---- WHAT IS DELIBERATELY THE SAME AS THE AMCL ARM, AND WHY ----
#
# THE CORRECTION CADENCE. minimum_travel_distance below is 0.25 m and
# minimum_travel_heading is 0.20 rad, which are amcl.yaml's update_min_d
# and update_min_a exactly. That is not laziness and it is not
# inheritance from the mapper (which uses 0.30): it is what makes the A/B
# an A/B. Two localisers that corrected at different cadences would
# differ in accuracy AND in CPU for a reason that is a configuration
# choice rather than a property of either algorithm, and neither column
# of EVIDENCE_LOCALIZATION_V3.md 13 could then be read.
#   THE UNDERLYING DERIVATION IS THE SAME ONE AND IT SURVIVES THE MOVE.
#   Over 0.25 m of travel F2's EKF accumulates 10.6 mm of along-track
#   error dry and 24 mm wet (EVIDENCE_FUSION.md 8.5), both UNDER this
#   map's own registration residual of 0.0291 m rms. A finer threshold
#   would correct against distances this map cannot resolve. And 0.25 m
#   is still under the 0.50 m shortest rack segment on this floor, which
#   is the property the mapper's 0.30 was chosen for.
#
# ---- AND WHAT IS DELIBERATELY DIFFERENT FROM THE MAPPER ----
#
# THE LOOP-CLOSURE SEARCH RADIUS GOES BACK TO THE SHIPPED 3.0 m. The
# mapper block raised it to 5.0 with a measurement: the raw odometry it
# was correcting drifts 9.86 m over the 225.0 m mapping drive, so a
# 3.0 m radius could be smaller than the error closure exists to remove.
# A LOCALISATION run has no such drift to close - it starts from a seed
# whose own prior is 0.50 m and is corrected against a finished graph
# every 0.25 m of travel - so the lower bound that forced 5.0 m is
# simply absent, while the UPPER bound is unchanged and is the floor's:
# the rack block repeats every 5.75 m, and a search radius past that can
# find a bay that is not the bay the truck is standing in. 3.0 m sits
# further inside that than 5.0 did, so the non-tuned choice and the
# better-argued one are the same choice here.
#
# THE SCAN BUFFER IS SIZED IN METRES AND THE METRES CHANGED. 32 nodes at
# the 0.25 m cadence above is 8.00 m of running history, which is the
# width of every cruise corridor on this floor and 1.39 rack pitches -
# so the buffer always spans at least one rack END, the only
# along-corridor feature there is. The mapper's 30 was the same
# arithmetic at its own 0.30 m spacing (9.0 m); the number moved because
# the spacing did, and the property did not.
#
# ---- WHAT IS NOT TOUCHED, AND THE REFUSAL IS THE POINT ----
#
# LOOP CLOSURE IS LEFT ON. docs/reports/m5v3-04's whole prediction
# against this arm is snap relocalisation - a localiser that jumps when
# the graph decides it is somewhere else - and the mechanism that does
# that is loop closure against a candidate chain. Turning it off would
# answer the question this task was set by assumption instead of by
# measurement, and would also be a configuration nobody ships. Both
# response thresholds are shipped and untouched for the same reason:
# they are the numbers a localiser is flattered with, and
# EVIDENCE_LOCALIZATION_V3.md 8 measures what the jumps actually are.
#
# NOTHING IN THIS BLOCK WAS MOVED BECAUSE A RUN CAME OUT BETTER. Every
# value was fixed before the first scored run on this arm, and the
# finding that most obviously invites tuning (the same dynamic
# along-track offset the amcl arm has, EVIDENCE_LOCALIZATION_V3.md 9) is
# recorded rather than tuned away, exactly as amcl.yaml's header
# promises for the other arm.

slam_loc:
  ros__parameters:

    # ================= SOLVER =================
    # THE SAME SIX LINES AS THE MAPPER, AND THAT IS THE ARGUMENT. A
    # different linear solver is a different optimiser: the graph below
    # is the one the block above built, and re-optimising it under
    # another back-end would make every figure in the A/B a statement
    # about two things at once.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ================= THE MODE, WHICH IS THE WHOLE ARM =================
    # NON-DEFAULT (mapping). `localization` is what makes
    # loadPoseGraphByParams() deserialise map_file_name instead of
    # starting an empty graph, what makes every processed scan a
    # LOCALIZATION scan that is added to the graph and then removed
    # again, and what makes the serialize service refuse
    # ("LocalizationSlamToolbox: Cannot call serialize map in
    # localization mode!"). The frozen artifact is therefore read-only by
    # the vendor's own construction and not only by this track's
    # discipline - F3 constraint 16, enforced one layer further down than
    # it is anywhere else on this stack.
    mode: localization

    # THE CLOCK IS THE PLANT'S. Live rather than replayed this time, but
    # the reason is the mapper block's word for word: with use_sim_time
    # false this node's now() would be wall time, every stamped scan and
    # transform would look hours stale, and the tf2 message filter would
    # drop the entire scan stream.
    use_sim_time: true

    debug_logging: false
    # EVERY SCAN IS OFFERED (default). The travel gates below are what
    # decide the correction cadence; a second, blunter gate here would
    # make it depend on the SPEED the profile happened to drive at.
    throttle_scans: 1

    # map -> odom, at 50 Hz. THIS IS THE EDGE THIS ARM EXISTS TO PUBLISH
    # and here it is live rather than ornamental - it is the one
    # transform F3 adds (global constraint 15), and the estimator keeps
    # odom -> base_link underneath it.
    #   IT IS NOT nav2_amcl's CADENCE AND THE DIFFERENCE IS MEASURED
    #   RATHER THAN EQUALISED. amcl re-broadcasts on every scan (15 Hz);
    #   this node re-broadcasts on a timer at 50 Hz. Both re-send an
    #   UNCHANGED edge between corrections, so neither number is a
    #   correction rate - EVIDENCE_LOCALIZATION_V3.md counts only
    #   broadcasts that DIFFER - and both are reported as the delivered
    #   rate a consumer would see. The value is the package's own and is
    #   not moved to make a table symmetrical.
    transform_publish_period: 0.02

    # THE RASTER, AND IT IS WHY THIS ARM NEEDS NO map_server. This node
    # publishes an occupancy grid rendered from the graph it deserialised
    # on config.yaml's topics.map, which is the service nav2_map_server
    # performs on the other arm for a measured 3.00 % of one core. Same
    # interval as the mapper used, so the two arms deliver the same thing
    # to any downstream consumer and the CPU column of the A/B compares
    # like with like.
    #   NOTHING ON THIS TRACK CONSUMES IT YET. It is here for parity and
    #   for F4, and what it costs is measured rather than assumed
    #   (EVIDENCE_LOCALIZATION_V3.md 13).
    map_update_interval: 10.0
    # 0.05 m cells - the same contract the frozen grid carries, so the
    # raster this node publishes and the one map_server serves are the
    # same resolution and a costmap downstream divides into either.
    resolution: 0.05

    restamp_tf: false
    # THE LOOKUP BUDGET, AND IT IS THE SHIPPED LOCALISATION VALUE RATHER
    # THAN THE MAPPER'S 0.5. The mapper's number was a REPLAY number:
    # rosbag2 plays by receive time, so a scan could arrive a long way
    # from the transform that brackets it. Live, base_link -> odom is on
    # the graph at 50 Hz and the tf2 message filter has already held the
    # scan until it can be transformed, so 0.2 s is ten periods of the
    # edge this lookup reads and the timeout never binds.
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    # 40 MB of stack. NOT ORNAMENTAL HERE: this node deserialises a
    # 48.7 MB pose graph on its configure transition, and the recursion
    # in karto's serializer is what this exists for.
    stack_size_to_use: 40000000
    # NO RVIZ AND NO HUMAN, and on this arm that is a safety property
    # rather than a tidiness one: interactive mode is how a pose graph is
    # DRAGGED, and the graph under this node is frozen.
    enable_interactive_mode: false
    # NOTHING HERE MAY WRITE A MAP. The localisation node refuses to
    # serialise anyway (see `mode`), and this is the same refusal said
    # once more where a reader is looking.
    use_map_saver: false
    # NO BOND, WHICH IS amcl.yaml's ARGUMENT ON THIS NODE. With
    # use_lifecycle_manager true this node bonds to a nav2
    # lifecycle_manager, and a bond is a heartbeat with a deadline: a
    # deadline starves at the real-time factors a simulation reaches, and
    # a manager that declares a healthy node dead is worse than no
    # manager. m5v3.sh drives the two transitions itself, so there is no
    # manager for it to bond to and the default is the right value -
    # written down because it decides whether a bond exists at all.
    use_lifecycle_manager: false

    # ================= WHEN A SCAN CORRECTS THE POSE =================
    #
    # THE CADENCE IS amcl.yaml's, DELIBERATELY. See the header: two
    # localisers that corrected at different cadences would differ in
    # accuracy and in CPU for a reason that belongs to neither
    # algorithm. 0.25 m is also what F2's measured error makes
    # meaningful - 10.6 mm dry and 24 mm wet of accumulated along-track
    # error over that distance, both under this map's 0.0291 m residual
    # rms - and it is under the 0.50 m shortest rack segment this floor
    # has.
    #   THE TIME GATE IS THE MAPPER'S AND IS THERE FOR THE MAPPER'S
    #   REASON: two scan periods at this sensor's 15 Hz, a floor that
    #   never binds at any speed this vehicle drives, and the thing that
    #   stops a STOPPED truck re-processing the same view.
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.20
    minimum_time_interval: 0.20
    check_min_dist_and_heading_precisely: false

    # ================= THE RUNNING SCAN =================
    #
    # 32 NODES AT 0.25 m IS 8.00 m, AND THE METRES ARE THE ARGUMENT. That
    # is the width of every cruise corridor on this floor and 1.39 rack
    # pitches (5.75 m), so the running chain always spans at least one
    # rack END - the only along-corridor feature a scan matcher has here.
    # The mapper's 30 was this same arithmetic at its own 0.30 m spacing;
    # the count moved because the spacing did.
    #   IT DOES NOT FIX A DEGENERATE CORRIDOR AND NOTHING CAN. Where a
    #   scan carries no along-aisle information a longer memory only
    #   remembers more of the same. EVIDENCE_LOCALIZATION_V3.md 9 is what
    #   that costs, on both arms.
    scan_buffer_size: 32
    # The scanner's own range, for the mapper's reason: the shipped 10.0
    # is BELOW this sensor's 25.0 m and would throw away exactly the
    # long-range returns - the far wall of a 48 m hall - that carry the
    # most geometry.
    scan_buffer_maximum_scan_distance: 25.0
    # THE tf2 MESSAGE FILTER'S QUEUE, AND LIVE IT IS A BRINGUP NUMBER
    # RATHER THAN A REPLAY ONE. Once the stack is up, base_link -> odom
    # is on the graph at 50 Hz against a 15 Hz scan and nothing ever
    # waits. What this covers is the first second: the bridges carry
    # scans as soon as the world is up, and a queue of 1 would drop
    # everything that arrived before the chain closed. Ten scans is
    # 0.67 s of holding and costs ten scans of memory.
    scan_queue_size: 10

    # ================= SCAN MATCHING =================
    # Both default, and on this arm scan matching is not optional at all:
    # with it off this node would be dead reckoning on F2's EKF with a
    # frozen graph it never consulted, which is the DEFAULT stack wearing
    # a localiser's label.
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ================= LOOP CLOSURE =================
    #
    # LEFT ON, AND THAT IS THE MEASUREMENT AND NOT AN OVERSIGHT. See the
    # header: the pathology docs/reports/m5v3-04 predicts for this arm is
    # the snap relocalisation loop closure produces, and a configuration
    # that disabled it would answer the question by assumption.
    #
    # loop_search_maximum_distance  SHIPPED 3.0, and NOT the mapper's 5.0
    #   The mapper raised it because the raw odometry it was correcting
    #   had drifted 9.86 m by the end of the drive. This node starts from
    #   a seed with a 0.50 m prior and is corrected every 0.25 m, so
    #   there is no such drift for a radius to have to cover - while the
    #   floor's own 5.75 m rack pitch, which is the UPPER bound, has not
    #   moved. The shipped value sits further inside it.
    # loop_search_space_dimension   SHIPPED 8.0
    #   The correlation grid the candidate chain is matched in. It has to
    #   bracket the radius above: +-3.0 m needs 6.0 m of grid and 8.0
    #   gives a metre of margin either side.
    # loop_match_minimum_chain_size  10, the mapper's and not the shipped
    #   localisation file's 3
    #   How many linked scans a closure candidate must present. It is the
    #   aliasing guard on a floor that repeats every 5.75 m: a chain of
    #   three can be assembled inside one bay, and ten cannot. The
    #   32-scan buffer above always has ten to offer.
    # BOTH RESPONSE THRESHOLDS ARE SHIPPED AND UNTOUCHED, for the header's
    # reason.
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 3.0

    # ================= CORRELATION, ALL SHIPPED =================
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ================= PENALTIES, ALL SHIPPED =================
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
    # WHAT THIS NODE PUTS IN THE COVARIANCE IT PUBLISHES, UNSCALED. Both
    # default. These scale the scan matcher's own response covariance
    # before it reaches the graph and the `pose` topic, and scaling them
    # is how a factor graph is told to trust the matcher more or less
    # than the odometry - a reading this rig has not taken. What the
    # covariance that comes out is actually WORTH is measured in
    # EVIDENCE_LOCALIZATION_V3.md 13, and the bringup gate is built on
    # that measurement rather than on the assumption that it means what
    # nav2_amcl's means.
    position_covariance_scale: 1.0
    yaw_covariance_scale: 1.0
