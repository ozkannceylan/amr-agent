# docking.yaml - opennav_docking 1.3.12 for the S5 AprilTag dock.
#
# TOP-LEVEL KEYS ARE THE TWO NODE NAMES m5v3.sh starts under --dock.
# Addresses (topics, frames, file paths) stay in config.yaml and are
# passed on the command line so this file cannot hold a second copy.
#
# controller.v_angular_max is v_linear_min / dock.min_radius_m.
# tests/test_docking_params.py recomputes it from config.yaml.
#
# dock_backwards is true: forks are model -x (see config.yaml dock:).
# use_external_detection_pose is true: SimpleNonChargingDock refines
# from topics.detected_dock_pose, which is the AprilTag TF, not a
# typed furniture pose.

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    initial_perception_timeout: 8.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 120.0
    undock_linear_tolerance: 0.50
    undock_angular_tolerance: 0.30
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: true
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_non_charging"]
    simple_non_charging:
      plugin: "opennav_docking::SimpleNonChargingDock"
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      external_detection_translation_x: -1.975
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      docking_threshold: 0.25
      staging_x_offset: 2.00
      staging_yaw_offset: 0.0
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.10
      v_linear_max: 0.25
      v_angular_max: 0.08
      slowdown_radius: 0.10
      use_collision_detection: false
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3

dock_lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 0.0
    attempt_respawn_reconnection: false
    node_names:
      - docking_server
