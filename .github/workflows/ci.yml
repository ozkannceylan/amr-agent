name: CI

# Gates PRs (ADR 0017). The three jobs are the required checks once
# branch protection is turned on; none of them needs ROS, Gazebo or
# the Windows writer.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  invariants:
    name: invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Layer-boundary checks
        run: python3 m6/tools/check_layer_boundaries.py

  pytest-m6:
    name: pytest-m6
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m6/requirements-ci.txt

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk

      - name: Python test dependencies
        run: python3 -m pip install -r m6/requirements-ci.txt

      - name: Vendored mosquitto
        run: bash m6/tools/install_broker.sh

      - name: pytest (native, no ROS)
        env:
          # Same isolation the suite already demands (conftest.py).
          ROS_DOMAIN_ID: "89"
        run: |
          python3 -m pytest m6/tests/ -q \
            --junit-xml=junit-m6.xml \
            --tb=short

      - name: Floor: at least 400 passed
        if: always()
        run: python3 m6/tools/check_junit_floor.py junit-m6.xml 400

      - name: Deploy snapshot is reproducible
        run: |
          bash m6/m6.sh deploy
          test -f m6/deploy/MANIFEST
          test -s m6/deploy/MANIFEST

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-m6
          path: junit-m6.xml
          if-no-files-found: warn
