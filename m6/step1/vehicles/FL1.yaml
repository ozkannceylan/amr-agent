# FL1.yaml - one vehicle's identity and calibration (ADR 0016 D2).
# The serialNumber is the root datum: the fleet layer addresses the vehicle
# by it and learns everything else from the wire, never from a second list.
serial: FL1

state_interval_s: 30.0   # spec 6.10: event-driven, at latest every 30 s
battery_charge_pct: 100.0  # the battery is MODELED - a required field, not
                           # a measurement; charging follows start/stopCharging
supervision_s: 3.0       # the SF-09 budget: controlled stop within this of
                         # broker loss; = cell keepalive_s * 1.5 (see cell.yaml)

# Where the deployed step 5 image lives, relative to m6/step1/. The client
# imports stations.py and status_contract.py from the DEPLOY, like every
# other vehicle node - run `./m5_ver2/step5/step5.sh deploy` first.
step5_ipc: ../../m5_ver2/step5/deploy/ipc

# factsheet numbers - the agv layer owns these (invariant 10). The physical
# rows are the sim model's; owner-revisable before the step 1 gate.
factsheet:
  series_name: "amr-forklift"
  kinematic: THREEWHEEL    # front-steer tricycle
  agv_class: FORKLIFT
  max_load_mass_kg: 1500
  physical:
    speed_min_mps: 0.0
    speed_max_mps: 1.5     # = limits.traction_speed_max_mps in config.yaml
    accel_max_mps2: 0.5
    decel_max_mps2: 0.8
    height_m: 2.0
    width_m: 1.0
    length_m: 2.4
  min_order_interval_s: 0.5
  min_state_interval_s: 0.5
